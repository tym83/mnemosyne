version: 1
pitch_convention: Sounding MIDI, C4=60; transpose = sounding minus written. Unpitched
  ranges are SFZ trigger keys.
range_reference: https://www.vsl.co.at/academy/
policy: Ordinary orchestral ranges. Comfortable ranges, velocity limits and balance
  are configurable engineering heuristics, not physical absolutes. Sample coverage
  is checked separately.
# Release seconds are time to silence after damping, not sample length.
release_profiles:
  woodwinds: {release_seconds: 0.4, sustained: true}
  brass: {release_seconds: 0.5, sustained: true}
  strings: {release_seconds: 0.8, sustained: true}
  keyboard: {release_seconds: 0.4, sustained: false}
  percussion: {release_seconds: 4.0, sustained: false}
  plucked: {release_seconds: 4.0, sustained: false}
  voice: {release_seconds: 0.5, sustained: true}
release_overrides:
  piano: {release_seconds: 0.4, sustained: false, pedal: true}
