name: Mnemosyne images
on:
  workflow_dispatch:
    inputs:
      notagen_revision:
        description: Optional reviewed NotaGen commit (empty skips the layer)
        required: false
        default: ''
permissions:
  contents: read
  packages: write
concurrency:
  group: mnemosyne-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [controller, studio]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: containers/Containerfile
          target: ${{ matrix.target }}
          # Python controller is cheap under emulation; sample bank builds are not.
          platforms: ${{ matrix.target == 'controller' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ghcr.io/tym83/mnemosyne-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          sbom: true
          provenance: mode=max
      - name: Write digest values for Helm
        env:
          TARGET: ${{ matrix.target }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digest-values
          printf 'addon:\n  images:\n    %s:\n      repository: ghcr.io/tym83/mnemosyne-%s\n      digest: %s\n' "$TARGET" "$TARGET" "$DIGEST" > "digest-values/$TARGET.yaml"
          printf '### %s\n`ghcr.io/tym83/mnemosyne-%s@%s`\n' "$TARGET" "$TARGET" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target }}
          path: digest-values/
  notagen:
    if: inputs.notagen_revision != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: containers/Containerfile
          target: studio-notagen
          platforms: linux/amd64
          build-args: NOTAGEN_REVISION=${{ inputs.notagen_revision }}
          push: true
          tags: ghcr.io/tym83/mnemosyne-studio-notagen:${{ github.sha }}
          cache-from: type=gha,scope=studio
          cache-to: type=gha,mode=max,scope=studio-notagen
          sbom: true
          provenance: mode=max
      - name: Report optional digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Studio NotaGen `ghcr.io/tym83/mnemosyne-studio-notagen@%s`\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
