name: Mnemosyne source kind e2e
on:
  workflow_dispatch:
    inputs:
      base_image:
        description: Python 3.12 slim image pinned by digest (image@sha256:...)
        required: true
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: azure/setup-helm@v4.3.0
      - name: Install kind and Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra operator
      - name: Source e2e (no Docker, no image builds)
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          sudo env PATH="$PATH" .venv/bin/python hack/addon/kind_e2e.py --provider podman --base-image "$BASE_IMAGE" --output /tmp/mnemo-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-e2e-evidence
          # Do not publish the private recipient key or kubeconfig.
          path: |
            /tmp/mnemo-e2e/result.json
            /tmp/mnemo-e2e/expected.json
            /tmp/mnemo-e2e/works/
            /tmp/mnemo-e2e/restore/report.json
