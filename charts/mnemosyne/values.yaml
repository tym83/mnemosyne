# No model, pod or weights provisioned by default (chamber/library mode).
models:
  endpoints: {}
  roles: {}
work:
  enabled: false
  schedule: '0 1 * * *'
  timeZone: Etc/UTC
  image: '' # image containing Mnemosyne and the selected worker dependencies
  command: [] # e.g. [python, -m, mnemosyne.music.composer, ...]
  activeDeadlineSeconds: 21600
  # Existing lowest-priority class (negative value, preemptionPolicy: Never).
  # No cluster-scoped objects or permissions are created by this tenant chart.
  priorityClassName: ''
  nodes: [] # optional explicit hostname allowlist
  resources:
    requests: {cpu: '1', memory: 1Gi}
    limits: {cpu: '4', memory: 8Gi}
  env: {}
  credentials: [] # [{env: MUSIC_TEXT_KEY, secretKeyRef: {name: model-key, key: token}}]
  artifacts:
    existingClaim: '' # required; generated works survive completion/failure
servers: []
# Native sidecars live only for the work Job; PVC retains weights after unload.
# - name: text
#   image: ghcr.io/ggml-org/llama.cpp:server (pin a tested digest)
#   command: [llama-server]
#   args: [--model, /models/text.gguf, --host, 0.0.0.0, --port, '8080',
#          --ctx-size, '16384', --threads, '4', --n-gpu-layers, '0']
#   port: 8080
#   healthPath: /health
#   resources: {requests: {cpu: '1', memory: 24Gi}, limits: {cpu: '4', memory: 28Gi}}
#   weights: {existingClaim: model-weights, size: 40Gi, storageClass: ''}
# Use another sidecar/port with --mmproj for a vision model. vLLM or Ollama
# can use the same contract: explicit command, args, readiness and GPU resources.
notagen:
  enabled: false
  directory: /opt/NotaGen/gradio
  device: cpu
  weightsFile: /notagen/model.ckpt
  weights: {existingClaim: '', size: 10Gi, storageClass: ''}

# Portable addon. Enable after Actions supplies real digests and a key reference.
addon:
  enabled: false
  # namespace uses only Role/RoleBinding and requires an existing priority class.
  rbacScope: cluster
  # Platforms with tenant quotas can manage this externally.
  manageQuota: true
  controllerReplicas: 1
  images:
    controller: {repository: ghcr.io/tym83/mnemosyne-controller, digest: ''}
    studio: {repository: ghcr.io/tym83/mnemosyne-studio, digest: ''}
  imagePullSecrets: []
  mode: chamber
  gpuResource: '' # e.g. the extended resource advertised by the installed device plugin
  budget: 0 # US dollars per month for the model API (0: no limit); needs prices in models.endpoints (price_in/price_out per million tokens)
  render: true # audio of accepted works; false keeps scores, drafts and notebooks only (the backup never needs sound)
  suspend: false
  window: {kind: night, timeZone: Etc/UTC, startHour: 1, endHour: 6}
  deadlineSeconds: 21600
  # Empty = all namespaces for this explicit inventory. Extend for installed APIs.
  snapshotNamespace: ''
  includeSecrets: false
  inventory:
    - {apiVersion: v1, kind: Namespace, resource: namespaces}
    - {apiVersion: v1, kind: ConfigMap, resource: configmaps}
    - {apiVersion: v1, kind: Service, resource: services}
    - {apiVersion: v1, kind: ServiceAccount, resource: serviceaccounts}
    - {apiVersion: v1, kind: PersistentVolumeClaim, resource: persistentvolumeclaims}
    - {apiVersion: apps/v1, kind: Deployment, resource: deployments}
    - {apiVersion: apps/v1, kind: StatefulSet, resource: statefulsets}
    - {apiVersion: apps/v1, kind: DaemonSet, resource: daemonsets}
    - {apiVersion: networking.k8s.io/v1, kind: NetworkPolicy, resource: networkpolicies}
    - {apiVersion: networking.k8s.io/v1, kind: Ingress, resource: ingresses}
    - {apiVersion: rbac.authorization.k8s.io/v1, kind: Role, resource: roles}
    - {apiVersion: rbac.authorization.k8s.io/v1, kind: RoleBinding, resource: rolebindings}
    - {apiVersion: apiextensions.k8s.io/v1, kind: CustomResourceDefinition, resource: customresourcedefinitions}
    # The atelier's own objects are the carrier, never the payload. Data backups
    # (e.g. velero.io Backup, database operator backups) can be listed here as the map to the data.
  # No artistic inputs exist here: ideas, schools, climate and moods belong to the atelier.
  priorityClassName: '' # empty creates release-scoped minimum integer priority
  resources:
    requests: {cpu: '100m', memory: 512Mi}
    limits: {cpu: '1', memory: 2Gi}
  quota: {requests.cpu: '2', requests.memory: 3Gi, limits.cpu: '4', limits.memory: 5Gi, pods: '5'}
  # A history lived elsewhere (mnemo history export) moves into the volume once, after
  # install; a living atelier is never overwritten. The archive holds no keys.
  history:
    source: '' # https URL of the archive
    sha256: ''
  # Read-only site of the atelier's history: works, drafts, notebooks, critics, Lives,
  # schools and how to restore. No keys, no token, no writes. The volume is ReadWriteOnce,
  # so the studio is scheduled beside the gallery.
  gallery:
    enabled: false
    refreshSeconds: 900
    service: {type: ClusterIP, port: 80}
    ingress: {enabled: false, className: '', host: '', annotations: {}, tls: []}
    resources:
      requests: {cpu: 50m, memory: 192Mi}
      limits: {cpu: 500m, memory: 768Mi}
  artifacts:
    existingClaim: ''
    size: 20Gi
    storageClass: null # null uses default; empty string means no dynamic provisioner
    keep: true
    s3: {bucket: '', endpoint: '', prefix: mnemosyne}
  # The atelier's own 32-byte X25519 key, mounted only in studio (from `mnemo keys new`).
  # The owner's private key never enters the cluster: only ownerPublic (hex) does,
  # so the atelier seals snapshots it cannot open. No Secret API reads for keys.
  key:
    ownerPublic: '' # required: hex public key printed by `mnemo keys new`
    provider: file # file (including Secret/CSI), vault (KV v2), or kms (AWS Decrypt)
    vault: {address: '', path: '', tokenFile: /key/token, field: recipient, namespace: ''}
    kms: {keyId: '', region: '', ciphertextFile: /key/recipient.enc, encryptionContext: {}}
    secretName: ''
    secretKey: atelier.key
    # Alternatively a CSI/PVC/projected volume supplied by Vault/KMS integration.
    volume: {}
    path: /key/atelier.key
  env: [] # env/valueFrom for model or S3 credentials
  volumes: [] # optional model/sample mounts
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
