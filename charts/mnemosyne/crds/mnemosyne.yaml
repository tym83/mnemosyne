apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ateliers.mnemosyne.art
spec:
  group: mnemosyne.art
  scope: Namespaced
  names:
    kind: Atelier
    plural: ateliers
    singular: atelier
    listKind: AtelierList
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
            properties:
              title: &id001
                type: string
              art: *id001
              runtime:
                type: object
                required:
                - mode
                - inventory
                properties:
                  mode:
                    type: string
                    enum:
                    - chamber
                    - background
                    - GPU
                    - API
                  render:
                    type: boolean
                    default: true
                  suspend:
                    type: boolean
                    default: false
                  deadlineSeconds:
                    type: integer
                    minimum: 60
                    maximum: 604800
                  drafts:
                    type: integer
                    minimum: 1
                    maximum: 10
                  snapshotNamespace: *id001
                  includeSecrets:
                    type: boolean
                    default: false
                  window:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - night
                        - weekends
                        - idle
                        - always
                      timeZone: *id001
                      startHour:
                        type: integer
                        minimum: 0
                        maximum: 23
                      endHour:
                        type: integer
                        minimum: 0
                        maximum: 23
                  inventory:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      required:
                      - apiVersion
                      - kind
                      - resource
                      properties:
                        names:
                          type: array
                          minItems: 1
                          items: *id001
                        apiVersion:
                          type: string
                          pattern: ^[a-z0-9.-]+(/[a-z0-9]+)?$
                        kind:
                          type: string
                          pattern: ^[A-Za-z][A-Za-z0-9]*$
                        resource:
                          type: string
                          pattern: ^[a-z][a-z0-9]*$
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
            properties:
              phase: *id001
              lastJob: *id001
              observedGeneration:
                type: integer
                format: int64
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - type
                items:
                  type: object
                  required:
                  - type
                  - status
                  - reason
                  - message
                  - lastTransitionTime
                  properties:
                    type: *id001
                    status:
                      type: string
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                    reason: *id001
                    message: *id001
                    lastTransitionTime:
                      type: string
                      format: date-time
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Art
      type: string
      jsonPath: .spec.art
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    subresources:
      status: {}
---
