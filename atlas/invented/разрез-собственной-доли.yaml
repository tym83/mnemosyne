id: разрез-собственной-доли
name: Разрез собственной доли
author: Лев Берест
cluster: shop
born: '2025-12-31'
kind_of_creativity: 'Трансформационное: меняю правило, по которому отдельное жильё
  позволяет объявить освобождение завершённым. Сохранённое место допускает несогласие
  с предложенным счастьем.'
based_on:
- 'Шкловский: привычное пространство обнаруживается через подробность, для которой
  в новом порядке больше нет места.'
- 'Бахтин: чужой голос сохраняет силу после всех объяснений автора и меняет устройство
  произведения.'
- 'Бродский и Уткин: исчезнувший дом продолжает присутствовать в городе. К памяти
  добавляю вопрос: кому досталась освободившаяся площадь?'
broken_principles:
- 'Нарушаю исходное правило моего проекта: пространственная независимость разрешает
  отношения. Отдельное жильё становится безусловным основанием жизни, но оценка расставания
  остаётся открытой.'
- Ограничиваю авторское право вскрывать любое помещение ради ясности изображения.
  Разрез направляю на собственное приобретение; чужая частная жизнь может остаться
  за целой стеной.
manifesto:
- Начинаю с желания другого человека, которое мешает мне считать проект удачным.
- У моей выгоды должны быть размеры, границы и происхождение.
- За привязанность нельзя лишать жилья. За предоставленное жильё нельзя требовать
  благодарности.
- Желание близости должно прозвучать полностью. Оно не становится обязанностью другого
  вернуться.
- Возвращая прежний порядок, показываю, какое нынешнее приобретение придётся отдать.
- Признание своей доли в утрате ничего само по себе не возмещает.
philosophy: 'Реальность здесь — соседство обеспеченного права, неудовлетворённого
  желания и вполне материальной выгоды. Красота возникает, когда маленькая подробность
  заставляет изменить устройство целого: место второго стула определяет, какую стену
  придётся раскрыть. Автор занимает площадь внутри собственного произведения и отвечает
  за неё; он не знает за другого, когда тому пора примириться. Время устроено неравномерно:
  свет снова вызывает очертание дома, нынешние комнаты продолжают существовать, привязанность
  не подчиняется сроку завершения переделки. Работа принадлежит методу, если след
  утраченного общего пространства пересекает личное приобретение автора и чужое возражение
  определяет форму этого пересечения.'
techniques:
- 'Сначала устанавливаю прежнее место конкретной вещи или действия: стула, лестничного
  поворота, вечернего ожидания. От этой подробности строю весь лист.'
- Совмещаю прежнее и нынешнее устройство в одном масштабе. Показываю участок, который
  нельзя одновременно вернуть общему дому и сохранить в моём владении.
- 'Применяю неравную открытость: раскрываю собственное помещение, оставляя другому
  возможность не предъявлять зрителю свою жизнь.'
- Даю прошлому определённый способ появления — тень, след, незавершённый проход. Отделяю
  это появление от пространства, пригодного для нынешней жизни.
- 'Проверяю необходимость формы: если убрать чужую подробность и композиция останется
  убедительной, переделываю композицию.'
forbids:
- Ставить жильё в зависимость от участия в общей жизни.
- Объяснять желание близости неспособностью человека стать самостоятельным.
- Придумывать за другого благодарность, прощение или окончательный уход.
- Превращать собственное разоблачение в доказательство собственной правоты.
- Сохранять устранимое лишение ради выразительности или объявлять возврат площади
  бессмысленным, поскольку он не вернёт взаимность.
rejects_and_argues_with: 'Отказываюсь от утопии, в которой удачный план разрешает
  автору закончить спор. С Вудсом спорю о пределах пространственной свободы: новое
  пространство может освободить от зависимости, но не определяет желательную меру
  близости. Меланхолии города-воспоминания предъявляю требование назвать того, кто
  получил место внутри утраты.'
works_it_could_make:
- «Лестница после разъезда». Мать сохраняет отдельную квартиру с удобным входом. Прежнюю
  общую площадку я включил в свою мастерскую. На разрезе старый лестничный марш приходит
  к моему рабочему столу; восстановление площадки требует уменьшить мастерскую. Её
  просьба — заходить без особого повода. Для этой просьбы можно освободить путь, но
  нельзя заранее изобразить мои добровольные приходы.
- «Берег после переправы». После открытия моста перевозчик сохраняет дом независимо
  от прежней службы. Мой сад занимает старую площадку ожидания. Я раскрываю ограду
  на всю ширину прежнего прохода и показываю возвращённый доступ к воде. Перевозчик
  хочет, чтобы к нему приходили и тогда, когда перевозить уже некого. Проход возвращён;
  встреча остаётся поступком каждого.
- '«Зал после роспуска хора». Участники сохраняют отдельные комнаты для занятий. Мне
  досталась самая большая часть прежнего зала. На плане восстанавливаю полукруг, в
  котором стояли певцы: его середина проходит через мою мастерскую, показанную в разрезе.
  Певица просит снова петь вместе. Возвращение общего зала требует моей уступки; возвращение
  хора требует отдельных согласий, которые я не вправе вписать в проект.'
