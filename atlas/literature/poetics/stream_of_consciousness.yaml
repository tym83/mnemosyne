# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: stream_of_consciousness
name: Поток сознания
art: literature
kind: prose
origin:
  place: Англия (Блумсбери), Ирландия, Франция
  era: 1910-е — 1930-е
  language: английский, французский
  note: >
    Термин «поток сознания» взят из «Принципов психологии» Уильяма Джеймса (1890). В прозу его
    перенесли Дороти Ричардсон («Паломничество», с 1915), Джеймс Джойс («Улисс», 1922) и Вирджиния Вулф
    («Миссис Дэллоуэй», 1925; «На маяк», 1927; «Волны», 1931). Вулф в эссе «Современная проза» (1919)
    и «Мистер Беннет и миссис Браун» (1924) выступила против «материалистов» — Уэллса, Беннета,
    Голсуорси, которые описывают внешнее, но упускают «светящийся ореол», окружающий сознание от
    первого до последнего мгновения. Внутренний монолог ещё раньше использовал Эдуар Дюжарден
    («Лавры сорваны», 1887), и Джойс называл его своим предшественником.

lineage:
  predecessors:
    - Уильям Джеймс — «поток сознания» как термин психологии
    - Лоренс Стерн, «Тристрам Шенди» — ассоциация и отступление как принцип
    - Пруст — «В поисках утраченного времени», память, длинная фраза
    - Толстой и Достоевский — внутренний монолог, которым Вулф восхищалась
    - Дюжарден — первый «внутренний монолог»
    - Анри Бергсон — длительность против часового времени
  neighbours:
    - Джойс, «Улисс» — самая радикальная форма (монолог Молли)
    - Дороти Ричардсон — «Паломничество»
    - Фолкнер, «Шум и ярость» — монолог Бенджи и Квентина
    - Кэтрин Мэнсфилд — малая проза в том же духе
    - Клариси Лиспектор — позднее и по-своему
  against:
    - «материалисты» — описание внешних обстоятельств, дома и дохода героя
    - сюжет как последовательность событий с развязкой
    - всеведущий автор, который знает и объясняет всё
    - ограничение романа готовыми рамками «жизнь — это ряд симметрично расположенных светильников»

worldview: >
  Жизнь — не цепь событий, а непрерывный поток впечатлений, памяти и мыслей, и главное в нём то,
  что происходит внутри. Обычный день содержит всю жизнь: за чашкой чая вспыхивает юность, за
  звуком часов — смерть. Время часов и время души не совпадают: минута может быть вечностью, годы —
  мгновением. Сознания проницаемы друг для друга: мысль одного человека продолжается в другом.
  Красота и смерть живут рядом.

reader: >
  Читатель — спутник, которого вводят в чужую голову без предупреждения; он должен следить за
  скольжением мысли, угадывать переходы, терпеливо ждать, пока ассоциация вернётся. Он не получает
  объяснений, но получает близость к чужому сознанию, и поэтому узнаёт собственное.

time: >
  Часы дня (утро, полдень, вечер) задают внешнюю рамку; внутри неё время растягивается и
  сворачивается памятью. Одна минута вмещает тридцать лет. «Настоящее» постоянно прошито
  прошлым и будущим. Внешнее событие (звонок, ножницы, прохожий) запускает внутренний.

composition:
  principle: один день или несколько моментов, в которых внимание скользит от впечатления к воспоминанию и от одного сознания к другому
  forms:
    - роман одного дня
    - рассказ-мгновение из внутреннего монолога
    - цепь моментов суток, каждый от своего голоса
    - монолог без пунктуации (предельный случай)
  inner: >
    Каждый блок — момент дня: что человек видит, слышит и о чём ему это напоминает. Фокус скользит:
    от героя к прохожему, от впечатления к воспоминанию, от своей мысли к чужой. Переходы мягкие, без
    маркеров. Блоки скреплены мотивом — звук, цвет, повторяющаяся фраза. Развязки нет: день
    заканчивается, как мысль.

narrator: >
  Рассказчик растворён в сознании героя и переходит от одного сознания к другому, как свет.
  Третье лицо часто почти неотличимо от внутреннего голоса (несобственно-прямая речь);
  допускается и «я», и «мы», и вполне безличный голос. Автор ничего не объясняет.

character: >
  Люди с богатой внутренней жизнью и скромным внешним существованием: хозяйка, готовящая приём,
  художница, у которой не выходит картина, вернувшийся с войны, мальчик. Характер дан через то, что
  им замечается и вспоминается, а не через описание. Герои существуют в сети отношений с
  другими сознаниями.

language: >
  Длинные текучие предложения с придаточными, перечислениями и повторами, которые несут поток;
  внезапные короткие фразы — всплески внимания. Ритм почти музыкальный. Пунктуация гибка (тире, точки
  с запятой), иногда её нет. Чувственные детали: свет, звук, запах. Метафора живая, рождается
  из ощущения. Слова часов и колоколов, возвращающиеся как рефрен.

imagery:
  - свет, который меняется в течение дня
  - море, волны, прилив
  - цветы, сад, ваза, окно
  - часы, колокол, бой
  - маяк, лодка, дорога
  - зеркало, чашка, ножницы, платье

themes:
  - время и память
  - смерть рядом с жизнью
  - одиночество и связь сознаний
  - красота момента и его исчезновение
  - женщина в быту и в творчестве
  - необъяснимое родство людей

devices:
  - внутренний монолог
  - скользящий фокус от сознания к сознанию
  - длинная фраза-поток
  - ассоциация, запущенная вещью или звуком
  - сжатие и растяжение времени
  - мотив-рефрен, скрепляющий блоки
  - момент бытия — мгновенное озарение в обычной минуте

genres: [роман одного дня, рассказ-мгновение, поток-монолог, лирическая проза]

forbidden:
  - перечень событий вместо движения сознания
  - авторское объяснение того, что думает герой
  - внешнее описание обстановки ради неё самой
  - плотная интрига и развязка
  - стилизованная невнятица без чувственного содержания
  - один и тот же голос у разных сознаний

markers:
  - предложения длинные, текучие, с возвращающимися мотивами
  - мысль скользит от впечатления к воспоминанию
  - есть минимум одна длинная фраза, которая держится на ассоциациях
  - фокус переходит от одного сознания к другому без маркера
  - внешнее событие мелкое, внутреннее — огромное
  - день заканчивается без развязки

reading: >
  Понятно в потоке сознания — когда читатель может проследить скольжение: что запустило мысль,
  куда она ушла и почему вернулась; ассоциации не произвольны, их связь можно восстановить.
  Интересно — когда за чашкой чая открывается целая жизнь и читатель чувствует себя внутри чужой
  головы. Работа провалена, если поток превращается в нечитаемую путаницу, если за ним нет
  чувственного материала, если голоса сливаются, если автор объясняет.

manifesto:
  - Жизнь — не ряд симметрично расположенных светильников, а светящийся ореол вокруг сознания.
  - Обыкновенный день содержит всю жизнь; смотри, что происходит внутри.
  - Мысль не идёт по прямой — пусть фраза течёт, как течёт внимание.
  - Время души не равно времени часов — растягивай и сжимай его.
  - Сознания проницаемы — переходи от одного к другому, как свет с лица на лицо.
  - Ничего не объясняй — читатель сам войдёт в голову и сам узнает дорогу.

form:
  code: src/mnemosyne/writing/schools/stream_of_consciousness.py
  note: механическая проверка — объём, число блоков-моментов и наличие хотя бы одной длинной фразы; логику ассоциаций и чувственную насыщенность читает внутренний критик по markers и forbidden

climate:
  age: память, прошлое прорастает в настоящее
  loss: смерть рядом с праздником
  steadiness: обычный день, в котором всё внутри
  crowding: гости, приём, много сознаний рядом
  renewal: момент бытия, озарение в обычной минуте

exemplars:
