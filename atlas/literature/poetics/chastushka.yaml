# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: chastushka
name: Частушка
art: literature
kind: poetry
origin:
  place: Россия — сначала деревня центральных и северных губерний, затем фабричные посёлки и город
  era: со второй половины XIX века по сей день; расцвет — конец XIX и первая половина XX века
  language: русский (и его говоры)
  note: >
    Частушка — жанр устный и коллективный: у неё нет автора в литературном смысле. Её сочиняют
    на ходу, перенимают, переиначивают под место, человека и случай; одна и та же строка живёт в
    десятках вариантов. Время рождения жанра совпадает с ломкой деревенского уклада после реформы
    1861 года: отходничество, фабрика, железная дорога, гармонь. Местные имена — припевки,
    коротушки, вертушки, частухи; отдельные напевные разновидности (страдания, «Семёновна»,
    «Матаня») имеют свою строфу и свой наигрыш. Поэтому поэтика частушки — это поэтика исполнения
    в кругу, а не текста на странице.

lineage:
  predecessors:
    - плясовые, хороводные и игровые песни с короткими припевами
    - скоморошины, прибаутки, небылицы, присловья
    - свадебные корильные песни — величание и корение в лицо
    - пословица и загадка как образец сжатой формулы
  neighbours:
    - городской романс и жестокий романс
    - раёшный стих и лубочная подпись
    - литературное подражание и переработка — Есенин, Демьян Бедный, плакатные частушки 1920-х, ритмы частушки в «Двенадцати» Блока
    - фронтовая и советская агитационная частушка как сочинённая сверху ветвь
  against:
    - протяжная лирическая песня с её медленным распевом и плачем — частушка коротка, быстра и насмешлива
    - чинность, начальство, благолепие — всё, что требует почтения
    - книжная, «правильная» речь

worldview: >
  Мир — деревенская улица и праздник, где все на виду и всё можно сказать в лицо, если сказать
  складно. Жизнь тяжела, но на круге о ней поют весело; горе и обида выговариваются шуткой, а
  шутка допускает то, что нельзя сказать прямо. Власть, поп, свекровь, начальник, колхоз, война —
  всё попадает под язык. Любовь — главная забота: выбор, измена, ревность, сватовство, и об этом
  говорят открыто, на людях.

reader: >
  Не читатель, а слушатель и соучастник круга. Частушку поют при всех, и круг отвечает: смехом,
  подхватом, встречной частушкой. Слушатель знает, о ком речь, даже если имя не названо, и знает
  напев, поэтому новая частушка ложится на знакомую мелодию и сразу подхватывается.

time: >
  Здесь и сейчас: гулянье, вечерка, свадьба, проводы в армию, праздник. Частушка злободневна —
  отзывается на событие недели, на нового председателя, на войну, на моду; поэтому она быстро
  стареет и тут же заменяется новой. Время круга — время пляски, наигрыша, чередования голосов.

composition:
  principle: короткая самостоятельная строфа с поворотом в конце; строфы нанизываются в цепь под один наигрыш
  forms:
    - четверостишие четырёхстопного хорея с рифмой чётных строк (иногда всех)
    - двустишие «страданий» с длинной строкой и особым распевом
    - цепь частушек под один наигрыш, с перепевом и отпевом
    - перекличка — спор девушек и парней, двух деревень, двух соперниц
  inner: >
    Первые две строки часто дают зачин — образ природы, предмет, обращение, «запев» без прямой связи
    со смыслом (психологический параллелизм, унаследованный от песни); вторые две делают поворот и
    бьют в цель. Соль — в последней строке: неожиданная рифма, двусмысленность, перевёртыш.

narrator: >
  Исполнитель от первого лица: «я», девушка или парень, говорящий о себе и о милом, сопернице,
  свекрови. «Я» частушки условно — исполнитель берёт чужую частушку и поёт её как свою, подгоняя
  имена и приметы. Голос дерзкий, вызывающий, кокетливый или жалобный; поётся под гармонь,
  балалайку или «под язык», без инструмента.

character: >
  Типы улицы: милый и милка (миленок, залётка), соперница, изменщик, свекровь, мать, парни из
  соседней деревни, председатель, поп, начальник. Они не описаны, а задеты: одна черта, одно
  действие, одна кличка.

language: >
  Разговорная, диалектная, иногда грубая речь; уменьшительные и ласкательные формы; бойкая рифма,
  часто неточная и составная. Хорей и плясовой ритм. Игра слов, двусмысленность, перевёртыш смысла,
  намёк вместо прямого слова. Озорная и непристойная ветвь — законная часть жанра, но живёт в
  своём кругу.

imagery:
  - гармонь, гармонист, гулянье, крылечко, тропинка, речка, мост
  - платок, ленточка, сапожки, колечко как знаки любви и измены
  - цветы, ягоды, птицы как запевные образы
  - деревня и город, поезд, фабрика, армия как новые приметы
  - начальство, колхоз, налог как предмет насмешки

themes:
  - любовь, измена, ревность, разлука
  - насмешка над соперником, над парнями и девками другой деревни
  - сатира на власть, начальство, порядки
  - труд, бедность, проводы, война
  - похвальба собой и своим умением плясать и петь

devices:
  - зачин-параллелизм, не связанный с остальным логикой
  - поворот или «соль» в последней строке
  - встречная частушка — ответ на чужую тем же напевом
  - подстановка имени, места, примет под случай
  - двусмысленность и намёк, особенно в озорных
  - рефрен и припевка между частушками
  - самоирония и похвальба в одной строфе

genres: [частушка, страдания, припевка, плясовая цепь, частушечная перекличка, агитационная частушка]

forbidden:
  - длинное рассуждение и описание
  - строфа без поворота и без адресата
  - книжная речь и высокий слог без пародии
  - мораль, поучение, благостность
  - жалоба без улыбки — частушка плачет, но смеётся

markers:
  - строфа самостоятельна и бьёт в последней строке
  - есть «я» и есть тот, к кому обращено
  - рифма звонкая, ритм ложится на пляску
  - речь живая, разговорная, с говорком
  - есть дерзость — насмешка, вызов или признание при всех
  - строфу можно подхватить и ответить на неё

reading: >
  Понятно в частушке — значит понятно с первого раза на слух, на ходу, в шуме гулянья: никаких
  трудных слов, никакой нужды возвращаться к строке. Интересно — когда последняя строка ловит
  слушателя: неожиданный поворот, меткая рифма, узнанный адресат; круг смеётся, ахает или
  отвечает встречной частушкой. Частушка провалена, если её надо объяснять, если она ни в кого не
  метит, или если после неё нечего ответить.

manifesto:
  - Пою, что вижу, и про кого хочу — пусть услышит.
  - Четыре строки, а последняя главная.
  - Сказано складно — значит, можно сказать всё.
  - Частушка ничья — спел — твоя, переиначил — тоже твоя.
  - Нам поют — мы отвечаем.
  - Горе на круг не выносят без смеха.
  - Сегодняшнее поётся сегодня; завтра споют новое.

form:
  code: src/mnemosyne/writing/schools/chastushka.py
  note: механическая проверка — только одна ось (четверостишия, длина строки, рифма чётных); поворот, адресат и дерзость читает внутренний критик по markers и forbidden

climate:
  turbulence: злее и злободневнее, больше сатиры, частушки отвечают друг другу
  strain: жалоба через смех, страдания вместо плясовой
  crowding: перекличка, много голосов, спор
  loss: проводы, разлука, напев тянется к страданиям
  novelty: новые приметы и слова сразу попадают в строку
  abundance: праздник, похвальба, пляс
  steadiness: любовная лирика без злости, ровная цепь под один наигрыш

exemplars:
  - напевные типы с собственной строфой и наигрышем — страдания, «Семёновна», «Матаня»
  - частушечные переклички на гуляньях и свадьбах
  - записи фольклористов XIX–XX веков в региональных собраниях
texts: фольклор — общественное достояние; конкретные публикации и сборники как составительская работа могут быть под охраной; литературные частушки (Есенин и др.) — по статусу автора
