# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: minimalism
name: Минимализм в прозе
art: literature
kind: prose
origin:
  place: США — провинция, пригороды, Тихоокеанский Северо-Запад; редакции Нью-Йорка
  era: середина 1970-х — 1980-е (корни — Чехов и Хемингуэй)
  language: английский (американский)
  note: >
    Минимализм — не манифест группы, а ярлык, который критика наклеила на прозу Реймонда Карвера и
    близких ему авторов; сами они его чаще отвергали. Ключевая фигура рядом с Карвером — редактор
    Гордон Лиш (сначала в Esquire, затем в издательстве Knopf), который радикально сокращал тексты
    Карвера для сборника «О чём мы говорим, когда говорим о любви» (1981): резал до половины объёма,
    менял названия и финалы. Сравнение с несокращёнными версиями (они изданы под названием
    «Начинающие», 2009) — главный документ спора о том, чья это поэтика. Позднее Карвер
    («Собор», 1983) сознательно отходит от предельной сжатости к большей полноте и теплу. Термин
    «грязный реализм» ввёл Билл Бьюфорд в журнале Granta (1983), объединив Карвера, Ричарда Форда,
    Тобиаса Вулфа, Джейн Энн Филлипс, Фредерика Бартелми и других.

lineage:
  predecessors:
    - Чехов — рассказ без развязки, деталь вместо объяснения, отказ от суда над героем; Карвер считал его учителем и написал о его смерти рассказ «Поручение» (1987)
    - Хемингуэй — «теория айсберга» из «Смерти после полудня» (1932) — писатель может опустить то, что знает, и читатель почувствует опущенное, если оно было знанием, а не пустотой; рассказы «Холмы, как белые слоны», «Убийцы»
    - Шервуд Андерсон и Гертруда Стайн как учителя Хемингуэя — простой синтаксис, повтор, провинция
  neighbours:
    - Энн Битти — пригородные пары, отчуждение, настоящее время
    - Фредерик Бартелми (не путать с Дональдом Бартелми, постмодернистом) — пригород, торговые центры, вещи
    - Тобиас Вулф, Ричард Форд, Бобби Энн Мейсон, Мэри Робисон, Эми Хемпел — круг «грязного реализма» и учеников Лиша
  against:
    - постмодернистская метапроза и «максимализм» (Барт, Пинчон, Гэддис) — игра с формой, энциклопедичность, книги о книгах
    - нравоучительная и объясняющая проза, где автор толкует мотивы и выносит приговор
    - лирическое многословие, украшенный стиль, «писательское» письмо
    - американская мечта как обязательная история успеха
    - сам минимализм позже получил отпор — Джон Барт (эссе «Несколько слов о минимализме», 1986) и пренебрежительные ярлыки вроде «реализма K-mart»

worldview: >
  Жизнь обычных людей — официанток, продавцов, безработных, пьющих, разведённых — достойна
  литературы, и её драма разыгрывается не в событиях, а в паузах между ними. Люди почти не
  способны сказать, что с ними происходит; язык у них отнят бедностью, усталостью, алкоголем,
  страхом. Мир хрупок: работа, брак, дом могут рассыпаться от одного вечера. Автор не спасает и не
  судит; он показывает с той точностью, которая сама по себе есть сострадание.

reader: >
  Читатель — соучастник умолчания: ему дают надводную часть айсберга, и он должен ощутить
  подводную. Ничего не объяснено, и это доверие: читатель сам слышит, что значит пауза, повтор,
  слишком будничная реплика. Он знает этих людей или сам из них, поэтому узнаёт их беду без
  подсказки.

time: >
  Короткий отрезок обыденного времени: вечер, разговор на кухне, поездка, утро после.
  Прошлое присутствует, но не рассказывается — его выдают обмолвки. Время линейно и почти
  бессобытийно; переломное событие часто случилось до рассказа или случится после, а мы видим
  момент рядом с ним.

composition:
  principle: короткий рассказ из нескольких сцен, где главное событие опущено или сдвинуто за кадр
  forms:
    - рассказ-сцена — одна ситуация, почти без экспозиции
    - рассказ из нескольких коротких сцен, разделённых пробелом
    - сборник рассказов как единство среды и интонации
  inner: >
    Вход с середины, без предыстории; диалог несёт основную нагрузку; повествование поверхностно в
    буквальном смысле — внешность, действия, вещи. Кульминация не названа: её заменяет жест,
    предмет, молчание. Финал открыт — рассказ обрывается на образе или реплике, не разрешая
    конфликта, но меняя его освещение.

narrator: >
  Нейтральный рассказчик в третьем лице, близкий к герою, или первое лицо простого человека,
  который не понимает до конца того, о чём рассказывает. Нет авторских оценок, философских
  отступлений, объяснённых чувств. Голос сухой, ровный, почти протокольный; за этой ровностью
  слышна боль.

character: >
  Рабочий класс и нижний средний класс американской провинции: супружеские пары на грани, безработные,
  пьющие, официантки, продавцы, соседи. Характер раскрывается через поступок, реплику и вещь, не
  через анализ. Герои часто пассивны, растеряны, говорят не о том; их внутренняя жизнь угадывается
  по тому, что они не могут сказать.

language: >
  Простая лексика, короткие предложения, минимум прилагательных и наречий, почти нет метафор.
  Диалог с повторами, обрывами, банальностями, в которых прячется главное. Точная бытовая деталь
  (марка сигарет, телевизор, кухонный стол, выпивка) вместо описания чувства. Никакой
  стилистической эффектности: каждое лишнее слово вычеркнуто.

imagery:
  - кухня, гостиная, телевизор, двор, машина
  - выпивка, сигареты, еда как знаки быта и бегства
  - вещи на распродаже, мебель на газоне, пустой дом
  - работа — смена, увольнение, ожидание звонка
  - провинциальный пейзаж без красоты

themes:
  - распад брака и семьи
  - бедность, безработица, неуверенность
  - алкоголизм и его последствия
  - неспособность выговорить и услышать
  - случайная беда в обыденной жизни
  - редкие моменты близости и благодати

devices:
  - айсберг — опущение главного при точности видимого
  - деталь-заместитель чувства
  - диалог, в котором говорят мимо сути
  - открытый финал без разрешения
  - повтор реплики или жеста
  - короткий абзац и пробел между сценами
  - редакторская обрезка — убрать объяснение, оставить действие

genres: [короткий рассказ, рассказ-сцена, сборник рассказов, сжатая повесть]

forbidden:
  - авторский комментарий и объяснение мотивов
  - называние чувств (ей было грустно, он злился)
  - метафорическая пышность, лирические отступления
  - закрытый финал с моралью или развязкой
  - экзотика, исключительные герои, драматические события на первом плане
  - метаповествовательная игра

markers:
  - предложения короткие, слова простые
  - главное не сказано, но ощущается
  - есть одна точная деталь, несущая смысл сцены
  - диалог живой, с паузами и уклонами
  - финал открыт и не объясняет
  - герои обычны, обстановка будничная

reading: >
  Понятно в минимализме — значит, на поверхности всё ясно: кто где, что делают, что говорят; ни
  одного трудного слова и ни одной загадочной фразы. Интересно — когда под этой ясностью
  ощущается давление опущенного: читатель чувствует, что сцена значит больше, чем показано, и
  деталь или пауза ведут его к этому. Рассказ провален, если под поверхностью пусто (опущено то,
  чего автор сам не знал), если умолчание превращено в нарочитую загадку, или если в конце автор
  не выдержал и объяснил.

manifesto:
  - Опусти всё, что знаешь, и читатель почувствует всё, что опущено; опусти то, чего не знаешь, и останется пустота.
  - Не называй чувство — дай вещь и жест.
  - Обычные люди за кухонным столом — тоже трагедия.
  - Каждое лишнее слово — ложь; вычеркни его.
  - Рассказ кончается, когда сцена сказала своё, а не когда всё разрешилось.
  - Не суди героя; точность — уже сострадание.

form:
  code: src/mnemosyne/writing/schools/minimalism.py
  note: механическая проверка — только одна ось (объём, число абзацев); умолчание, деталь, открытый финал читает внутренний критик по markers и forbidden

climate:
  strain: давление под поверхностью сильнее, реплики короче, паузы длиннее
  loss: распад брака, увольнение, пустой дом
  scars: прошлое выдаёт себя обмолвками, старые раны не названы
  closedness: герои говорят ещё меньше, умолчание глубже
  crowding: вечеринки и гости, разговор мимо друг друга
  renewal: к позднему Карверу — проблеск близости и благодати
  steadiness: будничная поверхность ровнее, событие дальше за кадром

exemplars:
  - Карвер, Пожалуйста, помолчи (1976)
  - Карвер, О чём мы говорим, когда говорим о любви (1981) и Начинающие (2009)
  - Карвер, Собор (1983)
  - Хемингуэй, В наше время (1925); Холмы, как белые слоны
  - Энн Битти, ранние рассказы
  - Granta 8, Dirty Realism (1983)
texts: Карвер, Битти, Вулф, Форд, Ф. Бартелми — под охраной, только приёмы; Хемингуэй — по юрисдикции (в РФ под охраной); Чехов — общественное достояние
