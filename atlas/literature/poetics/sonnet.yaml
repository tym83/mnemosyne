# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: sonnet
name: Сонет
art: literature
kind: poetry
origin:
  place: Сицилия, двор Фридриха II; затем Тоскана, Англия, вся Европа, Россия
  era: XIII век (сицилийская школа) — расцвет у Петрарки в XIV веке, у елизаветинцев на рубеже XVI–XVII, в России с XVIII века и особенно в Серебряном веке
  language: итальянский; затем английский, французский, испанский, русский и др.
  note: >
    Первые сонеты приписывают Джакомо да Лентини из сицилийской школы при дворе Фридриха II.
    Дольче стиль нуово и Данте («Новая жизнь») сделали сонет формой любовной мысли, Петрарка в
    «Канцоньере» — формой самоанализа, длящегося через годы. В Англию сонет принесли Уайетт и Сарри;
    Сарри дал схему из трёх катренов и двустишия, на которой написаны сонеты Шекспира (изданы 1609).
    Сонет — не стиль одной эпохи, а форма, ставшая поэтикой: четырнадцать строк, внутри которых мысль
    обязана повернуться.

lineage:
  predecessors:
    - провансальская куртуазная лирика — культ дамы, служение, любовь как наука
    - сицилийская канцона и строфа станцы
    - схоластическая диспута — тезис, возражение, разрешение
  neighbours:
    - канцона, секстина, баллада Петрарки и его школы
    - петраркизм — европейская мода XV–XVI веков (Ронсар, Дю Белле, испанцы)
    - метафизическая поэзия (Донн, «Священные сонеты»)
    - русская традиция — Тредиаковский и Сумароков, затем Пушкин, Дельвиг, в Серебряном веке Бальмонт, Брюсов, Вячеслав Иванов, Волошин
  against:
    - бесформенное излияние чувства — сонет требует меры
    - внутри самой традиции — против затёртого петраркизма (Шекспир, сонет 130, снимает с дамы все петраркистские сравнения)
    - позднее — против его самого восстают верлибр и авангард, а сонет отвечает возвращениями

worldview: >
  Чувство и мысль поддаются мере: страсть, сомнение, горе можно додумать до конца, если поставить
  их в тесную форму. Мир противоречив, но противоречие разрешимо или хотя бы может быть выговорено
  в одном повороте. Любовь — путь познания себя (Петрарка), время — враг, против которого
  стих выставляет бессмертие (Шекспир), а сама форма — испытание, которое поэт проходит у всех на
  глазах.

reader: >
  Читатель знает форму и ждёт поворота: он следит, как мысль развивается в восьмистишии и где
  ломается, и оценивает точность разрешения. Это читатель-ценитель, сравнивающий сонет с другими
  сонетами; для него форма — часть смысла, а нарушение формы — тоже высказывание.

time: >
  Время сонета — время размышления, сжатого в момент: прошлое и будущее стягиваются к одной точке
  рассуждения. В цикле (Петрарка, Шекспир) сонеты складываются в длительную историю, но каждый
  остаётся остановленным мгновением мысли. Тема времени-разрушителя и стиха, который его
  переживёт, — одна из главных.

composition:
  principle: четырнадцать строк, разделённых на неравные части; смысл движется через поворот (вольту)
  forms:
    - итальянский (петрарковский) — октава ABBAABBA и сестет CDECDE или CDCDCD, вольта на девятой строке
    - французский — октава с опоясывающей рифмой и сестет CCD EED или CCD EDE
    - английский (шекспировский) — три катрена ABAB CDCD EFEF и двустишие GG, вольта перед двустишием или в нём
    - спенсеровский — катрены, сцепленные рифмой ABAB BCBC CDCD EE
    - венок сонетов — пятнадцать сонетов, последняя строка каждого открывает следующий, пятнадцатый (магистрал) собран из первых строк четырнадцати
    - цикл сонетов (канцоньере) как роман в стихах
  inner: >
    Классическая логика — тезис, развитие и антитезис, синтез: первый катрен ставит положение,
    второй его углубляет или противопоставляет, сестет поворачивает и разрешает. В шекспировском
    сонете три катрена дают три приступа к теме, двустишие — афористический вывод или опровержение.
    Последняя строка (в итальянском — заключительный терцет, в английском — двустишие) должна
    звучать как замок, запирающий мысль.

narrator: >
  Лирическое «я», говорящее к себе, к возлюбленной, к другу, к Богу или к самому стиху. Это «я»
  рефлексирующее: оно не только чувствует, но и наблюдает своё чувство и спорит с ним. Голос
  сосредоточенный, ровный, иногда страстный, но всегда подчинённый мере.

character: >
  Адресат — возлюбленная (Лаура, Беатриче), друг и смуглая дама Шекспира, сам поэт, другой поэт,
  Бог, сама поэзия. Адресат не описывается во всей полноте, а дан как предмет размышления;
  психология выражена через ход мысли, а не через поступки.

language: >
  Плотный, отборный, интеллектуальный язык: каждое слово несёт вес. Антитеза и оксюморон
  (петраркистские «лёд и пламень»), развёрнутая метафора-концепт, проведённая через весь сонет,
  афоризм в замке. Синтаксис часто совпадает со строфикой; перенос допустим, но заметен.
  Рифмы точные и в итальянской схеме требуют богатого рифменного запаса, отчего английский сонет
  и упростил схему.

imagery:
  - глаза, взгляд, сердце, рана, огонь и лёд
  - время, коса, зеркало, увядающая роза, зима
  - корабль, буря, гавань как образы души
  - стих, перо, память, бессмертие в строке
  - небо, звёзды, сад

themes:
  - любовь, разлука, неразделённость
  - время, смерть, бессмертие в стихе
  - вера и сомнение
  - дружба, слава, долг поэта
  - сама форма — сонет о сонете (Пушкин, «Сонет», 1830; Вордсворт)

devices:
  - вольта — поворот мысли в заданном месте
  - антитеза и оксюморон
  - концепт — развёрнутая метафора через весь сонет
  - афористический замок в последней строке или двустишии
  - анафора и параллелизм катренов
  - сонет-ответ и сонет-спор с предшественником
  - метасонет — сонет, перечисляющий своих предшественников и обосновывающий форму

genres: [любовный сонет, философский сонет, духовный сонет, сонет-посвящение, сонет о сонете, цикл сонетов, венок сонетов]

forbidden:
  - больше или меньше четырнадцати строк без замысла
  - сонет без поворота — четырнадцать строк одной мысли
  - сестет или двустишие, повторяющие сказанное
  - небрежная рифма и случайный размер
  - многословное описание без движения мысли

markers:
  - четырнадцать строк в узнаваемой схеме
  - есть вольта, и после неё мысль идёт в другую сторону
  - части связаны как тезис, развитие и разрешение
  - последняя строка или двустишие звучат как вывод, который нельзя переставить
  - ни одно слово не случайно, рифма держит смысл

reading: >
  Понятно в сонете — значит, ход мысли можно проследить: читатель видит, что утверждается в начале,
  чем это осложняется и как разрешается. Сложность языка допустима и даже ожидаема, но логика
  поворота должна быть ясна. Интересно — когда вольта действительно меняет угол, а замок не
  предсказан, но после прочтения кажется неизбежным. Сонет провален, если он лишь укладывает в
  четырнадцать строк одну эмоцию, если поворот формальный или если последняя строка повторяет
  первую мысль другими словами.

manifesto:
  - Четырнадцать строк — не тюрьма, а мера; в тесноте мысль сгущается.
  - Мысль, которая не повернулась, ещё не додумана.
  - Чувство становится стихом, когда его можно рассудить.
  - Последняя строка запирает сонет, как ключ.
  - Время отнимает всё, кроме строки, которую нельзя забыть.
  - Каждый сонет отвечает всем сонетам, написанным до него.

form:
  code: src/mnemosyne/writing/schools/sonnet.py
  note: механическая проверка — только одна ось (четырнадцать строк, схема рифм, сцепление строк в венке); вольта, логика и замок читает внутренний критик по markers и forbidden

climate:
  strain: антитезы острее, вольта резче, разрешение трудное
  loss: тянется к элегии и к теме времени-разрушителя
  steadiness: ровная итальянская схема, спокойное разрешение
  density: концепт плотнее, рифмы богаче, цикл разрастается в венок
  closedness: замок туже, форма строже
  turbulence: английская схема с её ударом в двустишии, спор вместо размышления
  age: память, увядание, бессмертие в строке

exemplars:
  - Петрарка, Канцоньере (Rerum vulgarium fragmenta)
  - Данте, Новая жизнь
  - Шекспир, Сонеты (1609)
  - Донн, Священные сонеты
  - Пушкин, сонеты 1830 года — «Сонет», «Поэту», «Мадонна»
  - Прешерн, Венок сонетов (1834)
  - Вячеслав Иванов, Венок сонетов; Волошин, Corona astralis
texts: Петрарка, Данте, Шекспир, Донн, Пушкин, Прешерн — общественное достояние; русские переводы — по статусу переводчика; Вячеслав Иванов и Волошин — тоже общественное достояние
