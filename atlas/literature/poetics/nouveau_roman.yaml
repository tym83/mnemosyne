# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: nouveau_roman
name: Новый роман
art: literature
kind: prose
origin:
  place: Франция, Париж, издательство Les Éditions de Minuit (Жером Линдон)
  era: 1950-е — 1970-е
  language: французский
  note: >
    Школа не имела манифеста, но имела эссе: Натали Саррот, «Эра подозрения» (1956), и Ален Роб-Грийе,
    «Путь будущего романа» (1956; затем «За новый роман», 1963). Вокруг издательства Minuit
    собрались Роб-Грийе («Ластики», 1953; «Ревность», 1957; «В лабиринте», 1959), Саррот
    («Тропизмы», 1939; «Планетарий»), Мишель Бютор («Изменение», 1957), Клод Симон («Дороги Фландрии»,
    1960; Нобелевская премия 1985), Клод Мориак, Роберт Пенже, Маргерит Дюрас. Для Роб-Грийе
    традиционный роман с психологией, героем, сюжетом и «значением» вещей устарел: мир не
    человечен, мир просто есть.

lineage:
  predecessors:
    - Флобер — безличное письмо, «книга ни о чём»
    - Пруст и Джойс — внутренняя жизнь как материал формы
    - Кафка — отсутствие объяснений
    - Хемингуэй, Дос Пассос — внешнее наблюдение
    - Сартр, «Тошнота» — вещи, лишённые смысла
    - Фолкнер — разрыв хронологии
  neighbours:
    - Роб-Грийе — «школа взгляда», геометрическое описание
    - Саррот — «тропизмы», микродвижения до слов
    - Бютор — роман от второго лица, «Изменение»
    - Симон — периодические фразы-лабиринты памяти
    - Дюрас — тишина и повтор
  against:
    - бальзаковский роман — герой, типаж, интрига, причинность
    - психологизм, «душа» героя как предмет
    - символическая и «глубинная» интерпретация вещей
    - социальная и моральная миссия романа

worldview: >
  Мир не наделён заранее смыслом, он просто здесь: вещи не символы и не знаки души, они
  присутствуют. Привычный роман навязывает миру человеческую значимость и тем лжёт. Сознание
  ненадёжно и смещается: одна и та же сцена описывается снова и снова, и каждый раз немного иначе;
  никто не знает, что на самом деле произошло. Правда — это поверхность и её описание, а не
  глубина, которой нет.

reader: >
  Читатель — участник, у которого отняли готовые опоры: нет героя, который объясняет, нет
  морали, нет единой версии. Он должен сам выстраивать сцену из повторов и расхождений,
  терпеть пустоту и скуку, потому что именно в них новое восприятие. Читателя не успокаивают.

time: >
  Время нарушено: прошлое и настоящее смешаны, одна сцена повторена в нескольких вариантах, часы
  идут, но хода нет. Время — не последовательность, а повтор с изменениями; мгновение
  растягивается до страниц, потому что описывается каждая деталь.

composition:
  principle: повторное описание одной сцены, каждый раз со сдвигом; геометрия вещей вместо психологии
  forms:
    - роман-повтор одной сцены с вариациями
    - описание комнаты, предмета или улицы как сюжет
    - роман взгляда — наблюдатель, о котором ничего не сказано
    - короткий текст на одну сцену и несколько её версий
  inner: >
    Первый проход описывает предметы и их расположение точно, почти как чертёж. Каждый следующий
    возвращается к той же сцене и сдвигает: меняется порядок предметов, число, освещение, угол зрения,
    появляется или пропадает деталь. Читатель не может зафиксировать «что было». Событие едва
    намечено, а скорее всего его нет. Финал либо возвращает начало, либо обрывается.

narrator: >
  Безличный наблюдатель, чей взгляд холоден и точен; иногда «я», о котором ничего не известно.
  Он не объясняет, не обобщает, не оценивает; его присутствие ощущается лишь в выборе того,
  что смотреть. Нередко рассказчик ненадёжен, и описание от этого начинает расползаться.

character: >
  Герой сведён до имени-инициала или вообще безымянен: он набор действий и взглядов. Психологии
  нет, мотивов нет, прошлое намёками и противоречиво. Вещи значимее людей: стакан, лестница,
  жалюзи, пятно на стене описаны дольше, чем лицо.

language: >
  Точные, сухие, геометрические описания: размеры, расположение, число, углы, порядок. Настоящее
  время. Минимум эпитетов и метафор, почти нет оценочных слов. Повторы целых фраз с
  изменёнными деталями. Предложения короткие, одинаково выстроенные, как у протокола.
  Эмоция дана только расположением предметов.

imagery:
  - лестница, окно, жалюзи, дверь, пол из плитки
  - стакан, чашка, лампа, бритва, пятно
  - улица, фасад, перекрёсток, трамвай
  - тень, свет, угол, линия, решётка
  - фото, картинка, схема на стене
  - предметы, которые смещены на сантиметр

themes:
  - ненадёжность описания и памяти
  - вещь как факт, а не символ
  - невозможность восстановить событие
  - ревность, подозрение, ожидание без слов
  - скука и пустота как форма
  - повтор как способ видеть

devices:
  - геометрическое описание
  - повтор сцены со сдвигом
  - настоящее время, безличный взгляд
  - нарушение хронологии
  - исключение психологии и мотива
  - вещь, описанная дольше человека
  - ненадёжный наблюдатель

genres: [роман-повтор, роман взгляда, описание предмета, малый текст-вариация]

forbidden:
  - объяснение чувств и мотивов героя
  - символическое толкование вещи
  - моральная, социальная или психологическая «миссия»
  - причинно-следственная интрига с развязкой
  - метафорическое украшение вещей
  - хронологически честный рассказ с готовой версией

markers:
  - вещи описаны точно, как чертёж
  - одна сцена возвращается несколько раз с изменениями
  - психологии нет, мотивы не названы
  - время настоящее, взгляд холодный
  - читатель не может решить, что произошло
  - предмет описан дольше, чем человек

reading: >
  Понятно в новом романе — когда читатель видит предметы и их расположение так ясно, что мог бы
  начертить; ничего не скрыто за словами. Интересно — когда смещение деталей между повторами
  создаёт напряжение: что-то случилось, и теперь уже нельзя узнать что. Работа провалена,
  если вещи — символы, если автор объясняет, если повторы механически одинаковы или, наоборот,
  случайны; если описание красиво, но не точно.

manifesto:
  - Мир не человечен — вещи просто есть, и не говорят о нашей душе.
  - Описывай точно, как чертёж — размеры, расположение, угол.
  - Возвращайся к той же сцене и сдвигай её — в сдвиге прячется событие.
  - Не объясняй — психология — это привычка, а не знание.
  - Читатель сам соберёт мир из поверхностей, и это его работа.
  - Скука честнее лжи о смысле.

form:
  code: src/mnemosyne/writing/schools/nouveau_roman.py
  note: механическая проверка — объём и число блоков-описаний по числу проходов; точность, безличность и осмысленность сдвигов читает внутренний критик по markers и forbidden

climate:
  steadiness: застывший свет, неподвижные вещи
  closedness: замкнутая комната, взгляд из одного окна
  strain: ревность и подозрение, не названные словами
  volatility: детали смещаются между проходами
  scars: стёртое событие, оставившее пятно

exemplars:
  - Роб-Грийе, Ластики
  - Роб-Грийе, Ревность
  - Роб-Грийе, В лабиринте
  - Саррот, Тропизмы; Планетарий
  - Бютор, Изменение
  - Симон, Дороги Фландрии
  - Саррот, Эра подозрения (эссе)
  - Роб-Грийе, За новый роман (эссе)

texts: под охраной; используются только приёмы
