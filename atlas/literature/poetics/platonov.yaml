# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: platonov
name: Платонов
art: literature
kind: prose
origin:
  place: СССР — Воронеж, Москва, степь, стройплощадка, колхоз, железная дорога
  era: 1920-е — 1951
  language: русский
  note: >
    Андрей Платонов — инженер-мелиоратор, ставший прозаиком революции; его язык — это не стилизация, а
    особое мышление: идеологические слова и канцелярит, поставленные рядом с телесным и крестьянским
    словом, становятся метафизикой. Главные тексты — «Сокровенный человек» (1928), «Чевенгур» (1928–1929),
    «Котлован» (1930), «Ювенильное море», «Джан», «Фро», «Река Потудань». Многое было опубликовано только
    через десятилетия: «Котлован» — на Западе в 1969, в СССР в 1987, «Чевенгур» — в 1972 на Западе, в СССР
    в 1988. Бродский назвал язык Платонова тупиком, в который ведёт сама логика языка эпохи.

lineage:
  predecessors:
    - Гоголь, Лесков — сказовая речь, слово как событие
    - Достоевский — идея как судьба, юродство
    - Фёдоров, «Философия общего дела» — воскрешение отцов, общее дело человечества
    - русская народная мысль и сектантская книжность
    - пролеткульт и авангард 1920-х, но с обратным знаком — не победа, а боль
  neighbours:
    - Хлебников — слово как материал и шифр
    - Зощенко и Бабель — язык эпохи как предмет прозы
    - Введенский, Хармс (ОБЭРИУ) — абсурд логики
    - Замятин, «Мы» — дистопия строительства
  against:
    - советский производственный роман с оптимистическим пафосом
    - лакировочный язык лозунга без внутренней жизни
    - психологическая проза с внутренним анализом
    - ирония над простым человеком

worldview: >
  Революция и строительство нового мира — искренняя попытка людей найти смысл и общую правду, но
  язык, на котором они её ищут, заранее ломает и их мысль, и их жизнь. Человек ищет истину и
  всеобщее счастье, не умея выразить, что ему нужно; неуклюжее слово больше говорит о боли, чем
  гладкое. Стройка превращается в могилу, обещанное будущее не наступает, дети умирают, а старые
  вещи и люди остаются никому не нужными. Единственная утешительная сила — сострадание и
  собирание заброшенного.

reader: >
  Читатель — сочувственный и внимательный слушатель, который должен привыкнуть к странной речи и
  услышать за её неуклюжестью человеческую боль. Его сначала смущают, потом смешат, потом
  оставляют с комом в горле. Он не может отстраниться иронией: слова всерьёз.

time: >
  Время «новой жизни», которая всё откладывается: строительство идёт, а будущее не приходит.
  Странствие без цели: идут по местам, где время то стоит, то идёт скачками. Прошлое — сиротство,
  память о умерших, будущее — общая могила или несбыточный рай.

composition:
  principle: странствие искателя истины по эпизодам-встречам, где язык и ход мысли героев раскрывают тупик общего дела
  forms:
    - странствие-повесть из нескольких встреч
    - история стройки, превращающейся в могилу
    - рассказ о сироте и о собранной им вещи
    - короткий рассказ с притчевой логикой
  inner: >
    Герой — одинокий искатель — уходит с места, встречает людей, задаёт им наивные вопросы, слышит
    странные ответы. Каждая встреча — отдельный малый сюжет с логикой притчи. Герой собирает
    забытые вещи «на память», слушает слова, которые несут боль. Финал — смерть ребёнка, гибель
    стройки, уход, но без трагической риторики.

narrator: >
  Серьёзный, лишённый иронии голос, который присваивает слова своих героев: идеологический
  словарь, канцелярский оборот, народное слово он произносит с полной достоверностью. Автор не
  отстранён от героев: он соглашается с их логикой и тем показывает её тупик. Близко к сказу, но без
  комического зазора.

character: >
  Искатели истины, простодушные строители, сироты, активисты, бюрократы, мужики, дети. Они мыслят
  вслух и до конца, делают из лозунга метафизический вывод, ищут «смысл жизни» на стройке. Их
  жизнь телесна: голод, усталость, работа, болезнь. Вощев с его мешком забытых вещей, Чиклин,
  Настя — образцы.

language: >
  Смысловой сдвиг: отвлечённое понятие в паре с телесным глаголом («ощущал свою жизнь»), лишние
  причинные связки («потому что», «ввиду», «так как»), канцелярит, газетный и ведомственный язык,
  ставший метафизикой, неожиданные предлоги и падежи. Фраза выстроена чётко, но её смысл скользит.
  Слова крестьянские и инженерные соседствуют. Серьёзность тона, лишённая иронии.

imagery:
  - котлован, стройка, барак, общий дом
  - степь, овраг, дорога, станция, паровоз
  - мешок или сундучок с забытыми вещами
  - гроб, могила, труп ребёнка
  - сирота, деревня, колхоз
  - слово как предмет и ярлык

themes:
  - поиск смысла жизни и общей правды
  - обещанное будущее, которое не наступает
  - сиротство и память об умерших
  - стройка как могила
  - сострадание и собирание забытого
  - язык эпохи как ловушка мысли

devices:
  - смысловой сдвиг — абстракция с телесным глаголом
  - лишняя причинная связка
  - канцелярит как метафизика
  - наивный вопрос искателя истины
  - странствие по эпизодам-встречам
  - собирание забытых вещей
  - серьёзность без иронии

genres: [повесть-странствие, повесть-притча, рассказ о стройке, рассказ о сироте]

forbidden:
  - ирония над героем и его речью
  - лозунг без внутренней боли
  - гладкий, литературно правильный язык
  - психологический анализ в духе «диалектики души»
  - оптимистический финал, примиряющий с будущим
  - сентиментальность без точной вещи

markers:
  - абстрактное слово соседствует с телесным глаголом
  - в тексте есть лишняя причинная связка
  - канцелярский или идеологический оборот звучит всерьёз
  - герой ищет истину наивно и вслух
  - есть вещь, которую кто-то собирает или хранит
  - конец без утешения, но с состраданием

reading: >
  Понятно у Платонова — когда за странной фразой слышна простая человеческая мысль или нужда:
  человек хочет понять, как жить, и говорит на языке, который его подводит. Интересно — когда
  сдвиг слова открывает больше, чем правильная фраза, и когда боль проступает сквозь комизм
  речи. Работа провалена, если сдвиг превращается в манеру, набор странностей без боли; если
  автор иронизирует; если язык стилизован под Платонова, но герой ничего не ищет.

manifesto:
  - Язык эпохи — не украшение, а ловушка — покажи, что в ней застревает мысль.
  - Сдвинь слово — и увидишь то, что гладкая фраза скрывает.
  - Говори серьёзно — ирония — это способ не страдать.
  - Каждый, кто ищет истину, достоин рассказа, даже если ищет неуклюже.
  - Собирай забытые вещи — в них хранится то, что не сумела сохранить история.
  - Не обещай будущего — покажи, чем заплачено за обещание.

