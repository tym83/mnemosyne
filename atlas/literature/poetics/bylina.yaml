  turbulence: больше боя, застава под угрозой, сюжет выезда и поединка
  strain: конфликт богатыря с князем, обида и уход
  age: старшие богатыри, Святогор, тема меры и ухода силы
  abundance: пир, похвальба, новгородское богатство
  steadiness: зачин и исход крепче, повторы ровнее
  crowding: множится войско противника, гипербола числа
  loss: гибель богатыря, исход с оттенком плача

exemplars:
