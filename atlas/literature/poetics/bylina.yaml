# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: bylina
name: Былина
art: literature
kind: poetry
origin:
  place: Русь; записана в основном на Русском Севере — Обонежье, Пинега, Мезень, Печора, Беломорье — и в Сибири
  era: складывалась веками, в основе — домонгольская Русь (киевский и новгородский циклы); живое бытование засвидетельствовано записями XVIII–XX веков
  language: русский (северные говоры)
  note: >
    Сами исполнители называли эти песни старинами — песнями о бывшем, о старине. Слово «былина»
    — учёный термин XIX века, взятый из «Слова о полку Игореве» и закрепившийся в науке. Авторства
    нет: старина живёт в передаче от сказителя к сказителю, внутри семей и деревень, и каждый
    сказитель знает свой извод. Главные собрания — сборник Кирши Данилова (XVIII век), записи
    П. Н. Рыбникова и А. Ф. Гильфердинга в Олонецкой губернии (XIX век), позднее экспедиции XX века.
    Знаменитые сказители — Трофим Григорьевич Рябинин из Кижей, родоначальник династии Рябининых;
    Мария Дмитриевна Кривополенова с Пинеги, которую фольклористы вывезли петь в города.

lineage:
  predecessors:
    - мифологический эпос и архаические сказания о змееборце и старших богатырях (Святогор, Волх)
    - дружинная песня и поэтические предания княжеской Руси
    - плачи, заговоры и обрядовая поэзия как запас формул
  neighbours:
    - историческая песня (о Грозном, Ермаке, Смуте) — эпос, ближе к конкретной истории
    - духовный стих калик перехожих
    - волшебная сказка — общие мотивы, но иной статус правды
    - скоморошина и былина-пародия, небылица
    - эпос других народов — сербские юнацкие песни, карельские руны
  against:
    - небылица и сказка — старина претендует на правду о бывшем, а не на вымысел для забавы
    - забвение — песня существует, чтобы помнили богатырей и Киев

worldview: >
  Мир устроен вокруг стольного Киева и князя Владимира: Русь окружена степью и чужими силами, и
  богатыри стоят на заставе. Сила дана для службы земле, а не князю лично: богатырь может
  поссориться с Владимиром, но Русь не оставит. Земля — мать сыра земля, она даёт силу пахарю
  (Микула) и не держит лишней силы (Святогор). Прошлое — не легенда, а бывшее, которое надо
  сохранить в точности; сказитель отвечает за старину.

reader: >
  Слушатель — деревенская община, артель промысловиков, собравшаяся на долгий вечер. Он знает
  богатырей, знает формулы и ждёт их, как ждут знакомого напева; удовольствие — в полноте
  и правильности исполнения, а не в неожиданности. Знаток слышит, хорошо ли сказитель «сложил»
  старину, не пропустил ли места.

time: >
  Эпическое время «старины»: абсолютное прошлое, отделённое от слушателя, но прямо с ним
  связанное. Внутри песни время медлит и растягивается — сборы, седлание коня, поездка
  рассказываются подробно, а бой может уместиться в несколько строк. Исторические эпохи
  сливаются: татары, Киев, позднейшие реалии сосуществуют в одном «времени Владимира».

composition:
  principle: цепь типических мест (общих мест), соединённых сюжетом, в раме зачина и исхода
  forms:
    - запев — вступление, не связанное с сюжетом прямо (необязательно)
    - зачин — начало действия, часто пир у князя Владимира
    - типические места — пир, похвальба, снаряжение коня, поездка, распутье, встреча с противником, бой, возвращение
    - исход — концовка, формула завершения песни
  inner: >
    Сюжет движется от пира к выезду, от выезда к испытанию, от испытания к возвращению.
    Повторяющиеся действия рассказываются одними и теми же словами (повторы, троичность),
    ретардация затягивает решающий момент. Типические места кочуют из былины в былину; сказитель
    складывает старину из готовых блоков, но меру, порядок и подробность выбирает сам.

narrator: >
  Сказитель — хранитель старины, не автор. Он поёт речитативом на устойчивый напев, один, обычно
  без инструментального сопровождения на Севере (гусли у Садко — сюжетная деталь, а не обычай
  северных сказителей). Голос эпически спокоен, бесстрастен даже в бою; оценки — через постоянный
  эпитет и через исход, а не через комментарий. Каждый сказитель имеет свою манеру: один
  подробен, другой краток, один любит пир, другой бой.

character: >
  Богатыри — Илья Муромец, Добрыня Никитич, Алёша Попович; старшие — Святогор, Микула
  Селянинович, Вольга (Волх); новгородские — Садко, Василий Буслаев. Князь Владимир и Апраксия.
  Противники — Соловей-разбойник, Идолище поганое, Тугарин Змеевич, Калин-царь, Змей Горыныч.
  Каждый персонаж — тип с закреплёнными чертами: Илья — старый казак, сила и правда; Добрыня —
  вежество и учёность; Алёша — хитрость и бахвальство. Персонаж не развивается, а проявляется.

language: >
  Тонический стих без рифмы: длинная строка с тремя основными ударениями и дактилическим
  окончанием. Постоянные эпитеты (чисто поле, зелено вино, белы руки, мать сыра земля, добрый
  молодец, красна девица, поганые татары), усечённые прилагательные, тавтологические сочетания
  (путь-дороженька), отрицательные сравнения, уменьшительные формы. Гипербола — норма меры:
  палица в сорок пуд, конь скачет выше дерева стоячего. Синтаксический параллелизм внутри строки
  и между строками.

imagery:
  - Киев, гридня, белокаменные палаты, княжеский пир
  - чисто поле, застава, распутье с камнем, широкая дорога
  - богатырский конь, седлание, сбруя из шелков
  - палица, лук, сабля, богатырская сила
  - Волхов, Ильмень, Новгород, корабли Садко и морское царство

themes:
  - защита Руси и Киева от чужих сил
  - богатырь и князь — служба и обида
  - поединок, похвальба и её цена
  - сватовство и добывание невесты
  - сила и её мера (Святогор, Микула)
  - новгородское богатство, удаль и дерзость (Садко, Буслаев)

devices:
  - зачин и исход как устойчивые формулы
  - общие (типические) места, переносимые между сюжетами
  - постоянный эпитет
  - ретардация — замедление перед решающим событием
  - троичность и повтор действия одними словами
  - гипербола силы, оружия, коня, войска
  - отрицательное сравнение («не… а…»)
  - похвальба на пиру как пружина сюжета

genres: [героическая былина, новеллистическая былина, былина-пародия, историческая песня]

forbidden:
  - рифма и строфика книжного стиха
  - психологический анализ, внутренний монолог
  - ирония рассказчика над героем (кроме пародийной ветви)
  - описание без формулы, свои эпитеты вместо постоянных
  - торопливость — пропуск сборов, поездки, повторов
  - современный бытовой словарь

markers:
  - длинная безрифменная строка с тремя ударениями и дактилическим концом
  - есть зачин, типические места и исход
  - постоянные эпитеты на своих местах
  - повторяющиеся действия рассказаны повтором
  - есть гипербола и ретардация
  - голос спокоен и не комментирует

reading: >
  Понятно в былине — значит, слушатель всё время знает, где он: на пиру, в поле, на распутье;
  формулы служат ему вехами, и даже долгая старина не теряет нить. Интересно — когда
  ожидаемое исполнено сполна и с напряжением: ретардация действительно томит, гипербола
  восхищает, бой разрешает затянутое ожидание. Новизна здесь не в сюжете, а в мере и полноте
  исполнения. Былина провалена, если формулы рассыпаны без порядка, если торопится к развязке
  или если рассказчик объясняет то, что должно было быть пропето.

manifesto:
  - Поём о том, что было; старина — не сказка, её не выдумывают.
  - Как пели отцы, так и мы поём; слово в слово, где надо, и своими словами, где можно.
  - Чисто поле всегда чистое, и вино всегда зелено.
  - Не спеши к бою — сначала конь, сбруя и дорога.
  - Сила дана богатырю для земли, а не для похвальбы.
  - Кончил старину — отдай её дальше.

form:
  code: src/mnemosyne/writing/schools/bylina.py
  note: механическая проверка — только одна ось (объём в строках); стих, формулы, порядок типических мест и голос читает внутренний критик по markers и forbidden

