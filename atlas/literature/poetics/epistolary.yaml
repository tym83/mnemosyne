# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: epistolary
name: Эпистолярный роман
art: literature
kind: prose
origin:
  place: Англия, Франция, Германия, Россия
  era: XVIII век — расцвет; ранний пример — «Португальские письма» (1669)
  language: английский, французский, немецкий, русский
  note: >
    Эпистолярный роман вырос из практики частных писем и из сборников образцовых писем. Расцвет —
    1740–1790-е: «Памела» (1740) и «Кларисса» (1748) Сэмюэла Ричардсона, «Юлия, или Новая Элоиза» Руссо
    (1761), «Страдания юного Вертера» Гёте (1774), «Опасные связи» Шодерло де Лакло (1782). В России —
    «Бедные люди» Достоевского (1846), письма Девушкина и Вареньки. В XX веке жанр используют Элис
    Уокер («Цвет пурпурный», 1982), Дэниел Киз и многие другие. Письмо — не просто форма рассказа:
    оно действие, способное изменить судьбу.

lineage:
  predecessors:
    - Овидий, «Героиды» — письма героинь к покинутым возлюбленным
    - «Португальские письма» (1669) — письма монахини, которая писала возлюбленному
    - Ричардсон — «Памела», «Кларисса», письма как исповедь и оружие
    - Руссо, «Новая Элоиза» — письмо как чувство и мысль
    - Гёте, «Вертер» — монолог в письмах, обращённых к другу
  neighbours:
    - Лакло, «Опасные связи» — письма-интрига, письма как оружие
    - Достоевский, «Бедные люди» — письма двух бедных людей, обмен обнаружен сам собой
    - Брэм Стокер, «Дракула» — дневники, письма, телеграммы, газетные вырезки
    - Уилки Коллинз, «Лунный камень» — несколько повествователей
  against:
    - объективный рассказ третьего лица
    - роман без читателя внутри самого романа
    - эпос, в котором события рассказаны с высоты
    - всеведение автора

worldview: >
  Человек раскрывается в письме, адресованном другому: он пишет, чтобы убедить, оправдаться,
  соблазнить, скрыть, и в этом слове видно, кто он на самом деле. Каждый знает только то, что
  знает, и пишет только то, что хочет, и по расхождению писем видна правда. Письмо — событие: оно
  приходит не вовремя, теряется, попадает не в те руки, и судьба поворачивается. Чувство
  вынужденно становится словом, и слово лжёт или разоблачает.

reader: >
  Читатель — тот, кто читает чужую переписку: он знает то, чего не знают корреспонденты, видит
  ложь, предчувствует беду, но не может вмешаться. Он сопоставляет письма разных авторов, ловит
  паузы и недосказанное. Он подглядывающий и соучастник одновременно.

time: >
  Время задано датами писем и их интервалами: сегодня пишут, через неделю получают, через месяц
  отвечают. Разрыв между письмом и ответом — главный источник драмы: за это время всё
  меняется. Время фрагментарно, события пересказаны постфактум, а настоящее — это момент письма.

composition:
  principle: цепь писем разных корреспондентов, где сюжет движется между письмами, а не внутри них; одно письмо потеряно, не получено или без ответа
  forms:
    - роман в письмах двух корреспондентов
    - роман в письмах нескольких корреспондентов с пересечением тайн
    - переписка с пропущенными письмами
    - письма вперемешку с дневником, запиской, телеграммой
  inner: >
    Каждое письмо начинается с даты или места и обращения, заканчивается подписью. В нём
    содержится часть событий и много намерений; слова письма служат цели автора — убедить,
    оправдаться, скрыть. Письма разных людей об одном и том же событии расходятся. Какое-то
    письмо не доходит или не получает ответа: пустота становится событием.

narrator: >
  Нет единого рассказчика: каждый корреспондент говорит от первого лица в своей манере,
  обращаясь к конкретному адресату и потому по-разному в разных письмах. Редактор или издатель
  в предисловии может заявлять, что публикует найденные письма. Автор скрыт за ширмой подлинности.

character: >
  Корреспонденты с разной информацией и разными целями: влюблённые, интриганы, родственники,
  друзья, бедные люди, священник, слуга. Характер раскрыт тем, как человек пишет разным адресатам:
  одно и то же событие в письме к матери и в письме к другу выглядит по-разному. Лжец и
  искренний человек различимы по стилю письма.

language: >
  Язык письма: обращение, формулы вежливости, постскриптум, дата. Лексика меняется с адресатом.
  Эмоция выражена прямо и сдержанно; встречаются недомолвки, оговорки, зачёркнутое. Письма разной
  длины — от записки до многостраничного монолога. Стиль каждого корреспондента отличим.

imagery:
  - почтовая марка, конверт, печать, сургуч
  - перо, чернила, зачёркнутая строка
  - дорога, почтовая карета, почтальон, поздний ответ
  - запертый ящик, найденный пакет писем
  - постскриптум, приписанный в последний миг

themes:
  - любовь и её опасность
  - исповедь, самооправдание, ложь
  - интрига и разоблачение
  - расстояние и разлука
  - неполнота знания — каждый видит часть
  - письмо, пришедшее слишком поздно

devices:
  - письмо как действие
  - несовпадающие версии одного события
  - пропущенное или потерянное письмо
  - даты и интервалы между письмами
  - постскриптум как второе признание
  - ложная подлинность (издатель нашёл письма)
  - различие стиля корреспондентов

genres: [роман в письмах, повесть в письмах, переписка с пропусками, дневник и письма]

forbidden:
  - письмо, в котором автор объясняет события для читателя
  - одинаковый голос у всех корреспондентов
  - письма без адресата, без цели и без даты
  - сюжет, целиком происходящий внутри одного письма
  - всеведущий комментарий вне переписки
  - письма-отчёты без чувства и без интереса говорящего

markers:
  - письма разделены, у каждого дата или место, обращение и подпись
  - у каждого корреспондента своя манера и своя цель
  - версии одного события в разных письмах расходятся
  - одно письмо потеряно, опоздало или осталось без ответа
  - события происходят между письмами
  - в конце письмо приходит слишком поздно или не доходит

reading: >
  Понятно в эпистолярном романе — когда по каждому письму ясно, кто пишет, кому, чего хочет и что
  скрывает; между письмами читатель восстанавливает события. Интересно — когда читатель знает
  больше корреспондентов и видит, как письмо обернётся бедой. Работа провалена, если все
  пишут одинаково, если письма пересказывают события для читателя, а не для адресата, если
  между письмами ничего не происходит.

manifesto:
  - Письмо — не рассказ о событии, а само событие — оно приходит, опаздывает, попадает не в те руки.
  - Каждый пишет, чтобы чего-то добиться, и по цели видно, кто он.
  - Правда живёт в расхождении писем.
  - Самое важное происходит между письмами.
  - Читатель знает больше корреспондентов, и в этом его власть и его мука.
  - Пусть одно письмо потеряется — пустота говорит громче слов.

form:
  code: src/mnemosyne/writing/schools/epistolary.py
  note: механическая проверка — объём и число писем, разделённых строкой из трёх звёздочек; различие голосов, расхождение версий и потерянное письмо читает внутренний критик по markers и forbidden

climate:
  loss: разлука, письмо, пришедшее слишком поздно
  closedness: каждый скрывает своё
  strain: интрига, письмо-оружие
  crowding: несколько корреспондентов, пересечение тайн
  volatility: ответ меняет всё

exemplars:
  - Ричардсон, Памела; Кларисса
  - Руссо, Юлия, или Новая Элоиза
  - Гёте, Страдания юного Вертера
  - Лакло, Опасные связи
  - Достоевский, Бедные люди
  - Стокер, Дракула
  - Коллинз, Лунный камень
  - Овидий, Героиды

texts: все перечисленные — общественное достояние; XX век и позднее — под охраной, только приёмы
