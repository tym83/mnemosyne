# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: polyphony
name: Полифония
art: literature
kind: prose
origin:
  place: Россия — Петербург, Скотопригоньевск, меблированные комнаты, трактир, гостиная
  era: 1860-е — 1880-е; теория — 1929 и 1963
  language: русский
  note: >
    Полифонический роман — не самоназвание, а термин Михаила Бахтина («Проблемы творчества
    Достоевского», 1929, переработано как «Проблемы поэтики Достоевского», 1963). Бахтин показал, что в
    романах Достоевского нет единого авторского сознания, которому подчинены герои: есть несколько
    полноправных сознаний, каждое со своей идеей и своим голосом, и они не сливаются в одну мысль.
    Герой — не объект авторского слова, а субъект собственного. Главная форма — диалог, который не
    разрешается; сюжет строится не вокруг событий, а вокруг столкновений идей.

lineage:
  predecessors:
    - Гоголь — «Нос», «Шинель», двойник, чиновник и его гипербола; Достоевский вышел «из шинели»
    - Пушкин, «Пиковая дама», «Станционный смотритель» — образец, который Достоевский перерабатывал
    - Диккенс и Бальзак — большой город, семья, преступление, судьба в деньгах
    - сократический диалог и мениппея — по Бахтину, древнейшие корни диалогической прозы
    - газетная хроника и уголовный процесс — материал сюжета
  neighbours:
    - Бахтин как читатель — полифония как теория
    - Леонов, Андрей Платонов — менее прямо, ближе по духу
    - Томас Манн, «Волшебная гора» — идейный спор как сюжет
  against:
    - монологический роман, где один автор знает истину и все герои подчинены её свету
    - сюжет, который скрывает и закрывает голоса героев
    - характер как готовая «типическая» фигура
    - спокойное спокойствие эпического мира

worldview: >
  Истина не принадлежит одному сознанию, а рождается и ищется между голосами. Каждый человек — это
  вопрос, обращённый к другому, и ни одна идея не закончена, пока её не оспорили. Мысль у героя
  живая: она проживается как судьба, толкает на поступок, на унижение, на убийство. Человек
  непрозрачен для самого себя и не равен своей роли; он может в любую минуту выйти из неё
  скандалом. Бог, преступление, страдание, свобода обсуждаются всерьёз и без надежды на
  окончательный ответ.

reader: >
  Читатель — свидетель и участник спора: его не ведут к выводу, его ставят среди говорящих, так
  что он вынужден решать, кому верить. Он слышит каждого героя как правого изнутри и потому
  мучится выбором. Его не успокаивает позиция автора, потому что такой позиции нет.

time: >
  Сжатое, лихорадочное время, в котором всё решается в несколько дней или даже часов; сцены
  насыщены событием, как если бы вся жизнь была втиснута в один вечер. Прошлое вторгается
  внезапно — признанием, письмом, давним оскорблением. Время кризиса, порога, где человек способен
  переступить. Развязка часто отложена или оставлена на потом.

composition:
  principle: цепь диалогов и сцен-скандалов, в которых голоса сталкиваются, и кульминация — общая сцена, где все собираются и говорят лишнее
  forms:
    - роман в нескольких встречах-диалогах вокруг одного преступления или события
    - сцена-скандал в гостиной или трактире как центр повести
    - повесть-исповедь, где голос героя спорит с воображаемым собеседником
    - рассказ из двух-трёх разговоров, в которых идея проживается как судьба
  inner: >
    Сцена строится как диалог-событие: реплика меняет положение собеседника, толкает его к признанию
    или оскорблению. Идеи не излагаются, а проговариваются под давлением. В скандале собираются
    все и говорят то, чего не должны были: тайна выходит наружу, маска падает. Между скандалами —
    короткие встречи вдвоём, где продолжается спор. Автор не выносит вердикт.

narrator: >
  Рассказчик-хроникёр, часто неопытный или заинтересованный, который «пересказывает слухи» и сам
  втянут в события; он не знает больше героев. Его слово — одно из голосов, не верховный суд.
  Допустимы исповедь, записки, письмо. Он близок к героям, часто растерян и честен в своей
  растерянности.

character: >
  Идеолог, носитель идеи, человек в лихорадке: студент с теорией, чиновник-пьяница, шут,
  гордая женщина, юродивый, старец, подполье. У каждого своя идея и своя правда, которую можно
  оспорить, но нельзя отбросить. Герои не равны своим ролям и способны на поступок, неожиданный
  даже для себя. Двойники и зеркала.

language: >
  Речь героя — главный материал: каждая реплика звучит своим голосом, с обрывами, повторами,
  оговорками, с «лазейкой» (оговоркой, оставляющей возможность отказаться от сказанного), с
  надрывом и юродством. Диалог перебивается, ускоряется, срывается в крик и шёпот. Ремарки редки
  и нервны. Описание сведено к чему нужно сцене: комната, лестница, дверь.

imagery:
  - лестница, тёмный коридор, каморка, угол в чужой квартире
  - трактир, самовар, гостиная накануне скандала
  - топор, нож, письмо, деньги, пачка ассигнаций
  - петербургский туман, жара, духота, жёлтый свет
  - зеркало и двойник

themes:
  - преступление и совесть
  - свобода и ответственность
  - вера, неверие и страдание
  - гордость и унижение
  - вина, которую делят на всех
  - идея, которая проживается как поступок

devices:
  - равноправные голоса без верховного судьи
  - диалог как событие, меняющее положение говорящих
  - сцена-скандал с общим сбором
  - лазейка в слове
  - двойник и его речь
  - исповедь и записки
  - идея, воплощённая в судьбе

genres: [роман идей, повесть-исповедь, сцена-скандал, записки из подполья, роман-хроника]

forbidden:
  - авторский голос, который знает истину и поправляет героев
  - герой, выражающий только мнение автора
  - монолог без собеседника, чьё слово способно изменить говорящего
  - сцена без события — диалог ради изложения
  - примирение голосов в последней фразе
  - тихий, безболезненный спор

markers:
  - у каждого голоса своя идея, и ни одна не разбита автором
  - диалог меняет положение собеседников
  - есть сцена, где все сходятся и говорят лишнее
  - реплика прерывается, оговаривается, срывается
  - события умещаются в считанные дни или часы
  - в конце спор не решён

reading: >
  Понятно в полифонии — когда в каждой сцене ясно, кто чего хочет, кто кого задел и чем эта реплика
  отличается от предыдущей: идея в голосе героя понятна как его позиция. Интересно — когда читатель
  не знает, кому верить, и на каждом голосе чувствует правоту; когда в скандале говорится то, что
  изменит всё. Работа провалена, если голоса звучат одинаково, если есть «правильный» голос,
  если диалог — просто изложение мнений, или если в конце всё решено.

manifesto:
  - Истина не у автора, а между голосами; пусть ни один из них не победит по приказу.
  - Каждый герой прав изнутри; дай ему право на последнее слово, пока оно не станет предпоследним.
  - Диалог — это событие — после реплики говорящие уже не те, что были до неё.
  - Идея живёт не в трактате, а в человеке, и она толкает его на поступок.
  - Скандал — высшая форма откровенности — пусть все соберутся и скажут лишнее.
  - Не примиряй — если спор решён, значит, ты замолчал героев.

