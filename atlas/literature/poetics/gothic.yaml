# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: gothic
name: Готика
art: literature
kind: prose
origin:
  place: Англия, затем Германия, Франция, США, Россия
  era: 1764 — XIX век; возвращения в XX–XXI веках
  language: английский
  note: >
    Готический роман начинается с «Замка Отранто» Хорейса Уолпола (1764; подзаголовок «готическая
    повесть» — первый случай). Расцвет — 1790-е: Анна Рэдклиф («Удольфские тайны», 1794), Мэтью Льюис
    («Монах», 1796). Дальше жанр расходится: «Франкенштейн» Мэри Шелли (1818), «Мельмот-скиталец»
    Мэтьюрина, «Дракула» Стокера (1897), «Грозовой перевал» (1847) и «Джейн Эйр» (1847) сестёр Бронте,
    рассказы По («Падение дома Ашеров», 1839), «Поворот винта» Джеймса. В России — «Вий» Гоголя,
    «Пиковая дама» Пушкина, Одоевский, А. К. Толстой («Упырь»). Название связано со «средневековым»
    — готическим — зодчеством, а не со стилем письма.

lineage:
  predecessors:
    - Уолпол — «Замок Отранто», призрак и руины
    - Берк, «О возвышенном и прекрасном» (1757) — ужас как источник возвышенного
    - кладбищенская поэзия XVIII века (Юнг, Грей)
    - немецкая «рыцарская» и «разбойничья» проза, Шиллер, Гофман
    - средневековая и народная страшная повесть
  neighbours:
    - Рэдклиф — «объяснённая» готика, где тайна оказывается земной
    - Льюис — жестокая готика, где чудо настоящее
    - Шелли — научная готика, чудовище как творение человека
    - По — готика психики, дом как сознание
    - южная готика Фолкнера, Флэннери О'Коннор — позднее
    - Гофман, «Песочный человек» — немецкая готика как психологическая загадка
  against:
    - рационалистическая трезвость эпохи Просвещения
    - бытовой реализм без тайны
    - комедия нравов
    - литература, которая объясняет всё и сразу

worldview: >
  Рационального порядка недостаточно: прошлое, вина, страсть и смерть возвращаются из-под пола,
  как не погребённые. Старые дома, замки и семьи хранят тайну, и тайна наказывает того, кто
  вошёл. Человек не хозяин рассудка: страх открывает в нём то, что он скрывал от себя. Красота и
  ужас близки; возвышенное страшно. Граница между живым и мёртвым, между своим и чужим
  истончается.

reader: >
  Читатель — гость, которого впускают в дом тайны и не выпускают раньше времени. Он хочет
  бояться и в то же время знать, что находится за дверью; он заводится ожиданием, а не
  самим ужасом. Читатель доверяет рассказчику ровно настолько, чтобы потом сильнее вздрогнуть.

time: >
  Время застывшее и возвращающееся: прошлое присутствует в доме, как призрак. Действие идёт по
  ступеням — прибытие, знак, открытие, возвращение прошлого, последний поворот. Ночь, непогода,
  буря, сумерки; сезон — поздняя осень или зима. Роковая дата — годовщина.

composition:
  principle: ступени страха — прибытие, предзнаменование, открытие тайны, возвращение прошлого, последний поворот, который оставляет ужас живым
  forms:
    - повесть о доме и его тайне
    - рассказ-свидетельство (рукопись, письмо, дневник)
    - рассказ в рамке — гость слушает историю у камина
    - роман о семье и проклятии
  inner: >
    Герой прибывает в дом, замок или местность, чувствует неладное, получает знак
    (предупреждение, шаги, портрет, непогода). Далее открывается тайна, связанная с давней виной.
    Прошлое возвращается в виде призрака, двойника, безумия. Последний поворот — не облегчение:
    ужас остаётся, хотя тайна раскрыта. Страх строится недомолвками, угадыванием, ожиданием.

narrator: >
  Рассказчик — свидетель, часто неопытный, поверивший сначала в рациональное объяснение; он
  пишет «для потомства» или рассказывает у камина. Может быть и безличный повествователь с
  вкрадчивым, напряжённым голосом. Доверие к его словам постепенно подрывается, и это часть
  ужаса.

character: >
  Одинокий герой, чужак в доме; хозяин с тайной — граф, аббат, затворник; женщина в беде или
  женщина-призрак; слуга, знающий больше, чем говорит; двойник; безумец. Характер раскрывается
  через страх, влечение к запретному и вину. Люди обречены роком рода.

language: >
  Плотная, торжественная, чуть архаичная речь, насыщенная архитектурой и погодой: «стрельчатые окна»,
  «сырые коридоры», «ветер завывал». Периоды нарастают к кульминации, короткие фразы — на
  открытии. Эпитеты мрачные, но точные; недосказанное сильнее названного. Звуки и тени — главный
  материал.

imagery:
  - старый дом, замок, монастырь, склеп
  - коридор, лестница, потайная дверь, подвал
  - портрет, зеркало, свеча, часы
  - буря, туман, болото, ворон, кладбище
  - окно, из которого кто-то смотрит
  - рукопись, письмо, медальон

themes:
  - тайна рода и родовая вина
  - прошлое, которое возвращается
  - безумие и граница рассудка
  - запретная страсть
  - двойник и разделённое «я»
  - смерть, которая не отпускает

devices:
  - дом как носитель тайны
  - ступенчатое нарастание страха
  - предзнаменование и ожидание
  - рассказчик-свидетель, чьё доверие подорвано
  - недосказанность вместо показа ужаса
  - возвращение прошлого — призрак, портрет, двойник
  - погода и архитектура как настроение

genres: [готическая повесть, страшный рассказ, рассказ-рукопись, рассказ в рамке, роман о проклятии]

forbidden:
  - юмор, разрушающий напряжение
  - полное рациональное объяснение, снимающее ужас
  - ужас напоказ, без ожидания и подготовки
  - современная бытовая обстановка без тайны
  - рассказчик, который с самого начала знает всё
  - финал облегчения, где тайна раскрыта и страх исчез

markers:
  - есть дом, замок или место с историей
  - страх нарастает по ступеням
  - в начале предзнаменование, в конце поворот без облегчения
  - рассказчик свидетельствует и теряет доверие к своему рассудку
  - ужас в недосказанном, не в описании чудовища
  - погода и архитектура разделяют настроение героя

reading: >
  Понятно в готике — когда читатель всегда знает, где он находится в доме и что надо бояться,
  какая тайна ждёт и чем она связана с прошлым. Интересно — когда ожидание растёт, и страшно не
  от того, что показано, а от того, что вот-вот откроется. Работа провалена, если страх
  объяснён и снят, если дом — просто декорация, если ужас без предзнаменований, если
  рассказчик заранее всё знает.

manifesto:
  - Рассудка недостаточно — под полом лежит то, что не похоронили.
  - Дом помнит то, что люди забыли, и рано или поздно расскажет.
  - Страх нарастает по ступеням — сначала знак, потом шаги, потом дверь.
  - Не показывай чудовище — ожидание страшнее.
  - Рассказчику верят ровно до тех пор, пока он сам в себе не усомнится.
  - Раскрытая тайна не снимает ужаса — она только даёт ему имя.

