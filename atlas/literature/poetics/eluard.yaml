# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: eluard
name: Элюар и сюрреализм
art: literature
kind: poetry
origin:
  place: Франция, Париж
  era: 1920–1952 (от дадаизма и сюрреализма до послевоенной поэзии)
  language: французский
  note: >
    Поль Элюар (настоящее имя Эжен Грендель, 1895–1952) пришёл в литературу через войну и
    парижский дадаизм, стал одним из основателей сюрреализма рядом с Андре Бретоном, чей «Манифест
    сюрреализма» (1924) определил сюрреализм как психический автоматизм, освобождённый от контроля
    разума и от эстетических и моральных забот. Элюар участвовал в коллективных опытах — с Бретоном
    написал «Непорочное зачатие» (1930), с Бенжаменом Пере — «152 пословицы на потребу дня» (1925),
    — но его собственная поэзия уходит от чистого автоматизма к ясности: сон и случай дают материал,
    а стих отбирает и проясняет. В 1938 году он порвал с Бретоном; в годы оккупации стал поэтом
    Сопротивления, и его «Свобода» из сборника «Поэзия и правда 1942» разошлась по Франции в
    подпольных изданиях и листовках.

lineage:
  predecessors:
    - Лотреамон и Рембо — разрушение условной логики образа, ясновидение
    - Аполлинер — новый дух, слово «сюрреализм» и свобода от описательности
    - Пьер Реверди — образ как сближение двух далёких реальностей; чем дальше и вернее связь, тем сильнее образ (статья «Образ», 1918, которую Бретон приводит в «Манифесте»)
    - Фрейд — сон, бессознательное, желание как сила
    - дадаизм — разрыв с литературой как институтом
  neighbours:
    - Бретон, Арагон, Пере, Деснос, Супо — сюрреалисты первого круга
    - живописцы-сюрреалисты и друзья Элюара — Макс Эрнст, Ман Рэй, Пикассо, Дали, Миро; совместные книги стихов и изображений
    - поэзия Сопротивления — Арагон, Деснос, Шар
  against:
    - логика, рациональный контроль и «реалистическая установка», которую Бретон в «Манифесте» обвиняет в посредственности
    - литература как ремесло и карьера, поэзия как украшение
    - описание мира вместо его преображения
    - позднее у самого Элюара — герметизм и чистый автоматизм, если стих перестаёт быть обращением к человеку

worldview: >
  Видимый мир не единственный: сон, желание и случай вскрывают в нём другую, более истинную
  реальность (сюрреальность), где противоположности сходятся. Для Элюара путь к ней лежит через
  любовь: любимая — не предмет стиха, а способ видеть, через неё мир становится прозрачным и
  единым. Поэзия — не личная собственность, она принадлежит всем и должна вернуть людям зрение;
  отсюда переход от частной любви к братству и от сюрреализма к поэзии Сопротивления без измены
  себе. Свобода, любовь и поэзия — одно движение.

reader: >
  Читатель — не расшифровщик, а тот, кому возвращают взгляд. Стихи Элюара не требуют ключа: в них
  нет учёных аллюзий, слова простые, но сочетаются невозможно, и читатель должен принять образ,
  не переводя его в логику. Поздний Элюар обращается к каждому — к товарищу, к любой женщине, к
  народу, — и стих рассчитан на то, чтобы его повторяли вслух.

time: >
  Время мгновения встречи и озарения: стих фиксирует вспышку, в которой мир виден целым. Часто
  время отменено — прошлое и будущее сливаются в присутствии любимой. В военной лирике время
  становится историческим (оккупация, ожидание освобождения), но и там оно стягивается к
  настоящему обращения.

composition:
  principle: стихотворение строится как цепь образов, держащаяся не логикой, а повтором и обращением
  forms:
    - короткая лирическая пьеса из нескольких строк
    - анафорическая литания — «Свобода», где каждая строфа повторяет один ход и последняя называет адресата
    - стихотворение в прозе и афоризм
    - коллективный текст и совместная книга с живописцем
    - сборник как цикл любви (к Гала, к Нюш, к Доминик)
  inner: >
    Строки самостоятельны и прозрачны, каждая даёт образ; целое держится на анафоре, обращении
    к «ты», параллелизме и нарастании. Последняя строка часто называет то, к чему стремилось всё
    стихотворение, — имя, любовь, свободу.

narrator: >
  Лирическое «я», почти лишённое биографии и рефлексии: это взгляд влюблённого, глядящего через
  любимую на мир. «Я» легко переходит в «мы». Голос тихий, ясный, без риторической громкости даже в
  политических стихах; доверительный, как будто говорит одному человеку.

character: >
  Любимая — главная фигура и не персонаж: она лицо, глаза, руки, через которые виден мир; её
  имя то названо, то растворено. Позднее — товарищи, расстрелянные, народ, «все». Никакой
  психологии и сюжета: присутствие, а не характер.

language: >
  Предельно простая лексика — глаза, руки, свет, вода, хлеб, птицы, стекло, огонь, — соединённая
  в невозможные пары. Отказ от пышной метафоры и от высокого слога; образ возникает из
  сближения далёких вещей, но без нагромождения. Синтаксис ясен, строки короткие, часто
  законченные предложения; повтор и анафора создают музыку без регулярного метра. Прозрачность —
  главный идеал: сквозь слова должно быть видно.

imagery:
  - глаза и взгляд, лицо любимой, руки
  - свет, прозрачность, стекло, зеркало, вода
  - небо, птицы, крылья, листья, плоды
  - хлеб, огонь, дом, окно — простые вещи
  - земля, синяя как апельсин; невозможное сходство как норма

themes:
  - любовь как способ видеть и знать мир
  - прозрачность и единство мира
  - сон, желание, случай
  - свобода, братство, сопротивление
  - боль, утрата и возвращение надежды
  - поэзия как общее достояние

devices:
  - сближение далёких реальностей в одном образе
  - анафора и литания
  - обращение к «ты», переходящее в обращение ко всем
  - перечень простых вещей, из которых складывается мир
  - афоризм и перевёрнутая пословица
  - называние в финале — имя, ради которого писался стих
  - автоматическое письмо как источник, а не как метод готового текста

genres: [любовная лирика, литания, стихотворение в прозе, афоризм, гражданская лирика Сопротивления, совместная книга с живописцем]

forbidden:
  - логическое объяснение образа и аллегория с ключом
  - пышная риторика, нагромождение метафор, эффект ради эффекта
  - описание вместо видения
  - учёная аллюзия, требующая комментария
  - ирония, снимающая чувство
  - темнота, за которой ничего не стоит

markers:
  - слова простые, а сочетания невозможные
  - образ держится сам, без объяснения, и его можно увидеть
  - стих обращён к кому-то — к любимой, к другу, ко всем
  - есть повтор или анафора, задающие музыку
  - свет и прозрачность — в лексике и в построении
  - финал называет или открывает то, ради чего всё было

reading: >
  Понятно у Элюара — не значит объяснимо: логическая связь образа может отсутствовать, и это
  законно. Понятным должно быть каждое слово и сама интонация — к кому и с каким чувством
  обращён стих; читатель должен увидеть образ, а не разгадать его. Интересно — когда невозможная
  пара вещей вспыхивает и держит читателя, меняя его зрение, а повтор ведёт к финальному
  называнию. Темнота провальна, если за ней нет образа, если слова сложны, а не сочетания, или
  если сближение произвольно и не даёт ни света, ни чувства.

manifesto:
  - Вслед за Лотреамоном — поэзию делают все, а не один; поэт возвращает людям их собственное зрение.
  - Любовь — не тема, а глаза, которыми смотрят на мир.
  - Чем дальше вещи и вернее их связь, тем сильнее образ.
  - Сон даёт материал, но стих должен быть ясен, как стекло.
  - Простые слова, сведённые невозможным образом, говорят больше учёных.
  - Свобода — последнее слово, к которому ведут все строфы.

form:
  code: src/mnemosyne/writing/schools/eluard.py
  note: механическая проверка — только одна ось (строфы, анафора); прозрачность, образ и обращение читает внутренний критик по markers и forbidden

climate:
  turbulence: от любовной лирики к гражданской, литания крепнет, обращение ко всем
  loss: боль и прозрачность горя, как в стихах после смерти Нюш
  renewal: надежда, свет, возвращённое зрение
  closedness: тянется к сюрреалистической темноте, образ резче и дальше
  novelty: сближения неожиданнее, ход от сна и случая
  strain: свобода как ставка, стих короче и твёрже
  steadiness: ровная прозрачность любовной лирики

exemplars:
  - Столица боли (1926)
  - Любовь поэзия (1929)
  - Непорочное зачатие, с Бретоном (1930)
  - Общественная роза (1934)
  - Плодоносные глаза (1936)
  - Поэзия и правда 1942 — со стихотворением «Свобода»
  - Время выходит из берегов (1947)
  - Бретон, Манифест сюрреализма (1924); Реверди, статья «Образ» (1918)
texts: под охраной (Элюар умер в 1952, сроки различаются по юрисдикциям, с военными продлениями); берутся только приёмы, не текст. Манифест Бретона под охраной; переводы — по статусу переводчика
