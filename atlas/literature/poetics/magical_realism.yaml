# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: magical_realism
name: Магический реализм
art: literature
kind: prose
origin:
  place: Колумбия, Карибское побережье; шире — Латинская Америка
  era: 1950-е — 1980-е; «бум» латиноамериканской прозы
  language: испанский
  note: >
    Школа связана с «Сто лет одиночества» (1967) Габриэля Гарсиа Маркеса, но корни шире. Алехо
    Карпентьер в предисловии к «Царству земному» (1949) выдвинул понятие «чудесной действительности»
    (lo real maravilloso): в Латинской Америке чудесное живёт в самой реальности, истории и вере, и
    писателю не нужно его выдумывать. Мигель Анхель Астуриас, Хуан Рульфо («Педро Парамо», 1955), Хорхе
    Амаду, позднее Исабель Альенде продолжили линию. Маркес говорил, что научился тону у бабушки,
    которая рассказывала о невозможном с совершенно невозмутимым лицом.

lineage:
  predecessors:
    - Карпентьер — «чудесная действительность», барочное изобилие
    - Астуриас — индейский миф в языке и в сюжете («Легенды Гватемалы»)
    - Рульфо — мёртвые, которые говорят в селе, где время остановилось
    - Борхес и Кортасар — фантастическое в городской, интеллектуальной прозе
    - Фолкнер — вымышленный округ как вселенная; Маркес прямо у него учился
    - Кафка — невозмутимость тона перед абсурдом («Превращение»)
    - Рабле и барочные хроники конкисты — гипербола, перечисление, простодушие
  neighbours:
    - Амаду, Альенде, Фуэнтес — латиноамериканский «бум»
    - Салман Рушди, «Дети полуночи» — магический реализм в Индии
    - Бабель, Булгаков — менее прямо, чудо в быту истории
  against:
    - европейская «фантастика», в которой чудо удивляет и пугает
    - научное объяснение чудесного
    - сухой «объективный» реализм, не видящий невидимого
    - романтика экзотики для приезжих

worldview: >
  Реальность шире того, что признаёт рациональный взгляд: чудо, суеверие, память мёртвых и
  политическое насилие существуют в одном ряду и одинаково реальны для тех, кто там живёт.
  История повторяется кругом; поколения возвращаются к одним именам и одним ошибкам, и одиночество
  — наследственная болезнь рода. Память хрупка, и забвение — такая же эпидемия, как бессонница.
  Мир не заколдован и не объяснён: он просто таков.

reader: >
  Читатель — слушатель семейных преданий, которому верят как своему: рассказчик не оправдывается
  и не просит поверить. Читатель принимает чудо наравне с фактом и благодаря этому сильнее
  чувствует реальное: войну, нищету, жестокость. Он ищет в хронике родословную собственных
  повторений.

time: >
  Циклическое: семья проходит одни и те же круги, имена и судьбы возвращаются через поколения.
  Хроника идёт не по прямой, а петлями, с забеганием вперёд и воспоминанием назад; первая фраза
  заглядывает из будущего в прошлое. Время то растягивается (дождь идёт четыре года), то сжимается
  (сто лет за одну книгу). Конец уже известен в начале.

composition:
  principle: хроника рода по поколениям, где повторяются имена и судьбы, а чудо вписано в быт без объяснений
  forms:
    - семейная сага из нескольких поколений
    - хроника городка или деревни, ведущаяся как предание
    - короткий рассказ-быль о чуде, рассказанный вполголоса
    - роман о диктаторе, чья власть — тоже чудо и миф
  inner: >
    Книга открывается фразой, глядящей из будущего на прошлое («Много лет спустя, перед
    расстрелом…»). Дальше — поколение за поколением, с возвращающимися именами: вместе с именем
    передаётся характер. Чудеса приходят в обычный день и обычной интонацией, рядом с налогами и
    войной. Пророчество — часто в рукописи, которую читают слишком поздно. Конец замыкает круг.

narrator: >
  Хроникёр рода, говорящий спокойным, обстоятельным голосом, как будто пересказывает то, что все
  знают. Он не удивляется чудесному и не объясняет его; зато очень точен в мелочах: числа, имена,
  даты. Тон бабушки, которая рассказывает страшное и невероятное с одинаково невозмутимым лицом.

character: >
  Члены одного рода и жители городка: упрямые, одинокие, страстные, часто одержимые одной идеей.
  Имена повторяются (Аурелиано, Хосе Аркадио), и вместе с ними повторяются характер и судьба.
  Женщины — хранительницы дома и памяти, мужчины — основатели, воины, мечтатели, безумцы. Мёртвые
  остаются среди живых.

language: >
  Плотная, широкая, неторопливая проза с длинными периодами, перечислениями, точными числами
  («четыре года, одиннадцать месяцев и два дня»). Гипербола подана арифметически и потому
  правдоподобна. Чудо описано бытовым языком: вознесение — как стирка и бельё, которое улетело
  вместе с женщиной. Метафор мало: чудо — не сравнение, а факт.

imagery:
  - дождь, который идёт годами; жара; пыль; жёлтые цветы
  - дом, который растёт, ветшает и поглощается природой
  - лёд, магниты, цыгане с диковинками
  - мёртвые, которые приходят в гости; призраки в быту
  - поезд, банановая компания, война и расстрел
  - рукопись, которую никто не может прочитать до конца

themes:
  - одиночество как родовая болезнь
  - память и забвение
  - повторение истории по кругу
  - власть, война, насилие
  - любовь как стихия
  - судьба, которая известна заранее и всё-таки сбывается

devices:
  - прозрение из будущего в первой фразе
  - возвращающиеся имена и наследуемый характер
  - гипербола с точным числом
  - чудо в бытовой интонации
  - циклическое время, петли
  - пророческая рукопись
  - эпидемия вместо сюжета (бессонница, забвение)

genres: [семейная сага, хроника городка, роман о диктаторе, рассказ-быль]

forbidden:
  - удивление рассказчика перед чудом
  - объяснение чуда (наукой, сном, безумием)
  - чудо, не связанное с судьбой людей
  - линейное время без возвращений
  - гипербола без числа и без точности
  - герой без рода, без родины, без имени-эха

markers:
  - первая фраза глядит из будущего в прошлое
  - несколько поколений одного рода, имена возвращаются
  - чудо рассказано как быт, без удивления
  - в тексте есть точное число у чего-то невозможного
  - события повторяются кругами
  - в конце круг замыкается или рукопись прочитана слишком поздно

reading: >
  Понятно в магическом реализме — когда за хроникой прослеживаются род и имена: читатель знает,
  кто чей потомок и кто на кого похож. Чудо при этом не требует объяснения: оно ясно как факт.
  Интересно — когда необычное оказывается сильнее обычного, а обычное — страшнее необычного; когда
  читатель замечает, что история повторяется. Работа провалена, если рассказчик удивляется или
  объясняет, если чудо — украшение без последствия, если поколения неразличимы.

manifesto:
  - Рассказывай о невозможном тем же тоном, что и о налогах.
  - Чудо не нуждается в объяснении — оно часть того, как живут.
  - Преувеличивай точно — у каждого дождя есть число дней.
  - Имя — это судьба; пусть оно возвращается, и вместе с ним возвращается характер.
  - История ходит кругом, и первая фраза уже знает последнюю.
  - Забвение — болезнь народа; хроника — его лекарство.

form:
  code: src/mnemosyne/writing/schools/magical_realism.py
  note: механическая проверка — объём и число блоков по числу поколений; тон чуда, возвращающиеся имена и прозрение первой фразы читает внутренний критик по markers и forbidden

climate:
  age: смена поколений, имена возвращаются
  loss: забвение, эпидемия забвения
  closedness: одиночество рода, дом, закрытый от мира
  steadiness: жара, дождь, то, что не меняется
  volatility: война, банановая компания, чудо врывается в быт
  scars: пророчество, которое уже исполнилось

exemplars:
  - Гарсиа Маркес, Сто лет одиночества
  - Гарсиа Маркес, Осень патриарха
  - Гарсиа Маркес, Хроника объявленной смерти
