  note: механическая проверка — объём и число обращений к слушателю (вопросы и восклицания); голос, переиначенные слова и зазор между рассказчиком и читателем читает внутренний критик по markers и forbidden

climate:
  closedness: замкнутая среда, чья речь — отдельный язык
  crowding: ярмарка, очередь, коммуналка, говорят все сразу
  steadiness: быт, в котором случай становится былью
  loss: утраченное мастерство, уходящий мир
  renewal: чудо как возвращение веры

