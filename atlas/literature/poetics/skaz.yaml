# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: skaz
name: Сказ
art: literature
kind: prose
origin:
  place: Россия — Петербург, провинция, трактир, ярмарка, кают-компания, коммуналка
  era: 1830-е — 1930-е
  language: русский
  note: >
    Термин «сказ» ввёл Борис Эйхенбаум в статье «Как сделана „Шинель“ Гоголя» (1918) и в статье «Иллюзия
    сказа» (1918): это ориентация на устную речь рассказчика, который не автор. Главные мастера —
    Николай Лесков («Левша», «Очарованный странник», «Запечатлённый ангел»), Михаил Зощенко
    («Рассказы Назара Ильича господина Синебрюхова»), ранний Бабель, Алексей Ремизов, Павел
    Бажов («Малахитовая шкатулка», уральские сказы). Бахтин рассматривал сказ как «чужое слово» внутри
    авторской речи.

lineage:
  predecessors:
    - Гоголь — «Вечера на хуторе близ Диканьки» (рассказчик Рудый Панько), «Шинель»
    - Даль — «Казак Луганский», живое слово и пословица
    - фольклорный сказитель, ярмарочный и балаганный балагур
    - Пушкин, «Повести Белкина» — рассказчик как маска
  neighbours:
    - Лесков — речь народа, перевранные слова, народная этимология
    - Зощенко — речь обывателя, канцелярит и «простая» мысль
    - Бажов — уральский рассказчик дед Слышко
    - Бабель — одесский рассказчик, ироничная высокая речь
    - Ремизов — стилизация старорусской речи
  against:
    - литературный язык, ровный и «правильный»
    - объективный автор вне речи героев
    - психологический анализ, который знает героя лучше, чем он сам
    - гладкое «писательское» письмо

worldview: >
  Правда мира — в слове человека, который рассказывает о нём по-своему, и его речь есть
  мировоззрение. Простой человек видит вещи со своей точки зрения и с абсолютной уверенностью;
  автор и читатель видят, что он видит неправильно, или видят больше. Из этого зазора рождаются юмор,
  сострадание и правда. Язык народа богаче и точнее литературного: он сам изобретает, переиначивает,
  вкладывает в слово свою историю.

reader: >
  Читатель — слушатель, с которым рассказчик разговаривает: его окликают, ему подмигивают, у него
  просят согласия. Он считывает два уровня сразу — буквальный смысл слов рассказчика и то, что за
  ними на самом деле. Смеётся и жалеет одновременно.

time: >
  Время рассказывания: «вот было дело», «давненько это было». Рассказчик ведёт события в своём
  порядке, перескакивает, возвращается, добавляет «ещё вот что». События прошлого пересказаны как
  случай, анекдот, быль. Часто присутствует момент рассказывания — вагон, трактир, дорога.

composition:
  principle: рассказ, который держится на голосе рассказчика — отступления, обращения к слушателю, собственная логика и мораль, которой автор не разделяет
  forms:
    - рассказ-быль от лица очевидца
    - анекдот, развёрнутый в историю
    - сказ с рамкой — слушатели и обстановка рассказывания
    - цикл сказов одного рассказчика
  inner: >
    Начало — вход в разговор («Вот, значит, как дело было»). Дальше события идут в порядке
    рассказчика, с отступлениями, которые ему важнее сюжета, и с обращениями к слушателю.
    Развязка — мораль рассказчика, которая либо наивна, либо противоположна тому, что видит читатель.
    Финал — слово на прощание.

narrator: >
  Рассказчик — не автор, а носитель речи: унтер-офицер, торговка, кучер, чиновник, мастеровой,
  странник. Говорит от первого лица как бы вслух и для кого-то. У него свои любимые слова, свои
  неправильности, своя логика. Он уверен в своей правоте, и эта уверенность — главный комический и
  человеческий материал.

character: >
  Человек из народа или мелкой среды, чья речь определяет характер: хвастун, простак, плут, мастер,
  праведник, обыватель. Герои сказа — часто и сам рассказчик, и те, о ком он рассказывает, увиденные
  его глазами. Они наивны, упорны, склонны к чуду и к ошибке.

language: >
  Устная речь, воспроизведённая письмом: перестановки слов, присловья («то есть», «значит»,
  «как говорится»), народная этимология и переиначенные чужие слова — мелкоскоп вместо микроскопа —,
  неологизмы, канцелярит, пословицы, неправильные ударения и падежи. Короткие обрывистые фразы
  вперемешку с длинными закрученными. Прямая речь вплетена в повествование. Вопросы и
  восклицания к слушателю.

imagery:
  - дорога, ярмарка, трактир, станция
  - инструменты, вещи, тонкая работа мастера (подкованная блоха)
  - церковь, икона, чудо
  - казённая бумага, чин, начальство
  - коммуналка, очередь, баня, трамвай
  - еда, выпивка, одёжка

themes:
  - простодушный человек против власти или обстоятельств
  - мастерство и пренебрежение к мастеру
  - чудо в обыденной жизни
  - малые люди и большие слова
  - наивная вера, обман и самообман
  - гордость и унижение русского человека

devices:
  - речь рассказчика как главный материал
  - обращение к слушателю
  - народная этимология и словесная игра
  - зазор между словами рассказчика и тем, что видит читатель
  - отступления, «вот ещё что»
  - присловья и словечки-паразиты как характеристика
  - анекдотическая композиция

genres: [сказ, быль, байка, рассказ-анекдот, уральский сказ, цикл сказов]

forbidden:
  - гладкий литературный язык
  - авторское «объективное» описание вне речи рассказчика
  - рассказчик, который всё понимает и всё объясняет правильно
  - мораль от автора, не от рассказчика
  - стилизация в виде набора старинных слов без живой речи
  - голос без слушателя — монолог в пустоту

markers:
  - слышен конкретный человек — кто он, из каких слов говорит
  - в тексте есть обращения к слушателю, вопросы, восклицания
  - слова переиначены, перепутаны, придуманы
  - читатель видит больше, чем рассказчик
  - отступления важны рассказчику не меньше сюжета
  - конец — слово рассказчика, а не автора

reading: >
  Понятно в сказе — когда слышен рассказчик: кто он, чем гордится, чего не понимает; читатель
  улавливает событие сквозь его слова. Интересно — когда за словом рассказчика читатель видит
  больше и одновременно смеётся и жалеет. Работа провалена, если рассказчик говорит
  литературным языком, если речь — набор приёмов без характера, если автор поправляет
  рассказчика, или если слушателя нет.

manifesto:
  - Слово рассказчика — не украшение сюжета, а сам сюжет.
  - Пиши так, как говорят, и слышь, кто говорит.
  - Пусть рассказчик знает меньше читателя и верит в своё знание.
  - Переиначенное слово — не ошибка, а изобретение народа.
  - Говори с кем-то — у сказа всегда есть слушатель.
  - Не поправляй рассказчика — смех и жалость рождаются в зазоре между его словом и правдой.

form:
