# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: haiku
name: Хайку
art: literature
kind: poetry
origin:
  place: Япония — Эдо, Киото, Осака, дороги провинций; позднее Токио
  era: XVII–XIX века (Басё, Бусон, Исса), рубеж XIX–XX (Сики)
  language: японский
  note: >
    Хайку выросло из хокку — начальной строфы цепной поэзии хайкай-но рэнга, которую сочиняли
    вместе, по очереди. Хокку должно было быть цельным, с сезонным словом и паузой, потому что
    задавало тон всей цепи. Басё и его школа (Сёмон) сделали хокку самостоятельным высоким
    искусством, не отказываясь от рэнку; Масаока Сики в конце XIX века утвердил название «хайку» и
    окончательно отделил стих от цепи, сделав его авторским. Японский стих считает не слоги, а
    моры (он), поэтому 5-7-5 — счёт звуковых единиц, а не европейских слогов; переводы и
    иноязычные хайку держат не счёт, а краткость, три шага и разрез.

lineage:
  predecessors:
    - вака и танка — пятистишие придворной лирики, её сезонный канон и словарь поэтических мест
    - рэнга и хайкай-но рэнга — цепная поэзия, откуда взято хокку
    - китайская поэзия (Ду Фу, Ли Бо) и дзэнская словесность, которые Басё читал и цитировал
    - эстетика югэн из вака и театра Но — сокровенная глубина, видимое как намёк на невидимое
  neighbours:
    - сэнрю — та же форма без сезонного слова, о людях и нравах, с усмешкой
    - хайбун — проза путевого дневника, перемежаемая хайку
    - хайга — рисунок тушью с хайку на листе (Бусон как художник)
    - рэнку — продолжение цепной поэзии, в которой хайку остаётся началом
  against:
    - словесная игра и каламбур школ Тэймон и Данрин, от которых Басё уходит к простоте
    - цукинами — затёртое, «помесячное» сочинительство по шаблону, против которого восстал Сики
    - высокопарность и книжная условность, когда сезон назван, но не увиден

worldview: >
  Мир непостоянен, и в этом его правда: всё проходит, и каждое мгновение единственно. Человек не
  стоит над природой, он одна из её вещей, и поэт не объясняет мир, а замечает. Ваби — красота
  бедного, неполного, простого; саби — патина времени, одиночество и тишина старого. Неизменное
  проявляется только через изменчивое (фуэки рюко у Басё): вечное видно в сегодняшней лягушке и
  сегодняшнем дожде. Смысл не сообщают, его оставляют в паузе.

reader: >
  Читатель — участник, как партнёр по цепи рэнга: стих даёт два образа и разрез между ними, а связь
  достраивает он. Он знает сезонный канон, поэтому одно слово (вишня, цикада, первый снег) включает
  в нём целую погоду, время дня и настроение. Хайку не договаривает, рассчитывая на то, что читатель
  услышит остальное сам.

time: >
  Настоящее мгновение, схваченное в одной точке года. Сезонное слово (киго) ставит стих в круг
  годовых перемен: время циклическое, природное, а не историческое. Внутри стиха часто два времени
  — длительное и мгновенное (старый пруд и всплеск), и разрез сталкивает их.

composition:
  principle: два образа, соединённые разрезом; смысл возникает в зазоре между ними
  forms:
    - три отрезка 5-7-5 он (в японском — одна вертикальная строка, в переводе — три строки)
    - хайку в цепи рэнку как начальная строфа
    - хайку внутри хайбун, завершающее прозаический фрагмент
    - свободное хайку без строгого счёта — ветвь XX века, наследники Сики
  inner: >
    Кирэдзи (режущее слово — я, кана, кэри и другие) делит стих на две неравные части: обычно
    неизменный фон и сиюминутное событие, или крупное и малое. Части не связаны логикой; их соединяет
    созвучие настроения, контраст или неожиданное сходство. В переводе разрез держится паузой, тире,
    переходом строки.

narrator: >
  Голос почти безличен: поэт присутствует как взгляд, путник, монах, бедный житель, но не как
  рассуждающий субъект. У Басё — странник на дороге; у Бусона — живописец, видящий сцену с
  чётким светом и цветом; у Иссы — человек, говорящий с мухой и воробьём на равных, с жалостью и
  юмором; у Сики — наблюдатель, рисующий с натуры (сясэй).

character: >
  Персонажей почти нет; есть существа и вещи: лягушка, ворона на ветке, улитка, цикада, светляк,
  конь, путник, нищий, ребёнок. Каждое существо — само по себе, а не символ, и малое достойно
  взгляда наравне с великим.

language: >
  Простота и точность: конкретное имя вещи, мало прилагательных, нет абстракций. Каруми — поздний
  идеал Басё: лёгкость, обыденная речь, отказ от тяжести смысла и эффекта. Саби, сиори (сострадательная
  «гибкость»), хосоми (тонкость) — оттенки тона, а не приёмы. Язык не толкует собственных образов и не
  называет чувства; чувство передаётся сочетанием вещей и паузой.

imagery:
  - сезонные знаки — вишня, слива, кукушка, цикада, луна осени, первый снег, туман
  - вода, пруд, дождь, река в половодье, роса
  - малые существа — лягушка, улитка, муха, воробей, светляк
  - дорога, ночлег, старый храм, заброшенное поле, бедное жилище
  - свет и звук на грани тишины — колокол, крик птицы, всплеск

themes:
  - непостоянство и мимолётность
  - одиночество и тишина как полнота
  - путь и странствие
  - сострадание к малому и слабому (особенно Исса)
  - бедность, старость, смерть без пафоса
  - красота обыденного

devices:
  - киго — сезонное слово, по канону сайдзики
  - кирэдзи — разрез, пауза или поворот между двумя образами
  - сопоставление (ториавасэ) двух образов без связки
  - сдвиг масштаба — огромное и крошечное рядом
  - звук или движение, подчёркивающие тишину
  - сясэй — эскиз с натуры, наблюдение вместо вымысла (Сики)
  - лёгкая усмешка над собой и миром без сатиры

genres: [хайку, хокку в цепи рэнку, хайбун, хайга, путевой дневник]

forbidden:
  - объяснение образа и мораль в конце
  - метафора, которую нужно расшифровывать, и прямое называние чувства
  - абстрактные слова (вечность, душа, тоска) вместо вещей
  - больше двух образов, перегруженная картина
  - пафос, восклицание, ораторская интонация
  - сезон, названный по шаблону и не увиденный

markers:
  - есть указание на время года, явное или через предмет
  - есть разрез, и два образа по обе стороны держатся вместе без связки
  - всё названное конкретно и видимо или слышимо
  - чувство не названо, но возникает от сочетания вещей
  - стих краток, и из него нельзя убрать ни слова, не потеряв картину
  - после чтения остаётся пауза, в которой читатель видит больше сказанного

reading: >
  Понятно в хайку — значит увидено: читатель с первого прочтения представляет картину, сезон и
  место, ни одно слово не требует комментария. Интересно — когда в разрезе возникает искра: два
  простых образа вместе дают то, чего нет ни в одном из них, и это прибавление читатель находит сам.
  Темнота допустима только как недосказанность связи, но не как неясность вещей. Хайку провалено, если
  картина ясна и на этом всё кончается (иллюстрация к календарю), или если связь между частями
  объяснена, или если за образом виден нарочитый символ.

manifesto:
  - О сосне учатся у сосны — поэт идёт к вещи, а не тянет её к себе.
  - Не говори, что тебе грустно; покажи вещь, рядом с которой грустно.
  - Год ходит по кругу, и каждое слово знает своё время года.
  - Два образа и пауза между ними; всё остальное скажет читатель.
  - Вечное видно только в сегодняшнем, и сегодняшнее — лишь отражение вечного.
  - Чем легче стих, тем больше в нём помещается.

form:
  code: src/mnemosyne/writing/schools/haiku.py
  note: механическая проверка — только одна ось (три строки, 5-7-5 там, где можно считать); киго, разрез и тон читает внутренний критик по markers и forbidden

climate:
  steadiness: неподвижная картина, один сезон, тишина
  loss: тянется к саби — увядание, пустой дом, осенний вечер
  age: патина, старый пруд, старый храм
  turbulence: разрез становится резче, образы сталкиваются, а не созвучат
  renewal: весенние киго, первое — первый снег, первый крик кукушки
  crowding: отбирает одну вещь из множества, сопротивляется перечню
  scars: малое и раненое существо в центре внимания, сострадание по Иссе

exemplars:
  - Басё, хокку о старом пруде и лягушке (1686)
  - Басё, Оку-но хосомити (путевой дневник с хайку, путешествие 1689)
  - Бусон, хокку и хайга
  - Исса, Ора га хару (записки 1819 года)
  - Сики, хайку и критические статьи о хайку
texts: общественное достояние (японские оригиналы); русские переводы — по статусу переводчика (переводы Веры Марковой под охраной)
