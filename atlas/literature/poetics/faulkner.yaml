# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: faulkner
name: Фолкнер
art: literature
kind: prose
origin:
  place: США, Юг — вымышленный округ Йокнапатофа, штат Миссисипи
  era: 1929–1962
  language: английский (американский Юг)
  note: >
    Уильям Фолкнер создал вымышленный округ Йокнапатофа с городом Джефферсон и сквозными семьями —
    Сарторисы, Компсоны, Сатпены, Сноупсы, — и в нём написал большинство своих книг. Главные
    формальные открытия — «Шум и ярость» (1929), где одна семья рассказана четырьмя голосами в четырёх
    частях; «Когда я умирала» (1930) — 59 коротких глав от лица 15 рассказчиков, каждая названа именем
    говорящего; «Авессалом, Авессалом!» (1936), где история Сатпена пересказана и достроена несколькими
    рассказчиками, не знающими всей правды. Нобелевская премия — 1949. Прошлое у Фолкнера «не умерло, оно
    даже не прошло».

lineage:
  predecessors:
    - Конрад — несколько рассказчиков вокруг одного события, «Лорд Джим»
    - Джойс и Вулф — внутренний монолог, поток сознания
    - Шервуд Андерсон — провинциальный Юг и Средний Запад
    - Бытовое южное предание — рассказы старших о Гражданской войне
    - Библия и греческая трагедия — родовая вина, наследственное проклятие
  neighbours:
    - Флэннери О'Коннор, Каррен Маккалерс, Роберт Пенн Уоррен — южная готика
    - Гарсиа Маркес — Макондо как учебник у Фолкнера
    - Вирджиния Вулф — смена сознаний
  against:
    - единый всеведущий рассказчик с готовой версией событий
    - прогрессистский миф Севера и ностальгический миф «благородного Юга» одновременно
    - краткая, чистая американская проза
    - линейная хронология

worldview: >
  Прошлое — не позади, а вокруг: вина рода и края передаётся из поколения в поколение и определяет
  поступок. Событие не имеет одной версии: его рассказывают несколько людей, каждый знает часть,
  придумывает остальное и защищает себя. Человек — не изолированное «я», а звено в цепи
  предков; каждый голос в своей слепоте правдив. Рабство и поражение Юга — рана, которую не
  залечили. Выдержка и терпение — единственное, что остаётся людям, живущим на этой земле.

reader: >
  Читатель — следователь, которому дают показания нескольких свидетелей: он сопоставляет, ловит
  противоречия, достраивает целое. Ему не помогают, и терпеливый читатель вознаграждается
  внезапным пониманием, когда версии наконец складываются, хотя бы на миг. Он не получает
  «всей правды», потому что её нет ни у кого.

time: >
  Прошлое вторгается в настоящее, как в мыслях говорящих; хронология нарушена, события
  всплывают ассоциациями. Всё происходит «сейчас», но «сейчас» нагружено поколениями. Время рода
  — столетие, время главы — один монолог или один час, время события — центр, вокруг которого
  вращаются голоса.

composition:
  principle: одно событие, рассказанное несколькими голосами, в главах, каждая из которых подписана именем говорящего
  forms:
    - роман в главах-монологах разных рассказчиков
    - рассказ из нескольких голосов, каждый со своей версией
    - хроника рода, пересказанная несколькими поколениями
    - короткая проза одного голоса, внутри которого слышны предки
  inner: >
    Глава начинается с имени говорящего. Затем идёт его монолог — со своей лексикой, своей
    памятью, своей слепотой. Голоса дополняют и опровергают друг друга; центральное событие
    не рассказано напрямую ни одним. К концу читатель собирает картину и понимает, что целого нет.
    Последняя глава может быть самой короткой или самой чужой.

narrator: >
  Нет единого рассказчика: каждая глава принадлежит конкретному человеку — ребёнку, пьянице,
  вдове, плотнику, студенту, юристу. Голос звучит так, как говорит этот человек, со своей
  диалектной окраской и своим словарём. Автор остаётся за сценой. В целом книга — хор
  несогласных свидетелей.

character: >
  Люди одного края и одного прошлого: потомки плантаторов, белая беднота, чёрные слуги и их семьи,
  юристы, лавочники, фермеры. Каждый — носитель родовой вины или родовой выдержки. Характеры
  раскрыты тем, что они говорят, и тем, что они не замечают в себе. Аутсайдеры и безумцы
  показывают то, что скрывают нормальные.

language: >
  Длинные, закрученные, периодические фразы с вложенными придаточными; нарастающий ритм,
  библейская торжественность, соединённая с южной разговорностью. У каждого голоса свой
  словарь: детский лепет, пьяные обрывки, юридическая точность, деревенская речь. Пометки
  вроде имён и курсива сигнализируют переход. Повторы и мотивы скрепляют главы.

imagery:
  - усадьба в упадке, веранда, колонны, заросший сад
  - пыль, жара, магнолии, река, болото
  - телега, гроб, дорога
  - лошадь, ружьё, охота
  - часы, которые ломают или ненавидят
  - поколения на фотографии, родовой портрет

themes:
  - прошлое, которое не умерло
  - вина рода и края, рабство и поражение
  - распад семьи и усадьбы
  - смерть и похороны как испытание близких
  - слепота и ненадёжность свидетельства
  - выдержка людей, которые остаются

devices:
  - несколько рассказчиков
  - заглавие главы — имя говорящего
  - несогласные версии одного события
  - внутренний монолог и поток сознания
  - длинная периодическая фраза
  - нарушенная хронология
  - диалектная речь как характеристика

genres: [роман голосов, семейная хроника, южная готика, рассказ из нескольких голосов]

forbidden:
  - единый всезнающий рассказчик
  - одинаковый голос у всех рассказчиков
  - хронологически выстроенное изложение без вторжения прошлого
  - объяснение события одним голосом как окончательной правды
  - глава без имени говорящего
  - победа одной версии

markers:
  - каждая глава подписана именем говорящего
  - у каждого голоса свои слова и своя слепота
  - версии одного события не совпадают
  - прошлое вторгается в настоящее главы
  - ни один голос не знает всего
  - фразы длинные, с вложенными придаточными, где нужно

reading: >
  Понятно у Фолкнера — когда в каждой главе слышен её говорящий: кто он, что видит, что помнит и
  чего не хочет видеть; из глав складывается событие, хотя бы приблизительно. Интересно — когда
  читатель замечает расхождения между версиями и по ним угадывает правду, которой нет ни у кого.
  Работа провалена, если голоса одинаковы, если один из них «главный», если глава — не монолог
  человека, а авторское описание, или если события изложены хронологически и без противоречий.

manifesto:
  - Событие не имеет одной версии; пусть его расскажут несколько людей, и ни один не будет прав.
  - Подпиши главу именем говорящего — пусть читатель знает, чьё это слово.
  - Прошлое не умерло, оно даже не прошло.
  - Каждый голос слеп по-своему, и по слепоте его узнают.
  - Фраза должна быть такой длинной, как память.
  - Не собирай целое за читателя — пусть он сам решит, что видел.

form:
