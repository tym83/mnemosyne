  loss: смерть близкого, охлаждение, утраченная иллюзия
  scars: старая обида, которая объясняет нынешний поступок
  closedness: самообман, герой не видит себя
  steadiness: ровный быт, в котором работает мелкое душевное событие
  renewal: пробуждение, поздний взгляд на свою жизнь

