# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: psychological_realism
name: Психологический реализм
art: literature
kind: prose
origin:
  place: Россия и Франция — усадьба, провинция, столица, редакции толстых журналов
  era: 1850-е — 1900-е
  language: русский, французский
  note: >
    Школа сложилась в большом романе середины XIX века. Метод Толстого Чернышевский назвал «диалектикой души»,
    разбирая в 1856 году «Детство», «Отрочество» и военные рассказы:
    писатель следит не за результатом чувства, а за самим его течением, за тем, как одно движение души
    переходит в другое. Флобер («Госпожа Бовари», 1857) довёл до точности соединение внутренней жизни
    и вещного мира, выработал «несобственно-прямую речь» и требование безличности автора. Чехов в
    больших рассказах и повестях («Скучная история», «Дуэль», «Дама с собачкой», «Невеста») соединил это
    с краткостью и отказом от развязки. От короткого минимализма Карвера школа отличается тем, что
    внутренняя жизнь здесь именно рассказана, а не угадана.

lineage:
  predecessors:
    - Стендаль — анализ страсти и самолюбия, «Красное и чёрное»
    - Лермонтов, «Герой нашего времени» — исследование «истории души человеческой»
    - Тургенев — тонкая психологическая пейзажность, «Дворянское гнездо»
    - Толстой — «диалектика души», внутренний монолог, «Анна Каренина», «Смерть Ивана Ильича»
    - Флобер — несобственно-прямая речь, безличность автора, «Воспитание чувств»
  neighbours:
    - Джордж Элиот, «Миддлмарч» — моральная психология провинции
    - Генри Джеймс — тонкая точка зрения, сознание как сцена
    - Чехов (длинная проза) — психологизм без морали и развязки
    - Бунин — телесная память и точная чувственная деталь
  against:
    - романтический герой, объяснённый судьбой или страстью без причин
    - занимательный сюжет, где характер лишь двигает интригу
    - минимализм умолчания, где чувства вообще не называются
    - проповедь, в которой автор заранее знает, кто прав

worldview: >
  Человек — не единое «я», а поток противоречащих друг другу движений: самолюбие, жалость, скука,
  желание нравиться, стыд. Поступок вырастает из длинной цепи малых душевных событий, и честный
  писатель обязан эту цепь проследить. Люди обманывают себя, и самообман — главный предмет
  исследования. Время меняет человека исподволь, и перелом чаще совершается в обыденной минуте, чем
  в грандиозном событии. Автор не судит, но понимает, и понимание — форма справедливости.

reader: >
  Читатель — внимательный собеседник, который способен узнать в чужом самообмане свой. Его не
  торопят: ему доверяют долгое чтение, он должен уметь удерживать несколько душевных линий сразу и
  замечать, где герой лжёт себе, а рассказчик это тихо показывает. После чтения он понимает чужой
  поступок изнутри и поэтому не торопится судить.

time: >
  Протяжённое время жизни: день, который вместит всю судьбу, сезон, год, десятилетие. Прошлое
  входит как память героя, будущее — как его ожидание и ошибка ожидания. Время течёт неровно:
  важные минуты растянуты до страницы, годы пролетают в одной фразе. Герой к концу не тот, что в
  начале, и изменение прослежено в мелочах, а не объявлено.

composition:
  principle: цепь сцен, в каждой из которых душевное движение героя находит причину и следствие; к концу изменение накоплено
  forms:
    - повесть из нескольких сцен, разделённых временем
    - рассказ одного дня, вмещающий судьбу
    - история одного самообмана — от возникновения до крушения
    - роман-хроника семьи или брака
  inner: >
    Сцена начинается с положения героя и обстановки, затем рассказ входит в его сознание и идёт за
    ним шаг за шагом: желание, помеха, стыд, оправдание, решение. Между сценами проходит время, и
    разрыв отмечен переменой в герое. Финал не обязан быть развязкой, но должен показывать, что
    герой увидел или не захотел увидеть.

narrator: >
  Знающий рассказчик в третьем лице, который то держится на расстоянии, то сливает свой голос с
  мыслью героя (несобственно-прямая речь), так что граница между «он подумал» и «автор сказал»
  стирается. Он видит больше героя, но тактичен: не объясняет всё, а замечает, где герой
  себя обманывает. Не поучает.

character: >
  Люди своей среды и времени, живые и противоречивые: помещик, чиновник, жена, врач, студент,
  мать. Характер раскрыт через цепь мотивов, а не через черту; у каждого поступка есть причина в
  чувстве, и причина эта часто неприглядна или стыдна. Второстепенные лица тоже обладают
  собственной внутренней жизнью.

language: >
  Ясная, плотная проза, сложные периоды там, где мысль движется ступенями, и короткие фразы там,
  где решение падает. Слова причины («потому что», «оттого что», «и тут она подумала») — рабочий
  инструмент. Точная вещная деталь соединена с душевным движением: рука на спинке стула, звук
  шагов. Метафора редка и служит мысли, не украшению.

imagery:
  - дом, усадьба, гостиная, кабинет, купе вагона
  - письмо, визитная карточка, зеркало, часы
  - погода и время года как состояние, но не как символ
  - жест, выражение лица, взгляд, который замечают и истолковывают неверно
  - вещи, свидетельствующие о прошедших годах

themes:
  - самообман и его цена
  - брак, измена, охлаждение, привычка
  - стыд, самолюбие, совесть
  - смерть и пробуждение перед ней
  - расхождение между тем, как человек видит себя, и тем, каков он
  - тихая перемена, которую никто не заметил

devices:
  - диалектика души — прослеженная цепь душевных движений
  - несобственно-прямая речь
  - внутренний монолог
  - причинная мотивировка поступка
  - вещная деталь, связанная с чувством
  - сжатие и растяжение времени
  - разрыв между словами героя и его мыслью

genres: [повесть, большой рассказ, роман, роман-хроника, рассказ одного дня]

forbidden:
  - называть чувство без причины и без хода (она была несчастна — и всё)
  - внешний сюжет, который выполняет работу характера
  - нравоучение от автора
  - герой, неизменный от начала до конца
  - молчание вместо анализа — чувства здесь рассказаны
  - случайность вместо мотива в решающем поступке

markers:
  - мысль героя и голос рассказчика переходят друг в друга
  - у каждого важного поступка прослежена причина в чувстве
  - прошло время, и герой изменился
  - обман себя замечен рассказчиком, но не высмеян
  - вещная деталь несёт душевное состояние
  - в конце герой видит или не хочет видеть

reading: >
  Понятно в психологическом реализме — когда читатель на каждом шагу знает, почему герой так
  делает: цепь причин прослежена, ни одно решение не упало с неба. Интересно — когда читатель
  узнаёт в этих мотивах свои, неприглядные, и когда видит больше героя: рассказчик тихо показывает
  самообман. Работа провалена, если чувства только названы, если характер сводится к одной черте,
  если герой не изменился, или если рассказчик поучает.

manifesto:
  - Следи за самим движением души, а не за его итогом.
  - У каждого поступка есть причина в чувстве, и причина эта чаще стыдная, чем благородная.
  - Человек обманывает себя, и показать этот обман — значит понять его.
  - Время делает свою работу в мелочах; к концу герой уже другой.
  - Рассказчик слит с героем настолько, чтобы понимать, и отстранён настолько, чтобы видеть.
  - Не суди и не проповедуй — понимание — достаточная справедливость.

