# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: fairy_tale
name: Волшебная сказка
art: literature
kind: prose
origin:
  place: повсеместно у восточных славян; общий сюжетный фонд — с европейской и шире индоевропейской сказкой
  era: устное бытование с незапамятных времён; записи и собрания — с XVIII–XIX веков
  language: русский (и его говоры); сюжеты международны
  note: >
    Волшебная сказка не имеет автора: её рассказывают сказочники, и каждый рассказывает по-своему,
    сохраняя сюжет и формулы, но меняя подробности, порядок эпизодов, имена. Главное русское собрание
    — «Народные русские сказки» А. Н. Афанасьева (выпуски 1855–1863). Поэтику жанра описал
    В. Я. Пропп в «Морфологии сказки» (1928): при бесконечном разнообразии персонажей число и
    порядок их функций ограничены и постоянны. Позже, в «Исторических корнях волшебной сказки»
    (1946), Пропп возводил её композицию к обряду посвящения и представлениям о мире мёртвых — это
    гипотеза, а не общепринятый факт. Международные указатели сюжетов (Аарне — Томпсон, затем
    Утер) относят волшебные сказки к отдельному разделу.

lineage:
  predecessors:
    - миф и обряд (по Проппу — посвятительный обряд и представления о загробном пути)
    - архаические представления о тотемном помощнике, о лесе как границе миров
  neighbours:
    - сказка о животных и бытовая (новеллистическая) сказка — другие разделы сказочного фонда
    - былина — общие мотивы змееборства и добывания невесты, но иной статус правды
    - быличка и бывальщина — рассказ о встрече с нечистой силой, который выдаётся за правду
    - литературная сказка — Пушкин, Ершов, позднее авторские переработки
    - европейские собрания — Перро, братья Гримм
  against:
    - быличка — сказка не выдаёт себя за правду, её вымышленность объявлена формулой
    - бытовая достоверность и психологическое правдоподобие

worldview: >
  Мир делится на свой и иной: дом, царство отца — и тридесятое царство за лесом, морем, под землёй.
  Беда или недостача выталкивает героя из своего мира; в ином мире действуют чудесные законы, и
  герой проходит их с помощью дарителя и волшебного помощника. Добро и зло отчётливы,
  справедливость торжествует, слабый и младший (дурак, падчерица) оказывается избранным. Чудесное
  не удивляет никого внутри сказки: оно — часть устройства мира.

reader: >
  Слушатель — ребёнок или взрослый на посиделках; он знает, что сказка — вымысел, и принимает
  условность, объявленную зачином. Ему важно не «что будет», а «как будет»: он знает, что
  младший победит, и наслаждается тем, как именно. Повторы и формулы для него — удовольствие
  узнавания и ритм, которому можно подпевать.

time: >
  Время сказки неопределённо и отделено от времени слушателя: «жили-были», «в некотором царстве».
  Внутри — время пути: «долго ли, коротко ли», годы проходят в одной фразе, а испытание в три ночи
  рассказано подробно. Возраста почти не меняются, время не оставляет следов; после свадьбы
  сказка кончается, потому что время героя дальше не интересно.

composition:
  principle: цепь функций в постоянном порядке — от вредительства или недостачи через испытания к их ликвидации и свадьбе
  forms:
    - одноходовая сказка — одна недостача, одно путешествие
    - многоходовая — после возвращения новое вредительство, новый ход
    - сказка с ложным героем и трудной задачей во втором ходе
    - сказка с присказкой и концовкой
  inner: >
    По Проппу — тридцать одна функция (отлучка, запрет, нарушение, разведка, выдача, подвох,
    пособничество, вредительство или недостача, посредничество, начинающееся противодействие,
    отправка, первая функция дарителя, реакция героя, получение волшебного средства, перемещение,
    борьба, клеймение, победа, ликвидация беды, возвращение, преследование, спасение, неузнанное
    прибытие, необоснованные притязания, трудная задача, решение, узнавание, обличение,
    трансфигурация, наказание, свадьба). Не всякая сказка содержит все функции, но порядок тех, что
    есть, не нарушается. Испытания утроены, третье решает.

narrator: >
  Сказочник — исполнитель, а не автор: он открывает сказку формулой, ведёт её спокойным ритмичным
  сказом и закрывает концовкой, иногда шутливой, с переходом к слушателям. Голос объективен и не
  оценивает героев иначе как через сюжет; сказочник волен в подробностях, но не в устройстве.

character: >
  По Проппу — семь ролей (кругов действий): вредитель (антагонист), даритель, волшебный помощник,
  царевна (искомый персонаж) и её отец, отправитель, герой, ложный герой. Одно лицо может играть
  несколько ролей, одна роль — распределяться между несколькими лицами. Персонажи плоски и
  определены действием, а не внутренним миром: Иван-царевич, Иван-дурак, Баба-яга, Кощей,
  Морской царь, Василиса Премудрая, серый волк, Сивка-бурка.

language: >
  Формульная, ритмизованная, рифмованная в зачине и концовке речь. Постоянные эпитеты и
  устойчивые обороты (красна девица, добрый молодец, тёмный лес, сказка сказывается, да не скоро
  дело делается). Троичность в языке и в событиях. Простота синтаксиса, прямая речь в
  формулах-заклинаниях («Избушка, избушка…»). Чудесное называется так же буднично, как
  обыденное.

imagery:
  - тридесятое царство, дремучий лес, море-океан, подземное царство
  - избушка на курьих ножках, огненная река, калинов мост
  - волшебные предметы — клубок, ковёр-самолёт, скатерть-самобранка, живая и мёртвая вода
  - чудесные животные — серый волк, конь, щука, жар-птица
  - смерть Кощея, спрятанная в яйце, утке, сундуке

themes:
  - беда или недостача и её восполнение
  - испытание и инициация
  - младший, слабый, гонимый как избранный
  - добывание невесты и чудесного предмета
  - справедливое воздаяние

devices:
  - зачин и концовка — формулы входа в сказку и выхода из неё
  - присказка — шутливое вступление, не связанное с сюжетом
  - троичность испытаний, братьев, царств
  - повтор эпизода одними словами
  - формула пути («долго ли, коротко ли»)
  - задачи-загадки и их решение
  - запрет и его нарушение как пружина сюжета

genres: [волшебная сказка, сказка-присказка, многоходовая сказка, литературная сказка как наследник]

forbidden:
  - психологическая мотивировка и внутренний монолог
  - объяснение чудесного
  - нарушение порядка функций
  - открытый финал и неопределённость добра и зла
  - историческая или бытовая конкретика вместо «некоторого царства»
  - ирония над сказкой изнутри неё

markers:
  - есть недостача или беда, путь в иной мир и её восполнение
  - функции идут в узнаваемом порядке
  - испытания утроены, третье — решающее
  - персонажи определены ролью и действием
  - есть зачин и концовка
  - чудесное подано как обычное

reading: >
  Понятно в волшебной сказке — значит, слушатель в любой момент знает, чего не хватает и куда
  идёт герой; роль каждого персонажа ясна по его первому поступку. Интересно — когда знакомый
  ход наполнен новыми, конкретными чудесами: испытание остроумно, помощник неожидан, третье
  испытание действительно труднее первых. Сказка провалена, если в ней нет недостачи (некуда
  идти), если чудо объяснено, если порядок сломан так, что награда приходит раньше пути, или если
  повторы механичны и не нарастают.

manifesto:
  - Сказка — вымысел, и мы этого не скрываем; правда в ней — в устройстве, а не в событиях.
  - Чего-то не хватает — значит, пора в путь.
  - В ином царстве свои законы; кто их соблюдает, тот проходит.
  - Три раза — первый — для пробы, второй — для страха, третий — для победы.
  - Младший, слабый и осмеянный получит царевну.
  - Сказочник меняет слова, но не порядок.

form:
  code: src/mnemosyne/writing/schools/fairy_tale.py
  note: механическая проверка — только одна ось (порядок функций по Проппу); формулы, троичность, роли и тон читает внутренний критик по markers и forbidden

climate:
  loss: недостача острее, путь дальше, тридесятое глубже
  turbulence: второй ход, преследование, ложный герой
  strain: трудные задачи, запреты, смертельное испытание
  renewal: живая и мёртвая вода, трансфигурация, свадьба
  closedness: иное царство замкнуто, вход и выход через границу
  abundance: волшебные предметы, пир, царство в награду
  steadiness: одноходовая сказка, формулы крепче

exemplars:
  - Афанасьев, Народные русские сказки (1855–1863) — Марья Моревна, Царевна-лягушка, Иван-царевич и серый волк, Василиса Прекрасная, Сивка-бурка, Морозко
  - Пропп, Морфология сказки (1928)
  - Пропп, Исторические корни волшебной сказки (1946)
texts: сказки — фольклор, общественное достояние; собрание Афанасьева свободно; работы Проппа под охраной в РФ — берутся только понятия и схема, не текст
