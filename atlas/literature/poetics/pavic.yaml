# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: pavic
name: Павич
art: literature
kind: prose
origin:
  place: Сербия, Белград
  era: 1970–2009
  language: сербский
  note: >
    Павич — историк литературы, исследователь сербского барокко и византийского наследия
    (Венцлович, Орфелин, переход от средневековой к новой сербской литературе). Его проза растёт
    из этой учёности: барочная проповедь, житие, лексикон, апокриф, комментарий.

lineage:
  predecessors:
    - византийская словесность: лексиконы, патерики, жития, полемические трактаты
    - сербское барокко XVIII века (Гаврил Стефанович Венцлович): проповедь, притча, орнаментальное слово
    - Стерн как разрушитель линейного романа
    - Борхес: вымышленная учёность, библиотека, зеркало, лабиринт
  neighbours:
    - Кортасар, «Игра в классики»: читатель выбирает порядок
    - Кальвино, Эко: комбинаторика, книга о книгах
    - сам Павич стоит особняком от европейского постмодерна: корни у него не в иронии над традицией, а в барокко и Византии
  against:
    - роман как «улица с односторонним движением»: одно начало, один конец, одна причинная цепь
    - психологический реализм с объяснёнными мотивами
    - единая авторитетная версия истории

worldview: >
  Реальность многослойна и проницаема: явь, сон и текст переходят друг в друга. Сон — не образ
  сознания, а другое пространство, где люди разных веков встречаются и действуют. История —
  совокупность несогласных свидетельств, а не одна правда; малый народ живёт между империями и
  верами, и память о нём держится в книгах, которые сами становятся судьбой. Смерть и любовь —
  переходы, а не конец; вещи, тело и буквы хранят память и обладают силой.

reader: >
  Читатель — соавтор и действующее лицо. Он выбирает порядок чтения, вход и выход, версию,
  экземпляр; от его маршрута зависит, какую книгу он прочёл. Книга — предмет, которым пользуются:
  словарь, кроссворд, колода таро, клепсидра, гороскоп, меню.

time: >
  Обратимое и сквозное. Эпохи прошиты одним сюжетом (XVII и XX век у «Хазарского словаря»);
  персонажи встречаются через века во снах; события повторяются со сдвигом, будто время
  перелистывают, а не проживают.

composition:
  principle: нелинейная книга-предмет; сюжет не излагается, а собирается читателем из фрагментов
  forms:
    - лексикон: статьи, перекрёстные ссылки, несколько книг-источников
    - кроссворд: главы читаются «по горизонтали» и «по вертикали»
    - клепсидра: два начала с разных обложек, встречаются в середине
    - колода таро: главы-карты, порядок по раскладу
    - гороскоп, путеводитель, меню
  inner: >
    Внутри фрагмента — законченная притча или анекдот с поворотом; целое связывает не причинность,
    а повтор мотивов, сквозные персонажи и ссылки.

narrator: >
  Множество голосов-источников: летописец, комментатор, составитель словаря, свидетель другой
  веры. Голос стилизован под документ (статья, житие, донесение, протокол), но речь в нём
  притчевая и чудесная. Авторская речь и псевдодокумент неразличимы.

character: >
  Персонаж — носитель знака и судьбы, а не психологии: у него есть дар, проклятие, ремесло
  (ловец снов, каллиграф, музыкант, переписчик), чудесная примета тела. Персонажи двоятся и
  отражаются друг в друге через века.

language: >
  Афористичность и парадокс: фраза-притча, которую хочется выписать. Барочная орнаментальность,
  гипербола, катахреза, развёрнутые сравнения через вещи, еду, тело и ремесло. Эротика как способ
  знания. Ритм проповеди и сказа, чередование учёной точности (даты, имена, «источники») с
  чудесным, поданным без удивления.

imagery:
  - сны и ловцы снов; сон как место
  - зеркала, двойники, отражения
  - буквы, книги, письмена на теле, смертельное чтение
  - вещи с памятью и судьбой: музыкальные инструменты, ключи, ткани, посуда
  - превращения тела, животные-знаки, ветер, вода, Дунай, Константинополь

themes:
  - исчезнувший народ и память о нём
  - спор вер и версий; присвоение истории
  - любовь как охота, поединок и узнавание
  - смерть как переход, бессмертие в тексте
  - сербская и византийская история, барокко, Европа на границе империй

devices:
  - статья словаря о вымышленном лице, поданная как справка
  - одно событие в двух-трёх несогласных свидетельствах (у разных статей, не в одной)
  - сквозной персонаж, появляющийся в разных веках
  - сон, в котором действует другой персонаж, и последствия сна наяву
  - мнимый источник: апокриф, утраченная рукопись, комментарий к комментарию
  - различие экземпляров в одном месте (мужской/женский экземпляр)
  - притча в одну фразу как вывод статьи

genres: [роман-лексикон, роман-кроссворд, роман-клепсидра, роман-таро, роман-гороскоп, рассказ-притча, пьеса-меню]

forbidden:
  - линейный сюжет, который понятен при чтении подряд и только подряд
  - объяснение чудесного и психологическая мотивировка
  - ирония, разоблачающая чудо
  - одна авторитетная версия
  - бытовой реализм как самоцель

markers:
  - фрагменты можно читать в разном порядке, и смысл меняется от маршрута
  - чудесное подано тоном справки или хроники
  - есть хотя бы одна фраза-притча с парадоксом
  - время сквозное: встреча через эпохи, сон или повтор
  - вещь, тело или буква обладают силой или памятью

manifesto:
  - Книга не улица с односторонним движением: в неё входят и выходят где хотят.
  - Читатель пишет роман вместе с автором; его маршрут и есть сюжет.
  - Сон — такое же место действия, как город, и в нём встречаются люди разных веков.
  - Истина о прошлом — это несогласные свидетельства, и ни одно не главное.
  - Чудесное рассказывают тоном летописи, без удивления и без объяснений.
  - Каждый фрагмент должен держаться сам, как притча; целое держится на ссылках и повторе.

form:
  code: src/mnemosyne/writing/schools/pavic.py
  note: механическая проверка — только одна ось; остальное читает внутренний критик по markers и forbidden

climate:
  loss: исчезнувший народ, утраченная рукопись
  density: множатся ссылки и сквозные персонажи
  volatility: множатся версии и сны
  closedness: книга-предмет, герметичный лексикон

exemplars:
  - Хазарский словарь (1984)
  - Пейзаж, нарисованный чаем (1988)
  - Внутренняя сторона ветра (1991)
  - Последняя любовь в Константинополе (1994)
  - Звёздная мантия (2000)
  - Уникальный предмет (2004)
texts: под охраной; берутся только приёмы, не текст
