# Language teachers: public-domain authors whose language can be imitated
# from exemplars, plus their own devices (from letters, lectures, criticism).
- id: chekhov
  name: "Антон Чехов"
  devices: ["подтекст важнее сказанного", "нет авторской оценки", "деталь вместо описания", "открытый финал", "краткость"]
  language: "простой, точный синтаксис; короткие абзацы; ирония без нажима"
- id: gogol
  name: "Николай Гоголь"
  devices: ["гротеск", "лирические отступления", "перечисления", "сказ"]
  language: "длинные периоды, неожиданные сравнения, разговорная интонация рассказчика"
- id: platonov
  name: "Андрей Платонов"
  devices: ["смысловые сдвиги в сочетаниях слов", "канцелярит, ставший метафизикой", "наивный взгляд на вещи"]
  language: "неправильно-точные словосочетания; отвлечённые понятия рядом с бытом; медленная фраза"
- id: leskov
  name: "Николай Лесков"
  devices: ["сказ от лица рассказчика из народа", "народная этимология", "праведник как герой"]
  language: "пёстрая речь, просторечие и церковнославянизмы рядом"
- id: kharms
  name: "Даниил Хармс"
  devices: ["абсурд", "обрыв", "повтор", "невозмутимость"]
  language: "предельно короткие фразы; протокольная интонация"
- id: babel
  name: "Исаак Бабель"
  devices: ["сжатие", "яркая неожиданная метафора", "жестокость рядом с нежностью"]
  language: "короткие насыщенные фразы, каждая с образом"
- id: eluard
  name: "Поль Элюар"
  devices: ["анафора, как в «Свободе» («Я пишу твоё имя»)", "любовь и свобода как одно", "свет, глаза, прозрачность", "простые слова в невозможных сочетаниях"]
  language: "короткие прозрачные строки; повтор как дыхание; почти без метафорического нажима"
  exemplars_note: "оригиналы по-французски в общественном достоянии; русские переводы под охраной — образцы только французские"
- id: apollinaire
  name: "Гийом Аполлинер"
  devices: ["стихи без знаков препинания", "каллиграммы — стих как рисунок", "город и любовь, мост и река", "смешение древнего и современного"]
  language: "плавная интонация без пунктуации; повторы как припев («Под мостом Мирабо…»)"
  exemplars_note: "оригиналы по-французски в общественном достоянии"
- id: prevert
  name: "Жак Превер"
  devices: ["разговорная простота", "перечисления-каталоги", "бытовая сцена как притча", "нежность и ирония"]
  language: "простые короткие фразы, бытовые слова, рефрены"
  exemplars_note: "тексты под охраной — только приёмы, без образцов"
