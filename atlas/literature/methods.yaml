# Methods: how a skeleton becomes a story. Rules, not adjectives.
- id: realism
  name: "Реализм"
  hero: "типический характер в типических обстоятельствах; поступки вытекают из среды и характера"
  causality: "подробная социальная и психологическая причинность"
  time: "линейное, с редкими возвратами"
  narrator: "всеведущий или близкое третье лицо"
  ending: "закономерный, не обязательно счастливый"
  forbidden: ["чудесное", "авторские лозунги"]
- id: socialist-realism
  name: "Соцреализм"
  hero: "из народа; начинает стихийным, заканчивает сознательным"
  causality: "историческая необходимость; беда — испытание на пути"
  time: "линейное"
  narrator: "всеведущий, сочувствующий герою"
  ending: "оптимистический; личное совпадает с общим"
  master_plot: ["задание", "стихийность", "наставник", "испытание", "жертва", "сознательность", "награда"]
  required: ["функция помощника становится наставником", "коллектив"]
  forbidden: ["ирония к герою", "открытый финал", "ненадёжный рассказчик"]
- id: modernism
  name: "Модернизм"
  hero: "сознание, а не характер; внешнее событие преломлено изнутри"
  causality: "ассоциативная; связь через образы и память"
  time: "субъективное, сломанное; день может длиться страницу, минута — главу"
  narrator: "поток сознания или несобственно-прямая речь"
  ending: "смысловой сдвиг вместо развязки"
  devices: ["мифологический метод: под бытом проступает миф", "лейтмотивы-образы"]
- id: absurd
  name: "Абсурд"
  hero: "человек, ведущий себя разумно в неразумном мире"
  causality: "сломана нарочно; все ведут себя так, будто она есть"
  time: "линейное, но с провалами и повторами"
  narrator: "невозмутимый, протокольный"
  ending: "обрыв или повтор начала"
  forbidden: ["объяснение абсурда", "мораль"]
- id: magical-realism
  name: "Магический реализм"
  hero: "обычные люди"
  causality: "реалистическая, но чудесное входит в неё как обыденное"
  time: "циклическое, семейное"
  narrator: "спокойный рассказчик, которого чудо не удивляет"
  ending: "чудо остаётся необъяснённым"
  required: ["одно чудо, поданное как бытовой факт"]
- id: parable
  name: "Притча (Кафка)"
  hero: "безымянный человек перед законом, дверью, учреждением"
  causality: "логика сна: строгая и непостижимая"
  time: "вне времени"
  narrator: "ровный, почти протокольный"
  ending: "открытие, которое ничего не меняет"
- id: surrealism
  name: "Сюрреализм (Бретон, Элюар)"
  hero: "не характер, а взгляд; любимая, город, сон"
  causality: "сопряжение далёких образов вместо причин; логика сна"
  time: "вне времени, мгновение растянуто в образ"
  narrator: "первое лицо, интимный голос"
  ending: "образ, а не развязка"
  devices: ["автоматическое письмо как исходный материал", "неожиданные сопряжения", "прозрачная простая лексика при невозможных образах"]
  sources: ["А. Бретон, «Манифест сюрреализма» (1924)", "П. Элюар, «Столица скорби» (1926)"]
