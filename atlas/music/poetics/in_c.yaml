# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: in_c
name: «In C» — модульная форма
art: music
kind: instrumental
origin:
  place: США, Сан-Франциско (San Francisco Tape Music Center)
  era: 1964 и следующие десятилетия исполнений
  language: традиция — модальный джаз, магнитофонные петли, позднее индийское пение
  note: >
    «In C» Терри Райли (1964) — одна страница нот: 53 коротких модуля, которые каждый
    исполнитель играет по порядку, повторяя каждый столько раз, сколько хочет, и переходя к
    следующему по собственному решению. Ансамбль держится вместе: исполнителям рекомендуется не
    отрываться друг от друга дальше чем на несколько модулей и слушать целое. Над всем звучит
    пульс — повторяемое до восьмыми в высоком регистре; идею пульса для первого исполнения
    предложил Стив Райх, игравший в нём. Состав не задан — любые инструменты, любое число.
    Исполнение длится, пока последний музыкант не доиграет последний модуль. Пьеса считается
    одним из первых сочинений американского минимализма; позднее Райли учился северо-индийскому
    пению у Пандита Прана Натха.

lineage:
  predecessors:
    - модальный джаз — долгая импровизация на одной гармонии
    - магнитофонные петли и задержки, которые Райли использовал в своих пьесах
    - Ла Монте Янг — долгий звук и время как материал
    - открытые формы нью-йоркской школы — исполнитель решает порядок и длительность
  neighbours:
    - Стив Райх — процесс, рождающийся из повтора
    - Филип Гласс — повтор и сложение
    - Лютославский — алеаторика в ограниченных рамках (с противоположной стороны, через дирижёра)
    - позднее рок-группы и электроника, подхватившие петлю и пульс
  against:
    - сериализм и академический авангард с их сложностью
    - партитура как полный контроль над каждым звуком
    - иерархия солиста и оркестра
    - концерт как ритуал, где слушают одного автора

worldview: >
  Музыка — общее дело: каждый идёт своим шагом по одной дороге, и из этих разных шагов рождается
  целое, которого никто не задумал целиком. Повтор — не застой, а способ вслушаться; переход —
  решение, принятое из слушания других. Мир здесь — праздник согласия без подчинения: никто не
  дирижирует, но все слышат пульс и друг друга. Тональность — не закон, а дом, светлый и общий.

reader: >
  Слушатель погружается в мерцающую ткань, где одни и те же короткие фигуры звучат в разных
  фазах и сочетаниях. Ему не нужно следить за модулями: он слышит, как общая окраска медленно
  смещается из до мажора в соседние ладовые области, как ткань густеет и редеет. Слушание
  похоже на наблюдение за стаей птиц или за толпой на празднике: общее движение и отдельные
  голоса одновременно.

time: >
  Время задаётся пульсом и общим медленным продвижением по модулям; у каждого исполнителя оно
  своё, у ансамбля — общее. Длительность пьесы не фиксирована. Форма — медленное течение через
  гармонические области, в которых модули перекрываются; конец — постепенное выпадение
  исполнителей, пока не останется пульс.

composition:
  principle: общий ряд коротких модулей, который каждый исполнитель проходит по порядку с собственным числом повторов, не уходя далеко от остальных
  forms:
    - одностраничная партитура из пронумерованных модулей
    - пьеса с неопределённым составом и длительностью
    - исполнение-событие, иногда многочасовое
  inner: >
    Внутри — повтор модуля, пока исполнитель не решит идти дальше; соседние модули разных
    музыкантов накладываются и образуют контрапункт. Ограничение расстояния между самым быстрым
    и самым медленным держит ансамбль в одной гармонической области. Модули различаются длиной и
    ритмом, поэтому их наложения сдвигаются по фазе сами собой.

narrator: >
  Источник — ансамбль равных исполнителей, каждый из которых и композитор своего маршрута. Свобода
  велика (сколько повторять, когда переходить, с какой динамикой, транспонировать ли модуль на октаву), но связана обязанностью слушать других. Пульс — общий метроном,
  а не дирижёр.

character: >
  Персонаж — модуль: короткая фигура, которая звучит в разных сочетаниях и фазах. Коллективный
  персонаж — ансамбль, проходящий путь от первого модуля к последнему.

language: >
  Диатоника в до мажоре с ладовыми отклонениями; гармония возникает из наложения модулей, а не
  из аккордов. Ритм — пульс восьмыми, модули разной длины, фазовые сдвиги между исполнителями.
  Тембр — любой; часто смешанные составы, фортепиано, маримбы, духовые, струнные, электроника.
  Динамика — общая, следующая за ощущением ансамбля. Фактура — сеть повторяющихся фигур.

imagery:
  - праздник, общий танец
  - стая птиц, рой
  - мерцание, рябь
  - дорога, по которой идут разным шагом
  - солнечный свет, до мажор как светлый дом

themes:
  - свобода внутри общего правила
  - согласие без подчинения
  - повтор как вслушивание
  - праздник и транс
  - простота, открытая каждому

devices:
  - повтор модуля с произвольным числом раз
  - переход к следующему модулю по решению исполнителя
  - ограничение расстояния между самым быстрым и самым медленным
  - общий пульс на одной ноте
  - транспозиция модуля на октаву по выбору
  - постепенное выпадение исполнителей в конце

genres:
  - открытая пьеса для любого состава
  - многочасовое исполнение-событие
  - коллективная импровизация по правилам

forbidden:
  - дирижёр, задающий переходы
  - нарушение порядка модулей
  - солирование, заглушающее ансамбль
  - отрыв от общего пульса
  - уход одного исполнителя далеко вперёд

markers:
  - пульс держит всех, и ткань всё время смещается
  - слышно, как гармоническая окраска медленно меняется
  - модули перекрываются, создавая непредвиденные сочетания
  - ансамбль то густеет, то прореживается
  - слушатель начинает следить за общим движением, как за стаей, — признак живого исполнения
  - финал наступает, когда голоса уходят по одному

reading: >
  Понятно в «In C» — когда слушатель слышит пульс и короткие фигуры и понимает, что все играют
  одно и то же, но в разное время. Интересно — когда из этих сдвигов рождается живая, меняющаяся
  ткань, а гармония медленно уходит и возвращается. Исполнение проваливается, если все переходят
  синхронно (тогда это обычная пьеса), если исполнители расходятся так далеко, что ткань теряет
  общую область, или если повторов так мало, что модули не успевают сложиться в сеть.

manifesto:
  - Каждый идёт своим шагом по общей дороге.
  - Повтор — способ вслушаться, а не способ ждать.
  - Решение переходить приходит из слушания других.
  - Пульс объединяет без дирижёра.
  - Целое никто не задумывал полностью, и в этом его жизнь.
  - Простое и светлое открыто всем.

form:
  code: src/mnemosyne/music/schools/in_c.py
  note: >
    Код не берёт модули Райли, а сочиняет восемь собственных модулей длиной 3, 5, 2, 7, 4, 6, 3 и
    5 звуков из звукоряда до, ре, фа, соль, ля. Каждая партия повторяет свой текущий модуль;
    после четырёх повторов или с вероятностью 40 % после повтора она переходит к следующему, но
    только если не ушла больше чем на два модуля от самой медленной. Ритм каждой ноты выбирается
    заново при каждом повторе (восьмая или восьмая с точкой), звучит половина длины — поэтому
    повторы модуля ритмически не идентичны, в отличие от модулей Райли. Отдельной партии пульса
    нет. Конец задан длительностью секции, а не тем, что все доиграли. Оставлены композитору:
    пульс, выбор модулей и их гармонический путь, октавные транспозиции, динамика ансамбля,
    постепенное выпадение исполнителей в финале.

climate:
  abundance: больше повторов, ткань гуще
  crowding: исполнители теснее, модули налегают плотнее
  volatility: переходы чаще, ансамбль быстрее движется по ряду
  steadiness: повторы долгие, ткань стоит в одной области
  renewal: переход к новому модулю, новая окраска
  density: больше партий в одной области
  loss: голоса выпадают, остаются отдельные фигуры
  novelty: новые сочетания модулей

exemplars:
  - Райли, In C (1964)
  - первая студийная запись In C (Columbia, 1968)
  - Райли, A Rainbow in Curved Air (1969)
texts: под охраной (Райли родился в 1935 году); берутся только приёмы — модульный ряд, свободный повтор, ограниченное расхождение, — не модули партитуры
