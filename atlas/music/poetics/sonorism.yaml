# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: sonorism
name: Сонористика
art: music
kind: instrumental
origin:
  place: Польша — Варшава, Краков, Катовице; фестиваль «Варшавская осень»
  era: конец 1950-х — середина 1960-х
  language: традиция — польская музыкальная культура после оттепели 1956 года, открытая западному авангарду
  note: >
    После 1956 года, когда в Польше ослабли требования соцреализма, возник фестиваль «Варшавская
    осень», и молодые композиторы впервые услышали западный авангард. Почти сразу сложилось
    направление, которое критика назвала «польской школой»: Кшиштоф Пендерецкий, Хенрик Миколай
    Гурецкий, Казимеж Сероцкий, Войцех Килар и другие писали не мелодию и гармонию, а звучание
    как таковое — полосы кластеров, глиссандо, шумы, удары по корпусу инструмента, игру за
    подставкой. Теоретическое понятие «сонористика» связывают с польским музыковедом Юзефом
    Хоминьским. Символом направления стал «Плач по жертвам Хиросимы» Пендерецкого (1960),
    первоначально названный по своей длительности — «8'37"». Для новых приёмов понадобилась новая
    нотация: чёрные полосы кластеров, условные знаки «самой высокой ноты», графики глиссандо.

lineage:
  predecessors:
    - Варез — звук как масса и удар
    - Барток — кластеры, удар, «ночная» звукопись
    - электронная музыка — полоса шума, звук без высоты
    - Экспериментальная студия Польского радио — звук, сочинённый на плёнке
  neighbours:
    - Ксенакис — масса через вероятность
    - Лигети — масса через микрополифонию
    - Лютославский — алеаторика рядом в той же стране
    - Хельмут Лахенман — «конкретная инструментальная музыка», звук усилия
  against:
    - соцреалистическая песенность и народнический пафос 1950-х
    - сериальная абстракция, где звук — номер в ряду
    - мелодия и гармония как единственные носители смысла
    - нотная запись, не способная выразить новый звук

worldview: >
  Звук важнее ноты: его фактура, плотность, шероховатость, давление и направление — сами по
  себе смысл. Инструмент — не только носитель высоты, но тело, которое можно тереть, бить,
  давить смычком, заставлять скрипеть и выть. Мир, переживший войну и катастрофу, звучит не
  гармонией, а криком, гулом, сиреной; но и красотой поверхности, сиянием высоких полос. Музыка
  возвращает звуку его физическую и эмоциональную силу без посредничества мелодии.

reader: >
  Слушатель воспринимает звучание телом — как плотность, жар, холод, давление, крик или гул. От
  него не требуется анализировать высоты; он должен отдаться силе тембров и следить за тем, как
  полосы расширяются и сужаются, как одна техника звукоизвлечения сменяет другую. Слушание
  эмоционально и прямо: эта музыка доходит до неподготовленного уха быстрее многих
  авангардных направлений.

time: >
  Время часто измеряется секундами, а не тактами: партитура размечена отрезками длительности,
  внутри которых звучит поле. Форма — последовательность звуковых полей и их контрастов:
  плотное и разреженное, высокое и низкое, гладкое и шумное. Переходы — то постепенные (полоса
  медленно сужается), то резкие.

composition:
  principle: форма строится из звуковых полей — полос, кластеров, глиссандо, шумов, — каждое со своей техникой звукоизвлечения и плотностью
  forms:
    - пьеса для струнного оркестра из полос и полей («Плач»)
    - пьеса-контраст из блоков разных техник
    - пьеса для большого состава с ударными и шумовыми источниками
    - позднее — оратория, вобравшая сонористику в драму (Страсти по Луке)
  inner: >
    Внутри поля — полоса из соседних четвертитонов или полутонов, которая медленно расширяется,
    сужается или ползёт глиссандо; на неё накладываются удары, пиццикато, игра за подставкой.
    Поле держится на одной технике и одном регистре, а смена техники — событие формы.

narrator: >
  Источник — оркестр как одно звучащее тело, разделённое на множество партий. Исполнитель
  осваивает новые приёмы — давление смычка, sul ponticello, col legno, удары по деке, самую
  высокую ноту инструмента — и выполняет их с полной отдачей. Свобода дана в точной высоте
  глиссандо или скорости тремоло; рамка — длительность поля в секундах.

character: >
  Персонаж — звуковая полоса и техника звукоизвлечения: вой полосы четвертитонов, шорох col
  legno, скрежет давления смычка. Она ведёт себя как живое тело — расширяется, сужается, кричит.

language: >
  Кластеры и полосы из четверть- и полутонов; высота часто приблизительна или задана как
  «наивысшая». Ритм — секундная разметка, тремоло, нерегулярные удары. Тембр — главный
  параметр: sul ponticello, col legno, давление смычка, игра за подставкой, удары. Динамика —
  от едва слышного до оглушающего. Фактура — полосы, поля, массы.

imagery:
  - сирена, крик, гул
  - взрыв и его эхо, катастрофа
  - рой, жужжание, шелест
  - холодный свет высоких полос
  - тело инструмента — дерево, жила, конский волос

themes:
  - катастрофа XX века и её память
  - крик без слов
  - звук как физическая сила
  - освобождение от официального языка
  - красота шероховатого

devices:
  - кластер из соседних четвертитонов
  - полоса, расширяющаяся или сужающаяся по регистру
  - параллельные глиссандо целого поля
  - смена техники смычка как смена раздела
  - игра на самой высокой ноте инструмента
  - удары по корпусу и игра за подставкой
  - разметка времени в секундах

genres:
  - пьеса для струнного оркестра
  - пьеса для симфонического оркестра с расширенными ударными
  - камерная пьеса с новыми приёмами
  - оратория и страсти (позднее)

forbidden:
  - кантилена и тема
  - функциональная гармония
  - традиционный «красивый» звук как единственно возможный
  - тонкая мотивная работа, неслышимая в массе
  - регулярный метр

markers:
  - звук ощущается телом — как жар, холод, давление
  - смена техники слышна и меняет характер поля
  - полоса движется — расширяется, сужается, ползёт
  - тишина и взрыв контрастны и точно поставлены
  - слушатель забывает искать мелодию и следит за поверхностью звука — знак живой пьесы
  - финал — угасание полосы или резкий обрыв

reading: >
  Понятно в сонористике — когда слушатель сразу ощущает звучание как объект: полоса, поле,
  шорох, — и чувствует, когда меняется техника. Интересно — когда поля сменяют друг друга с
  драматургической логикой, когда полоса живёт и меняет ширину, а контраст техник создаёт
  напряжение, сравнимое с драмой. Пьеса проваливается, если приёмы превращаются в каталог
  эффектов без формы, если поле стоит без изменения, или если новизна приёма заменяет
  содержание звучания.

manifesto:
  - Звук важнее ноты.
  - Инструмент — тело, а не только высота.
  - Полоса, поле, шум — такие же слова музыки, как мелодия.
  - Время можно мерить секундами звучания.
  - Новый звук требует новой записи.
  - Крик тоже может быть красотой.

form:
  code: src/mnemosyne/music/schools/sonorism.py
  note: >
    Код ставит партии полосой с шагом в четверть тона вокруг случайного центра (до, ре или ми
    первой октавы); в блоке длиной шесть четвертей каждая партия держит звук половину блока и
    затем глиссандирует на тон вверх или вниз (направление чередуется по секциям); между блоками —
    пауза 0–2 четверти. Техника меняется по секциям по кругу — sul ponticello, col legno,
    давление смычка; звук синтезирован процедурно, без сэмплов. Записано в обычном такте 4/4 с
    текстовыми указаниями; графическая нотация, секундная разметка, расширение и сужение полосы,
    удары по корпусу, «самая высокая нота» и контрастная драматургия полей оставлены
    композитору.

climate:
  turbulence: глиссандо круче, техники меняются чаще, удары
  strain: давление смычка, предельный регистр, fff
  scars: скрежет и шум держатся дольше
  crowding: полоса шире, больше партий в кластере
  density: поле плотнее, пауз меньше
  loss: полоса сужается до одной ноты, угасает
  steadiness: одно поле, одна техника, медленное движение
  novelty: новые приёмы звукоизвлечения

exemplars:
  - Пендерецкий, Anaklasis (1959–1960)
  - Пендерецкий, Плач по жертвам Хиросимы (1960)
  - Пендерецкий, Polymorphia (1961)
  - Пендерецкий, Fluorescences (1961–1962)
  - Гурецкий, Scontri (1960)
  - Килар, Riff 62 (1962)
texts: под охраной (Пендерецкий умер в 2020 году, Гурецкий — в 2010-м; ноты изданы PWM и Schott); берутся только приёмы — полосы, поля, техники звукоизвлечения, — не партитуры
