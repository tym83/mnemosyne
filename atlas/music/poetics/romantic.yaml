# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: romantic
name: Романтическая лирика
art: music
kind: instrumental
origin:
  place: Париж, Лейпциг, Вена, Дюссельдорф — салоны, домашние вечера, концертные залы
  era: примерно 1820–1890-е годы
  language: фортепианная миниатюра, песня (Lied), камерный ансамбль; опера бельканто как образец пения
  note: >
    Романтическая лирика выросла из песни и из фортепиано, ставшего домашним инструментом
    буржуазной Европы. Ирландец Джон Филд опубликовал первые ноктюрны в 1812 году; Фредерик
    Шопен (1810–1849), живший с 1831 года в Париже, сделал ноктюрн жанром долгой поющей мелодии
    над широкой фигурацией левой руки — его часто сравнивают с итальянским бельканто, прежде
    всего с Беллини. Феликс Мендельсон издавал «Песни без слов» с 1830-х годов. Роберт Шуман
    (1810–1856) писал циклы миниатюр («Детские сцены», 1838) и песен («Любовь поэта», 1840) и
    издавал «Новый музыкальный журнал». Иоганнес Брамс (1833–1897) в поздних интермеццо op. 116–119
    (1892–1893) соединил лирику с плотной гармонией и строгой мотивной работой. Хроматические
    медианты — сопоставления аккордов на терцию — характерны уже для Шуберта.

lineage:
  predecessors:
    - Бетховен — драматургия вершины и экспрессия
    - Шуберт — песня, хроматические медианты, долгие мелодии
    - итальянская опера бельканто — Беллини, Россини
    - Джон Филд — ноктюрн
  neighbours:
    - Лист — виртуозная транскрипция и новая гармония
    - Вагнер — бесконечная мелодия и хроматизм, доведённый до тристан-аккорда
    - Клара Шуман, Фанни Мендельсон — салонная и концертная лирика
  against:
    - классическая соразмерность, при которой чувство подчинено периоду
    - виртуозность ради блеска (у лириков; не у Листа)
    - программная музыка как рассказ событий (у Брамса — сознательно)

worldview: >
  Музыка — язык души, говорящий то, для чего нет слов. Чувство важнее схемы; личность автора
  звучит в каждом повороте гармонии. Мир окрашен тоской по недостижимому — по прошлому, по
  родине, по любимой, по природе; красота горька, и именно поэтому драгоценна.

reader: >
  Слушатель — один на один с музыкой, в салоне или дома за инструментом. Он отдаётся пению
  мелодии, переживает её подъёмы и спады, вздрагивает от неожиданной гармонии и ждёт вершины,
  которая придёт не сразу. От него требуется сочувствие, а не анализ.

time: >
  Время дышит: длинная фраза нарастает и опадает, гармония то задерживается, то сдвигается в
  далёкую тональность. Форма часто трёхчастная — песня, контрастная середина, возвращение, —
  и у целого одна вершина, к которой ведёт расширение регистра и громкости.

composition:
  principle: долгая поющая мелодия над широко расставленной арпеджированной гармонией; хроматика — побочные доминанты, уменьшённые септаккорды, хроматические медианты, задержания
  forms:
    - ноктюрн, песня без слов, интермеццо
    - трёхчастная форма с контрастной серединой
    - цикл миниатюр
    - Lied — песня с фортепиано
  inner: >
    Фраза начинается скачком вверх и спускается ступенями; на сильных долях — задержания и
    апподжиатуры, разрешающиеся вниз. Гармония идёт к каденции, но по пути проходит через
    побочные доминанты и уменьшённые септаккорды; середина пьесы может оказаться в тональности
    на терцию ниже — хроматической медианте. Бас глубоко внизу, аккорд разложен широко, через
    полторы–две октавы.

narrator: >
  Голос — личный, лирический, как в песне. Пианист поёт правой рукой, левая разливает гармонию
  педальными арпеджио. Динамика волнами — крещендо к середине фразы, диминуэндо к концу; темп
  дышит (rubato), но в этой школе свобода темпа не записывается.

character: >
  Вместо героя — мелодия: она поёт, тоскует, поднимается к вершине и стихает. Гармония — её
  душевное состояние, которое меняется от аккорда к аккорду.

language: >
  Мажор и минор с обильной хроматикой: побочные доминанты, уменьшённые септаккорды, неаполитанская
  гармония, мажорные и минорные медианты. Задержания и апподжиатуры. Мелодия кантиленная,
  долгими нотами, со скачками на сексту и заполнением. Аккомпанемент арпеджио в широком
  расположении. Динамика волнами, одна общая кульминация с расширением регистра.

imagery:
  - ночь и луна
  - одинокий странник
  - воспоминание о детстве
  - любовь и разлука
  - пейзаж за окном салона

themes:
  - тоска и мечта
  - любовь
  - память
  - одиночество
  - природа как зеркало души

devices:
  - долгая кантилена со скачком и нисходящим заполнением
  - широкое арпеджио в левой руке
  - побочная доминанта перед аккордом
  - уменьшённый септаккорд к доминанте
  - хроматическая медианта (VI ступень мажора как тональность середины)
  - задержание и апподжиатура, разрешающиеся вниз
  - динамическая волна в каждой фразе и одна кульминация

genres:
  - ноктюрн
  - песня без слов
  - интермеццо
  - Lied
  - характерная пьеса

forbidden:
  - сухая моторика без пения
  - квадратная гармония без хроматики
  - мелодия в узком регистре на всём протяжении
  - ровная динамика без волн
  - контрапункт, в котором тонет мелодия

markers:
  - мелодия поёт длинными нотами
  - под ней разливаются широкие арпеджио
  - аккорды неожиданно окрашиваются хроматикой
  - на сильных долях — сладкие задержания
  - к вершине мелодия поднимается выше, а бас опускается ниже
  - середина звучит в далёкой тональности

reading: >
  Понятно — когда слышно, что мелодия поёт, а всё остальное её окружает, и гармония ведёт фразу к
  каденции. Захватывает — когда хроматический поворот или задержание ранят, а кульминация
  приходит как неизбежная, расширив регистр и громкость. Проваливается, если хроматика случайна и
  не тяготеет к разрешению, если мелодия мельчает в мелких нотах или если все фразы одинаково
  громки.

manifesto:
  - Музыка говорит то, для чего нет слов.
  - Мелодия поёт; всё остальное её несёт.
  - Гармония — цвет чувства.
  - Задержание сладко потому, что разрешается.
  - У пьесы одна вершина, и к ней ведёт весь путь.
  - Тоска — это тоже красота.

form:
  code: src/mnemosyne/music/schools/romantic.py
  note: >
    Код выбирает мажор или минор, делит разделы на фразы по четыре такта и строит гармонию по
    полутактам: тоника — побочная доминанта (V7 или уменьшённый септаккорд) к аккорду второго
    такта — этот аккорд — далее либо полная каденция с V7, либо полукаденция через уменьшённый
    септаккорд к V. Средние разделы звучат в мажоре на малую сексту выше (хроматическая
    медианта). Мелодия идёт долгими нотами, открывает фразу скачком, спускается ступенями, на
    сильных долях берёт апподжиатуры. Фортепиано (или виолончель в ансамбле без фортепиано)
    играет широкие восходящие и нисходящие арпеджио восьмыми; средние голоса держат аккордовые
    звуки с задержаниями. В середине каждой фразы — крещендо на уровень выше, затем возврат;
    около 62 % длительности — кульминация: мелодия поднимается к расширенному верху, бас и
    арпеджио опускаются. Rubato, педаль, мотивная работа и полифония середины не реализованы.

climate:
  steadiness: тихие ноктюрновые разделы, мелкие волны
  loss: минор, нисходящие фразы, неаполитанская гармония
  scars: уменьшённые септаккорды и задержания дольше разрешений
  renewal: мажорная медианта в середине, светлый верх мелодии
  age: XIX век — эпоха, к которой обращаются ностальгически
  closedness: фортепиано соло
  crowding: квартет и оркестр с арпеджио виолончелей
  turbulence: кульминация с расширением регистра и ff

exemplars:
  - Джон Филд, ноктюрны (с 1812)
  - Шопен, ноктюрны op. 9 (1832) и op. 27 (1836)
  - Мендельсон, «Песни без слов» (с 1830-х)
  - Шуман, «Детские сцены» op. 15 (1838)
  - Шуман, «Любовь поэта» op. 48 (1840)
  - Брамс, интермеццо op. 117 (1892)
texts: общественное достояние; берутся только приёмы — кантилена над арпеджио, побочные доминанты, медианты, задержания, волны динамики, — но не мелодии конкретных сочинений
