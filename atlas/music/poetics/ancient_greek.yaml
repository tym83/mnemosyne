# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: ancient_greek
name: Древнегреческая монодия
art: music
kind: mixed
origin:
  place: Греция и эллинистический мир — Афины, Дельфы, Малая Азия, позднее Александрия и Рим
  era: теория — с IV века до н. э. (Аристоксен); сохранившиеся записи — со II века до н. э. по III век н. э.
  language: греческий стих с долгими и краткими слогами; голос с лирой или авлосом
  note: >
    От древнегреческой музыки дошли около шестидесяти фрагментов, чаще всего обрывки папирусов и
    надписей, записанные буквенной нотацией, известной по таблицам Алипия. Самые цельные
    памятники — два Дельфийских гимна Аполлону, высеченные на стене Сокровищницы афинян в
    Дельфах около 128 года до н. э. и найденные французской экспедицией в 1893 году, и эпитафия
    Сейкила — короткая песня на надгробной стеле из окрестностей Тралл в Малой Азии (обычно
    датируется I веком н. э.), ныне в Национальном музее Дании. Теория известна лучше практики:
    «Элементы гармоники» Аристоксена Тарентского описывают тетрахорды и три рода — диатонику,
    хроматику и энармонику, — а «Гармоника» Птолемея (II век н. э.) — числовые отношения.
    Платон в «Государстве» обсуждает этический характер гармоний, а в «Законах» упоминает
    гетерофонию — расхождение партии лиры с голосом.

lineage:
  predecessors:
    - эпическое пение под форминг — гомеровские аэды (известны только по описаниям)
    - пифагорейское учение о числовых отношениях октавы, квинты и кварты
    - лирика Сапфо, Алкея, Пиндара — песня, неотделимая от стиха и танца
  neighbours:
    - трагический хор Афин — пение и танец орхестры
    - гимны Месомеда (II век н. э.), дошедшие в рукописной традиции
    - Оксиринхский гимн (III век н. э.) — христианский текст в греческой нотации
  against:
    - инструментальная музыка, оторвавшаяся от слова — Платон осуждал новое «пёстрое» искусство
    - многоголосие и гармония в позднейшем европейском смысле (его здесь нет)
    - метр, не выведенный из стиха

worldview: >
  Музыка — это слово, ритм и мелодия вместе (мусическое искусство), и она воспитывает душу: каждая
  гармония несёт свой этос — мужественный дорийский, возбуждённый фригийский. Космос устроен
  числом, и те же отношения, что держат октаву, держат небесные сферы. Песня принадлежит общине —
  празднику, жертве, пиру, надгробию.

reader: >
  Слушатель — гражданин на празднике, гость на симпосии, прохожий у надгробия. Ему не нужно знать
  теорию: он слышит стих, его долготы и краткости, и голос, который тянет долгие слоги. От него
  ждут, что он узнает характер гармонии и подчинится ему — успокоится, вдохновится, оплачет.

time: >
  Время задаётся стопой: краткий слог — единица (хронос протос), долгий — две, иногда три.
  Строка складывается из стоп одного метра — ямбов, трохеев, дактилей, анапестов, спондеев — и
  кончается долгим звуком. Целое — строфа и её повтор, гимн из стихов, короткая эпиграмма.

composition:
  principle: одна мелодия по звукоряду лада в выбранном роде; ритм из долгих и кратких слогов; инструменты вторят голосу с отклонениями
  forms:
    - короткая эпиграмма-песня — эпитафия Сейкила
    - гимн божеству — дельфийские гимны Аполлону, гимны Месомеда
    - хоровая строфа и антистрофа трагедии
    - пиршественная песня (сколий)
  inner: >
    Звукоряд строится из двух тетрахордов: крайние звуки кварты неподвижны, внутренние подвижны и
    определяют род — тон-тон-полутон в диатонике, малую терцию и два полутона в хроматике,
    большую терцию и две четверти тона в энармонике. Мелодия ходит по ступеням вокруг опорных
    звуков и возвращается к ним в конце строки; один слог — один звук, изредка два.

narrator: >
  Поёт один голос — певец или хор в унисон; лира (кифара) или авлос вторят ему. Аккомпанемент не
  гармонизует, а сопровождает: играет ту же мелодию с отклонениями, ударяет консонанс ниже голоса,
  вставляет соседний звук. Такое расхождение греки называли гетерофонией.

character: >
  Вместо героя — гармония и род: дорийская строгость, лидийская мягкость, энармоническая тонкость
  четверти тона, которая к временам Аристоксена уже казалась старинной и трудной.

language: >
  Звукоряды из тетрахордов в трёх родах; четвертитоны энармоники. Октавные виды (гармонии)
  получают имена — дорийская, фригийская, лидийская, миксолидийская и гиподорийская,
  гипофригийская, гиполидийская; тоны (тропы) переносят систему на другую высоту. Ритм —
  долготы стиха. Тембр — голос, лира, кифара, авлос. Фактура — одна линия и её вторение.

imagery:
  - мраморная стела с высеченными нотами
  - храм Аполлона в Дельфах
  - симпосий и чаша
  - хор в орхестре театра
  - лира Орфея и авлос Марсия

themes:
  - краткость жизни и радость, пока живёшь
  - хвала богу
  - этос — характер, воспитание души
  - мера и порядок космоса
  - память об умершем

devices:
  - тетрахорд с неподвижными краями и подвижной серединой
  - смена рода — диатоника, хроматика, энармоника
  - стопа из долгих и кратких; трисема на конце строки
  - мелодия возвращается к опорному звуку лада
  - гетерофония — инструмент вторит с отклонением
  - удар лиры в кварту или октаву ниже голоса

genres:
  - гимн
  - пеан и номос
  - эпиграмма-песня, эпитафия
  - хоровая лирика и хор трагедии
  - сколий

forbidden:
  - аккорды и функциональная гармония
  - такт, не совпадающий со стихом
  - многоголосие независимых линий
  - темперированная хроматика вместо родов
  - инструментальная виртуозность, заслоняющая слово

markers:
  - слышен стих: долгое и краткое
  - строка кончается долгим звуком на опоре лада
  - в энармоническом роде слышны четверти тона
  - инструменты идут рядом с голосом, но не в точный унисон
  - характер гармонии ясен и выдержан

reading: >
  Понятно — когда слышно, что музыка выросла из стиха: каждая строка — ряд стоп, и долгий
  финал строки возвращает к опоре. Захватывает — когда род меняет освещение: энармонические
  четверти тона делают ту же линию чужой и древней, хроматика — напряжённой, а лира и авлос
  создают вокруг голоса живое мерцание. Проваливается, если ритм перестаёт быть стихом и
  становится тактом, если четвертитоны звучат как фальшь, а не как род, или если вторение
  превращается в гармонию.

manifesto:
  - Мелодия, ритм и слово — одно искусство.
  - Каждая гармония воспитывает свой характер.
  - Кварта неподвижна, середина её подвижна.
  - Долгий слог тянется, краткий бежит.
  - Инструмент идёт рядом с голосом, а не под ним.
  - Мера — первое условие красоты.

form:
  code: src/mnemosyne/music/schools/ancient_greek.py
  note: >
    Код строит систему из двух разделённых тоном тетрахордов (каркас ми–ля, си–ми) в роде,
    который задаёт характер раздела: тихий и угасающий — энармоника (четверти тона, высоты x.5),
    напряжённый — хроматика, текучий и светлый — диатоника. Октавный вид (гармония) и тон
    переноса выбираются по зерну. Строка — 3–5 стоп одного метра (ямб, трохей, дактиль, анапест,
    спондей), последний звук — трисема; краткое — восьмая, долгое — четверть. Мелодия первой
    партии ходит по ступеням и кончает строку на нижнем звуке вида. Вторая партия вторит в
    унисон, разбивая некоторые долгие слоги на звук и верхний соседний; другие партии — лира:
    ударяют только долгие слоги, иногда квартой ниже. Фортепиано не играет четвертитонов и
    берёт только неподвижные звуки. Ладовые оттенки Птолемея, буквенная нотация, текст и
    строфика не реализованы.

climate:
  steadiness: диатоника, спондеи, ровные строки
  loss: энармонический род, нисходящие строки, долгие трисемы
  scars: хроматика с её малой терцией над двумя полутонами
  renewal: светлый вид, подъём строки, ямбы
  age: древнейшая теория музыки Европы
  closedness: голос и одна лира
  crowding: вторение всех инструментов, гуще гетерофония
  turbulence: смена родов от раздела к разделу

exemplars:
  - эпитафия Сейкила (I век н. э., Национальный музей Дании)
  - Дельфийские гимны Аполлону (около 128 года до н. э.)
  - гимны Месомеда (II век н. э.)
  - Оксиринхский гимн (III век н. э.)
  - Аристоксен, «Элементы гармоники»
  - Птолемей, «Гармоника»
  - Платон, «Государство» (кн. III) и «Законы» (кн. VII)
texts: общественное достояние; тем не менее берутся только приёмы — роды тетрахордов, октавные виды, стопы, гетерофония, — а не мелодии сохранившихся песен
