# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: renaissance_polyphony
name: Полифония строгого стиля
art: music
kind: mixed
origin:
  place: Франко-фламандские земли, капеллы Италии, Рима, Франции, Испании; позднее Рим папской капеллы
  era: примерно 1450–1600 годы
  language: латинская месса и мотет; хор a cappella, четыре–шесть голосов
  note: >
    Франко-фламандские мастера — Йоханнес Окегем (около 1410–1497), Жоскен Депре (около
    1450–1521) — сделали имитацию основой многоголосия: каждый голос по очереди вступает с одной и
    той же мелодической фразой. Первая печатная книга многоголосной музыки, «Odhecaton»,
    вышла у Оттавиано Петруччи в Венеции в 1501 году; мотет Жоскена «Ave Maria… virgo serena»
    открывает его сборник мотетов 1502 года. Джованни Пьерлуиджи да Палестрина (около 1525–1594)
    в Риме довёл стиль до идеальной гладкости; его «Месса папы Марцелла» издана в 1567 году и
    позднее легендарно связывалась со спорами Тридентского собора (1545–1563) о разборчивости
    текста. Теорию эпохи изложили Джозеффо Царлино («Установления гармонии», 1558) и Глареан
    («Додекахордон», 1547, двенадцать ладов). Иоганн Йозеф Фукс в «Gradus ad Parnassum» (1725)
    сделал палестриновский стиль школьным контрапунктом по видам.

lineage:
  predecessors:
    - григорианский хорал — лады, движение по ступеням, cantus firmus
    - Гийом Дюфаи и Жиль Беншуа — бургундская школа, мессы на cantus firmus
    - английская «contenance angloise» (Данстейбл) — полнозвучие терций и сект
  neighbours:
    - Орландо Лассо, Томас Луис де Виктория, Уильям Бёрд
    - итальянский и английский мадригал — тот же язык ради светского стиха
    - венецианская многохорность (Габриели) — пространство вместо имитации
  against:
    - грубые параллельные квинты и октавы
    - неподготовленный диссонанс на сильной доле
    - изоритмические конструкции, скрытые от слуха
    - текст, тонущий в мелизмах (претензия Тридентского собора)

worldview: >
  Многоголосие — образ гармонии творения: голоса равны, ни один не аккомпанирует, и все вместе
  звучат согласно. Красота — в соразмерности и плавности; диссонанс не запрещён, но подчинён,
  он проходит или подготавливается и разрешается вниз, как напряжение, которое тут же
  успокаивается. Звук служит литургическому слову.

reader: >
  Слушатель стоит в капелле и слушает, как фраза переходит из голоса в голос, каждый раз
  обновлённая новым окружением. От него требуется слушать горизонтально — следить за линиями, —
  и вертикально — ощущать чистоту созвучий. Кульминаций нет: есть течение.

time: >
  Время течёт ровно, без тактового акцента: такт — лишь мера, tactus. Форма строится из
  «точек имитации»: каждый новый отрезок текста получает свою тему, которая проходит по голосам
  и закрывается каденцией; затем начинается следующая.

composition:
  principle: точка имитации — все голоса по очереди вступают с одной темой; плавные ступенные линии; диссонанс только проходящий или задержанный; каденции на финалисе лада
  forms:
    - месса — Kyrie, Gloria, Credo, Sanctus, Agnus Dei; на cantus firmus, пародийная, парафраза
    - мотет — цепь точек имитации на латинский текст
    - мадригал — светский аналог
  inner: >
    Тема начинается долгими нотами и движется ступенями, допускает один скачок с заполнением.
    Вступления чередуются на финалисе и на квинте (или кварте). После темы голос продолжает
    свободным контрапунктом, сохраняя консонанс с другими. Каденция: один голос (тенор)
    спускается на ступень к финалису, другой (дискант) берёт задержание септимы, разрешает его в
    сексту и поднимается полутоном к октаве; бас идёт квинтой вниз.

narrator: >
  Хор a cappella, по одному–два певца на голос в капелле; ровный, светлый тон, без вибрато.
  Голоса равноправны; исполнитель ведёт линию дыханием фразы и слушает целое.

character: >
  Вместо героя — тема точки имитации: короткая фраза, которая переходит от голоса к голосу и
  живёт в каждом по-своему.

language: >
  Церковные лады; musica ficta — повышенный вводный тон в каденциях (кроме фригийского лада).
  Консонансы — терции, сексты, квинты, октавы; кварта консонирует лишь между верхними голосами.
  Диссонанс — проходящий на слабой доле или задержание, разрешающееся ступенью вниз. Ритм —
  ровные половинные и четверти, редкие восьмые парами.

imagery:
  - своды капеллы
  - свет витража, переходящий по стенам
  - хор как образ единой церкви
  - река, в которую впадают ручьи

themes:
  - хвала и мольба литургии
  - гармония мира
  - порядок и плавность
  - равенство голосов

devices:
  - точка имитации с вступлениями через равные промежутки
  - ответ на квинте или кварте
  - свободный контрапункт после темы
  - задержание септимы и разрешение вниз в каденции
  - повышенный вводный тон
  - бас квинтой вниз на каденции
  - плавное ступенное движение со скачком и заполнением

genres:
  - месса
  - мотет
  - мадригал
  - Магнификат и гимн

forbidden:
  - параллельные совершенные консонансы
  - неподготовленный диссонанс на сильной доле
  - скачки на увеличенные и уменьшённые интервалы
  - аккомпанемент и мелодия вместо равных голосов
  - хроматизм ради выразительности (это уже маньеризм мадригала)

markers:
  - одна фраза вступает в голосах по очереди
  - линии плавные, без резких скачков
  - созвучия чистые, диссонанс мимолётен
  - каденции приходят к финалису с задержанием
  - нет сильных долей и громких кульминаций

reading: >
  Понятно — когда слышно, как тема входит в первый голос, затем во второй на квинте, затем в
  третий, и каждая точка закрывается каденцией. Захватывает — когда свободные линии вокруг темы
  складываются в сияющие созвучия, а задержание на каденции звучит как сладкая боль, сразу
  разрешённая. Проваливается, если вступления неразличимы, если диссонансы торчат на сильных
  долях или если голоса стоят аккордами без собственной жизни.

manifesto:
  - Голоса равны; никто не аккомпанирует.
  - Тема переходит из голоса в голос.
  - Диссонанс проходит или подготавливается и разрешается вниз.
  - Ступень лучше скачка; скачок заполняется.
  - Каденция возвращает к финалису.
  - Слово должно быть слышно.

form:
  code: src/mnemosyne/music/schools/renaissance_polyphony.py
  note: >
    Код выбирает лад и делит каждый раздел на точки имитации (по 18–24 четверти). Тема — 5–8 нот
    с долгим началом и одним скачком; имитируется её голова (не меньше трёх нот). Голоса
    (до четырёх линий, по высоте) вступают по очереди через равный промежуток, чередуя финалис и
    ответ; из нескольких промежутков и интервалов ответа (квинта вверх, кварта вниз, унисон)
    выбирается сочетание без параллельных квинт и октав между вступлениями, а из них — с
    наименьшим числом диссонансов. Затем свободный контрапункт ступенями: звук принимается, только
    если консонирует со всеми уже записанными голосами (кварта — между верхними) и не идёт с
    каким-либо голосом параллельными квинтами или октавами (в том числе при входе в каденцию),
    иначе пауза; восьмая ступенью может быть проходящей.
    Точка кончается каденцией: тенор 2→1→0, дискант держит октаву как задержание и разрешает его
    вниз в повышенный вводный тон (во фригийском — без повышения), бас идёт квинтой вниз, средние
    держат квинту. Текст и вступления на кварту между верхними голосами не проверяются; немногие
    диссонансы между вступлениями остаются.

climate:
  steadiness: долгие ноты темы, широкие промежутки вступлений
  loss: плагальный лад, низкие вступления, медленные каденции
  scars: каденционное задержание, протянутое дольше
  renewal: тема вверх скачком, светлый лад
  age: золотой век хоровой полифонии
  closedness: два голоса
  crowding: тесная имитация через полтакта
  turbulence: частые точки, короткие темы, много восьмых

exemplars:
  - Жоскен Депре, «Ave Maria… virgo serena» (напечатан в 1502)
  - Жоскен Депре, «Missa Pange lingua»
  - Йоханнес Окегем, «Missa prolationum»
  - Палестрина, «Месса папы Марцелла» (1567)
  - Т. Л. де Виктория, Реквием (1605)
  - Царлино, «Установления гармонии» (1558)
  - Фукс, «Gradus ad Parnassum» (1725)
texts: общественное достояние; берутся только приёмы — точка имитации, ответ, задержание в каденции, правила диссонанса, — но не темы и не голоса конкретных сочинений
