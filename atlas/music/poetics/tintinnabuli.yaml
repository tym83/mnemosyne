# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: tintinnabuli
name: Тинтиннабули
art: music
kind: mixed
origin:
  place: Эстония, Таллин; позднее Западный Берлин
  era: с 1976 года (первая пьеса в новой манере — «Für Alina»)
  language: традиция — григорианский хорал, полифония школы Нотр-Дам, франко-фламандские мастера
  note: >
    Арво Пярт прошёл через неоклассику и сериализм («Некролог», 1960, первая двенадцатитоновая
    пьеса в Эстонии) и коллаж («Credo», 1968, вызвавший скандал из-за текста). После «Credo» он
    почти на восемь лет замолчал как композитор: переписывал и пел григорианику, изучал Машо,
    Окегема, Жоскена, искал, как одна линия может держать целое. Выход из молчания — «Für Alina»
    (1976), короткая фортепианная пьеса, и с ней название манеры: tintinnabulum — колокольчик.
    В 1980 году Пярт с семьёй эмигрировал из СССР, жил в Вене, затем в Западном Берлине. Термины
    «M-голос» (мелодический) и «T-голос» (тинтиннабули) закрепились в разговорах композитора с
    исследователями и в книге Пола Хиллиера об Арво Пярте (1997).

lineage:
  predecessors:
    - григорианский хорал — одна линия, движение по ступеням, слово задаёт ритм
    - органум и школа Нотр-Дам (Перотин) — голос на выдержанном тоне, звучание как пространство
    - Машо, Окегем, Жоскен — мензуральные каноны, пропорции, голоса, выведенные друг из друга
    - православное церковное пение — молитва как непрерывное звучание текста
    - колокольный звон — удар и долгое затухание, обертоновый ореол
  neighbours:
    - так называемый «священный минимализм» — Хенрик Гурецкий, Джон Тавенер (ярлык критики, не группа)
    - американский минимализм — общий интерес к трезвучию и повтору при совершенно иной цели
    - Валентин Сильвестров — тихая музыка после авангарда, «постлюдии»
  against:
    - авангард, в котором сложность стала самоцелью, и сам собственный сериальный период
    - коллаж и цитата как столкновение эпох — путь «Credo», от которого Пярт ушёл
    - романтическая экспрессия, где музыка исповедует композитора
    - гармония как движение к разрешению; функциональная драматургия тяготений

worldview: >
  Звук — дар, а не материал; его не строят, его принимают. Одна нота, правильно поставленная,
  весит больше, чем многие; тишина перед ней и после неё — часть звука. Мир здесь дуален и
  неразъединим: идущая линия (человек, путь, грех, слово) и неподвижное трезвучие (благодать,
  прощение, колокол) звучат одновременно и не могут быть друг без друга. Сложное сводится к
  простому не обеднением, а очищением; простота — результат отказа, а не исходная бедность.

reader: >
  Слушателя не ведут и не захватывают; его ставят перед звуком, как перед иконой. От него
  требуется остановиться — отказаться от ожидания событий, развития и кульминации — и слушать
  каждое соединение двух голосов как отдельное, весомое. Внимание переходит с «куда идёт музыка»
  на «как она звучит сейчас»: тембр трезвучия, обертон, затухание, тишину. Слушание становится
  созерцанием, близким к молитве, но не требует веры — только тишины внутри.

time: >
  Время останавливается или течёт очень медленно, без цели. Форма часто задаётся текстом или
  числом (длина слова, номер стиха, мензуральная пропорция), а не драматургией; поэтому музыка
  не «развивается», а «длится». Паузы равноправны со звуком. В канонах разной скорости
  («Cantus», «Arbos») возникает время-вечность: одно и то же звучит одновременно в разных темпах,
  и конец наступает, когда медленнейший голос договорил.

composition:
  principle: два голоса, выведенных один из другого, — мелодический ходит по ступеням вокруг центра, тинтиннабули-голос отвечает ближайшим звуком тонического трезвучия
  forms:
    - пьеса на одну линию и её трезвучный ореол — «Für Alina», «Spiegel im Spiegel»
    - мензуральный канон голосов в пропорциях скоростей — «Cantus», «Arbos»
    - вариации-ступени на повторяемую формулу — «Fratres»
    - текстовая форма — каждый слог или слово задаёт длину и шаг мелодии (Passio, Te Deum, Magnificat)
    - месса и молитвенный цикл на старый латинский или церковнославянский текст
  inner: >
    Внутри — строгое правило соединения голосов: позиция T-голоса (ближайший сверху, снизу,
    поочерёдно) выбирается раз и навсегда или меняется по закону. Внутри фразы — шаговое движение
    к центру или от него, длина фразы часто растёт или сжимается на одну ступень от строки к
    строке. Целое держится не на контрасте тем, а на повторе процедуры и на тишине между фразами.

narrator: >
  Голос — анонимный и смиренный: композитор отходит, оставляя правило и текст. Исполнитель не
  выражает себя, а служит звуку: ровная атака, точная длительность, полное затухание, честно
  выдержанная пауза. Свободы мало и они тонки — касание, дыхание, акустика зала. Ансамбль дышит
  вместе; хор и солисты поют без вибратного пафоса, ближе к ранней музыке.

character: >
  Персонаж — пара голосов: M-голос (путник, говорящий, кающийся) и T-голос (колокол, ангел,
  неподвижная опора). Их отношение — главный и единственный сюжет; трезвучие ля минора или ре
  минора здесь не тональность, а место.

language: >
  Диатоника, чаще натуральный минор; гармонии в функциональном смысле нет — есть сумма линии и
  трезвучия, рождающая мягкие диссонансы-обертоны (секунды, септимы) без разрешения. Ритм прост и
  часто выведен из текста или пропорции. Тембр — колокол, фортепиано с педалью, струнные без
  вибрато, хор a cappella, орган. Динамика сдержанная, от pp до mf, редкие форте как удар колокола.
  Фактура прозрачная, две–четыре линии; регистры широко разнесены, чтобы было слышно пространство.

imagery:
  - колокол и его затухание
  - свет, белый луч, разложенный на спектр
  - зеркало в зеркале — бесконечное отражение простого
  - дерево, ступени, лестница, путь
  - келья, свеча, тишина храма

themes:
  - покаяние и прощение
  - смерть и память (Бриттен, ушедшие)
  - молитва как непрерывное состояние
  - простота как итог очищения
  - человек и благодать, звучащие вместе

devices:
  - M-голос движется по ступеням к центру или от него, с растущей длиной фразы
  - T-голос в ближайшей позиции трезвучия — сверху, снизу или поочерёдно
  - мензуральный канон одной линии в нескольких пропорциях скоростей
  - нисходящая гамма, расходящаяся по регистрам и уходящая в низ
  - ритм из длины слова и ударения текста
  - длинная пауза как полноправный такт
  - удар колокола (или его имитация на фортепиано) в начале фразы

genres:
  - фортепианная миниатюра
  - пьеса для скрипки или виолончели и фортепиано
  - пассион, месса, Te Deum, Magnificat
  - хоровой мотет a cappella
  - канон для струнного оркестра

forbidden:
  - модуляция и функциональное тяготение как двигатель формы
  - кульминация, построенная нагнетанием ради нагнетания
  - виртуозность и украшение как показ исполнителя
  - густая фактура, в которой не слышно двух голосов
  - смена приёма посреди пьесы без закона
  - заполненная пауза и «живой» фон вместо тишины

markers:
  - каждое созвучие слышно отдельно, и оно звучит, а не проходит
  - T-голос узнаётся как колокол рядом с линией, и между ними есть мягкое трение
  - пауза держит внимание не меньше звука
  - процедура ясна и выдержана до конца, без поблажек
  - слушатель замедляет дыхание; это знак того, что пьеса жива и держит
  - финал не разрешает, а затихает и отпускает

reading: >
  Понятно в тинтиннабули — когда слушатель на первой минуте слышит две вещи сразу: линию,
  которая идёт, и трезвучие, которое стоит, — и понимает, что это и есть весь материал.
  Интересно — когда при неизменном правиле каждое соединение звучит заново: по-другому трёт
  секунда, иначе затухает колокол, пауза оказывается длиннее ожидаемого, и слушатель перестаёт
  ждать события и начинает слышать звучание. Пьеса проваливается, если правило читается как
  механика (ровный ряд одинаковых аккордов без дыхания), если простота оборачивается слащавостью
  или если её пытаются «оживить» сменой фактуры и динамическими волнами.

manifesto:
  - Одной ноты достаточно, если она поставлена правильно.
  - Линия идёт, трезвучие стоит; одно без другого не существует.
  - Тишина — не перерыв между звуками, а то, из чего они выходят.
  - Сложное надо пройти, чтобы прийти к простому; простота без пути пуста.
  - Правило не стесняет, а освобождает от произвола.
  - Музыка не говорит о себе; она служит слову и звуку.

form:
  code: src/mnemosyne/music/schools/tintinnabuli.py
  note: >
    Код строит только ядро процедуры. Чётные партии ведут M-линию — шаговое блуждание по
    натуральному минору вокруг центра регистра (шаг ±1 ступень, не дальше трёх от центра);
    нечётные партии берут ближайший звук тонического трезвучия, сверху или снизу, причём
    сторона меняется каждые две четверти по времени, а не по правилу позиции. Длина звука — 4
    четверти при редкой плотности и 2 при густой, звучит три четверти длины, остальное — вдох.
    Код проверяет лад, трезвучие и регистр. Не делаются и оставлены композитору: текст и
    силлабика, мензуральные каноны, нисходящие гаммы, растущие фразы, весомые паузы, выбор
    позиции T-голоса как закона, колокольные удары, тембровая драматургия и сама тишина как
    форма. Фортепианная версия кладёт T-голос на октаву ниже центра M.

climate:
  steadiness: ровная процедура, длинные звуки, паузы равной длины
  loss: медленнее и ниже, траурная нисходящая линия, длиннее тишина
  scars: трение секунды между M и T держится дольше, не разрешаясь
  renewal: светлый регистр, T-голос сверху, фразы чуть удлиняются
  age: тянется к старинному — хорал, органум, мензуральный канон
  closedness: одна линия и одно трезвучие, без расширения материала
  crowding: каноны нескольких скоростей, голоса набегают друг на друга
  turbulence: редкие удары колокола fortissimo посреди тишины, но правило не ломается

exemplars:
  - Für Alina (1976)
  - Fratres (1977)
  - Cantus памяти Бенджамина Бриттена (1977)
  - Tabula rasa (1977)
  - Spiegel im Spiegel (1978)
  - Passio (1982)
  - Te Deum (1984–1985)
  - Magnificat (1989)
  - Kanon Pokajanen (1997)
  - Пол Хиллиер, «Arvo Pärt» (1997) — описание M- и T-голосов
texts: под охраной (Пярт родился в 1935 году, ноты изданы Universal Edition); берутся только приёмы — соотношение голосов, мензуральная пропорция, силлабика, — но не мелодии и не партитуры
