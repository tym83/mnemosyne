# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: micropolyphony
name: Микрополифония
art: music
kind: mixed
origin:
  place: Вена и Кёльн (студия электронной музыки WDR), Дармштадт, Донауэшинген
  era: конец 1950-х — 1970-е (от «Apparitions» до «Камерного концерта»)
  language: традиция — франко-фламандская полифония, Веберн, Барток, опыт электронной студии
  note: >
    Дьёрдь Лигети, венгерский композитор, родившийся в Трансильвании, бежал из Венгрии в конце
    1956 года и попал в Кёльн, в круг Штокхаузена и Кёнига, где работал в электронной студии. Там
    и в анализе «Структур Ia» Булеза (журнал «Die Reihe», 1958) он увидел, что сериальная
    музыка на слух превращается в неразличимую ткань, — и решил сочинять саму эту ткань. Термин
    «микрополифония» принадлежит Лигети: множество строго выписанных голосов движется так тесно и
    быстро, что отдельная линия перестаёт быть слышна, а слышна общая поверхность, её цвет и
    медленное движение. После премьеры «Атмосфер» в Донауэшингене (1961) манера стала его
    визитной карточкой; Стэнли Кубрик использовал эту музыку в фильме «2001 год: Космическая
    одиссея» (1968).

lineage:
  predecessors:
    - Окегем — бесконечная мелодия без каденций, голоса, растворённые в целом
    - Веберн — канон как структура, звучание как кристалл
    - Барток — кластеры, «ночная музыка», шорохи природы
    - Дебюсси — гармония как цвет, а не функция
    - электронная студия — звук как непрерывное поле, наслоение
  neighbours:
    - Ксенакис — масса через вероятность, а не через канон
    - польские сонористы — полосы и кластеры, но через приём, а не через полифонию
    - Шельси — внутренняя жизнь одного звука
    - позднее спектралисты — звук как поле, медленная трансформация
  against:
    - сериальный пуантилизм, где точки на слух не складываются ни во что
    - тематическая работа, мотив как носитель смысла
    - неоклассика и социалистический реализм, от которых Лигети бежал
    - случайность Кейджа — у Лигети всё выписано до ноты

worldview: >
  Звук — не точка и не линия, а поверхность, ткань, облако, которое шевелится изнутри. Видимая
  неподвижность скрывает лихорадочное движение множества частиц, как в паутине, которая дрожит
  целиком, или в облаке, где каждая капля летит, а облако стоит. Мир — сеть, и её интересно
  слушать не по нитям, а по тому, как сеть меняет цвет, плотность и форму. Прошлое звучит в
  этой ткани призраком: кварта, октава, чистое созвучие проступают из кластера, как свет из
  тумана.

reader: >
  Слушатель отказывается следить за голосами и слушает целое — как смотрят на поверхность воды,
  а не на отдельную волну. Ему нужно терпение к медленным изменениям: кластер чуть сдвигается,
  тембр перетекает от струнных к духовым, ткань сужается до унисона. Слушание — внимание к
  поверхности и к моменту, когда из неё проступает знакомое созвучие или когда она вдруг
  обрывается.

time: >
  Время тягучее и почти неподвижное: изменения происходят медленнее, чем внимание успевает их
  отметить, и замечаются задним числом. Внутри — бешеная скорость частиц, снаружи — статика; это
  двойное время и есть главный эффект. Форма — последовательность состояний ткани, связанных
  постепенными переходами или резкими обрывами в тишину.

composition:
  principle: десятки голосов выписаны в плотных канонах с разными скоростями внутри узкого диапазона, так что на слух возникает единая медленно меняющаяся поверхность
  forms:
    - кластерная поверхность, которая расширяется и сужается («Атмосферы»)
    - многоголосный хоровой канон, сплетённый в ткань («Lux aeterna»)
    - сеть, медленно уходящая от одного созвучия к другому («Lontano»)
    - механическая сверхбыстрая фактура, рождающая иллюзорные ритмы («Continuum»)
    - большой многочастный цикл с контрастом статики и взрыва (Реквием)
  inner: >
    Внутри — канон одного материала в нескольких голосах с разными длительностями и смещёнными
    вступлениями; голоса движутся хроматическими шагами в пределах нескольких полутонов, и сама
    узость диапазона заставляет их сливаться. Постепенно расширяются или стягиваются границы
    кластера, меняются тембры, и ткань приходит к новому созвучию.

narrator: >
  Источник — анонимная масса голосов, каждый из которых выписан полностью; ни один не солирует.
  Исполнитель должен играть свою линию точно и при этом раствориться: без акцентов, без
  выделения, с ровными переходами динамики. Ансамбль — коллективный инструмент, порождающий
  поверхность.

character: >
  Персонаж — ткань, сеть, облако. Её «поступки» — сгущение, расширение, смена цвета, застывание,
  разрыв. Иногда из ткани вычленяется призрак: октава, чистая квинта, высокий звук флейты-пикколо.

language: >
  Хроматические кластеры и их медленные трансформации; иногда — проступающие диатонические или
  чистые интервалы как событие. Ритм отдельного голоса сложен (разные деления длительностей), но
  на слух растворён. Тембр — ключевой параметр: струнные divisi, хор без вибрато, медленная
  оркестровка «по цвету». Динамика — от ppppp до мощных волн; часто долгие плавные нарастания и
  спады. Фактура — плотная, до сорока и более отдельных партий.

imagery:
  - облако, туман, дым
  - паутина и сеть, дрожащая целиком
  - свет и воздух, космическое пространство
  - механизм, часы, сломанная машина
  - призрак старого созвучия

themes:
  - неподвижность, за которой скрыто движение
  - время, ставшее пространством
  - свет и тьма, вечный покой (латинский заупокойный текст)
  - память о прошлой музыке как о призраке
  - отчуждённая, нечеловеческая красота

devices:
  - канон одной хроматической линии с разными скоростями и смещёнными вступлениями
  - кластер, расширяющийся или стягивающийся по регистру
  - постепенная тембровая модуляция одной ткани
  - проступающий чистый интервал или октава как кульминация
  - внезапный обрыв ткани в тишину или в другой регистр
  - механическая сверхскорость, создающая иллюзорные ритмы

genres:
  - оркестровая пьеса-поверхность
  - хор a cappella
  - реквием
  - камерный концерт
  - пьеса для органа или клавесина

forbidden:
  - узнаваемая мелодия и тема
  - отдельный голос, выходящий на передний план
  - регулярный метр и танцевальный пульс
  - функциональная гармония
  - резкие контрасты без причины внутри ткани

markers:
  - отдельные линии неслышны, а поверхность ясна и узнаваема
  - поверхность всё время чуть меняется, и это заметно задним числом
  - есть момент проступания — чистое созвучие, новый тембр, обрыв
  - внутренняя подвижность ощущается как шорох, мерцание
  - слушатель перестаёт различать время и следит за цветом — признак того, что пьеса держит
  - финал растворяется или обрывается в тишину, оставляя призрак

reading: >
  Понятно в микрополифонии — когда слушатель не ищет мелодию, а сразу воспринимает поверхность:
  узкую полосу, мерцающее облако, растущий кластер, — и понимает, что смотреть надо на её форму.
  Интересно — когда поверхность живёт: шевелится изнутри, медленно меняет цвет и ширину, и
  вдруг из неё проступает чистое созвучие или она обрывается. Пьеса проваливается, если ткань
  стоит неподвижно и однородно (тогда это просто кластер), если голоса слышны отдельно и спорят,
  или если изменения столь медленны, что не создают направления.

manifesto:
  - Слышна не нота, а ткань; голоса пишутся, чтобы исчезнуть в целом.
  - Неподвижность — видимость; внутри всё в движении.
  - Время можно превратить в пространство, по которому звук медленно плывёт.
  - Тембр — не окраска, а сама форма.
  - Прошлое возвращается призраком — чистым интервалом в тумане кластера.
  - Каждая нота выписана; случайность не нужна, чтобы получить облако.

form:
  code: src/mnemosyne/music/schools/micropolyphony.py
  note: >
    Код строит одну хроматическую линию из 24 шагов (случайное блуждание в пределах ±2 полутонов)
    и раскладывает её канонами по партиям со сдвигом вступления на шестнадцатую. Скорости партий —
    0,5; 0,75; 1; 1,25 четверти (вдвое медленнее при редкой плотности). Все голоса стоят в общей
    полосе пересечения регистров, с небольшим смещением между собой, и за секцию плавно дрейфуют
    на четыре полутона. Проверяются регистр и тесная полоса. Оставлены композитору: число голосов
    (у Лигети десятки, здесь — состав плана), расширение и стягивание кластера, тембровая
    оркестровка по цвету, долгие динамические волны, проступающие чистые интервалы и обрывы.
    Внутренняя динамика каждой линии свободна только в канале исполнения.

climate:
  density: больше голосов в каноне, полоса уже, ткань плотнее
  crowding: вступления набегают теснее, кластер распирает регистр
  steadiness: неподвижная поверхность с медленным дрейфом
  turbulence: скорости голосов расходятся сильнее, ткань мерцает быстрее
  closedness: полоса сужается к унисону
  renewal: из кластера проступает чистый интервал, ткань светлеет
  loss: ткань редеет, голоса выпадают, уходит в тишину
  age: проступают старые созвучия — октава, квинта, призрак Окегема

exemplars:
  - Apparitions (1958–1959)
  - Atmosphères (1961)
  - Реквием (1963–1965)
  - Lux aeterna (1966)
  - Lontano (1967)
  - Continuum для клавесина (1968)
  - Камерный концерт (1969–1970)
  - Лигети, анализ «Структур Ia» Булеза в «Die Reihe» (1958)
texts: под охраной (Лигети умер в 2006 году, ноты изданы Universal Edition и Schott); берутся только приёмы — канон с разными скоростями, кластерная поверхность, — не партитуры
