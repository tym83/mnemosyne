# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: feldman
name: Фелдман
art: music
kind: instrumental
origin:
  place: США, Нью-Йорк; позднее Буффало
  era: 1950–1987 (от графических партитур до сверхдолгих поздних пьес)
  language: традиция — нью-йоркская школа живописи и композиции, абстрактный экспрессионизм
  note: >
    Мортон Фелдман учился у Уоллингфорда Риггера и Стефана Вольпе, а в 1950 году познакомился с
    Джоном Кейджем; вокруг них сложилась «нью-йоркская школа» композиторов (Кейдж, Фелдман, Эрл
    Браун, Кристиан Вольф, пианист Дэвид Тюдор). Ближе музыкантов ему были художники —
    Ротко, Гастон, Поллок, де Кунинг, Клайн; Фелдман говорил и писал о музыке их языком —
    поверхность, плоскость, масштаб. В 1950-х он писал графические партитуры («Projections»), где
    задан регистр и время, но не высоты; позднее вернулся к точной нотации. С конца 1970-х его
    пьесы стали очень долгими — час, несколько часов, — и построенными на почти повторяющихся
    паттернах; образцом он называл анатолийские ковры с их «несовершенной» симметрией и
    сдвигом узора (эссе «Crippled Symmetry», 1981).

lineage:
  predecessors:
    - Варез — звук как объект в пространстве
    - Веберн — тишина, отдельный звук, сжатость (вывернутая Фелдманом в протяжённость)
    - живопись абстрактного экспрессионизма — Ротко, Гастон
    - анатолийские и туркменские ковры — повтор узора с отклонением
  neighbours:
    - Кейдж — освобождение звука от воли композитора
    - Эрл Браун и Кристиан Вольф — открытые формы нью-йоркской школы
    - американский минимализм — повтор, но у Фелдмана без процесса и без пульса
    - Беккет — сотрудничество над оперой «Neither» (1977)
  against:
    - европейская конструктивистская логика и система как оправдание звука
    - драматургия напряжения и разрешения
    - риторика громкости, жест, «выступление»
    - память как средство формы — узнавание темы, реприза
    - сам американский процесс-минимализм с его ясной целью

worldview: >
  Звук должен быть отпущен: не построен и не использован, а оставлен самому себе. Самое ценное —
  поверхность, а не конструкция; как на холсте Ротко, где цвет дышит и плоскость колеблется.
  Тишина — это среда, в которой звук возникает и в которую он уходит, медленно затухая. Мир
  не повторяется буквально: узор возвращается, но слегка сдвинутым, и это сдвинутое
  возвращение составляет жизнь. Память ненадёжна, и музыка работает с её провалами — мы не
  уверены, слышали ли это раньше.

reader: >
  Слушатель погружается в долгое тихое звучание, где почти ничего не происходит и всё время
  происходит что-то малое. Он отказывается от ожидания развития и запоминания и учится
  слушать каждое созвучие как отдельный цвет. Внимание рассеивается и снова собирается; именно
  в этом колебании слушатель замечает, что паттерн изменился — или не может вспомнить, каким он
  был. Долгие пьесы требуют смирения перед масштабом: их не «прослушивают», в них живут.

time: >
  Время протяжённое, без направления; масштаб важнее пропорции. Пьеса длится час и больше не
  ради развития, а чтобы изменилось само восприятие времени. Паттерны повторяются с
  отклонениями, ритм асимметричен, такты меняют размер; нет кульминации и нет цели. Время
  похоже на ковёр: его разглядывают, а не проходят.

composition:
  principle: тихие паттерны повторяются с асимметричными отклонениями, так что память не успевает закрепить узор
  forms:
    - короткая тихая пьеса из отдельных созвучий (1950–1960-е)
    - графическая партитура с заданным регистром и временем
    - сверхдолгий паттерн-цикл для небольшого ансамбля (поздний период)
    - пьеса памяти друга или художника — «Rothko Chapel», «For Philip Guston»
    - оркестровая пьеса как поле цвета
  inner: >
    Внутри — небольшой узор (созвучие, пара интервалов, ритмическая фигура), который повторяется
    с изменением одной длительности, одного интервала, одного тембра. Узоры сменяют друг друга
    без перехода, как куски ткани. Повтор никогда не точен; асимметрия вшита в такты.

narrator: >
  Голос — безличный и тихий. Исполнитель держит очень тихую динамику на протяжении долгого
  времени, без акцентов, с ровной атакой, и отвечает за чистоту каждого созвучия. Свобода
  тонкая — касание и затухание; выносливость важнее виртуозности. Ансамбль звучит как одно
  поле, где тембры слегка смещены относительно друг друга.

character: >
  Персонаж — отдельное созвучие или паттерн, его цвет и вес. Он возвращается, слегка изменённый,
  как знакомое лицо, которое мы не уверены, что узнаём.

language: >
  Хроматические созвучия с малыми секундами, септимами и тритонами, часто в разреженной
  расстановке; высотного плана в тональном смысле нет. Ритм — асимметричные длительности,
  меняющиеся такты, повтор с отклонением. Тембр — тщательно выбранные сочетания, часто фортепиано
  с затуханием, струнные без вибрато, челеста, вибрафон. Динамика — почти всегда ppp, без
  акцентов. Фактура — прозрачная, вертикали отдельными «каплями» цвета.

imagery:
  - живопись — цветовое поле, холст, плоскость
  - ковёр и его сдвинутый узор
  - капли звука в тишине
  - часовня, свет, сумрак
  - память и её провалы

themes:
  - отпущенный звук
  - память и забвение
  - масштаб и долгота как опыт
  - дружба с художниками, память об ушедших
  - несовершенная симметрия как красота

devices:
  - повтор паттерна с изменённой одной длительностью
  - асимметричный ряд длительностей, не совпадающий с тактом
  - сдвиг интервала на полутон при возвращении
  - почти постоянное ppp без акцентов
  - внезапная смена паттерна без перехода
  - затухающий звук фортепиано как мера времени
  - очень долгий масштаб пьесы

genres:
  - камерная пьеса для двух–пяти инструментов
  - струнный квартет большой длительности
  - сольная фортепианная пьеса
  - хоровая пьеса без слов
  - оркестровая пьеса-поле
  - графическая партитура

forbidden:
  - кульминация и громкий жест
  - акцент и выделение одного голоса
  - тема и её развитие, реприза как вывод
  - буквальный повтор без отклонения
  - система, оправдывающая звук вместо слуха
  - заполнение тишины

markers:
  - всё тихо, и каждое созвучие звучит отдельно, как цвет
  - узор возвращается не совсем тем же — слушатель замечает сдвиг или сомневается
  - асимметрия ощущается как дыхание, а не как сбой
  - затухание звука значимо
  - слушатель теряет чувство часов и при этом остаётся внимательным — признак живой пьесы
  - смена паттерна ощущается как поворот ковра под другим светом

reading: >
  Понятно у Фелдмана — когда слушатель с первых минут улавливает тишину как среду и узор как
  предмет внимания: вот созвучие, вот его повтор, вот он чуть другой. Интересно — когда
  отклонения тонки, но реальны, и слух всё время ловит, что изменилось, а память не успевает
  всё закрепить; пьеса становится пространством, где внимание колеблется и находит новое.
  Пьеса проваливается, если повторы точны (это механика), если отклонений столько, что узора не
  остаётся, если тишину нарушает акцент или кульминация, или если тихое звучание сухо и лишено
  цвета.

manifesto:
  - Звук надо отпустить; не толкать его к цели.
  - Поверхность важнее конструкции.
  - Тишина — не пауза, а среда.
  - Узор возвращается всегда немного иным; иначе он мёртв.
  - Масштаб меняет восприятие; долгота — материал, а не помеха.
  - Музыка учится у живописи, а не у риторики.

form:
  code: src/mnemosyne/music/schools/feldman.py
  note: >
    Код строит пятинотный узор из интервалов 0, 1, 6, 7 полутонов от до первой октавы и пять
    длительностей 3, 5, 4, 7, 3 четверти; на каждом цикле одна позиция удлиняется на восьмую, и
    эта позиция смещается по кругу. Раз в четыре цикла одна нота (своя для каждой партии)
    сдвинута на полутон вверх. Звучит семь восьмых длительности, всё ppp с указанием «без
    акцентов». Все партии играют один узор одновременно, разнесённый по октавам регистра,
    поэтому фактура почти гоморитмична. Проверяются регистр, ppp и асимметрия возвратов.
    Оставлены композитору: выбор созвучий как цвета, тембровая расстановка, смена паттернов без
    перехода, масштаб в час и более, тонкие тембровые смещения между партиями и работа с
    затуханием.

climate:
  steadiness: узор возвращается почти без изменений, долгие длительности
  age: длиннее масштаб, медленнее смена паттернов
  loss: созвучия реже, тишина шире, затухание длиннее
  scars: возвращение с полутоновым сдвигом держится, не исправляясь
  volatility: отклонения чаще, узор смещается на каждом цикле
  novelty: новый паттерн без перехода
  closedness: один узор на весь раздел, без внешнего материала
  renewal: светлее регистр и тембр, узор раскрывается

exemplars:
  - Projections (1950–1951)
  - Rothko Chapel (1971)
  - Why Patterns? (1978)
  - Triadic Memories (1981)
  - Patterns in a Chromatic Field (1981)
  - String Quartet II (1983)
  - For Philip Guston (1984)
  - Piano and String Quartet (1985)
  - Фелдман, эссе «Crippled Symmetry» (1981)
texts: под охраной (Фелдман умер в 1987 году, ноты изданы Universal Edition и C. F. Peters); берутся только приёмы — асимметричный повтор, тишина, ppp, сдвиг узора, — не партитуры
