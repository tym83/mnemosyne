# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: fugue
name: Фуга
art: music
kind: instrumental
origin:
  place: германские земли — Тюрингия, Саксония (Веймар, Кётен, Лейпциг); корни в Италии и Нидерландах
  era: расцвет — конец XVII — середина XVIII века
  language: клавир, орган, ансамбль; хоровая фуга в мессах и кантатах
  note: >
    Фуга выросла из имитационной полифонии и инструментальных ричеркаров и канцон XVI–XVII веков
    (Фрескобальди, Фробергер, Свелинк), прошла через северогерманских органистов (Букстехуде) и
    Пахельбеля и достигла вершины у Иоганна Себастьяна Баха (1685–1750). Его «Хорошо
    темперированный клавир» — 24 прелюдии и фуги во всех тональностях — первый том 1722 года,
    второй собран около 1742 года; «Музыкальное приношение» (1747) построено на теме Фридриха
    Великого; «Искусство фуги» не закончено и издано в 1751 году. Теоретики называли тему «dux»
    (вождь), ответ — «comes» (спутник); Фридрих Вильгельм Марпург в «Трактате о фуге» (1753–1754)
    систематизировал приёмы — реальный и тональный ответ, противосложение, интермедии, стретту.

lineage:
  predecessors:
    - ричеркар и канцона — имитационные инструментальные пьесы
    - строгий стиль XVI века — равные голоса, имитация
    - северогерманская органная школа — Букстехуде, Рейнкен
    - Иоганн Пахельбель, Иоганн Якоб Фробергер
  neighbours:
    - Георг Фридрих Гендель — хоровые фуги ораторий
    - французская увертюра с фугированным аллегро
    - позднейшие фуги Моцарта, Бетховена (Большая фуга op. 133), Шостаковича (op. 87)
  against:
    - гомофония галантного стиля, где голоса аккомпанируют одной мелодии
    - произвольная импровизация без темы
    - смена материала без мотивной связи

worldview: >
  Всё целое вырастает из одной темы: она утверждается, отвечает себе на квинте, расходится по
  голосам, дробится в интермедиях и сжимается в стретте. Порядок не противостоит выражению — он
  и есть выражение: согласие независимых голосов как образ мира, устроенного разумно и щедро.

reader: >
  Слушатель следит за темой: узнаёт её вступления в разных голосах и тональностях, слышит, как
  её обрывки строят интермедии, ждёт стретты, где тема наступает сама себе на пятки. Он слушает
  сразу несколько линий и получает радость от их сплетения.

time: >
  Время непрерывно и напористо: моторный ритм, редкие остановки. Форма: экспозиция (все голоса
  по очереди вводят тему), интермедии и средние проведения в родственных тональностях, стретта и
  органный пункт перед заключением.

composition:
  principle: тема и ответ на квинте, противосложение, интермедии из обрывков темы в секвенциях, стретта, органный пункт
  forms:
    - фуга на две, три, четыре голоса
    - двойная и тройная фуга
    - прелюдия и фуга, токката и фуга
    - фугато внутри сонаты или хора
  inner: >
    Экспозиция: тема в одном голосе; затем ответ — тема на квинту выше (тональный ответ меняет
    первые звуки, чтобы доминанта отвечала тоникой); первый голос продолжает противосложением —
    постоянным контрапунктом к теме. Интермедия берёт голову темы и ведёт её секвенцией вниз,
    второй голос подражает на терцию ниже, бас идёт по квинтовому кругу. Средние проведения
    звучат в параллельной тональности, субдоминанте, доминанте. В стретте вступления наслаиваются;
    над органным пунктом доминанты тема звучит в последний раз.

narrator: >
  Голоса равноправны; исполнитель ведёт каждую линию отдельно и выделяет вступления темы,
  не теряя ровного движения. Свобода — в артикуляции и в выборе темпа, не в ритме.

character: >
  Вместо героя — тема: короткая, характерная, узнаваемая с первых звуков; её история —
  путь через голоса и тональности к стретте.

language: >
  Мажор и минор, функциональная гармония, рождающаяся из голосоведения; секвенции; модуляции в
  родственные тональности; в минорной фуге финальный мажорный аккорд (пикардийская терция).
  Ритм моторный, восьмые и шестнадцатые; тема с ясной головой и бегущим продолжением.

imagery:
  - собор, растущий из одного камня
  - разговор учёных собеседников
  - часовой механизм
  - река, сливающаяся с притоками

themes:
  - единство в многообразии
  - порядок мира
  - упорство и разум
  - хвала

devices:
  - тема и ответ на квинте (реальный и тональный)
  - противосложение, возвращающееся с каждым проведением
  - интермедия из обрывков темы в секвенции
  - средние проведения в родственных тональностях
  - стретта — наложение вступлений
  - органный пункт на доминанте
  - пикардийская терция в миноре

genres:
  - клавирная и органная фуга
  - фуга для струнных
  - хоровая фуга
  - фугато

forbidden:
  - аккомпанемент без самостоятельных голосов
  - вступление темы, которого не слышно
  - интермедия без связи с темой
  - конец без каденции на тонике

markers:
  - тема слышна отдельно в начале и узнаётся в каждом голосе
  - второе вступление — на квинту выше
  - интермедии звучат секвенциями
  - ближе к концу вступления наслаиваются
  - бас долго держит один звук перед концом

reading: >
  Понятно — когда тема узнаётся с первого вступления, а дальше слушатель ловит её в каждом
  голосе, на квинте и в новых тональностях. Захватывает — когда интермедии разгоняют движение,
  стретта сгущает тему до предела, а органный пункт держит напряжение перед заключением.
  Проваливается, если вступления тонут в фактуре, если свободные голоса стоят аккордами или если
  форма распадается на одинаковые блоки без нарастания.

manifesto:
  - Всё выросло из темы.
  - Вождь говорит, спутник отвечает на квинте.
  - Голоса равны и независимы.
  - Интермедия ведёт тему по кругу тональностей.
  - В стретте тема догоняет себя.
  - Над органным пунктом — последнее слово.

form:
  code: src/mnemosyne/music/schools/fugue.py
  note: >
    Код выбирает мажор или минор и сочиняет тему в два такта (голова, затем бегущее продолжение,
    конец на тонике или терции). Ответ — тема на квинту выше; если тема начинается с доминанты,
    первый звук ответа — тоника (тональный ответ). Голоса (до четырёх, у каждого своя тесситура)
    вступают по очереди: тема, ответ, тема, ответ; противосложение сочиняется один раз против
    первого ответа (дополнительный ритм, консонанс на каждом звуке) и возвращается с каждым
    проведением. Затем чередуются интермедии (голова темы трижды секвенцией по ступени вниз,
    подражание через полдоли на терцию ниже, бас по квинтам) и средние проведения в
    родственных тональностях. Стретта: вступления через L/2, 3L/4 или L/4 — выбирается вариант с
    наименьшим числом диссонансов. Затем органный пункт на доминанте в басу и тема в верхнем
    голосе, финальный аккорд с мажорной терцией. Пустоты заполняет свободный контрапункт,
    консонирующий со всеми голосами. Обращение, увеличение, двойной контрапункт и модуляция в
    другой лад темы не реализованы; средние проведения транспонируются без смены лада.

climate:
  steadiness: экспозиция и ровные интермедии
  loss: минор, нисходящие секвенции
  scars: долгий органный пункт, задержанная каденция
  renewal: проведение в параллельной тональности
  age: барочная вершина учёной музыки
  closedness: двухголосная фуга
  crowding: четырёхголосная стретта
  turbulence: шестнадцатые и тесные вступления

exemplars:
  - И. С. Бах, «Хорошо темперированный клавир», том I (1722)
  - И. С. Бах, «Хорошо темперированный клавир», том II (около 1742)
  - И. С. Бах, «Музыкальное приношение» (1747)
  - И. С. Бах, «Искусство фуги» (издано в 1751)
  - Бетховен, Большая фуга op. 133 (1825–1826)
  - Ф. В. Марпург, «Трактат о фуге» (1753–1754)
texts: общественное достояние для Баха и Бетховена; берутся только приёмы — тема и ответ, противосложение, интермедия, стретта, органный пункт, — но не темы конкретных фуг
