# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: messiaen
name: Мессиан
art: music
kind: mixed
origin:
  place: Франция, Париж (церковь Святой Троицы, где Мессиан был органистом; Парижская консерватория)
  era: 1930-е — 1992
  language: традиция — католическая литургия и григорианика, французская органная школа, индийские и древнегреческие ритмы
  note: >
    Оливье Мессиан с начала 1930-х и до конца жизни был органистом парижской церкви Святой
    Троицы и много десятилетий преподавал в Парижской консерватории (среди учеников — Булез,
    Штокхаузен, Ксенакис, Гризе, Мюрай). Его язык описан им самим в трактате «Техника моего
    музыкального языка» (1944): лады ограниченной транспозиции, неретроградируемые
    (палиндромные) ритмы, добавленные длительности, индийские ритмы из трактата Шарнгадевы.
    «Квартет на конец времени» написан в немецком лагере для военнопленных и впервые исполнен там
    в январе 1941 года. С 1950-х Мессиан записывал пение птиц в поле и делал из него музыку
    («Каталог птиц»). Он описывал свою способность видеть цвета при звучании аккордов и писал
    гармонию как цвет. Вера для него — не тема, а основание: его музыка — богословие в звуке.

lineage:
  predecessors:
    - григорианский хорал — невматические мелодии, свободный ритм
    - Дебюсси — гармония как краска, лад, природа
    - Мусоргский и Стравинский — ритм, колокола, повтор
    - индийская ритмика (деси-талы Шарнгадевы) и древнегреческие метры
    - французская органная школа — Дюпре, Турнемир
  neighbours:
    - Андре Жоливе и группа «Молодая Франция» (1936) — против неоклассики за духовность
    - ученики — Булез, Штокхаузен, Ксенакис, спектралисты
    - Ивонна Лорио — пианистка, первая исполнительница его фортепианной музыки
  against:
    - неоклассика 1920–1930-х — ирония, стилизация, «возврат к Баху»
    - музыка как развлечение и светская игра
    - метр как равномерная сетка, «военный марш»
    - мажорно-минорная функциональность как единственный путь гармонии

worldview: >
  Мир — творение, полное славы: звёзды, горы, птицы, свет витража — всё поёт хвалу. Музыка
  должна выразить веру, любовь и восторг перед творением, а также непостижимое — вечность,
  время, воскресение. Ритм — не метр, а жизнь, неравномерная, как шаг или дыхание;
  палиндромный ритм — образ вечности, которую нельзя повернуть вспять. Звук и цвет — одно:
  аккорд светится, как витраж. Птицы — лучшие музыканты, и им надо учиться.

reader: >
  Слушатель приглашён к восторгу и созерцанию, а не к разгадке. Ему нужно отдаться цвету
  гармонии, чувствовать неравномерный ритм как живое дыхание, слышать птиц как голоса
  творения. Музыка часто длительна и экстатична; слушатель переходит от остановленного времени
  медленных частей к ослепительной энергии быстрых.

time: >
  Время двойное: остановленное время созерцания (бесконечно медленные части) и пёстрое время
  творения (птицы, ритмические персонажи). Неравномерность ритма — принцип: добавленная
  длительность ломает симметрию, палиндром делает время необратимым и обратимым сразу. Вечность
  — главная временная категория.

composition:
  principle: лад, ритм и тембр — три независимые системы цвета, соединённые в блоки-видения, а птичье пение и хорал — полюса формы
  forms:
    - цикл созерцаний на богословский сюжет («Двадцать взглядов», «Рождество Господне»)
    - большая симфония-праздник («Турангалила»)
    - каталог птичьих портретов в пейзаже
    - хорал медленной вечности — бесконечно медленная часть
    - опера-мистерия («Святой Франциск Ассизский»)
  inner: >
    Внутри — мозаика блоков: хорал, птица, ритмический персонаж, звонница; повтор с
    варьированием и наложение независимых слоёв (лад одного цикла, ритм другого). Форма — не
    развитие, а чередование и нагнетание, иногда — ритмические каноны.

narrator: >
  Источник — голос верующего созерцателя и одновременно рассказчика-орнитолога. Исполнитель —
  виртуоз (Ивонна Лорио, органист, оркестр с волнами Мартено), от которого требуется точность
  неравномерных ритмов и яркость цвета. Птичьи пассажи требуют блеска; хоралы — бесконечного
  дыхания.

character: >
  Персонажи — птица (дрозд, жаворонок, соловей и десятки других, названных в партитуре),
  хорал, ритмический персонаж (растущий, убывающий, неподвижный), звон колокола.

language: >
  Лады ограниченной транспозиции (второй лад — октатоника), аккорды резонанса и «цветные»
  аккорды; доминантовые и тонические опоры без функциональной логики. Ритм — добавленные
  длительности, неретроградируемые ритмы, индийские талы, ритмические каноны. Тембр — орган,
  фортепиано, волны Мартено, ударные с высотой, оркестр как витраж. Динамика — от неподвижного
  pp хорала до экстатического fff. Фактура — слоистая.

imagery:
  - птицы, их пение и пейзажи
  - звёзды, горы, каньоны
  - витраж, радуга, цвет
  - ангелы, вечность, конец времени
  - колокола

themes:
  - вера и богословие
  - вечность и время
  - любовь — земная и божественная
  - природа как творение
  - радость и слава

devices:
  - лад ограниченной транспозиции как гармоническое поле
  - неретроградируемый палиндромный ритм
  - добавленная длительность, ломающая симметрию
  - птичья фигура — короткая, быстрая, в высоком регистре
  - аккорды резонанса с цветовой окраской
  - бесконечно медленный хорал
  - ритмические персонажи — растущий, убывающий, неподвижный

genres:
  - органный цикл
  - фортепианный цикл
  - симфония
  - каталог птиц
  - камерный квартет
  - опера-мистерия

forbidden:
  - ирония и стилизация
  - ровный метр как основа
  - функциональная модуляция
  - сдержанность там, где нужен восторг
  - сухость конструкции без цвета

markers:
  - звучание цветное, аккорды светятся
  - ритм неравномерен и живёт
  - слышна птица — короткая, яркая, с высоты
  - симметрия ритма ощутима и окрашена добавленной длительностью
  - слушатель переходит от остановки времени к восторгу — признак живой пьесы
  - финал звучит как свет или вечное сияние

reading: >
  Понятно у Мессиана — когда слушатель слышит ясные персонажи: хорал, птицу, колокол, —
  и различает цвет лада. Интересно — когда эти персонажи соединяются в мозаику, а ритм с
  добавленными длительностями создаёт живое, неравномерное движение, и когда восторг
  нарастает. Пьеса проваливается, если лад звучит как механическая октатоника без цвета, если
  птица — просто украшение, а не голос, или если ритм выдаёт ровный метр.

manifesto:
  - Музыка — хвала творению.
  - Ритм — жизнь, а не метр.
  - Палиндром — образ вечности.
  - Звук светится, как витраж.
  - Птицы — лучшие музыканты; им надо учиться.
  - Добавленная длительность ломает симметрию и делает ритм живым.

form:
  code: src/mnemosyne/music/schools/messiaen.py
  note: >
    Код использует второй лад ограниченной транспозиции (октатонику) в одной из трёх транспозиций
    и палиндромный ритм 1, ½, 1½, ½, 1 четверти с добавленной шестнадцатой в центре — ритм
    остаётся палиндромом. Первая партия в пяти нотах из каждых тринадцати играет «птицу» —
    шестнадцатые на случайных ступенях лада октавой выше. Фортепиано берёт аккорды из ступеней
    лада. Ступени лада в остальных партиях идут по кругу со сдвигом по партии и секции.
    Проверяются лад и ритм. Оставлены композитору: настоящие птичьи транскрипции, аккорды
    резонанса и цвета, хоралы, ритмические персонажи и каноны, богословская программа и форма
    мозаики.

climate:
  steadiness: хорал, остановленное время
  abundance: птицы множатся, мозаика пестрее
  renewal: свет, восхождение, мажорная опора
  turbulence: ритмические персонажи сталкиваются
  density: больше слоёв одновременно
  age: литургия, григорианика
  novelty: новые птицы, новые лады
  closedness: один лад и один ритм, без расширения

