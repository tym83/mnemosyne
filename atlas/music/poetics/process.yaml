# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: process
name: Процессуальная музыка
art: music
kind: instrumental
origin:
  place: США, Сан-Франциско (Tape Music Center), затем Нью-Йорк
  era: с середины 1960-х (магнитофонные пьесы) до середины 1970-х («Music for 18 Musicians»)
  language: традиция — западноафриканское барабанное искусство, балийский гамелан, джаз, средневековый органум
  note: >
    Стив Райх пришёл к фазовому сдвигу через магнитофон: в пьесах «It's Gonna Rain» (1965) и
    «Come Out» (1966) две одинаковые петли записанной речи, запущенные на чуть разных скоростях,
    постепенно расходятся, и из их сдвига рождаются новые ритмы и созвучия. Затем он перенёс
    процесс на живых исполнителей («Piano Phase», 1967). В эссе «Music as a Gradual Process»
    (1968) Райх сформулировал принцип: его интересуют процессы, которые слышны, — композиция и
    звучащая музыка совпадают, слушатель может следить за процессом от начала до конца. В 1970
    году он изучал барабанное искусство в Гане, позднее — балийский гамелан; результатом стали
    «Drumming» (1970–1971) с техникой постепенной замены пауз ударами и «Music for 18 Musicians»
    (1974–1976).

lineage:
  predecessors:
    - Терри Райли — «In C» (Райх участвовал в первом исполнении) и петли магнитофона
    - западноафриканская ансамблевая игра — наложение повторяющихся паттернов, общий цикл
    - балийский гамелан — взаимосцепление партий
    - Перотин — долгий выдержанный тон и пульсирующие голоса над ним
    - модальный джаз, Джон Колтрейн — долгая игра на одной гармонии
  neighbours:
    - Филип Гласс — аддитивный процесс вместо фазового
    - Ла Монте Янг — выдержанный тон и время
    - позднее Джон Адамс, Луи Андриссен — постминимализм
    - нидерландская сцена и ансамбли, игравшие эту музыку
  against:
    - сериализм и европейский авангард с его скрытой, неслышимой конструкцией
    - случайность Кейджа, где процесс композиции не слышен в результате
    - выражение личности композитора в каждой ноте
    - музыка, понятная только по партитуре

worldview: >
  Музыка — процесс, который однажды запущен и идёт сам; композитор лишь выбирает материал и
  правило и затем слушает, что получится. Сила такой музыки — в её прозрачности: всё, что
  происходит, слышно, и при этом процесс рождает то, чего никто не задумывал, — побочные мелодии,
  призрачные ритмы, психоакустические узоры. Как смотреть на секундную стрелку или на песок в
  часах: медленное изменение захватывает, потому что оно неотвратимо и честно. Пульс — основа
  мира, коллективное тело ансамбля.

reader: >
  Слушатель следит за процессом от начала до конца, и это слежение само по себе — содержание.
  Ему не нужно знать устройство: оно слышно. Внимание колеблется между общим пульсом и
  возникающими в сдвиге фигурами, которые слух выбирает сам — разные слушатели слышат разные
  мелодии в одной ткани. Слушание — медитативное и вовлекающее одновременно: тело чувствует
  пульс, ум ловит изменения.

time: >
  Время — постепенное, необратимое изменение. Пульс неизменен, а соотношение партий медленно
  ползёт: из унисона в сдвиг, из сдвига в новое совпадение. Форма — сам процесс, без контраста
  тем; разделы соответствуют этапам процесса и стыкуются ясно. Время ощущается как длящееся
  настоящее, которое при этом движется.

composition:
  principle: один короткий паттерн проходит через слышимый постепенный процесс — фазовый сдвиг, наращивание ударов вместо пауз или замену звуков
  forms:
    - фазовая пьеса — две или более копии паттерна медленно расходятся и сходятся
    - пьеса наращивания — паузы паттерна постепенно заполняются ударами
    - пьеса на хлопках — один исполнитель стоит, другой смещается на долю
    - большая пьеса из циклов гармоний и пульсирующих секций (18 музыкантов)
    - магнитофонная пьеса на петлях речи
  inner: >
    Внутри этапа — повтор паттерна до тех пор, пока изменение не станет слышно; затем шаг
    процесса. При фазовом сдвиге один голос слегка ускоряется, пока не опередит другой на долю,
    затем держит новое совпадение. При наращивании — одна нота за раз появляется на месте паузы.
    Целое держится на неизменном материале и неотвратимости процесса.

narrator: >
  Источник — ансамбль, играющий как один организм. Исполнители не интерпретируют, а выполняют
  процесс с предельной точностью и слушают друг друга; повторы и момент перехода иногда
  оставлены на их слух. От музыканта требуются выносливость, ровность атаки и концентрация.
  Композитор часто сам играет в ансамбле.

character: >
  Персонаж — паттерн и его двойник; их встречи, расхождения и новые совпадения — сюжет. Побочные
  мелодии, возникающие из сдвига, — второстепенные лица, которых никто не сочинял.

language: >
  Диатоника, часто пентатоника или модальные звукоряды; гармония почти неподвижна, меняется
  медленными циклами. Ритм — постоянный пульс восьмыми или шестнадцатыми; сдвиг на долю как
  главное событие. Тембр — ударные с высотой (маримба, вибрафон, глокеншпиль), фортепиано,
  голоса без слов, кларнеты, струнные. Динамика ровная, волны редки. Фактура — сцепление
  одинаковых партий.

imagery:
  - песочные часы, секундная стрелка, маятник
  - эхо, отражение, двойник
  - качели, приливы
  - речь, превращённая в музыку
  - машина, ставшая организмом

themes:
  - процесс сильнее воли
  - точность и коллективное тело ансамбля
  - побочное, рождённое из повтора
  - пульс как основа жизни
  - речь и голос как материал

devices:
  - фазовый сдвиг одного голоса относительно другого
  - наращивание — пауза заменяется ударом по одной ноте
  - замена звука в паттерне при неизменном ритме
  - удвоение возникающей побочной мелодии отдельным инструментом
  - цикл гармоний, задающий большие разделы
  - сигнал к смене раздела — в «Music for 18 Musicians» его подаёт вибрафон

genres:
  - пьеса для двух одинаковых инструментов в фазе
  - ансамбль ударных
  - пьеса для нескольких фортепиано
  - пьеса на петлях записанной речи
  - большой ансамбль с голосами

forbidden:
  - скрытая конструкция, которую нельзя услышать
  - тема и её развитие
  - смена паттерна без процесса
  - рубато и выразительное отступление от пульса
  - внезапная драматическая кульминация

markers:
  - процесс слышен с первых секунд и не прерывается
  - пульс держит тело, а ткань всё время чуть меняется
  - из сдвига возникают фигуры, которых не было в паттерне
  - момент нового совпадения ощущается как событие
  - слушатель начинает «выбирать» мелодии в ткани — признак того, что пьеса живая и захватывает
  - конец процесса ощущается как его исчерпание, а не как выдуманная концовка

reading: >
  Понятно в процессуальной музыке — когда слушатель с первых тактов слышит паттерн и правило и
  может предсказать направление процесса. Интересно — когда процесс при этом рождает
  непредвиденное: призрачные мелодии, перекрёстные ритмы, неожиданные совпадения, — и каждый
  этап чуть меняет восприятие целого. Пьеса проваливается, если процесс стоит (повтор без
  изменения), если он слишком быстр и не успевает стать слышимым, если паттерн беден и не даёт
  побочных фигур, или если композитор вмешивается в процесс «для интереса».

manifesto:
  - Композиция и звучащая музыка — одно; процесс должен быть слышен.
  - Запущенный процесс идёт сам; композитор его слушает.
  - Медленное изменение захватывает сильнее внезапного.
  - Из повтора рождается то, чего никто не сочинял.
  - Пульс — общее тело ансамбля.
  - Правило не прячут; в нём нет тайны, а музыка всё равно таинственна.

form:
  code: src/mnemosyne/music/schools/process.py
  note: >
    Код строит один паттерн из восьми звуков пентатоники (до, ре, ми, соль, ля) и проводит его
    через три типа секций по кругу. Фаза — все партии повторяют паттерн восьмыми, но шаг каждой
    следующей партии на 0,75 % короче, так что партии постепенно расходятся; онсеты квантуются к
    1/32 четверти. Наращивание — в цикле звучат только первые позиции паттерна, их число растёт на
    одну каждые два цикла, на остальных местах паузы. Замена — ещё не раскрытые позиции заняты
    первым звуком паттерна. Все звуки — шестнадцатые. Проверяются регистр и сетка. Оставлены
    композитору: удержание нового совпадения после сдвига, переход по слуху, смена гармонических
    циклов, удвоение побочных мелодий, сигналы к смене раздела, тембровые наслоения.

climate:
  steadiness: пульс и паттерн неизменны, процесс идёт медленно
  volatility: фазовый сдвиг быстрее, совпадения сменяются чаще
  renewal: наращивание — пустоты заполняются звуком
  abundance: больше раскрытых позиций, побочные мелодии множатся
  density: больше копий паттерна в сдвиге
  closedness: один паттерн на всё, без новых нот
  novelty: замена звуков в паттерне, новые совпадения
  loss: позиции убывают, паузы вместо звуков

exemplars:
  - It's Gonna Rain (1965)
  - Come Out (1966)
  - Piano Phase (1967)
  - Drumming (1970–1971)
  - Clapping Music (1972)
  - Music for Pieces of Wood (1973)
  - Music for 18 Musicians (1974–1976)
  - Райх, эссе «Music as a Gradual Process» (1968)
texts: под охраной (ноты изданы Universal Edition и Boosey & Hawkes); берутся только приёмы — фазовый сдвиг, наращивание, замена, — не паттерны конкретных пьес
