# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: drone
name: Дрон и чистый строй
art: music
kind: mixed
origin:
  place: США, Нью-Йорк (лофты Даунтауна, «Dream House»); Калифорния
  era: с конца 1950-х (Трио для струнных Ла Монте Янга, 1958) до наших дней
  language: традиция — индийская классическая музыка (бурдон танпуры, рага), японский гагаку, органум; чистый строй натурального звукоряда
  note: >
    Ла Монте Янг в Трио для струнных (1958) построил целую пьесу из очень долгих выдержанных
    звуков и пауз. В 1960 году он написал текстовые партитуры, одна из которых предписывает взять
    квинту си — фа-диез и держать её долго. В середине 1960-х вокруг него сложился ансамбль Theatre
    of Eternal Music (Мариан Зазила, Тони Конрад, Джон Кейл и другие): часами звучали выдержанные
    звуки в чистом строе, усиленные, с точно рассчитанными соотношениями частот. С 1970 года Янг
    учился у мастера северо-индийского пения Пандита Прана Натха. Вместе с Зазилой он создал
    «Dream House» — пространство, где непрерывно звучит дрон и горит световая инсталляция; его
    «The Well-Tuned Piano» (с 1964) — многочасовая импровизация на фортепиано в чистом строе.
    Рядом развивались электронные и акустические опыты долгого звука — Элиан Радиг, Полин
    Оливерос, Фил Нибло, Тони Конрад.

lineage:
  predecessors:
    - индийская музыка — бурдон танпуры, медленное раскрытие раги
    - японский гагаку — долгие звуки шо, неподвижное время
    - органум и византийское исон — голос над выдержанным тоном
    - Веберн — паузы и отдельные долгие звуки
    - звуки среды — гул трансформаторов, ветер в проводах
  neighbours:
    - Терри Райли — повтор и петли, общая сцена начала 1960-х
    - Fluxus — текстовые партитуры и событие
    - Элиан Радиг — электронный долгий звук, медленные изменения
    - Полин Оливерос — практика глубокого слушания (Deep Listening)
    - Фил Нибло, Тони Конрад — плотные дроны с биениями
    - Шельси — внутренняя жизнь одного звука
  against:
    - равномерная темперация, стирающая натуральные соотношения
    - мелодия и смена гармоний как основа музыки
    - короткая концертная форма с началом и концом
    - европейский авангард с его плотностью событий

worldview: >
  Звук, выдержанный достаточно долго, становится местом, в которое можно войти. Частоты в
  простых целочисленных соотношениях складываются в созвучия, которые слух ощущает как покой и
  единство, а их сочетания рождают биения и разностные тона — звук, которого никто не играет.
  Мир — вибрация, а музыка — настройка на неё; время перестаёт быть линией и становится
  состоянием. Чистая интонация — не педантизм, а доступ к тому, что темперация закрывает.

reader: >
  Слушатель входит в звук, как в комнату, и находится в нём долго. Ему предлагается двигать
  головой и телом, замечая, как меняются обертоны в разных точках пространства; слушать
  биения, разностные тона, внутреннее мерцание. Слушание — состояние, а не прослеживание:
  восприятие постепенно перестраивается, звук становится средой, время исчезает.

time: >
  Время вечное или очень долгое: пьеса может длиться часами или звучать непрерывно годами.
  Изменения редки и медленны — вход нового частичного тона, смена тембра, едва заметный сдвиг
  громкости. Нет начала и конца как событий; есть погружение и выход.

composition:
  principle: выдержанные звуки в чистых целочисленных соотношениях частот образуют неподвижное поле, внутри которого слушатель различает биения, обертоны и пространство
  forms:
    - пьеса из долгих выдержанных звуков и пауз
    - текстовая партитура — указание держать интервал долго
    - непрерывная звуковая инсталляция с освещением
    - многочасовая импровизация в чистом строе
    - электронный дрон с медленными изменениями
  inner: >
    Внутри — выбор частот по натуральному звукоряду или числовым соотношениям, постепенное
    добавление голосов, стабильность каждого звука. Изменения — вход и уход частичного тона,
    смена тембра, медленная динамика; гармония складывается из соотношений частот, а не из
    последовательности аккордов.

narrator: >
  Источник — звук как поле, иногда — электронный генератор или усиленные инструменты.
  Исполнитель держит тон с предельной точностью интонации и ровностью, часами; его свобода — в
  мельчайших колебаниях и в выборе момента для перехода. Ансамбль — система настроенных
  частот, а не собрание голосов.

character: >
  Персонаж — частичный тон и его место в натуральном звукоряде. Вход нового тона — событие,
  биение двух соседних — жизнь.

language: >
  Чистый строй, натуральный звукоряд, целочисленные соотношения частот; интервалы, которых нет в
  темперации (натуральная септима, натуральная терция). Ритм почти отсутствует — выдержанные
  звуки, редкие входы. Тембр — струнные, голос, электроорган, синусоидальные генераторы,
  усиление. Динамика — ровная, часто громкая для насыщения пространства. Фактура — поле
  выдержанных звуков.

imagery:
  - комната, дом сна
  - гул трансформатора, ветер в проводах
  - цветной свет в инсталляциях Зазилы
  - океан, долгий прибой
  - вечность

themes:
  - звук как место
  - чистая интонация как истина
  - время как состояние
  - слушание телом и пространством
  - медитация и транс

devices:
  - выдержанный звук без изменения на долгое время
  - частичные тона натурального звукоряда в чистом строе
  - постепенный вход голосов от низа к верху
  - биения и разностные тона как результат соотношений
  - усиление для насыщения пространства
  - инсталляция, где звук звучит непрерывно

genres:
  - пьеса для струнных или голоса с выдержанными звуками
  - текстовая партитура
  - звуковая и световая инсталляция
  - электронная пьеса долгого звука
  - многочасовая импровизация в чистом строе

forbidden:
  - темперированное приближение там, где нужна чистая интонация
  - мелодия и смена гармоний
  - частые события и драматургия
  - короткая форма с кульминацией
  - неровный, колеблющийся тон без причины

markers:
  - звук стоит, и в нём слышна внутренняя жизнь — биения, обертоны
  - вход нового тона ощущается как смена света
  - созвучия звучат «чисто», с покоем и сиянием
  - пространство и положение тела меняют звук
  - слушатель перестаёт следить за временем и остаётся внутри — признак живой пьесы
  - конец — выход из звука, а не каденция

reading: >
  Понятно в музыке дрона — когда слушатель сразу понимает, что звук не будет меняться быстро и
  что слушать надо его внутренность. Интересно — когда поле живое: слышны биения, разностные
  тона, сияние натуральных интервалов, а вход нового частичного тона ощущается как событие
  огромной силы. Пьеса проваливается, если звук мёртв (ровный синтетический тон без внутренних
  взаимодействий), если интонация неточна и созвучие «грязное» без смысла, или если изменения
  слишком часты и разрушают состояние.

manifesto:
  - Звук, выдержанный долго, становится местом.
  - Целые числа частот — путь к покою и сиянию.
  - Темперация закрывает то, что открывает чистый строй.
  - Время — не линия, а состояние.
  - Слушают телом и пространством, а не только ухом.
  - Одно событие в час может быть громче симфонии.

form:
  code: src/mnemosyne/music/schools/drone.py
  note: >
    Код даёт каждой из партий (в образце — десять линий струнного оркестра) один частичный тон
    натурального звукоряда над фундаментальным (из плана, по умолчанию до большой октавы, со
    сдвигом на тон или без): нижние партии берут низкие частичные. Тона входят снизу вверх, каждый
    следующий через восемь четвертей, и держатся до конца, связанными нотами через секции. Чтобы
    попасть в диапазон инструмента, тон переносится на октавы, так что регистровый порядок
    натурального звукоряда может нарушаться. В нотах высота округлена до четверти тона с
    указанием отклонения в центах; в MIDI и аудио — точная частота, звук — осцилляторный синтез.
    Проверяются частичные и порядок входов. Оставлены композитору: выбор соотношений сверх
    натурального ряда, уход тонов, длительность в часы, пространство и усиление, световое решение.

climate:
  steadiness: поле стоит, ничего не меняется
  abundance: больше частичных, поле богаче
  closedness: один фундамент, один ряд
  renewal: вход нового высокого частичного, свет
  loss: частичные уходят, остаётся фундамент
  age: бесконечная длительность, древние бурдоны
  density: больше голосов в близких частичных, биения гуще
  strain: громкость насыщает пространство до предела

exemplars:
  - Ла Монте Янг, Трио для струнных (1958)
  - Ла Монте Янг, The Well-Tuned Piano (с 1964)
  - Ла Монте Янг и Мариан Зазила, Dream House
  - Тони Конрад, Four Violins (1964)
  - Элиан Радиг, Trilogie de la Mort
  - Полин Оливерос, Deep Listening (1989)
texts: под охраной (Янг, Радиг, Нибло; Оливерос умерла в 2016 году); берутся только приёмы — выдержанные звуки, чистый строй, медленный вход частичных, — не партитуры и не записи
