# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: chance
name: Музыка случайных операций
art: music
kind: instrumental
origin:
  place: США, Нью-Йорк; Блэк-Маунтин-колледж; труппа Мерса Каннингема
  era: с 1951 года («Music of Changes») до 1992 года (поздние «числовые пьесы»)
  language: традиция — дзен-буддизм в лекциях Д. Т. Судзуки, китайская «Книга перемен», американский экспериментализм
  note: >
    Джон Кейдж учился у Арнольда Шёнберга, затем писал для ансамблей ударных и изобрёл
    подготовленное фортепиано — винты, болты, резина и дерево между струнами превращают его в
    маленький оркестр ударных (первый опыт — «Bacchanale», 1940; вершина — «Сонаты и интерлюдии»,
    1946–1948). В конце 1940-х он слушал лекции Судзуки о дзен и начал искать музыку, свободную
    от вкуса и памяти композитора. В 1951 году он стал пользоваться «Книгой перемен» (И цзин):
    броски монет определяли высоты, длительности, громкости и паузы по заранее составленным
    таблицам («Music of Changes», 1951). Тогда же, побывав в безэховой камере в Гарварде, он
    убедился, что абсолютной тишины не существует; итогом стала пьеса «4′33″» (1952), где
    исполнитель не играет, а звучит мир. Его лекции и тексты собраны в книге «Тишина» (1961).

lineage:
  predecessors:
    - Эрик Сати — повтор, равнодушие к развитию, «мебельная музыка»
    - Чарльз Айвз — американская свобода, наслоение
    - Генри Кауэлл — кластеры, игра на струнах, внеевропейская музыка
    - Шёнберг — учитель, от которого Кейдж взял дисциплину структуры
    - Марсель Дюшан — реди-мейд, случай, отказ от вкуса
    - дзен-буддизм и «Книга перемен»
  neighbours:
    - Мортон Фелдман, Эрл Браун, Кристиан Вольф, Дэвид Тюдор — нью-йоркская школа
    - Мерс Каннингем — танец, созданный независимо от музыки
    - Роберт Раушенберг — «белые картины», пустота как поверхность
    - Fluxus и хэппенинг
    - европейская алеаторика (Булез, Штокхаузен) — с ней Кейдж спорил
  against:
    - вкус, память и воля композитора как источник музыки
    - выражение чувства и самовыражение
    - гармония как иерархия звуков
    - различие между музыкой и шумом
    - контролируемая алеаторика европейцев — случай под присмотром

worldview: >
  Звуки должны быть сами собой, а не носителями идей, чувств и намерений. Композитор не
  навязывает им порядок, а задаёт вопросы и принимает ответы случая, — так он выходит из
  собственного вкуса и памяти. Тишины нет: есть звуки, которые мы не намеревались услышать.
  Всё, что звучит, — музыка, если к нему обратить внимание. Мир не делится на важное и неважное;
  цель — не выразить, а открыть внимание к жизни, как она есть.

reader: >
  Слушатель не получает сообщения и не следит за развитием. Ему предлагается слушать каждый звук
  как отдельный, не связывая его с предыдущим, принимать тишину как полноправное время, а шумы
  зала — как часть пьесы. Слушание — практика внимания, освобождённая от ожидания; оно может
  быть радостным, смешным, растерянным, но всегда — внимательным.

time: >
  Время — пустое вместилище, куда попадают звуки; оно не направлено. Структура часто задаётся
  длительностями (квадратный корень, секунды, «временные скобки» поздних пьес), а не тактами.
  Нет начала и конца как событий: есть рамка, внутри которой звучит то, что выпало.

composition:
  principle: композитор задаёт пространство возможностей и вопросы, а случайные операции отвечают — какая высота, какая длительность, какая громкость, звук или тишина
  forms:
    - пьеса по таблицам «Книги перемен» («Music of Changes»)
    - пьеса-рамка без заданных звуков («4′33″»)
    - пьеса для радиоприёмников и случайного эфира
    - графическая и неопределённая партитура («Variations»)
    - числовые пьесы с временными скобками для любого состава
    - пьеса по звёздным картам («Atlas Eclipticalis»)
  inner: >
    Внутри — независимость параметров: каждый определяется своей операцией, и между событиями
    нет причинной связи. Звук не готовит следующий, тишина не ждёт. Связность возникает
    только в восприятии слушателя.

narrator: >
  Источник — безличный: случай, звёздная карта, эфир. Исполнитель — не интерпретатор, а
  дисциплинированный исполнитель операций (Дэвид Тюдор как образец) или участник неопределённой
  партитуры с большой свободой, ограниченной правилами. Ему нельзя вносить вкус — импровизация в
  смысле самовыражения не нужна.

character: >
  Персонаж — звук сам по себе: отдельный, не связанный, со своим тембром и громкостью.
  Подготовленная струна — маленький гонг, шуршание, стук. Тишина — равный персонаж.

language: >
  Высоты — из таблиц и случайных операций, без иерархии; хроматика, шумы, подготовленные
  звуки. Ритм — нерегулярные длительности, часто в пропорциональной или секундной записи.
  Тембр — подготовленное фортепиано, ударные, радиоприёмники, электроника, бытовые предметы.
  Динамика — назначается операцией, независимая от высоты. Фактура — разреженная, отдельные
  события в пространстве тишины.

imagery:
  - пустота, белый холст, безэховая камера
  - монеты, гексаграммы, звёздные карты
  - грибы (страсть Кейджа), лес, дождь
  - радиоэфир, улица, город
  - смех и игра

themes:
  - освобождение звука от воли
  - тишина как полнота
  - внимание к жизни
  - анархия как порядок без власти
  - дзен — пустота и принятие

devices:
  - бросок монет по «Книге перемен» для каждого параметра
  - независимые операции для высоты, длительности, громкости и паузы
  - подготовленное фортепиано — предметы между струнами
  - рамка длительности без заданных звуков
  - временные скобки — окно для начала и конца звука
  - наложение карт и прозрачных листов в неопределённых партитурах

genres:
  - пьеса для подготовленного фортепиано
  - пьеса для ансамбля ударных
  - неопределённая партитура для любого состава
  - пьеса для радио и электроники
  - лекция-пьеса, текст как музыка
  - музыка к танцу Каннингема

forbidden:
  - вкус и предпочтение композитора в выборе звуков
  - выражение чувства
  - причинная связь между событиями
  - заполнение тишины
  - драматургия, ведущая к кульминации

markers:
  - каждый звук отдельный, ни один не готовит другой
  - тишина звучит и наполнена миром
  - события неожиданны, и нет ощущения, что их выбрал вкус
  - параметры независимы — громкость не следует за высотой
  - слушатель начинает слышать шумы вокруг как часть пьесы — признак того, что она жива
  - конец — исчерпание рамки, а не вывод

reading: >
  Понятно в музыке случайных операций — когда слушатель с первых звуков понимает, что связь
  между ними искать не надо: каждый звук — сам по себе, и тишина — тоже. Интересно — когда это
  освобождение даёт свежесть восприятия: звуки неожиданны, подготовленное фортепиано звенит и
  шуршит, тишина наполняется миром. Пьеса проваливается, если в случайности проступает вкус
  (красиво подобранные звуки), если операции дают монотонную серую массу, или если исполнитель
  «оживляет» её самовыражением.

manifesto:
  - Пусть звуки будут сами собой.
  - Композитор задаёт вопросы, а не выбирает ответы.
  - Тишины нет; есть звуки, которых мы не намеревались слышать.
  - Музыка и шум — одно; всё зависит от внимания.
  - Вкус и память — то, от чего надо освободиться.
  - Цель — не выразить, а пробудить внимание к жизни.

form:
  code: src/mnemosyne/music/schools/chance.py
  note: >
    Код строит оракул на 64 исхода: шесть линий, каждая из трёх бросков монеты, бит линии —
    чётность суммы. Это не воспроизведение исторических процедур «Книги перемен» и таблиц Кейджа,
    а модель независимых операций. Для каждого события четыре независимых броска определяют
    высоту (исход по модулю диапазона инструмента), длительность (одно из восьми значений от
    восьмой до двух целых), паузу (при исходе меньше 24, то есть примерно в трёх случаях из
    восьми) и громкость (одна из восьми ступеней от ppp до fff). Тембр — процедурно
    синтезированный «подготовленный» звук с металлическим резонансом, шумом атаки и
    демпфированием, а не сэмпл. Оставлены композитору: составление таблиц и вопросов, рамка
    длительности, подготовка конкретных струн, неопределённая нотация, временные скобки.

climate:
  volatility: параметры меняются от звука к звуку, без закона
  steadiness: равномерная разреженность, тишина и звук в равновесии
  loss: больше пауз, звуки редки
  abundance: пауз меньше, звуки гуще
  novelty: неожиданные сочетания громкости и регистра
  closedness: одна подготовленная окраска на всё
  turbulence: скачки между ppp и fff
  renewal: тишина открывается звукам мира

exemplars:
  - Сонаты и интерлюдии для подготовленного фортепиано (1946–1948)
  - Music of Changes (1951)
  - Imaginary Landscape No. 4 для двенадцати радиоприёмников (1951)
  - 4′33″ (1952)
  - Atlas Eclipticalis (1961–1962)
  - Кейдж, «Тишина» (1961) — лекции и тексты, в том числе «Лекция о ничто»
texts: под охраной (Кейдж умер в 1992 году, ноты изданы C. F. Peters); берутся только приёмы — независимые случайные операции, подготовка, рамка, — не партитуры и не таблицы
