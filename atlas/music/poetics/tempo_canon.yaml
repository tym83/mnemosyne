# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: tempo_canon
name: Темповый канон
art: music
kind: instrumental
origin:
  place: Мексика, Мехико — студия Конлона Нанкарроу
  era: с конца 1940-х (первые этюды для механического фортепиано) до 1990-х
  language: традиция — американский экспериментализм (Генри Кауэлл), джаз и блюз, механическое фортепиано
  note: >
    Конлон Нанкарроу, американец, воевавший в Испании в бригаде Линкольна, с 1940 года жил в
    Мексике. Книга Генри Кауэлла «New Musical Resources» (1930) подсказала ему, что ритм и темп
    можно строить из тех же соотношений, что и высоту, — но живые музыканты таких ритмов сыграть
    не могли. Нанкарроу обзавёлся механическим фортепиано и машиной для пробивки перфолент и десятилетиями
    сам вручную пробивал свои «Этюды для механического фортепиано». В них голоса канона идут в
    разных темпах — в рациональных и иррациональных соотношениях, ускоряются и замедляются, так что
    совпадают только в рассчитанной точке. Долгое время его музыку почти не знали; широкую
    известность она получила в 1970–1980-е, в том числе благодаря поддержке Лигети.

lineage:
  predecessors:
    - Генри Кауэлл — «New Musical Resources», аналогия ритма и обертонового ряда
    - Чарльз Айвз — наслоение независимых темпов и оркестров
    - Стравинский — ритмическая энергия, «Весна священная»
    - блюз, буги-вуги, джаз — Нанкарроу играл на трубе в джазе
    - канон эпохи Возрождения — мензуральный канон в разных пропорциях
  neighbours:
    - Лигети — фортепианные этюды и полиритмия, восхищение Нанкарроу
    - Эллиотт Картер — метрическая модуляция и независимые темпы
    - Ксенакис — математика формы
    - позднее компьютерная и алгоритмическая музыка
  against:
    - ограничения человеческой руки и ансамблевой синхронности
    - общий метр как обязательная сетка для всех голосов
    - европейская серьёзность без юмора и энергии
    - интерпретация как произвол исполнителя

worldview: >
  Время — не одна река, а много рек, текущих с разной скоростью рядом. Музыка может показать это
  буквально: один и тот же мотив звучит одновременно в нескольких темпах, и слух видит время со
  стороны, как машину. Машина освобождает от ограничений тела: то, что невозможно сыграть,
  можно пробить в перфоленте. Но в этой механике живёт юмор, джазовая энергия и восторг перед
  невозможным.

reader: >
  Слушатель следит за временем как за действующим лицом: голоса расходятся, догоняют друг друга,
  совпадают в одной точке и снова разлетаются. Ему не нужно считать соотношения; он слышит
  напряжение расхождения и разрядку совпадения. Скорость и плотность часто запредельны —
  слушание захватывает азартом, как наблюдение за гонкой или аттракционом.

time: >
  Время многослойно: каждый голос живёт в своём темпе, а соотношения могут быть иррациональными,
  так что голоса никогда не совпадают по сетке. Ускорения и замедления делают время упругим.
  Форма часто строится на точке схождения — где все голоса совпадают — или на расхождении из
  неё. Время буквально становится материалом.

composition:
  principle: один и тот же материал звучит в каноне при разных, нередко иррациональных, соотношениях темпов, а схождение и расхождение голосов задают форму
  forms:
    - темповый канон с рациональным соотношением (например, 3:4:5)
    - темповый канон с иррациональным соотношением
    - канон ускорения и замедления — один голос ускоряется, другой замедляется
    - многоголосный канон с точкой схождения в рассчитанный момент
    - этюд на блюзовом или джазовом материале с наслоением темпов
  inner: >
    Внутри — точный расчёт онсетов каждого голоса: в постоянном темпе, в ускорении, в
    замедлении. Совпадения планируются: голоса начинают вместе и расходятся, или сходятся к
    концу, или встречаются в середине. Материал часто прост (гамма, арпеджио, мотив), чтобы
    канон был слышен.

narrator: >
  Источник — машина: механическое фортепиано с перфолентой. Исполнителя нет; композитор
  пробивает каждый звук сам. Позднее этюды переложены для живых ансамблей и компьютера, но
  точность машины остаётся идеалом. Свобода исполнителя равна нулю, свобода композитора — полная.

character: >
  Персонаж — мотив и его двойники в разных темпах. Их гонка, встречи и разлуки — сюжет.

language: >
  Материал часто прост: гаммы, арпеджио, блюзовые обороты, хроматические мотивы. Ритм —
  главный параметр: соотношения темпов, ускорения, сверхбыстрые пассажи. Тембр — механическое
  фортепиано с усиленными молоточками (иногда обитыми металлом). Динамика — ограничена
  механикой; громкость часто постоянна. Фактура — от прозрачного двухголосия до немыслимой
  плотности.

imagery:
  - гонка, бег, погоня
  - машина, часы, механизм
  - перфолента, отверстия
  - река и её притоки
  - буги-вуги, бар, джаз

themes:
  - многослойность времени
  - машина и невозможное
  - юмор и азарт
  - схождение и расхождение
  - одиночество мастера

devices:
  - канон одного мотива в нескольких темпах одновременно
  - иррациональные соотношения темпов
  - ускорение и замедление голоса по закону
  - точка схождения, рассчитанная заранее
  - глиссандо-арпеджио на запредельной скорости
  - блюзовый бас и мелодия в разных темпах

genres:
  - этюд для механического фортепиано
  - переложение для ансамбля
  - канон для нескольких фортепиано или компьютера

forbidden:
  - общая метрическая сетка для всех голосов
  - рубато и интерпретация
  - сложный материал, за которым не слышен канон
  - случайная встреча вместо рассчитанной
  - отказ от энергии ради медитативности

markers:
  - слышно, что один мотив звучит в нескольких темпах
  - расхождение создаёт напряжение, совпадение — разрядку
  - скорость или плотность превосходят человеческое
  - точка схождения ощущается как событие
  - слушатель ловит себя на том, что следит за гонкой голосов, — признак живой пьесы
  - финал — схождение или разлёт, не каденция

reading: >
  Понятно в темповом каноне — когда слушатель с первых тактов слышит, что голоса играют одно и то
  же, но в разных темпах. Интересно — когда расхождение нарастает, рождает напряжение и
  непредвиденные ритмы, а совпадение (или его ожидание) становится событием формы. Пьеса
  проваливается, если материал так сложен, что канон не слышен, если соотношения не дают ни
  расхождения, ни встречи, или если плотность превращается в шум без формы.

manifesto:
  - Время не одно; голоса живут в разных темпах рядом.
  - Ритм можно строить из тех же соотношений, что и высоту.
  - Машина сыграет то, что не сыграет рука.
  - Схождение голосов — событие, которое рассчитывают.
  - Иррациональное соотношение — не ошибка, а новая свобода.
  - Механика не исключает юмора и энергии.

form:
  code: src/mnemosyne/music/schools/tempo_canon.py
  note: >
    Код строит ячейку из девяти разных высотных классов и проводит её во всех партиях
    одновременно в соотношениях скоростей 1 : √2 : √3 : φ (золотое сечение). Все голоса
    равномерно ускоряются от начала к концу секции; онсеты получены точным интегрированием
    закона ускорения и затем округлены до 1/32 четверти без накопления ошибки. Голоса стартуют
    вместе в начале секции и только расходятся — точки схождения нет. Ансамбль — четыре
    фортепиано как замена механическому. Проверяются соотношения и сетка онсетов. Оставлены
    композитору: точка схождения, замедляющиеся голоса против ускоряющихся, смещённые вступления,
    выбор материала (блюз, гамма, арпеджио) и большая форма.

climate:
  turbulence: голоса расходятся быстрее, ускорение круче
  volatility: соотношения иррациональнее, совпадений нет
  steadiness: постоянные темпы, предсказуемое расхождение
  crowding: больше голосов, плотность выше
  density: сверхбыстрые пассажи
  renewal: точка схождения, голоса встречаются
  novelty: новые соотношения темпов
  closedness: одна ячейка, один закон

exemplars:
  - Этюды для механического фортепиано (с конца 1940-х)
  - Этюд № 21 «Canon X» — один голос ускоряется, другой замедляется
  - Этюд № 37 — двенадцатиголосный темповый канон
  - Генри Кауэлл, «New Musical Resources» (1930)
texts: под охраной (Нанкарроу умер в 1997 году); берутся только приёмы — темповые соотношения, ускорение, схождение, — не этюды и не перфоленты
