# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: ustvolskaya
name: Уствольская
art: music
kind: instrumental
origin:
  place: Ленинград — Санкт-Петербург
  era: 1940-е — 1990 (последнее сочинение — Пятая симфония)
  language: традиция — ленинградская композиторская школа, от которой она отреклась; в звуке слышат православную молитву и колокол, хотя сама она родства не называла
  note: >
    Галина Уствольская (1919–2006) училась в Ленинградской консерватории в классе Шостаковича,
    который высоко её ценил и цитировал тему её Трио в своих сочинениях. Сама она позднее резко
    отрицала его влияние и всякую преемственность. Жила замкнуто, писала мало, многое из раннего отвергла,
    сочинения подолгу ждали исполнения; в 1960–1980-е её музыка почти не звучала в СССР. Её
    поздний корпус — двадцать с небольшим опусов: шесть фортепианных сонат, «Композиции» № 1–3 и
    симфонии № 2–5 с молитвенными подзаголовками для необычных составов (восемь контрабасов,
    фортепиано и деревянный куб; четыре флейты, четыре фагота и фортепиано). Она настаивала, что её
    музыка духовна, но не литургична, и что даже малые составы не делают её камерной. На Западе
    её с 1990-х годов исполняли и записывали, в частности Рейнберт де Леув.

lineage:
  predecessors:
    - Шостакович — учитель, от которого она отреклась
    - православная молитва и колокольный звон — то, что слышат в её музыке критики; сама она предшественников не называла
  neighbours:
    - сама себя считала одиночкой и отрицала любое родство
    - Пярт и Гурецкий — духовная музыка позднесоветского времени, но у Уствольской без утешения
    - Фелдман — радикальная сосредоточенность и редукция, при противоположной громкости
  against:
    - камерность, изящество, концертная красивость
    - советская симфоническая риторика
    - утешительная духовность
    - ирония и цитатность
    - развитие и драматургия по образцу симфонии XIX века

worldview: >
  Звук — молитва и крик одновременно; молитва здесь не утешение, а мучительное, почти
  насильственное усилие пробиться к Богу. Мир сжат до немногого: удар, кластер, унисон, тишина.
  Музыка аскетична, как пустая келья, и тяжела, как камень; она не нравится и не должна
  нравиться. Её сила в бескомпромиссности: одно и то же утверждается снова и снова, пока не
  станет непреложным.

reader: >
  Слушатель выдерживает удар. От него требуется вынести предельную громкость и предельную тишину,
  монотонность повторов, отсутствие красоты в привычном смысле — и пережить это как
  духовное усилие, а не как концерт. Слушание тяжело и телесно; оно требует абсолютной серьёзности
  и вознаграждает чувством подлинности, которую нельзя подделать.

time: >
  Время — тяжёлое, неравномерное, без метра в привычном смысле: сочинения писались без тактовых
  черт, длительности ровными четвертями, повтор удара за ударом. Нет развития; есть упорство и
  нагнетание. Тишина — отрезанная, не дыхание, а обрыв. Время ощущается как испытание.

composition:
  principle: немногие звуковые блоки — кластер, унисон, удар, тишина — повторяются и чередуются с предельной настойчивостью, без развития
  forms:
    - фортепианная соната из повторяющихся кластеров и унисонов
    - «Композиция» для странного ансамбля с молитвенным заголовком
    - симфония-молитва с чтецом или голосом
    - дуэт, где два инструмента бьются друг о друга
  inner: >
    Внутри — повторы ровных длительностей, монотонные линии в унисон, кластерные удары, часто
    fff с акцентами; контрастом — внезапные ppp-эпизоды той же упрямой фактуры. Блоки стыкуются
    без переходов.

narrator: >
  Источник — голос, который не просит и не рассказывает, а заклинает. Исполнитель играет с
  предельной физической силой (кластеры предплечьем, кулаком, удары по деревянному кубу) и с
  предельной сосредоточенностью в тишайших местах. Свободы почти нет; исполнительская
  выразительность — в выдержке и полной отдаче, без смягчения.

character: >
  Персонаж — удар и унисон: кластер как камень, унисонная линия как монотонная молитва,
  тишина как бездна между ними.

language: >
  Кластеры, унисоны, монотонные линии; диатонические и хроматические кластеры, иногда в
  крайних регистрах. Ритм — ровные четверти, повторы, без такта. Тембр — фортепиано как ударный
  инструмент, низкие струнные, туба, флейта-пикколо, деревянный куб; необычные составы.
  Динамика — крайние: ffff и pppp, редко середина. Фактура — блоки, никакой полифонической
  ажурности.

imagery:
  - камень, молот, удар
  - келья, пустота
  - крест, молитва, крик
  - деревянный куб
  - снег, холод, Петербург

themes:
  - молитва как усилие
  - страдание и надежда без утешения
  - одиночество
  - бескомпромиссность
  - Dona nobis pacem, Dies irae, Benedictus — даруй мир, день гнева, благословен грядущий

devices:
  - кластер, повторяемый ударами fff
  - унисонная линия ровными длительностями
  - внезапный переход от fff к ppp той же фактурой
  - отсутствие такта, ровные четверти
  - удар по деревянному кубу
  - необычный состав без камерного смешения тембров

genres:
  - фортепианная соната
  - «Композиция» для необычного ансамбля
  - симфония с чтецом или голосом
  - дуэт
  - трио и октет (ранние)

forbidden:
  - красота звука ради красоты
  - развитие и тематическая работа
  - камерная деликатность
  - цитаты и ирония
  - утешение и сентиментальность
  - средняя динамика как норма

markers:
  - удары ощущаются физически и не смягчаются
  - тишайшие эпизоды так же напряжены, как громкие
  - повтор не надоедает, а нагнетает
  - блоки стыкуются без переходов, как камни
  - слушатель не может отстраниться и переживает звук как испытание — признак живой пьесы
  - финал не разрешает, а обрывается или застывает

reading: >
  Понятно у Уствольской — когда слушатель сразу слышит немногие блоки — удар, унисон, тишина —
  и понимает, что больше ничего не будет. Интересно — когда упорство повторов превращается в
  напряжение, которое невозможно выдержать равнодушно, когда контраст fff и ppp становится
  духовным, а не эффектным. Пьеса проваливается, если удары звучат как приём, если громкость
  смягчена ради красоты, если в материал добавлены развитие и разнообразие или если повтор
  механичен и не нагнетает.

manifesto:
  - Звук — молитва, и молитва — усилие, а не утешение.
  - Немногое, повторённое до конца, сильнее многого.
  - Громкость и тишина — две крайности одного крика.
  - Красота не цель; правда — цель.
  - Малый состав не делает музыку камерной.
  - Ни учителей, ни родства — только своё.

form:
  code: src/mnemosyne/music/schools/ustvolskaya.py
  note: >
    Код чередует секции по номеру, а не по характеру плана — чётные секции fff, нечётные ppp
    (это указание перекрывает динамику характера). В fff-секциях партии берут центр плюс 0–3
    полутона (своё смещение у каждой), фортепиано — шестизвучный хроматический кластер, удары с
    акцентом длиной восьмую каждые две четверти. В ppp-секциях все партии бьют центр в унисон с
    акцентом каждые четыре четверти. Проверяются блоки, акценты и чередование крайних динамик.
    Оставлены композитору: отсутствие такта, монотонные линии ровными четвертями, удары
    кулаком и предплечьем, деревянный куб, необычные составы, длительность нагнетания, переходы
    без перехода внутри секции и молитвенный заголовок.

climate:
  strain: удары чаще и громче, кластер шире
  scars: удар повторяется, не уходя
  closedness: один блок, одна высота
  loss: унисон в ppp, длинные паузы
  steadiness: ровные четверти, упорство повтора
  turbulence: резкие переходы между fff и ppp
  crowding: кластеры плотнее, регистр сжат
  age: колокол и молитва, вне времени

exemplars:
  - Трио для кларнета, скрипки и фортепиано (1949)
  - Октет (1949–1950)
  - Большой дуэт для виолончели и фортепиано (1959)
  - Композиция № 1 «Dona nobis pacem» (1970–1971)
  - Композиция № 2 «Dies irae» (1972–1973)
  - Композиция № 3 «Benedictus, qui venit» (1974–1975)
  - Симфонии № 2–5 (1979–1990)
  - Соната для фортепиано № 6 (1988)
texts: под охраной (Уствольская умерла в 2006 году, ноты изданы Sikorski); берутся только приёмы — кластер, унисон, крайняя динамика, повтор, — не партитуры
