# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: organum
name: Органум школы Нотр-Дам
art: music
kind: mixed
origin:
  place: Франция, Париж — собор Нотр-Дам (строительство начато в 1163 году)
  era: около 1160–1250 годов
  language: латинская литургия; многоголосие на основе григорианского хорала
  note: >
    Органумом называли пение, в котором к хоралу добавлен ещё один голос. Ранние формы описаны в
    трактате «Musica enchiriadis» (IX век): параллельное движение в кварту или квинту. В XII веке
    в Аквитании и Сантьяго-де-Компостеле верхний голос уже свободно распевает над долгими звуками
    хорала. В Париже при соборе Нотр-Дам сложился «Magnus liber organi» — великая книга органумов
    к праздникам года. О его авторах известно в основном от анонимного английского автора, которого
    называют Аноним IV (около 1270-х): Леонин — «лучший органист», сочинитель книги; Перотин —
    «лучший дискантор», который её переработал и написал органумы для трёх и четырёх голосов,
    среди них «Viderunt omnes» и «Sederunt principes». Распоряжения парижского епископа Эда де Сюлли
    (1198 и 1199) упоминают исполнение органумов в три и четыре голоса. Ритм записывался
    лигатурами по ритмическим модусам; их теория изложена, в частности, у Иоанна де Гарландии
    (середина XIII века). Рукописи этого репертуара — так называемые W1, W2 и флорентийская F.

lineage:
  predecessors:
    - григорианский хорал — сама основа, тенор берёт его звуки
    - параллельный органум «Musica enchiriadis»
    - аквитанская полифония (Сен-Марсьяль) и Кодекс Каликстинус — мелизмы над долгими тонами
  neighbours:
    - кондукт — многоголосие на новый, не литургический текст, все голоса в одном ритме
    - мотет — вырос из клаузул, когда верхним голосам подтекстовали новые слова
    - готическая архитектура собора — современница и частая метафора
  against:
    - одноголосие без пространства
    - ритм без меры — модус впервые делает многоголосие точно соизмеримым
    - светская песня трубадуров с её строфой

worldview: >
  Хорал — неподвижная основа, данная традицией; над ним человек строит украшение, как собор над
  фундаментом. Протянутый звук хорала становится временем, внутри которого распевают верхние
  голоса. Консонанс — образ порядка: октава и квинта суть совершенные числа, и на сильных местах
  голоса сходятся в них; всё прочее — путь от одного согласия к другому.

reader: >
  Слушатель стоит под сводами в большой праздник. Он не следит за словом — слово растянуто так,
  что один слог длится минуту, — а слышит, как над неподвижным тоном кружатся голоса и
  сходятся в пустых, звонких созвучиях. От него требуется не понимать, а пребывать: органум —
  звучащее пространство праздника.

time: >
  Два времени разом: бесконечно долгий тон тенора и мерный, танцевальный ход верхних голосов в
  трёхдольных модусах. Форма идёт по хоралу: сольные части распеваются многоголосно, хоровые
  остаются одноголосными. Внутри — смена органума с выдержанными тонами и дисканта, где тенор тоже
  движется в мере.

composition:
  principle: тенор — хорал в очень долгих звуках; верхние голоса в ритмических модусах сходятся с ним в совершенных консонансах на сильных долях
  forms:
    - органум дуплум (Леонин) — два голоса, свободная мелизма над тенором
    - органум триплум и квадруплум (Перотин) — три и четыре голоса в модусах
    - клаузула — отрывок, где тенор тоже идёт мерно (дискант)
    - кондукт — все голоса в одном ритме на новом тексте
  inner: >
    Модус — повторяемая ячейка из долгих и кратких в трёхдольной мере: первый — долгий-краткий,
    второй — краткий-долгий, третий — долгий с точкой и два кратких, шестой — три кратких. Ячейки
    собраны в ордо — фразу, которая кончается паузой. На начале каждой перфекции голос берёт унисон,
    квинту или октаву с тенором; краткие ноты идут проходящими ступенями и могут диссонировать.

narrator: >
  Солисты поют многоголосные части, хор — одноголосный хорал между ними. Голоса равноправны в
  ритме, но не в происхождении: тенор принадлежит традиции, верхние — мастеру. Исполнитель
  держит меру и чистоту созвучий; свобода — в протяжённости тенора и в акустике собора.

character: >
  Вместо героя — тенор: звук хорала, вытянутый до неподвижности, и голоса, которые над ним
  танцуют. Их встреча в квинте и октаве — событие каждой перфекции.

language: >
  Диатоника ладов хорала; совершенные консонансы — унисон, квинта, октава (кварта между верхними
  голосами); терции как несовершенные, диссонансы как проходящие. Трёхдольный ритм модусов,
  запись лигатурами. Тембр — мужские голоса солистов. Фактура — тенор и над ним два–три голоса
  в близком диапазоне, часто перекрещивающихся.

imagery:
  - своды и столпы собора
  - каменная основа и ажурная резьба над ней
  - праздничное утро Рождества
  - свет витража
  - бесконечно тянущийся колокольный тон

themes:
  - торжество праздника
  - порядок мира в числе
  - традиция и украшение
  - время, растянутое до вечности

devices:
  - тенор хорала в очень долгих звуках
  - ритмические модусы в трёхдольной мере
  - совершенный консонанс на начале перфекции
  - проходящий диссонанс на кратких
  - ордо с паузой в конце
  - смена органума purum и дисканта
  - обмен голосов и повтор мотивов между верхними голосами

genres:
  - органум дуплум, триплум, квадруплум
  - клаузула
  - кондукт
  - ранний мотет

forbidden:
  - терции и сексты как опорные созвучия
  - двудольный метр
  - смена или хроматизация хорала в теноре
  - выразительная мелодия солиста над аккомпанементом
  - диссонанс на сильной доле перфекции

markers:
  - слышен тон, который тянется и тянется
  - над ним — танцующий трёхдольный ход
  - на сильных местах — пустые звонкие квинты и октавы
  - фразы верхних голосов отделены короткими паузами
  - смена звука в теноре ощущается как поворот всего здания

reading: >
  Понятно — когда слушатель с первых секунд держит в слухе тон тенора и понимает, что всё
  звучащее над ним собирается к нему в квинту и октаву. Захватывает — когда долгий тон становится
  пространством, а модальный танец голосов — его светом; каждая новая нота тенора меняет освещение.
  Проваливается, если верхние голоса теряют меру, если консонансы перестают совпадать с сильными
  долями или если тенор движется так часто, что исчезает неподвижность.

manifesto:
  - Хорал — фундамент; на нём строят, его не меняют.
  - Долгий звук — это пространство, а не пауза в мелодии.
  - Мера трёхдольна — долгий и краткий.
  - На сильном месте — совершенное согласие.
  - Диссонанс — только путь между согласиями.
  - Голоса сходятся, как своды над столпом.

form:
  code: src/mnemosyne/music/schools/organum.py
  note: >
    Код выбирает лад, строит тенор как ступенное блуждание хорала и тянет его звуки: в тихих,
    светлых и угасающих разделах (organum purum) — по 4–8 перфекций (6–12 четвертей), в напряжённом
    разделе (дискант) — долгими пятого модуса по полторы четверти. Тенор — самая низкая не
    фортепианная партия. Верхние голоса (до трёх линий: дуплум, триплум, квадруплум) идут в
    модусах I, II, III или VI; перфекция — полторы четверти внутри записи 4/4. Первая нота каждой
    перфекции — унисон, квинта или октава над звучащим тоном тенора; прочие ноты — ступени, иногда
    диссонирующие. Ордо из 2–4 перфекций заканчивается паузой. Не реализованы обмен голосов,
    копулы, лигатурная запись и исполнение хоровых частей одноголосно.

climate:
  steadiness: organum purum, тенор почти неподвижен
  loss: низкий тенор, редкие ордо, больше пауз
  scars: дольше проходящие диссонансы между перфекциями
  renewal: третий и четвёртый голос, светлая квинта в верхах
  age: первая записанная мерная полифония Европы
  closedness: дуплум над тенором
  crowding: квадруплум, голоса перекрещиваются
  turbulence: дискант — тенор тоже идёт в мере

exemplars:
  - Magnus liber organi (рукописи W1, F, W2)
  - Перотин, Viderunt omnes (organum quadruplum)
  - Перотин, Sederunt principes (organum quadruplum)
  - Леонин, органумы дуплум из Magnus liber
  - Аноним IV, трактат о музыке (около 1270-х)
  - Иоанн де Гарландия, «De mensurabili musica»
texts: общественное достояние; берутся только приёмы — тенор на хорале, ритмические модусы, консонансы на перфекциях, — но не мелодии и не голоса конкретных органумов
