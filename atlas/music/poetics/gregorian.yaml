# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: gregorian
name: Григорианский хорал
art: music
kind: mixed
origin:
  place: Западная Европа — Рим и франкские земли; монастыри Санкт-Галлен, Мец, Лан, позднее Солем
  era: складывается в VIII–IX веках, нотированные источники с IX–X веков; возрождение в XIX–XX веках
  language: латынь литургии — месса и часы оффиция; одна мелодическая линия без сопровождения
  note: >
    Григорианский хорал — одноголосное литургическое пение латинской церкви. Название связано с
    папой Григорием I (ум. 604), но его авторство — средневековая легенда: репертуар сложился
    позднее, при соединении римского пения с франкским в каролингскую эпоху. Первые записи —
    невмы над текстом, напоминавшие певцу уже выученную мелодию (рукописи Санкт-Галлена и Лана
    IX–X веков). Каролингские теоретики свели напевы в систему восьми ладов (октоих) и составили
    тонарии. Гвидо Аретинский (XI век) предложил линейную нотацию и слоги ут–ре–ми, взятые из
    гимна «Ut queant laxis». В XIX веке бенедиктинцы аббатства Солем восстановили мелодии по
    старым рукописям; в 1908 году вышел ватиканский «Graduale Romanum», а Второй Ватиканский
    собор (1963) признал за хоралом «первое место» в римской литургии. Изучение ранних невм как
    указаний на ритм и нюанс — семиология Эжена Кардина (1970).

lineage:
  predecessors:
    - пение псалмов в синагоге и ранней церкви — речитатив на одном тоне с формулами начала и конца
    - староримское и галликанское, амвросианское (миланское) и мосарабское пение — соседние латинские традиции
    - византийское пение и его восемь гласов — образец ладовой классификации
  neighbours:
    - византийское и знаменное пение — одноголосие, ладовые формулы, исон (держащийся тон) в греческой практике
    - органум — первое многоголосие, выросшее прямо на хорале
    - тропы и секвенции — новые тексты и мелодии, вставленные в старый напев
  against:
    - инструментальное сопровождение и размер, приходящий извне слова
    - мелодия как выражение личности певца или сочинителя
    - светская песня с её куплетом и танцевальным метром

worldview: >
  Пение — это молитва, произнесённая громче, чем говорят, и протянутая во времени. Звук принадлежит
  слову, а слово принадлежит службе: у мелодии нет автора, есть место в годовом круге и в часах дня.
  Один голос, в котором слились многие, — образ единой церкви; унисон не бедность, а согласие.
  Лад — не тональность, а характер и место: у каждого своя финалис, свой тон речитации и свой простор.

reader: >
  Слушатель не публика, а участник: он стоит в храме, и пение обращено не к нему, а вместе с ним
  вверх. От него требуется не следить за развитием, а войти в дыхание текста — фраза кончается,
  когда кончается мысль, долгая мелизма на «Аллилуйя» — это радость, которой не хватает слов.
  Слушание медленное и повторяемое: те же напевы возвращаются каждый год в тот же день.

time: >
  Время — литургическое и неметрическое. Ритм не делится тактами, а складывается из групп по
  два–три звука и из долготы слогов; длинный звук стоит на конце слова и фразы. Форма задана
  текстом: антифон — псалом — антифон, стих и ответ, части мессы. Внутри — волны подъёма к тону
  речитации и возвращения к финалису.

composition:
  principle: одна линия в ладу — от финалиса к тону речитации и обратно, движение по ступеням, ритм из слогов текста
  forms:
    - псалмовый тон — интонация, речитация, медианта, речитация, окончание
    - антифон к псалму — короткий силлабический напев
    - невматические песнопения — интроит, коммунио, офферторий
    - мелизматические — градуал и аллилуйя с юбиляцией на последнем слоге
    - гимн и секвенция — строфические, более поздние формы
  inner: >
    Песнопение растёт из формул: начальная интонация поднимается к тону речитации, середину держит
    повторяемый тон, каденция опускается к финалису. Слог несёт одну ноту (силлабический стиль),
    группу из двух–трёх (невматический) или длинную мелизму. Скачки редки и почти всегда
    заполняются ступенями обратно.

narrator: >
  Голос анонимен: кантор начинает, схола подхватывает — так чередуются солист и хор, полухория
  или община. Певец не украшает себя; ровный тон, внимание к тексту, общее дыхание.
  Исполнительские свободы — в нюансе слога, в длине паузы, в акустике храма.

character: >
  Вместо героя — текст и лад. Каждый лад узнаётся по финалису и тону речитации: первый —
  ре и ля, восьмой — соль и до; это места, в которых стоит молитва.

language: >
  Диатоника белых клавиш (с си-бемолем как допустимой поправкой), восемь церковных ладов — четыре
  автентических и четыре плагальных. Движение по ступеням, редкие терции, кварты и квинты на
  интонациях. Ритм из слогов и невменных групп, без метра. Тембр — голоса в унисон или октаву;
  в этой школе к хоралу добавлен держащийся исон на финалисе, взятый из восточной практики.
  Динамика вырастает из линии: подъём к вершине фразы и спад к каденции.

imagery:
  - своды храма и долгая реверберация
  - свеча и ночное бдение
  - годовой круг праздников
  - псалтирь, читаемый подряд
  - море голосов, сливающихся в один

themes:
  - хвала и прошение
  - покаяние и надежда
  - Рождество, Страсти, Пасха как повторяющийся круг
  - время дня — утреня, вечерня, повечерие
  - смирение и общность

devices:
  - речитация на тоне лада с интонацией и каденцией
  - мелизма на одном слоге
  - движение по ступеням, скачок с заполнением
  - каденция на финалисе в конце песнопения
  - чередование кантора и хора
  - удлинение последнего звука слова и фразы
  - исон — держащийся финалис под мелодией (здесь как заимствование)

genres:
  - месса — проприй (интроит, градуал, аллилуйя, офферторий, коммунио) и ординарий
  - оффиций — антифоны, псалмы, респонсории, гимны
  - секвенция
  - Магнификат на псалмовый тон

forbidden:
  - многоголосие, гармония и модуляция
  - метр и такт, навязанные снаружи текста
  - выход за амбитус лада без причины
  - хроматизм
  - инструментальная виртуозность и украшение ради показа
  - сочинительская подпись и индивидуальная манера

markers:
  - слышно, где финалис и где тон речитации
  - движение почти всегда по соседним ступеням
  - фразы дышат, как текст, и кончаются долгим звуком
  - хор поёт одним голосом
  - мелизма звучит как расцвет слова, а не как пассаж
  - конец приходит на финалис и успокаивает

reading: >
  Понятно — когда с первых звуков слышно, где опора лада, и речитация на одном тоне читается как
  произнесение текста. Захватывает — когда простая линия начинает дышать: подъём к вершине фразы,
  долгая мелизма, возвращение к финалису ощущаются как молитва, а не как упражнение. Хорал
  проваливается, если ритм становится маршевым, если линия скачет без заполнения или если лад
  теряется в случайных ступенях.

manifesto:
  - Мелодия служит слову, слово — молитве.
  - Много голосов звучат как один.
  - Лад — это место, а не тональность.
  - Ступень за ступенью; скачок возвращается.
  - Ритм рождается из слога, а не из такта.
  - Конец фразы — дыхание, конец песнопения — финалис.

form:
  code: src/mnemosyne/music/schools/gregorian.py
  note: >
    Код выбирает один из восьми ладов (финалис, тон речитации, амбитус в ступенях) и строит
    фразы по разделу: при тихом и редком разделе — псалмовый тон (интонация к тону речитации,
    речитация из 5–10 слогов, медианта, вторая речитация, окончание по ступеням вниз к финалису),
    при средней плотности — невматическое пение группами по 1–3 восьмых на слог, при светлом или
    густом разделе — мелизмы по 4–8 звуков на слог. Высоты — блуждание по ступеням лада (шаг
    чаще всего на одну ступень), конец фразы удлиняется. Фразы чередуют кантора (первая партия) и
    хор в унисон или октаву; последняя партия держит исон на финалисе. Невмы, текст, тропы,
    антифонные формы и си-бемоль не реализованы; ритм записан восьмыми в такте 4/4 как условность.

climate:
  steadiness: псалмовый тон, долгая речитация на одном звуке
  loss: плагальный лад, низкий амбитус, медленные фразы
  scars: каденции чаще на медианте, не на финалисе
  renewal: мелизмы аллилуйи, подъём к вершине амбитуса
  age: самое древнее, что есть в мастерской из записанной музыки Запада
  closedness: только кантор и исон
  crowding: хор во все голоса в октавах
  turbulence: длинные мелизмы и широкие подъёмы, но без выхода из лада

exemplars:
  - Graduale Romanum (Ватиканское издание, 1908)
  - Liber Usualis (Солем, 1896 и последующие издания)
  - интроит Puer natus est
  - секвенция Victimae paschali laudes (XI век)
  - антифон Salve Regina
  - гимн Ave maris stella
  - Эжен Кардин, «Sémiologie grégorienne» (1970)
texts: общественное достояние — напевы анонимны и средневековы; современные издания (Солем, Ватикан) могут нести права на редакцию, поэтому берутся только приёмы — лады, псалмовые формулы, невменная группировка, — но не мелодии конкретных песнопений
