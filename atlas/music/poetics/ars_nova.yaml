# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: ars_nova
name: Ars nova — изоритмический мотет
art: music
kind: mixed
origin:
  place: Франция — Париж, двор и капитулы; Реймс (Машо был каноником Реймсского собора)
  era: около 1310–1377 годов
  language: латинские и французские тексты, часто разные в разных голосах одного мотета
  note: >
    Название эпохе дал трактат «Ars nova», связываемый с Филиппом де Витри (1291–1361), поэтом,
    дипломатом и позднее епископом Мо. Новое искусство — новая нотация: длительности делятся
    на два или на три (tempus и prolatio), появляется минима, ритм становится гибким и
    сложным. Ранние мотеты в новой манере вошли в интерполированную рукопись «Романа о Фовеле»
    (около 1317–1318). Папа Иоанн XXII в декреталии «Docta sanctorum patrum» (1324–1325) осудил
    новшества — дробные ноты, гокеты, мирские тексты в церковном пении. Главный мастер века —
    Гильом де Машо (около 1300–1377), автор мотетов, баллад, рондо, виреле и «Мессы Богоматери»,
    одного из первых многоголосных ординариев, написанных целиком одним автором. Слово
    «изоритмия» придумал музыковед Фридрих Людвиг в начале XX века; сам принцип в мотете —
    повторяемый ритм тенора (талея), наложенный на повторяемый ряд высот (колор).

lineage:
  predecessors:
    - мотет XIII века (ars antiqua) — тенор из хорала и подтекстованные верхние голоса
    - клаузулы школы Нотр-Дам — тенор, разложенный в повторяющиеся ритмические ячейки
    - ритмические модусы — изоритмия рождается из их повтора
  neighbours:
    - итальянское треченто — Франческо Ландини, мадригал и баллата
    - ars subtilior — изощрённая ритмика конца XIV века
    - Иоанн де Мурис — трактат «Notitia artis musicae» (1321) о новой нотации
  against:
    - трёхдольная монотонность модусов
    - запреты церковного авторитета на дробление нот
    - простое пение, не знающее числа

worldview: >
  Музыка — звучащее число. Под поверхностью красоты лежит скрытая конструкция, которую слух
  ощущает как порядок, даже не распознав её: ритм тенора повторяется, высоты повторяются, но с
  разной длиной циклов, и лишь в конце они сходятся. Мир многослоен: в одном мотете одновременно
  звучат латинская молитва, французская любовная жалоба и хоральный тенор, и смысл возникает из
  их сопоставления.

reader: >
  Слушатель — учёный клирик, придворный, знаток. Он ценит хитрость: замечает, как возвращается
  ритм тенора, слышит гокет, узнаёт хорал, спрятанный внизу. От него требуется двойное слушание —
  сразу чувственное (быстрые переплетающиеся верхние голоса) и интеллектуальное (конструкция).

time: >
  Время размечено циклами: талея — ритм из нескольких длительностей с паузой — повторяется, колор
  — ряд высот — повторяется со своим периодом. Ближе к концу талея может звучать в уменьшении,
  вдвое быстрее, и тогда конструкция ускоряется. Каденции на совершенных созвучиях отмечают
  границы разделов.

composition:
  principle: тенор из талеи и колора разной длины; быстрые верхние голоса; гокет; каденция с двумя вводными тонами
  forms:
    - изоритмический мотет на три или четыре голоса (тенор, контратенор, мотетус, триплум)
    - многоголосная месса (ординарий)
    - баллада, рондо, виреле — светские формы с повторами
  inner: >
    Талея повторяется точно; колор накладывается на неё с другим периодом, поэтому одни и те же
    ритмы получают новые высоты. Контратенор иногда тоже изоритмичен. Верхние голоса идут
    мелкими длительностями, сходятся с тенором в консонансах на его новых звуках; в гокете два
    голоса перебрасывают звуки, заполняя паузы друг друга. Раздел кончается каденцией: тенор
    спускается на тон к финалису, два верхних голоса поднимаются на полутон к квинте и октаве.

narrator: >
  Голоса — солисты, часто с разными текстами; инструменты могли брать тенор и контратенор.
  Исполнитель держит сложный счёт и чистые совершенные созвучия; гокет требует точности, похожей
  на игру.

character: >
  Вместо героя — тенор с его скрытым порядком и два верхних голоса, которые спорят или
  перекликаются над ним; гокет — их диалог через паузы.

language: >
  Лады с musica ficta — повышенными вводными тонами в каденциях; совершенные консонансы на опорах,
  терции и сексты как несовершенные, проходящие диссонансы. Двухдольное и трёхдольное деление,
  синкопы. Фактура трёх–четырёх голосов в разных темпах движения: медленный тенор, средний
  мотетус, быстрый триплум.

imagery:
  - часы и механизм
  - рукопись с цветными нотами
  - придворная любовь и аллегория
  - собор как числовая конструкция
  - лис Фовель — сатира на испорченный мир

themes:
  - любовь куртуазная и божественная
  - Фортуна и превратности
  - скрытый порядок за видимым
  - политика и сатира
  - конец, который есть начало

devices:
  - талея — повторяемый ритм тенора с паузой
  - колор — повторяемый ряд высот иной длины
  - уменьшение талеи вдвое
  - изоритмический контратенор
  - гокет — перебрасывание звуков между голосами
  - каденция с двумя вводными тонами к квинте и октаве
  - быстрые верхние голоса над медленным тенором

genres:
  - изоритмический мотет
  - месса
  - баллада, рондо, виреле
  - гокет как отдельная пьеса

forbidden:
  - тенор без повторяемой конструкции
  - функциональная гармония и тональность
  - заключение на терцовом созвучии
  - один текст и одно настроение для всех голосов без причины
  - одинаковое движение всех голосов

markers:
  - внизу слышен ритм, который возвращается
  - высоты тенора на том же ритме меняются
  - верхние голоса быстрые и узорные
  - в гокете звук прыгает от голоса к голосу
  - на конце раздела два голоса поднимаются полутоном в пустую квинту-октаву

reading: >
  Понятно — когда слушатель к третьему повтору ловит ритм тенора и с удивлением замечает, что
  высоты уже другие. Захватывает — когда конструкция и поверхность живут вместе: быстрый триплум
  поёт свободно, гокет вспыхивает игрой, а каденция с двумя вводными тонами разрешает напряжение
  ярким совершенным созвучием. Проваливается, если конструкция слышна только на бумаге, если
  верхние голоса механически заполняют время или если каденции теряют ясность.

manifesto:
  - Музыка — число, ставшее звуком.
  - Ритм повторяется, высоты блуждают; они встретятся в конце.
  - Скрытый порядок держит видимую свободу.
  - Каждый голос имеет свою скорость и свой текст.
  - Пауза одного — звук другого.
  - Конец — полутон вверх к совершенному согласию.

form:
  code: src/mnemosyne/music/schools/ars_nova.py
  note: >
    Код выбирает финалис (ре, соль, фа или до), строит талею из 3–5 звуков и одной паузы
    (длительности 1–3 четверти) и колор — ступенный ряд высот, длина которого не кратна числу
    звуков талеи. Тенор (самая низкая не фортепианная партия) проходит талею за талеей, колор
    сдвигается относительно неё; в напряжённом разделе талея звучит в уменьшении вдвое. Третья по
    высоте верхняя партия — изоритмический контратенор на ритме тенора; остальные — мотетус и
    триплум мелкими длительностями, консонирующие с тенором на его новых звуках. При плотности от
    0,75 мотетус и триплум идут гокетом по восьмым. Каждый раздел кончается каденцией: тенор на
    тон выше финалиса → финалис, мотетус на увеличенную кварту → квинту, триплум на большую
    септиму → октаву. Не реализованы тексты, мензуральные деления, синкопы и разные тексты голосов.

climate:
  steadiness: талея в прямом виде, редкие верхние голоса
  loss: низкий тенор, длинные паузы талеи
  scars: колор долго не совпадает с талеей
  renewal: каденция в светлую квинту-октаву
  age: XIV век, первая авторская мастерская числа
  closedness: тенор и один верхний голос
  crowding: четыре голоса с изоритмическим контратенором
  turbulence: уменьшение талеи и гокет

exemplars:
  - «Роман о Фовеле» (интерполированная рукопись, около 1317–1318)
  - Филипп де Витри, мотеты в «Романе о Фовеле» (атрибуции частично спорны)
  - Гильом де Машо, «Месса Богоматери»
  - Гильом де Машо, мотеты (23) и «Hoquetus David»
  - Гильом де Машо, рондо «Ma fin est mon commencement»
  - Иоанн де Мурис, «Notitia artis musicae» (1321)
texts: общественное достояние; берутся только приёмы — талея, колор, гокет, каденция с двумя вводными тонами, — а не теноры и голоса конкретных мотетов
