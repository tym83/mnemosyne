# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: classical
name: Венский классицизм
art: music
kind: instrumental
origin:
  place: Вена и её круг — Эстерхаза (двор князей Эстерхази, где служил Гайдн), Зальцбург, Бонн
  era: примерно 1770–1810-е годы
  language: инструментальная музыка — соната, квартет, симфония, концерт; итальянская опера как источник мелодии
  note: >
    «Венскими классиками» позднейшая история назвала Йозефа Гайдна (1732–1809), Вольфганга
    Амадея Моцарта (1756–1791) и Людвига ван Бетховена (1770–1827), чей ранний период ещё
    принадлежит этому стилю. Гайдн, тридцать лет служивший капельмейстером у Эстерхази, называл
    свои квартеты op. 33 (1781) написанными «совершенно новым, особенным образом». Теоретик
    Генрих Кристоф Кох в «Опыте руководства к композиции» (1782–1793) описал, как мелодия
    складывается из фраз и предложений, которые завершаются каденциями разной силы. Аккомпанемент
    ломаными аккордами в левой руке позже назвали «альбертиевым басом» по имени Доменико Альберти
    (около 1710–1740). Термин «сонатная форма» появился позднее, у А. Б. Маркса (1845).

lineage:
  predecessors:
    - галантный стиль и итальянская опера-буффа — короткие ясные фразы, песенная мелодия над простым басом
    - Карл Филипп Эмануэль Бах — чувствительный стиль клавирной сонаты
    - мангеймская оркестровая школа — динамика как средство формы
    - барочная гармония — генерал-бас, каденционные формулы
  neighbours:
    - Луиджи Боккерини, Муцио Клементи — современники с той же грамматикой
    - Глюк — реформа оперы во имя простоты
    - ранние романтики, выросшие из позднего Бетховена и Шуберта
  against:
    - барочная полифония, где голоса равноправны и фраза не делится на части
    - нескончаемая мелодия без вопросов и ответов
    - учёный контрапункт как самоцель (но не как средство разработки)

worldview: >
  Музыка — разумная речь звуков: в ней есть вопрос и ответ, напряжение и разрешение, отход и
  возвращение домой. Порядок прозрачен и соразмерен, как у Просвещения: всё неожиданное
  неожиданно лишь на фоне ясного правила. Остроумие, грация и ясность ценятся не меньше чувства;
  чувство же сказано в форме, а не вопреки ей.

reader: >
  Слушатель — просвещённый любитель, играющий дома в квартете или слушающий в салоне и в
  публичном концерте. Он понимает грамматику — знает, где полукаденция, где полная, — и потому
  наслаждается тем, как композитор с ней играет: задерживает ответ, повторяет вопрос, уходит в
  чужую тональность и возвращается.

time: >
  Время периодично и соразмерно: два такта — мотив, четыре — предложение, восемь — период.
  Предложения парны: первое кончается полукаденцией на доминанте, второе — полной каденцией на
  тонике. Крупная форма — путь из главной тональности в доминантовую и обратно.

composition:
  principle: период из двух предложений (вопрос — ответ) над функциональной гармонией с ясными каденциями; мелодия над басом и аккомпанементом
  forms:
    - период и его повтор
    - двухчастная и трёхчастная форма
    - сонатное аллегро — экспозиция с уходом в доминанту, разработка, реприза
    - рондо и вариации
    - менуэт с трио
  inner: >
    Предложение начинается с тоники, проходит через субдоминанту (IV, ii) и приходит к доминанте.
    Второе предложение повторяет начало первого (параллельный период) и закругляется полной
    каденцией ii — V7 — I. Модуляция в доминанту идёт через общий аккорд; возвращение готовится
    стоянием на доминантсептаккорде главной тональности.

narrator: >
  Мелодия поёт сверху, бас ведёт внизу, середина заполняет гармонию — фигурацией (альбертиев бас)
  или пульсирующими повторами. Исполнитель ясен, точен и элегантен: артикуляция, баланс,
  фразировка, никакого произвола в темпе.

character: >
  Вместо героя — тема и тональность. Тема — короткая и узнаваемая, тональность — дом, из которого
  уходят и в который возвращаются.

language: >
  Мажор и минор, функциональная гармония на трёх опорах — тоника, субдоминанта, доминанта;
  каденции полные и половинные; модуляция в доминанту, в минор — в параллельный мажор.
  Аккомпанемент альбертиевым басом, повторяющимися аккордами или басом четвертями. Фактура —
  гомофония: мелодия и гармония. Динамика контрастная, но в пределах классического оркестра и
  фортепиано.

imagery:
  - салон и свечи
  - парк с ясными аллеями
  - разговор остроумных собеседников
  - комическая опера, переодевания и примирения
  - путешествие и возвращение домой

themes:
  - ясность и порядок
  - игра и остроумие
  - чувство в мере
  - дом и путь

devices:
  - параллельный период — вопрос с полукаденцией, ответ с полной каденцией
  - каденция ii — V7 — I
  - альбертиев бас
  - пульсирующий аккомпанемент восьмыми
  - модуляция в доминанту через общий аккорд
  - стояние на доминанте перед возвращением
  - кодетта из повторяемых каденций

genres:
  - фортепианная соната
  - струнный квартет
  - симфония
  - концерт
  - дивертисмент и серенада

forbidden:
  - фраза без каденции
  - хроматизм, затемняющий тональность
  - полифония, в которой не слышна мелодия
  - модуляция без подготовки и без возвращения
  - произвольное rubato

markers:
  - фразы слышно по четыре такта
  - второе предложение начинается как первое и кончается увереннее
  - бас ходит по корням аккордов, середина фигурирует
  - в середине пьесы — новая тональность на квинту выше
  - конец подтверждён несколькими каденциями

reading: >
  Понятно — когда с первых тактов ясно, где вопрос и где ответ, и полная каденция ощущается как
  точка. Захватывает — когда в этой ясности есть игра: ответ задерживается, тональность уходит,
  доминанта долго стоит перед возвращением и возвращение радует. Проваливается, если периоды
  становятся квадратными без жизни, если гармония не движется к каденции или если аккомпанемент
  заглушает мелодию.

manifesto:
  - Каждый вопрос получает ответ.
  - Тоника — дом; доминанта — дорога.
  - Мелодия поёт, бас держит, середина движется.
  - Ясность — первое условие выразительности.
  - Неожиданное возможно лишь там, где ожидание ясно.
  - Возвращение должно быть подготовлено.

form:
  code: src/mnemosyne/music/schools/classical.py
  note: >
    Код делит каждый раздел на предложения по четыре такта и пары предложений — периоды. Гармония
    по полутактам: первое предложение кончается полукаденцией на V, второе повторяет его начало
    (те же такты мелодии) и кончается каденцией ii — V7 — I. Если разделов три и больше, средние
    звучат в доминантовой тональности: последнее предложение первого раздела модулирует (каденция
    уже в V), последнее предложение предпоследнего раздела останавливается на V7 главной
    тональности. Лишние такты — кодетта I — V7. Роли: мелодия, бас (корни аккордов),
    фортепиано — альбертиев бас, средние голоса — повторяющиеся аккордовые звуки восьмыми или
    четвертями. В миноре (план `mode: minor`) главная тональность звучит в гармоническом миноре
    с повышенной VII ступенью в V и viio, каденции идут на i и V, а средние разделы уходят не в
    доминанту, а в параллельный мажор. Сонатная разработка, побочная тема, вариации и мотивная
    работа не реализованы.

climate:
  steadiness: периоды в главной тональности, пульсирующий аккомпанемент
  loss: долгое стояние на доминанте, тише и реже аккомпанемент
  scars: модуляция, затянувшаяся дольше ожидаемого
  renewal: возвращение в тонику после доминантового раздела
  age: классика как мера всего последующего
  closedness: мелодия и альбертиев бас
  crowding: квартет и оркестр — все голоса в пульсе
  turbulence: восьмые в аккомпанементе, напряжённые разделы

exemplars:
  - Гайдн, струнные квартеты op. 33 (1781)
  - Гайдн, Симфония № 94 «Сюрприз» (1791–1792)
  - Моцарт, Соната для фортепиано до мажор K. 545 (1788)
  - Моцарт, Симфония № 40 соль минор K. 550 (1788)
  - Бетховен, фортепианные сонаты op. 2 (1795)
  - Г. К. Кох, «Опыт руководства к композиции» (1782–1793)
  - Чарльз Розен, «Классический стиль» (1971)
texts: общественное достояние; берутся только приёмы — период, каденции, альбертиев бас, план тональностей, — но не темы и не голоса конкретных сочинений
