# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: polystylism
name: Полистилистика
art: music
kind: instrumental
origin:
  place: СССР, Москва; с 1990 года — Гамбург
  era: конец 1960-х — 1990-е
  language: традиция — европейская музыка всех эпох как общий словарь; советская киномузыка как лаборатория
  note: >
    Альфред Шнитке (1934–1998) прошёл через сериальную технику начала 1960-х и почувствовал её
    тесноту. Работа в кино (он написал музыку к десяткам фильмов) приучила его соединять несоединимое:
    вальс, марш, хорал, джаз, авангардный кластер в одной сцене. В конце 1960-х — начале 1970-х он
    перенёс этот опыт в концертную музыку и описал его в докладе о полистилистических тенденциях в
    современной музыке: цитата, аллюзия, стилизация и коллаж как способ говорить о времени и о
    себе. Первая симфония (1969–1972), впервые исполненная в Горьком в 1974 году под управлением
    Геннадия Рождественского, — манифест метода: оркестр уходит и возвращается, джаз сталкивается
    с Бетховеном, похоронный марш — с хаосом. Позднее полистилистика у Шнитке становится трагичнее
    и сосредоточеннее — Concerto grosso № 1 (1977), Альтовый концерт (1985).

lineage:
  predecessors:
    - Малер — банальное и возвышенное в одной симфонии, марш и лендлер
    - Айвз — наслоение маршей, гимнов и песен, независимые оркестры
    - Шостакович — цитаты и самоцитаты, гротеск, Пятнадцатая симфония
    - Берг — тональная цитата внутри двенадцатитоновой музыки (хорал Баха в Скрипичном концерте)
    - Стравинский — стилизация, игра с чужим стилем
  neighbours:
    - Лучано Берио, «Sinfonia» (1968–1969) — скерцо Малера как русло для цитат
    - Бернд Алоис Циммерман — коллаж эпох, «Musique pour les soupers du Roi Ubu» (1966)
    - Арво Пярт до тинтиннабули — «Collage sur B-A-C-H» (1964), «Credo» (1968)
    - Валентин Сильвестров, Гия Канчели — память стиля, тихие отголоски
    - Эдисон Денисов, София Губайдулина — московский круг
  against:
    - стилистическая чистота как догма — и авангардная, и академическая
    - сериализм как единственная «правильная» современность
    - соцреалистическая цельность без трещин
    - музыка вне истории, вне памяти

worldview: >
  Мир расколот, и музыка должна это слышать: прошлое и настоящее, высокое и банальное, святое и
  пошлое звучат одновременно, и честно — не прятать раскол, а сделать его материалом. Стили —
  голоса эпох и людей; цитата — не украшение, а память, которая вторгается в настоящее и
  разрушается в нём. Добро и зло, Бог и дьявол, красота и её подделка спорят внутри одной пьесы.
  Ирония здесь не снимает трагизма, а обнажает его.

reader: >
  Слушатель узнаёт: Баха, Моцарта, вальс, танго, церковный хорал, советскую эстраду, — и тут же
  переживает, как узнанное искажается, тонет в хаосе или сталкивается с чужим. Слушание требует
  памяти и культурного багажа, но работает и без него: шок контраста ощутим сразу. Слушатель
  становится свидетелем борьбы стилей и сам решает, на чьей он стороне.

time: >
  Время многослойно: в один момент звучат разные эпохи. Форма — монтаж и столкновение, а не
  развитие: стили вторгаются, обрываются, наслаиваются. Внутри больших форм (симфония, концерт)
  сохраняется драматургия классического типа — путь, кульминация, итог, — но этот путь пролегает
  через катастрофы стилей.

composition:
  principle: разные стили и эпохи сводятся в одной пьесе — через цитату, аллюзию, стилизацию и коллаж, — и их столкновение становится драмой
  forms:
    - симфония-коллаж, где оркестр уходит и возвращается (Первая симфония)
    - concerto grosso, где барочная форма раскалывается авангардом и танго
    - соната «как бы» — ушедший жанр, прочитанный сквозь трещины
    - малая форма-шутка, сплетённая из цитат (Moz-Art)
    - реквием и кантата, где сакральное сталкивается с эстрадным
  inner: >
    Внутри — сопоставление или наложение двух-трёх стилевых слоёв: например, тональная цитата и
    хроматический кластер, клавесин и симфонический хаос. Стиль-цитата узнаётся, затем
    искажается — расстраивается микротонами, ускоряется, тонет. Монтаж резкий; иногда старое
    проступает из нового медленно, как воспоминание.

narrator: >
  Источник — множество голосов-стилей, а за ними — один голос автора, который всё это слышит и
  страдает. Исполнитель должен владеть всеми стилями сразу — играть Вивальди как Вивальди и
  кластер как кластер, — и не сглаживать швы. Часто нужны солисты-виртуозы и необычные
  инструменты (клавесин, препарированное фортепиано, бас-гитара).

character: >
  Персонаж — стиль: вальс, хорал, танго, барочная фуга, авангардный кластер. Стили ведут себя
  как герои драмы — вторгаются, побеждают, погибают, превращаются друг в друга.

language: >
  Вся история гармонии — от барочной до кластерной; микротоновое искажение тональной цитаты.
  Ритм — от барочного моторного до свободного. Тембр — смешение эпох: клавесин и электрогитара,
  орган и джаз-бэнд. Динамика — резкие контрасты. Фактура — наслоение несовместимого.

imagery:
  - зеркало, кривое зеркало
  - маска, карнавал, Фауст и Мефистофель
  - руины, пепел, память
  - вальс на краю пропасти
  - распад и собирание

themes:
  - память и её разрушение
  - добро и зло, Бог и дьявол
  - культура XX века как раскол
  - подлинное и подделка
  - смерть и надежда

devices:
  - цитата, узнаваемая и затем искажённая
  - аллюзия — намёк на стиль без прямой цитаты
  - стилизация — ушедший жанр, написанный заново
  - коллаж — наложение двух эпох одновременно
  - микротоновое расстраивание тональной темы
  - вторжение банального (танго, марш) в серьёзное

genres:
  - симфония
  - concerto grosso
  - инструментальный концерт
  - скрипичная соната
  - реквием и кантата
  - музыка к кино

forbidden:
  - стилистическая чистота как цель
  - цитата как украшение без столкновения
  - ирония без трагедии
  - сглаживание швов
  - музыка без памяти

markers:
  - узнаётся стиль или цитата, и тут же его подрывают
  - швы слышны и болят
  - стили спорят, а не просто сменяют друг друга
  - банальное вторгается и становится страшным
  - слушатель вздрагивает от узнавания и от его разрушения — признак живой пьесы
  - финал не примиряет стили, а оставляет трещину или тишину

reading: >
  Понятно в полистилистике — когда слушатель сразу узнаёт стиль и понимает, что пьеса о
  столкновении. Интересно — когда это столкновение имеет драму: узнанное искажается, банальное
  становится страшным, высокое — беззащитным, а форма ведёт через эти катастрофы к итогу.
  Пьеса проваливается, если цитаты стоят рядом как витрина, если швы заглажены, если ирония
  не переходит в трагедию, или если узнавание не вызывает ничего, кроме узнавания.

manifesto:
  - Мир расколот, и музыка должна слышать этот раскол.
  - Стили — голоса эпох; их спор — драма нашего времени.
  - Цитата — память, которая вторгается и разрушается.
  - Банальное и возвышенное звучат вместе.
  - Ирония обнажает трагедию, а не снимает её.
  - Чистота стиля — ложь о времени.

form:
  code: src/mnemosyne/music/schools/polystylism.py
  note: >
    Код требует в плане архивную цитату со списком событий и SHA-256 исходника; без неё
    сочинение отказывается. Цитата — не Шопен, а мелодия из сгенерированного в мастерской
    «романтического ноктюрна»: восемь четвертей верхнего голоса. Последняя партия циклически
    повторяет её на p. Остальные партии на ff играют «хроматическое вторжение» — восьмые по кругу
    квартовых шагов через все двенадцать высотных классов, со смещёнными вступлениями и шагом,
    меняющимся по секциям. Проверяются целостность цитаты и разделение слоёв. Оставлены
    композитору: выбор и драматургия стилей, искажение цитаты (микротоны, ускорение, распад),
    аллюзия и стилизация, монтаж и путь формы к итогу.

climate:
  turbulence: стили сталкиваются чаще, швы резче
  scars: искажённая цитата держится и не исцеляется
  age: больше цитат из далёких эпох
  novelty: неожиданный стиль вторгается
  loss: цитата тонет, остаётся хаос или тишина
  crowding: слоёв больше, эпохи наслаиваются
  strain: банальное становится страшным
  volatility: монтаж быстрее, стили сменяются чаще

exemplars:
  - Скрипичная соната № 2 «Quasi una sonata» (1968)
  - Симфония № 1 (1969–1972)
  - Moz-Art (1976)
  - Concerto grosso № 1 (1977)
  - Фортепианный квинтет (1972–1976)
  - Альтовый концерт (1985)
  - Берио, Sinfonia (1968–1969)
texts: под охраной (Шнитке умер в 1998 году, ноты изданы Sikorski и Universal Edition); берутся только приёмы — цитата, аллюзия, стилизация, коллаж, — не партитуры; цитаты в коде — собственная продукция мастерской
