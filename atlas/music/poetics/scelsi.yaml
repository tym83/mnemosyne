# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: scelsi
name: Шельси — музыка одного звука
art: music
kind: mixed
origin:
  place: Италия, Рим
  era: с конца 1950-х («Четыре пьесы на одной ноте», 1959) до 1980-х
  language: традиция — восточные духовные практики (индийская и тибетская мысль), звук как вибрация; европейский авангард остался в стороне
  note: >
    Джачинто Шельси (1905–1988), итальянский аристократ, в молодости писал в духе футуризма и
    двенадцатитоновой музыки. После тяжёлого нервного кризиса конца 1940-х, по его собственному
    рассказу, он часами повторял на фортепиано одну ноту и вслушивался в неё — и понял, что звук
    имеет глубину и внутреннюю жизнь, которые теряются, когда ноты быстро сменяют друг друга.
    Дальнейшая его музыка исследует один звук или узкую область вокруг него: микротоновые
    колебания, биения, смены тембра и динамики. Шельси импровизировал на ондиоле и магнитофоне,
    а записи по его указаниям переносили в партитуру помощники; после смерти композитора это
    вызвало спор об авторстве. Сам он избегал публичности и фотографий, а себя называл не
    композитором, а посредником. Его музыку широко узнали в 1980-е годы, когда её начали играть
    ансамбли нового поколения.

lineage:
  predecessors:
    - индийская музыка — бурдон, микроинтонация, звук как путь
    - тибетское горловое и обертоновое пение
    - сериализм, который Шельси прошёл и оставил
  neighbours:
    - спектралисты — Гризе и Мюрай, считавшие его предтечей
    - Ла Монте Янг — долгий звук и вибрация
    - Лигети — медленная трансформация поверхности
    - Элиан Радиг — электронная музыка долгого звука
  against:
    - сочинение как расстановка нот
    - мелодия и гармония как последовательность разных высот
    - авангардная конструкция, лишённая глубины звука
    - композитор как автор-демиург

worldview: >
  Звук не плоская точка, а сфера: у него есть глубина, центр и бесконечная внутренняя жизнь —
  колебание, биение, тембр, энергия. Звук — космическая сила, вибрация, которая лечит и
  разрушает. Музыка — не конструкция, а путешествие внутрь звука; композитор — посредник, через
  которого звук приходит. Ноты, сменяющие друг друга, только скользят по поверхности; надо
  остановиться на одной и войти в неё.

reader: >
  Слушатель останавливается на одном звуке и погружается в него. Ему предлагается слышать не
  смену высот, а жизнь внутри высоты: дрожание на четверть тона, биения между инструментами,
  темнение и просветление тембра, нарастание и спад энергии. Слушание — медитативное и
  телесное, как будто звук входит внутрь; оно требует отказа от ожидания мелодии.

time: >
  Время — длительность одного звука, растянутая в форму. Изменения медленны и непрерывны;
  нет тем и разделов в привычном смысле, есть дыхание звука. Форма — смена состояний
  одного центра: вспыхивание, угасание, смещение на соседний центр.

composition:
  principle: вся пьеса или её часть строится вокруг одного тона, который живёт через микротоновые колебания, тембр и динамику
  forms:
    - пьеса на одной ноте («Четыре пьесы на одной ноте»)
    - струнный квартет как медленная жизнь одного центра
    - оркестровая пьеса с хором — ритуал, звук-заклинание
    - сольная пьеса для струнного или духового инструмента вокруг центрального тона
  inner: >
    Внутри — центр и его колебания: четвертитоновые отклонения вверх и вниз, унисоны с биениями,
    тремоло, смена атаки и тембра (sul ponticello, sul tasto, сурдина), медленные нарастания и
    спады. Переход к новому центру — редкое и значимое событие.

narrator: >
  Источник — звук, а не автор. Исполнитель — посредник: он не интерпретирует, а держит и оживляет
  звук, следя за мельчайшими изменениями интонации, давления смычка, дыхания. Свобода невелика,
  но тонка; требуется абсолютный слух на микротоны и терпение. Голос часто используется без слов
  или с фонемами вместо текста.

character: >
  Персонаж — один звук, его центр и его колебания. Он дышит, темнеет, светлеет, дрожит, будто
  живое существо.

language: >
  Один центр и четвертитоновые соседи; гармония — биения и унисоны. Ритм — медленные
  изменения, тремоло, атаки. Тембр — главный параметр: sul ponticello, sul tasto, сурдины,
  флажолеты, голос без слов, медь с сурдиной. Динамика — непрерывные нарастания и спады.
  Фактура — плотный унисон с микротоновыми отклонениями.

imagery:
  - сфера, центр, вибрация
  - космос, звёзды
  - дыхание, сердце
  - ритуал, заклинание, мантра
  - глубина, внутренняя жизнь

themes:
  - звук как космическая сила
  - путь внутрь
  - посредничество, отказ от авторства
  - исцеление и разрушение
  - вечное и неподвижное

devices:
  - один центральный тон на всю пьесу или часть
  - четвертитоновые колебания вокруг центра
  - унисон с биениями между инструментами
  - смена тембра на той же высоте
  - медленные нарастания и спады
  - редкий переход к новому центру как событие формы

genres:
  - струнный квартет
  - пьеса для камерного оркестра
  - сольная пьеса
  - оркестровая пьеса с хором
  - вокальная пьеса на фонемах

forbidden:
  - мелодия как последовательность разных высот
  - быстрая смена гармоний
  - ровный неподвижный тон без внутренней жизни
  - темперированная чистота, убивающая биения
  - конструкция, заслоняющая звук

markers:
  - всё вращается вокруг одного звука, и он живой
  - слышны биения, дрожание, смена тембра
  - энергия звука нарастает и спадает
  - переход к новому центру ощущается как событие
  - слушатель погружается внутрь звука и перестаёт ждать мелодии — признак живой пьесы
  - финал — угасание звука, а не каденция

reading: >
  Понятно у Шельси — когда слушатель сразу понимает, что пьеса — один звук, и что слушать надо
  его внутреннюю жизнь. Интересно — когда эта жизнь богата: звук дрожит, бьётся, меняет цвет,
  наливается энергией и опадает, и каждый переход заметен. Пьеса проваливается, если звук стоит
  неподвижно (тогда это просто бурдон), если микротоны звучат как фальшь, а не как жизнь, или
  если изменений так мало, что внимание уходит.

manifesto:
  - Звук — сфера, а не точка.
  - Надо остановиться на одной ноте и войти в неё.
  - Звук — вибрация и сила, а не знак.
  - Композитор — посредник, а не автор.
  - Микротон — дыхание звука.
  - Смена нот скользит по поверхности; глубина — в одной.

form:
  code: src/mnemosyne/music/schools/scelsi.py
  note: >
    Код берёт один центр (из плана, по умолчанию ре первой октавы, со сдвигом на полутон или без)
    и даёт всем партиям одну высоту с четвертитоновым контуром 0, +½, 0, −½ полутона, сдвинутым у
    каждой партии. Длительности звуков у партий разные (4, 4½, 5… четвертей), поэтому вступления
    расходятся и создают перекрытия. Динамика движется по кругу ppp, p, mf, p; тембр меняется по
    секциям — тёмный, светлый, с придыханием. Звук синтезирован процедурно. Проверяются центр и
    контур. Оставлены композитору: переход к новому центру, тремоло, атаки, нарастания внутри
    звука, смена техник смычка и сурдин, голос и форма как путь.

climate:
  steadiness: один центр, ровные колебания
  closedness: никуда от центра
  turbulence: колебания шире и чаще, биения сильнее
  strain: энергия звука на пределе, нарастание
  loss: звук темнеет и угасает
  renewal: светлый тембр, новый центр
  age: ритуал, древнее
  density: больше голосов в унисоне

exemplars:
  - Quattro pezzi su una nota sola (1959)
  - Aion (1961)
  - Струнный квартет № 4 (1964)
  - Anahit для скрипки и ансамбля (1965)
  - Uaxuctum (1966)
  - Konx-Om-Pax (1969)
texts: под охраной (Шельси умер в 1988 году, ноты изданы Salabert); берутся только приёмы — центр, микротоновые колебания, тембровая форма, — не партитуры
