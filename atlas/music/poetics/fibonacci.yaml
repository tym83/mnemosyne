# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: fibonacci
name: Форма по числам Фибоначчи
art: music
kind: mixed
origin:
  place: Москва (Софья Губайдулина); венгерская аналитическая традиция (Эрнё Лендваи о Бартоке)
  era: от анализов Лендваи (1950–1970-е) до сочинений Губайдулиной 1980-х и позднее
  language: традиция — пифагорейское учение о числе и гармонии, средневековая числовая символика, золотое сечение в архитектуре
  note: >
    Числовые пропорции — старая мечта музыки о соответствии звука и мироздания. В XX веке ряд
    Фибоначчи (1, 1, 2, 3, 5, 8, 13…, где каждое число — сумма двух предыдущих, а отношение
    соседей стремится к золотому сечению) стал инструментом формы. Венгерский музыковед Эрнё
    Лендваи утверждал, что Барток строил формы и ладовые системы по золотому сечению и
    противопоставлял диатонику «акустического» мира хроматике «золотосеченного»; эта трактовка
    влиятельна и спорна, прямых свидетельств самого Бартока о расчёте нет. Софья Губайдулина с
    начала 1980-х сознательно строила длительности разделов по рядам Фибоначчи и Люка (2, 1, 3,
    4, 7, 11…) и говорила о «ритме формы» — пропорциях больших отрезков времени, которые слушатель
    переживает как дыхание целого. Для неё число было не украшением, а связью с духовным порядком.

lineage:
  predecessors:
    - пифагорейцы — число как гармония мира
    - средневековая изоритмия и числовая символика (Машо, Дюфаи)
    - золотое сечение в архитектуре и живописи
    - Барток в прочтении Лендваи — пропорции формы, диатоника против хроматики
    - Дебюсси в прочтении Роя Хауата — пропорции формы («Debussy in Proportion», 1983)
  neighbours:
    - Штокхаузен — числовые ряды длительностей в «Klavierstück IX»
    - Ксенакис и архитектура Ле Корбюзье (модулор на золотом сечении)
    - Мессиан — числа в ритме, простые числа
    - Пярт — пропорция и число в мензуральном каноне
  against:
    - форма как набор равных квадратных периодов
    - драматургия, где кульминация ставится по привычке, а не по пропорции
    - числовая игра без смысла, недоступная слуху
    - бесформенная импровизация, лишённая меры

worldview: >
  Мир устроен по числу, и время тоже: рост раковины, ветвление дерева, спирали подсолнуха
  подчиняются одной пропорции, и форма музыки может в неё войти. Пропорция — не расчёт ради
  расчёта, а способ сделать время живым, неравномерным, растущим, как растёт живое. У
  Губайдулиной число соединяется с верой: правильная пропорция — путь от хаоса к порядку, от
  разделённого к соединённому. Противоположности — диатоника и хроматика, свет и тьма, звук и
  тишина — уравновешиваются числом.

reader: >
  Слушатель не считает и не должен считать. Он переживает пропорции как дыхание формы:
  разделы растут или сжимаются, кульминация приходит «вовремя», и это ощущается телом, а не
  разумом. Внимание направлено на смену миров (светлое диатоническое и тёмное хроматическое, звук
  и тишина), а число держит их соотношение в равновесии.

time: >
  Время неравномерно и растёт по закону: длительности разделов, фраз и даже отдельных звуков
  относятся как соседние числа ряда. Форма — спираль: каждый следующий отрезок длиннее, точка
  золотого сечения — естественное место перелома. Два ряда (Фибоначчи и Люка) могут
  чередоваться как два времени — светлое и тёмное.

composition:
  principle: длительности разделов, фраз и звуков выводятся из рядов Фибоначчи и Люка, а противоположные звуковые миры чередуются по этой пропорции
  forms:
    - многочастный цикл, где длительности частей растут по ряду
    - форма с переломом в точке золотого сечения
    - чередование двух миров — диатонического и хроматического, звука и тишины
    - симфония, где число определяет даже молчание (часть-«соло дирижёра» в «Stimmen… Verstummen…»)
  inner: >
    Внутри — длительности, кратные числам ряда; противопоставление диатонического и хроматического
    материала, светлого и тёмного регистра, звучания и паузы. Числовой план задаёт, где
    перелом, где вершина, где тишина.

narrator: >
  Источник — голос, ищущий порядок в мироздании. Исполнитель не видит чисел и не должен их
  подчёркивать; его задача — прожить каждое состояние полно, чтобы пропорции почувствовались.
  Часто нужны необычные составы и приёмы (баян, ударные, флажолеты), но число — над тембром.

character: >
  Персонаж — два мира и их пропорция: светлый диатонический и тёмный хроматический, звук и
  тишина. Иногда персонаж — сам рост: раздел, который становится больше с каждым возвращением.

language: >
  Противопоставление диатоники и хроматики, иногда — натуральных флажолетов и хроматических
  кластеров. Ритм — длительности по числам ряда, асимметричные группировки. Тембр — от
  прозрачного до плотного, необычные сочетания. Динамика следует пропорциям формы.
  Фактура — смена миров, а не развитие темы.

imagery:
  - спираль, раковина, подсолнух
  - рост дерева, ветвление
  - лестница, восхождение
  - свет и тьма
  - крест, соединение вертикали и горизонтали

themes:
  - порядок мироздания
  - рост и становление
  - противоположности и их равновесие
  - вера и восхождение
  - время как живое

devices:
  - длительности разделов по ряду Фибоначчи
  - ряд Люка как второй, «тёмный» ритм
  - перелом формы в точке золотого сечения
  - чередование диатонического и хроматического мира
  - длительности звуков, кратные числам ряда
  - пауза или молчание, отмеренное числом

genres:
  - симфония
  - камерное сочинение
  - вокальный цикл
  - инструментальный концерт
  - струнный квартет

forbidden:
  - равные квадратные периоды
  - числовая игра, недоступная слуху
  - кульминация «по привычке» вне пропорции
  - тематическая разработка как главная сила формы
  - смешение миров без их противопоставления

markers:
  - разделы растут или сжимаются, и это чувствуется как дыхание
  - перелом формы приходит в «правильный» момент
  - два мира ясно различимы и уравновешены
  - нет квадратности, время неравномерно, но не хаотично
  - слушатель чувствует, что форма живёт и растёт, не считая, — признак живой пьесы
  - финал звучит как достижение пропорции, а не как каденция

reading: >
  Понятно в форме по числам — когда слушатель различает миры (светлое и тёмное, диатоническое и
  хроматическое) и ощущает, что они сменяют друг друга в неравных, растущих отрезках. Интересно —
  когда этот рост создаёт напряжение и ожидание, а перелом в точке золотого сечения становится
  событием. Пьеса проваливается, если числа не слышны (пропорции слишком малы или затёрты
  материалом), если миры не различаются, или если пропорция становится единственным
  содержанием и за ней нет звучания.

manifesto:
  - Время растёт, как растёт живое.
  - Пропорция — дыхание формы, а не расчёт ради расчёта.
  - Противоположности уравновешиваются числом.
  - Перелом приходит в точке золотого сечения.
  - Слушатель не считает, а чувствует меру.
  - Число соединяет разрозненное в порядок.

form:
  code: src/mnemosyne/music/schools/fibonacci.py
  note: >
    Пропорции формы код не вычисляет: длительности разделов приходят из плана (в образце —
    16, 24, 40, 64 и 104 секунды, то есть 2 : 3 : 5 : 8 : 13). Код чередует миры по номеру
    раздела — чётные разделы диатонические (мажорный звукоряд от корня до, до-диез или ре) с ритмом из
    ряда Фибоначчи 1, 1, 2, 3, 5, 8 восьмых, нечётные хроматические с ритмом из ряда Люка
    2, 1, 3, 4, 7, 11 восьмых; каждая партия сдвинута по ряду и по звукоряду. Проверяются
    чередование миров и ритмы рядов. Оставлены композитору: точка золотого сечения как перелом,
    вершина, молчание, отмеренное числом, тембровое противопоставление миров и сам выбор
    пропорций.

climate:
  steadiness: ровные ряды, предсказуемый рост
  renewal: диатонический мир, светлый регистр
  scars: хроматический мир держится дольше
  abundance: разделы растут
  loss: разделы сжимаются, тишина
  closedness: один ряд, один мир
  turbulence: миры сменяются чаще, рост ломается
  age: пифагорейская мера, средневековая числовая символика

exemplars:
  - Губайдулина, «Stimmen… Verstummen…», симфония в двенадцати частях (1986)
  - Губайдулина, «Perception» для сопрано, баритона и струнных
  - Барток, Музыка для струнных, ударных и челесты (1936) — в анализе Лендваи
  - Штокхаузен, Klavierstück IX
  - Эрнё Лендваи, книга о Бартоке (англ. издание 1971)
  - Рой Хауат, «Debussy in Proportion» (1983)
texts: под охраной (ноты Губайдулиной — Sikorski; Штокхаузен — собственное издательство; Барток умер в 1945 году и в странах с правилом «жизнь + 70» в общественном достоянии); берутся только приёмы — числовые пропорции, ряды, чередование миров, — не партитуры
