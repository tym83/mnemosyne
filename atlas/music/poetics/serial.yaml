# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: serial
name: Серийная музыка
art: music
kind: instrumental
origin:
  place: Вена (додекафония), затем Париж, Дармштадт, Кёльн (послевоенный сериализм)
  era: от начала 1920-х (додекафония Шёнберга) до 1950-х (тотальный сериализм)
  language: традиция — немецко-австрийская мотивная работа и контрапункт от Баха до Брамса и Малера
  note: >
    Арнольд Шёнберг пришёл к додекафонии после свободной атональности: в начале 1920-х годов он
    сформулировал «метод композиции на двенадцати тонах, соотнесённых лишь друг с другом» —
    весь звуковой материал пьесы выводится из одного ряда и его зеркальных форм (основная,
    инверсия, ракоход, ракоход инверсии) и их транспозиций. Его ученики Антон Веберн и Альбан
    Берг развили метод в противоположные стороны: Берг — к лиризму и тональным отсветам, Веберн —
    к симметрии, канону и предельной сжатости. После 1945 года молодые композиторы летних курсов
    в Дармштадте (Булез, Штокхаузен, Ноно) распространили сериальный принцип на длительности,
    громкости и атаки; поводом стала пьеса Мессиана «Лад длительностей и интенсивностей» (1949).
    Булез в статье «Шёнберг мёртв» (1952) объявил наследником не Шёнберга, а Веберна.

lineage:
  predecessors:
    - Бах — канон, обращение, ракоход, контрапункт как мысль
    - Брамс в прочтении Шёнберга — развивающая вариация, всё из одного зерна
    - Малер — распад тональной формы, тембровая детализация
    - свободная атональность самого Шёнберга (1908–1920) — эмансипация диссонанса
  neighbours:
    - Йозеф Маттиас Хауэр — собственная двенадцатитоновая система тропов
    - Мессиан — модусы длительностей, атак и громкостей
    - Булез, Штокхаузен, Ноно, Бэббит — тотальный сериализм в Европе и США
    - поздний Стравинский — сериальные сочинения 1950-х
  against:
    - тональная иерархия, где одна нота главнее других
    - повтор и секвенция как дешёвое средство формы
    - неоклассика 1920–1930-х, «возврат к Баху» как стилизация
    - позднее Ксенакис и Лигети — против тотального сериализма как неслышимого порядка

worldview: >
  Двенадцать тонов равноправны; ни один не тянет к себе, и поэтому каждая нота должна быть
  оправдана порядком, а не привычкой уха. Музыкальное пространство едино: что идёт по
  горизонтали, может стоять по вертикали, что звучит вперёд, может звучать назад и в зеркале.
  Порядок — не сухость, а этическая требовательность: всё связано со всем, ничего лишнего. У
  Веберна этот порядок становится кристаллом, тишиной между точками; у дармштадтцев — полной
  организацией звука, где высота, длительность, сила и тембр подчинены одной логике.

reader: >
  Слушатель лишён привычных опор — тоники, повторяющейся темы, регулярного метра. Ему предлагается
  слушать отдельные события как значимые: интервал, тембр, точку и паузу, их симметрию.
  Связь не узнаётся сразу, она ощущается как напряжённая плотность смысла, где каждое событие
  несёт вес. Слушание требует сосредоточенности и повторения: пьеса раскрывается при втором,
  третьем прослушивании.

time: >
  Время сжато: у Веберна целая часть длится меньше минуты, каждая нота — событие. Время
  симметрично и обратимо: ракоход и зеркальный канон делают движение вперёд и назад
  равноправными. Метр часто не ощущается; длительности у поздних сериалистов сами упорядочены
  рядом.

composition:
  principle: весь материал выводится из одного ряда двенадцати тонов и его форм; последовательности рядов заменяют тональный план
  forms:
    - двенадцатитоновая сюита и вариации на ряд
    - зеркальный канон и палиндромная форма (Веберн)
    - сонатная форма на ряде (Шёнберг)
    - тотально организованная пьеса — ряды высот, длительностей, громкостей и атак
    - момент-форма и группы (Штокхаузен) как продолжение сериального мышления
  inner: >
    Внутри — комбинаторика ряда: деление на сегменты, инвариантные группы, совпадающие при
    инверсии, распределение звуков по голосам и регистрам. Тематизм заменяется рядом, но у
    Шёнберга остаются фраза, период и характер; у Веберна — канон и симметрия; у Булеза — сетки
    и матрицы.

narrator: >
  Источник — строгая конструкция, которую исполнитель должен донести без украшений.
  Исполнительская свобода минимальна: точная высота, длительность, атака и громкость часто
  выписаны для каждой ноты. При этом от музыканта требуется выразительность внутри точности —
  у Веберна каждый звук «поёт», а не просто стоит. Ансамбль — система точек, переходящих от
  инструмента к инструменту.

character: >
  Персонаж — ряд, а также его форма-отражение. В пуантилизме персонажем становится отдельная
  точка-звук со своим тембром, громкостью и регистром; в группе таких точек проступает фигура.

language: >
  Атональная хроматика, все двенадцать тонов в обращении; интервалы — большие скачки,
  септимы и ноны, тритоны; октавы и тональные созвучия избегаются. Ритм нерегулярен, часто
  дробный. Тембр — Klangfarbenmelodie, мелодия, разложенная по инструментам. Динамика резко
  контрастная, у тотального сериализма — своя у каждой ноты. Фактура — прозрачная у Веберна,
  плотная у Шёнберга, рассыпанная у дармштадтцев.

imagery:
  - кристалл, снежинка, симметрия
  - зеркало и отражение
  - сеть, матрица, таблица
  - звёздное небо из отдельных точек
  - тишина вокруг звука

themes:
  - порядок как этическая требовательность
  - конец тональности и новое начало
  - единство музыкального пространства
  - абстракция и чистота
  - экспрессионистская тревога у раннего Шёнберга и Берга

devices:
  - ряд и четыре его формы — основная, инверсия, ракоход, ракоход инверсии
  - полный агрегат всех двенадцати тонов до повтора
  - Klangfarbenmelodie — ряд, переходящий от инструмента к инструменту
  - зеркальное распределение тембров
  - палиндромная симметрия и канон в обращении
  - регистровая разбросанность — один класс высоты в далёких октавах
  - ряды длительностей и громкостей (тотальный сериализм)

genres:
  - камерная миниатюра и вариации
  - струнное трио и квартет
  - симфония для камерного состава
  - сольная фортепианная пьеса
  - кантата и вокальный цикл на экспрессионистский текст

forbidden:
  - тоника и каденция
  - октавное удвоение, подчёркивающее одну высоту
  - преждевременный повтор тона до завершения агрегата (в строгом стиле)
  - секвенция и механический повтор
  - тональные трезвучия без мотивировки

markers:
  - каждый звук несёт вес и слышен как событие
  - есть ощутимая симметрия, отражение, возвращение в зеркале
  - тембр переходит от инструмента к инструменту, рисуя линию
  - паузы так же точны, как ноты
  - слушатель чувствует плотный, неслучайный порядок, даже если не может его назвать, — знак живой пьесы
  - концовка ощущается как замыкание формы, а не каденция

reading: >
  Понятно в серийной музыке — не значит «узнаётся ряд»: его слух не отслеживает. Понятны должны
  быть фраза, жест, симметрия и характер — слушатель чувствует, что звуки стоят на своих местах и
  отвечают друг другу. Интересно — когда при отсутствии тональности возникает напряжённая
  связность: интервал возвращается в зеркале, тембр рисует линию, тишина звенит. Пьеса
  проваливается, если она звучит как случайный набор нот (тогда порядок не дошёл до слуха), если
  все параметры равномерно серы, или если строгость подменяет мысль.

manifesto:
  - Двенадцать тонов равны, и каждый должен быть оправдан порядком.
  - Всё выводится из одного ряда; лишнего нет.
  - Вперёд и назад, вверх и вниз — одно музыкальное пространство.
  - Нота — событие, а не проходящий звук.
  - Тишина между точками так же выписана, как сами точки.
  - Порядок, распространённый на все параметры, — следующий шаг после ряда высот.

form:
  code: src/mnemosyne/music/schools/serial.py
  note: >
    Код берёт случайный ряд из двенадцати тонов и его четыре формы — основную, инверсию, ракоход
    и ракоход инверсии — без транспозиций. Каждая секция содержит только целые агрегаты (все 12
    классов), их число зависит от длины и плотности секции; звуки распределены равномерно во
    времени, по шестнадцатой, поочерёдно стаккато и тенуто. Тембр — зеркальный: ряд проходит по
    инструментам вперёд, следующий — назад. Регистр каждой ноты выбирается в верхней или нижней
    четверти диапазона инструмента, поочерёдно. Проверяется полнота агрегата. Не сериализуются
    длительности, громкости и атаки; нет транспозиций, сегментации, инвариантов, канонов,
    фразировки и характера. Это оставлено композитору; динамика свободна только в канале
    исполнения.

climate:
  closedness: строже симметрия, меньше форм ряда, зеркало замыкается
  steadiness: равномерный пуантилизм, ровные агрегаты
  density: больше агрегатов на секцию, точки гуще
  strain: шире скачки, крайние регистры, резче контрасты атак
  scars: тритон и большая септима выходят вперёд
  novelty: новые формы ряда, перестройка тембрового зеркала
  loss: агрегаты разрежаются, пауз больше, чем звуков
  age: к Шёнбергу — фраза и характер; к Веберну — кристалл и тишина

exemplars:
  - Шёнберг, Сюита для фортепиано op. 25 (1921–1923)
  - Шёнберг, Вариации для оркестра op. 31 (1926–1928)
  - Веберн, Симфония op. 21 (1928)
  - Веберн, Концерт op. 24 (1934)
  - Берг, Скрипичный концерт (1935)
  - Мессиан, «Лад длительностей и интенсивностей» (1949)
  - Булез, «Структуры Ia» (1952)
  - Булез, статья «Шёнберг мёртв» (1952)
texts: статус разный — Берг (ум. 1935), Веберн (ум. 1945) и Шёнберг (ум. 1951) в большинстве стран с правилом «жизнь + 70» уже в общественном достоянии, в США статус зависит от даты публикации; Мессиан, Булез, Штокхаузен — под охраной; берутся только приёмы — ряд, его формы, агрегат, зеркало, — не партитуры
