# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: spectral
name: Спектральная музыка
art: music
kind: instrumental
origin:
  place: Франция, Париж (ансамбль L'Itinéraire, IRCAM); Германия, Дармштадт и Фрайбург
  era: с середины 1970-х («Partiels» Гризе, 1975) до 1990-х
  language: традиция — французская школа тембра от Дебюсси до Мессиана, акустика и психоакустика
  note: >
    Жерар Гризе и Тристан Мюрай — ученики Мессиана — вместе с Мишелем Левинасом, Роже Тессье и
    Юго Дюфуром основали в 1973 году ансамбль L'Itinéraire. Их исходная мысль — сочинять не из
    нот, а из звука, каким его показывает акустика: спектр обертонов, атака, затухание, биения.
    В «Partiels» (1975) Гризе оркестровал сонограмму низкой ноты тромбона: инструменты ансамбля
    играют её отдельные гармоники, и из них складывается синтетический тембр. Эта процедура —
    инструментальный синтез — стала образцом школы. Термин «спектральная музыка» обычно связывают
    с Дюфуром (конец 1970-х); сам Гризе позже предпочитал говорить о музыке пороговой
    (liminale) — о звуке на границе восприятия, между тембром и гармонией, ритмом и пульсом.

lineage:
  predecessors:
    - Дебюсси — гармония как краска, тембр как форма
    - Мессиан — учитель, резонансные аккорды, цвет звука
    - Варез — звук как физическое тело, «организованный звук»
    - Шельси — внутренняя жизнь одного звука
    - Штокхаузен — «Stimmung», обертоны голоса
    - Лигети — медленная трансформация поверхности
    - электронная музыка и акустика — сонограф, синтез, анализ спектра
  neighbours:
    - Хорацио Радулеску — спектральные полифонии и спектры, построенные на скордатуре
    - Магнус Линдберг, Кайя Саариахо — продолжатели во втором поколении
    - IRCAM — компьютерный анализ и ассистированная композиция
    - американские композиторы чистого строя — Ла Монте Янг, Джеймс Тенни
  against:
    - сериализм — комбинаторика нот, равнодушная к физике звука
    - темперированная система как единственная сетка
    - нота как абстрактный знак без тела
    - музыка, понятная только глазу в партитуре

worldview: >
  Звук — живое существо со своим телом: у него есть рождение (атака), жизнь (спектр, биения,
  колебания) и смерть (затухание). Композиция — не расстановка нот, а увеличительное стекло,
  которое растягивает звук во времени, чтобы его внутренность стала формой. Тембр и гармония —
  одно и то же на разном расстоянии: аккорд из гармоник сливается в тембр, тембр, разложенный по
  инструментам, становится аккордом. Мир здесь — непрерывность и переход; важнее всего то, что
  происходит между состояниями.

reader: >
  Слушатель вслушивается в звук изнутри — как в огромный, замедленный колокол. Ему предлагается
  заметить порог: когда аккорд перестаёт быть аккордом и становится тембром, когда гармонический
  спектр сдвигается в негармонический и начинает «звенеть», когда ровный пульс превращается в
  дыхание. Слушание — восприятие процесса, а не событий; оно требует сосредоточенности и
  вознаграждает ощущением, что звук живой.

time: >
  Время — растянутое время одного звука: секунда жизни ноты разворачивается в минуты формы.
  Процессы постепенны, направлены (от гармоничного к шумному, от периодичного к хаотичному,
  от тени к свету) и часто повторяются в увеличенном или сжатом масштабе. Гризе различал время
  людей, китов и насекомых — разные скорости восприятия, — и форма может переключаться между
  ними.

composition:
  principle: спектр звука — его гармоники и их эволюция — становится гармонией, оркестровкой и формой; переходы между спектрами задают драматургию
  forms:
    - инструментальный синтез — оркестровка анализа одного звука
    - процесс от гармонического спектра к негармоническому и обратно
    - цикл пьес на одном спектре для растущих составов (Espaces acoustiques)
    - пьеса-процесс с периодичностью, переходящей в апериодичность
    - вокальный цикл о пороге жизни и смерти
  inner: >
    Внутри — постепенная интерполяция между состояниями: гармоники смещаются от целых кратных к
    растянутым или сжатым, атаки инструментов имитируют атаку исходного звука, тембр
    оркеструется по амплитудам гармоник. Микротоны — не украшение, а необходимость: гармоники
    лежат вне темперации.

narrator: >
  Источник — ансамбль как синтезатор: каждый инструмент — одна гармоника, одна огибающая.
  Исполнитель играет точно в микротонах, держит ровный звук и мельчайшие изменения динамики и
  тембра; солистические жесты редки. Электроника иногда участвует, но главное — акустический
  синтез живыми инструментами.

character: >
  Персонаж — звук-прототип и его спектр: тромбон, колокол, низкая струна. Его превращения —
  растяжение, сжатие, затенение, распад — и есть судьба персонажа.

language: >
  Гармония из гармонических и негармонических спектров, частотная модуляция, разностные тона;
  микротоны (четверть- и восьмитоны). Ритм — периодичность и апериодичность, ускорения и
  замедления как процессы. Тембр — главный параметр, оркестровка по анализу. Динамика —
  огибающие атаки и затухания, крещендо как рост спектра. Фактура — от одного звука до плотной
  гармонической массы.

imagery:
  - колокол, растянутый во времени
  - тромбон, гонг, низкая струна
  - сонограмма, спектр, свет через призму
  - дыхание, сердцебиение
  - порог, сумерки, переход между сном и явью

themes:
  - звук как живое тело
  - порог восприятия
  - время людей, китов и насекомых
  - смерть и переход (поздний Гризе)
  - единство тембра и гармонии

devices:
  - оркестровка гармоник одного звука по инструментам
  - интерполяция от гармонического спектра к растянутому
  - имитация атаки и затухания исходного звука оркестром
  - разностные и суммарные тона
  - микротоновое округление гармоник до четвертей или восьмых тона
  - процесс от периодичного к апериодичному ритму

genres:
  - камерная пьеса-процесс
  - оркестровая пьеса
  - цикл для растущих составов
  - вокальный цикл
  - пьеса с электроникой

forbidden:
  - нота как абстрактный знак без звукового тела
  - комбинаторика ради комбинаторики
  - резкий монтаж без перехода
  - темперированная аппроксимация, разрушающая спектр
  - тематическая работа

markers:
  - аккорд звучит как тембр, а тембр — как аккорд
  - слышно направление процесса и порог, на котором звук меняет природу
  - микротоны звучат не фальшиво, а «правильно» — сливаются
  - атака и затухание целой формы похожи на атаку и затухание одного звука
  - слушателю кажется, что он внутри одного огромного звука, — признак живой пьесы
  - финал — затухание или переход в иное состояние, а не каденция

reading: >
  Понятно в спектральной музыке — когда слушатель с самого начала слышит звук-прототип и
  понимает, что пьеса — его медленное раскрытие. Интересно — когда процесс ведёт к порогу:
  гармоничное становится звенящим, пульс — дыханием, аккорд — тембром, — и этот переход
  ощущается физически. Пьеса проваливается, если гармоники звучат как обычный кластер (спектр
  не сливается), если процесс статичен или слишком быстр, или если за процедурой нет
  восприятия — когда ощущение порога так и не возникает.

manifesto:
  - Мы сочиняем из звука, а не из нот.
  - Тембр и гармония — одно явление на разном расстоянии.
  - Форма — растянутая жизнь одного звука.
  - Важнее всего — переход, порог между состояниями.
  - Микротон — не украшение, а правда спектра.
  - Время у звука своё; слушатель должен попасть в него.

form:
  code: src/mnemosyne/music/schools/spectral.py
  note: >
    Код берёт фундаментальный тон (из плана, по умолчанию до большой октавы, со случайным сдвигом на 0, 2 или 5
    полутонов) и даёт каждой партии одну гармонику — номер партии плюс два. Внутри секции
    спектр растягивается от гармонического (степень 1) до растянутого (степень 1,18) или обратно
    в нечётных секциях; высота пересчитывается каждые восемь четвертей и округляется до
    четверти тона. Чтобы попасть в диапазон инструмента, гармоника переносится на октавы, поэтому
    порядок гармоник по регистру не сохраняется — это главный компромисс кода. Проверяются
    вывод высоты из номера гармоники и четвертитоновая запись. Оставлены композитору: выбор
    звука-прототипа и его анализ, амплитуды гармоник (оркестровка по силе), огибающие атаки и
    затухания, разностные тона, ритмические процессы периодичности, порог как драматургия.

climate:
  steadiness: гармонический спектр стоит, переходы медленные
  strain: спектр растягивается сильнее, звенящие негармонические интервалы
  turbulence: процессы быстрее, атаки резче, шум
  renewal: от негармонического возврат к чистому спектру
  age: затухание, медленная смерть звука
  density: больше гармоник, богаче спектр
  loss: гармоники уходят, остаётся фундаментальный тон
  novelty: новый звук-прототип, новый спектр

exemplars:
  - Гризе, Partiels (1975)
  - Гризе, Les Espaces acoustiques (1974–1985)
  - Гризе, Vortex Temporum (1994–1996)
  - Гризе, Quatre chants pour franchir le seuil (1997–1998)
  - Мюрай, Mémoire/Érosion (1976)
  - Мюрай, Gondwana (1980)
  - Мюрай, Désintégrations (1982–1983)
texts: под охраной (Гризе умер в 1998 году, ноты изданы Ricordi; Мюрай — Henry Lemoine); берутся только приёмы — инструментальный синтез, интерполяция спектров, — не партитуры
