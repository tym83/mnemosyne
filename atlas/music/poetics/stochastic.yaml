# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: stochastic
name: Стохастическая музыка
art: music
kind: instrumental
origin:
  place: Франция, Париж; мастерская Ле Корбюзье, затем собственная студия и компьютерные центры
  era: с середины 1950-х («Метастазис», 1953–1954) до 1990-х
  language: традиция — греческая античность (Пифагор, Парменид, атомисты), архитектура и математика XX века
  note: >
    Янис Ксенакис — грек, родившийся в Румынии, инженер по образованию, участник греческого
    Сопротивления, тяжело раненный в уличных боях в Афинах; в 1947 году бежал во Францию. Двенадцать лет
    работал инженером и архитектором у Ле Корбюзье (монастырь Ла Туретт, павильон «Филипс» для
    выставки в Брюсселе 1958 года, где линейчатые поверхности выросли из глиссандо «Метастазиса»).
    Композиции учился у Оливье Мессиана, который советовал ему опираться на математику и
    архитектуру, а не на гармонию консерватории. В статье «Кризис сериальной музыки» (1955) Ксенакис
    показал, что тотальный сериализм на слух даёт статистическую массу, и предложил управлять
    массой прямо — законами вероятности. Теория собрана в книге «Формализованная музыка» (франц.
    издание 1963, расширенное английское 1971).

lineage:
  predecessors:
    - Варез — звук как масса и плоскость, «организованный звук»
    - Мессиан — учитель, модусы и ритмические ряды как числа
    - Барток — пропорции, народная энергия, ударная фактура
    - античная математика и физика — Пифагор, кинетическая теория газов, теория вероятностей
    - архитектура Ле Корбюзье — модулор, линейчатые поверхности
  neighbours:
    - Лигети — масса и кластер, но через полифонию, а не через вероятность
    - польский сонористический авангард 1960-х — глиссандо и полосы как материал
    - электроакустическая музыка (Groupe de recherches musicales) — звук без нот
    - позже спектралисты — масса, плотность, длительность как предмет формы
  against:
    - тотальный сериализм — линейная логика ряда, которая на слух рассыпается в случайную массу
    - тематизм и развитие мотива
    - музыка как выражение личного чувства
    - случайность без закона у Кейджа — Ксенакису нужна вероятность, а не произвол

worldview: >
  Мир состоит из множеств: капли дождя по крыше, стрекот цикад, крики и шаги толпы на
  демонстрации, хрустящий град — каждое событие непредсказуемо, а масса подчинена закону. Музыка
  должна работать на уровне этих масс, управляя плотностью, распределением и скоростью
  изменений, а не отдельной нотой. Звук — физическое явление в пространстве и времени; композиция —
  архитектура из вероятностей, строгая, как расчёт, и стихийная, как погода. Здесь нет ни
  утешения, ни иронии: есть энергия, столкновение, ярость и свет.

reader: >
  Слушатель не следит за мелодией и не узнаёт темы; он стоит внутри стихии и воспринимает
  плотность, направление, скорость, давление звука на тело. Слушание — как наблюдение за грозой,
  прибоем или толпой: глаз и ухо схватывают общее движение и отдельные вспышки. Требуется
  выдержка и готовность к громкости и шероховатости; наградой становится физическое переживание
  порядка, проступающего из хаоса.

time: >
  Время — ось распределения событий, а не линия рассказа. Его плотность меняется: облака точек
  густеют и редеют, глиссандо растягивают время в непрерывность. Форма — смена состояний массы,
  иногда резкие обрывы; секции стыкуются, как архитектурные блоки, без переходов и без репризы
  в классическом смысле.

composition:
  principle: композитор задаёт законы распределения (плотность, высотное поле, длительности, скорость глиссандо), а события получаются выборкой из них
  forms:
    - облако звуковых точек — пиццикато, удары, стаккато с пуассоновской плотностью
    - поле глиссандо — сотни струнных линий, образующих поверхность
    - блоковая форма из контрастных состояний массы
    - сита — высотные шкалы из объединения модульных последовательностей
    - пространственная форма — исполнители вокруг публики, звук обходит зал
  inner: >
    Внутри секции правят законы: экспоненциальные интервалы между атаками, нормальное или
    равномерное распределение высот, случайные блуждания. Сита дают высотную опору, отличную и
    от тональности, и от ряда, — периодичность с непериодическим наполнением. Переходы между
    состояниями — сдвиг параметров закона, а не мотивное развитие.

narrator: >
  Источник звука — масса исполнителей, каждый из которых играет свою индивидуальную партию;
  оркестр часто разделён до отдельного пульта. Исполнитель не интерпретирует фразу, а с
  предельной точностью и силой выполняет свою долю статистики; от него требуется виртуозность,
  выносливость и отказ от звукового комфорта. Ансамбль — популяция, а не хор.

character: >
  Персонажа в привычном смысле нет. Роль героя играет масса — облако, поверхность, рой; её
  плотность и направление и есть «поведение». Иногда из массы выделяется отдельная линия или
  удар, как лицо в толпе.

language: >
  Высоты — из сит или из распределений, без тональной иерархии; хроматика, микротоны, глиссандо.
  Ритм — нерегулярный, вероятностный, часто с полиритмией и сложными делениями. Тембр — струнные
  divisi, пиццикато, удары, медь на пределе, перкуссия; шумовые компоненты законны. Динамика —
  широкий диапазон, частые fff и sfz. Фактура — от разреженного облака до непрерывной стены.

imagery:
  - дождь, град, цикады, ветер
  - толпа и демонстрация, выстрелы, крики
  - линейчатые поверхности, гиперболические параболоиды, архитектура
  - звёздное небо, туманность, газ
  - огонь, вулкан, античная трагедия

themes:
  - порядок и хаос как одна природа
  - энергия массы и судьба отдельного
  - древняя Греция как исток разума и трагедии
  - война и насилие, пережитые телом
  - космос и вечное движение

devices:
  - пуассоновское облако атак с заданной плотностью
  - поле струнных глиссандо разной скорости и направления
  - сито — объединение модульных классов как высотная шкала
  - пространственное рассаживание оркестра среди публики
  - резкий обрыв массы и тишина
  - случайное блуждание высоты (броуновская линия)

genres:
  - оркестровая пьеса для крупного разделённого состава
  - камерный ансамбль и струнный квартет
  - ударные соло и ансамбль ударных
  - сольная фортепианная пьеса предельной трудности
  - электроакустическая и компьютерная музыка
  - многомедийный «Политоп» — свет, звук, пространство

forbidden:
  - тема и её развитие
  - тональная гармония и каденция
  - сентиментальная выразительность фразы
  - ровная регулярная пульсация без причины
  - случайность без закона — бросок без распределения
  - камерная деликатность там, где нужна масса

markers:
  - слышна масса, а не ноты, и у массы есть форма — она густеет, редеет, поворачивает
  - внутри закона каждое событие неожиданно
  - звук физически давит или окутывает
  - переходы состояний резки и архитектурны
  - слушатель ловит себя на том, что следит за плотностью, как за погодой, — это знак живой пьесы
  - тишина после массы звучит как удар

reading: >
  Понятно в стохастической музыке — когда слушатель сразу понимает, какое у звука состояние:
  редкие капли, густой ливень, восходящая поверхность глиссандо — и замечает, когда состояние
  меняется. Интересно — когда изменение массы имеет направление и силу, когда внутри закона
  вспыхивают неожиданные столкновения, а архитектура секций держит целое. Пьеса проваливается,
  если вероятность звучит как однородный шум без формы, если плотность не меняется, или если за
  «облаком» угадывается обычная мелодия, которой стыдно показаться.

manifesto:
  - Масса, а не нота, — единица слышимого.
  - Каждое событие непредсказуемо, но множество подчиняется закону.
  - Композитор задаёт законы, а не события.
  - Музыка — архитектура в звуке и времени.
  - Сериальная линия рассыпается в массу; значит, надо сочинять массу прямо.
  - Математика не охлаждает звук, а даёт ему силу стихии.

form:
  code: src/mnemosyne/music/schools/stochastic.py
  note: >
    Код делает выборку по двум законам. Высотное поле — сито из объединения классов по модулю 3
    и 7 со случайной фазой. Интервалы между атаками — экспоненциальное распределение (процесс
    Пуассона), интенсивность растёт с плотностью секции, затем квантуется к шестнадцатым с
    минимальным промежутком, так что процесс уже не чисто пуассоновский. В секциях flowing и
    luminous струнные вместо стаккато-точек играют пары нот, связанные глиссандо на квинту вверх
    или вниз; в остальных секциях — стаккато-точки. Каждая партия независима. Проверяются регистр
    и сетка. Оставлены композитору: выбор законов под форму (нормальное, гауссово, случайное
    блуждание), скорость и плотность глиссандо-полей, пространственное расположение, резкие
    обрывы массы, развитие плотности внутри секции, тембровая и динамическая драматургия.

climate:
  turbulence: облака густеют, глиссандо круче, обрывы резче
  volatility: законы распределения меняются часто, секции короче
  crowding: плотность атак растёт до стены звука
  density: больше партий одновременно, divisi до отдельного пульта
  strain: громкость и регистр к пределу, сфорцандо
  steadiness: ровное разреженное облако с постоянной интенсивностью
  loss: масса редеет до отдельных точек и тишины
  novelty: новые сита, неожиданные классы высот

exemplars:
  - Метастазис (1953–1954)
  - Питопракта (1955–1956)
  - Ахоррипсис (1956–1957)
  - ST/10 (1962)
  - Номос альфа для виолончели (1965–1966)
  - Персефасса для шести ударников (1969)
  - Mists для фортепиано (1980)
  - Ксенакис, «Формализованная музыка» (1963, англ. расширенное издание 1971); статья «Кризис сериальной музыки» (1955)
texts: под охраной (Ксенакис умер в 2001 году, ноты изданы Boosey & Hawkes и Salabert); берутся только приёмы и законы — сита, распределения, глиссандо-поля, — не партитуры
