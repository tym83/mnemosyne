# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: additive
name: Аддитивный процесс
art: music
kind: instrumental
origin:
  place: США, Нью-Йорк (лофты и галереи Сохо); опыт работы в Париже
  era: конец 1960-х — середина 1970-х (от «Two Pages» до «Эйнштейна на пляже»)
  language: традиция — ритмические циклы индийской классической музыки, строгий контрапункт школы Нади Буланже
  note: >
    Филип Гласс учился у Нади Буланже в Париже и там же работал с Рави Шанкаром и таблистом
    Аллой Ракхой над музыкой к фильму «Chappaqua» (1966): переводя индийскую музыку в западную
    нотацию, он понял, что ритм может строиться не делением такта, а сложением малых единиц в
    длинные циклы. Вернувшись в Нью-Йорк, он создал Philip Glass Ensemble (1968) — электроорганы,
    саксофоны, флейты, голос, усиление — и играл в галереях и лофтах среди художников и
    скульпторов. Ранние пьесы («Two Pages», «Music in Fifths», «Music in Similar Motion») строятся
    на одной линии, которая растёт и сжимается добавлением и вычитанием нот. Сам Гласс
    отказывался от ярлыка «минимализм», предпочитая говорить о музыке с повторяющимися
    структурами.

lineage:
  predecessors:
    - индийская классическая музыка — тала, циклы, сложение ритмических единиц
    - Надя Буланже — строгость голосоведения, дисциплина ремесла
    - Терри Райли и Ла Монте Янг — повтор и долгое время
    - нью-йоркская живопись и скульптура минимализма — Сол Левитт, Ричард Серра, серийность объекта
  neighbours:
    - Стив Райх — процесс через фазу, а не через сложение
    - театр Роберта Уилсона — замедленное время, образ вместо сюжета
    - позднее рок и электроника, взявшие повтор и арпеджио
    - Майкл Найман и британский минимализм
  against:
    - сериализм и европейский авангард — неслышимая сложность, элитарность
    - драматургия развития и кульминации
    - музыка как выражение биографии композитора
    - концертный ритуал академической музыки

worldview: >
  Музыка — не рассказ, а среда, в которой слушатель живёт определённое время. Ритм — живое
  тело, которое растёт и сжимается: одна нота добавлена — и мир фразы изменился, одна убрана —
  и он стал снова другим. Повторение не скучно; оно обнаруживает, что ничто не повторяется
  буквально, потому что слух меняется. Энергия, громкость и непрерывность — не грубость, а
  способ войти в состояние, где нет больше «до» и «после», есть только длящееся.

reader: >
  Слушатель погружается в непрерывное движение и следит за тем, как меняется длина фразы —
  слышит, как узор растягивается и сжимается, как будто дышит. Ему не нужно ничего узнавать или
  запоминать; нужно отдаться пульсу и заметить переход. Восприятие колеблется между
  сосредоточенным счётом и трансом; громкость и плотность звука держат тело.

time: >
  Время — непрерывный поток восьмых, в котором длина цикла меняется по правилу. Метра в
  обычном смысле нет: такт растягивается и сжимается вместе с фигурой. Форма складывается из
  длинных секций, каждая из которых проходит свой цикл сложения и вычитания, и из смен
  гармонии, приходящих только после завершения цикла.

composition:
  principle: короткая фигура растёт и сжимается добавлением и вычитанием единиц, а гармония меняется только после целых циклов
  forms:
    - одноголосная или параллельная линия, растущая по правилу сложения («Music in Fifths»)
    - пьеса из нескольких частей, каждая на своём процессе («Music in Twelve Parts»)
    - опера-портрет из повторяющихся сцен-образов («Эйнштейн на пляже»)
    - цикл гармоний, проходящий через аддитивные фигуры
  inner: >
    Внутри — ряд длин цикла (например, две ноты, три, четыре, пять и обратно), каждый размер
    повторяется несколько раз, прежде чем смениться следующим. Фигура остаётся узнаваемой, но
    растягивается и сжимается; гармония (часто цепь аккордов) сменяется на границах циклов.

narrator: >
  Источник — ансамбль, играющий как машина с дыханием. Исполнители держат пульс без колебаний,
  точно отсчитывают повторы и переходы; выразительность — в ровности и силе. Голос поёт числа
  или сольфеджио, а не текст. Композитор часто играет сам.

character: >
  Персонаж — фигура и её длина. Её рост и сжатие, смена окраски гармонией — единственный сюжет.

language: >
  Диатоника, арпеджио, параллельные квинты и терции; гармония медленная, аккорды сменяются циклами.
  Ритм — непрерывные восьмые, длины циклов по правилу сложения. Тембр — электроорганы,
  саксофоны, флейты, голос, позднее оркестр; усиление и ровность. Динамика громкая и ровная.
  Фактура — параллельное движение, арпеджированные фигуры.

imagery:
  - поезд, движение, дорога
  - здание, лестница, кирпичная кладка
  - дыхание и пульс
  - свет на поверхности, сменяющийся медленно
  - числа и счёт

themes:
  - повтор как способ войти в состояние
  - рост и сжатие как жизнь формы
  - время, освобождённое от рассказа
  - портрет без биографии (Эйнштейн, Ганди, Эхнатон)
  - энергия ансамбля

devices:
  - фигура, растущая на одну ноту за цикл и затем сжимающаяся
  - каждый размер фигуры повторяется несколько раз
  - смена гармонии только после целого цикла
  - параллельное движение голосов в квинтах или терциях
  - пение чисел или сольфеджио вместо текста
  - арпеджио, обходящее аккорд по кругу

genres:
  - ансамблевая пьеса для электроорганов и духовых
  - сольная клавишная пьеса
  - опера-портрет
  - музыка для театра и кино
  - струнный квартет

forbidden:
  - рубато и выразительное отклонение от пульса
  - тема с развитием
  - смена гармонии посреди цикла
  - атональная хроматика
  - тишина как пауза в потоке

markers:
  - поток не прерывается, пульс ровен
  - слышно, как фигура вытягивается и стягивается
  - переход к новой гармонии ощущается как смена света
  - один и тот же узор при разной длине звучит по-разному
  - слушатель ловит себя на том, что дышит в ритме цикла, — признак живой пьесы
  - конец наступает как остановка потока, а не как каденция

reading: >
  Понятно в аддитивной музыке — когда слушатель с первых тактов слышит фигуру и чувствует, что
  её длина меняется. Интересно — когда рост и сжатие создают ощущение дыхания, а смена гармонии
  после цикла приходит как событие, меняющее освещение всего узора. Пьеса проваливается, если
  длина фигуры не меняется (тогда это просто остинато), если правило сложения непоследовательно
  и слух теряет ориентир, или если гармония меняется так часто, что цикл не успевает
  сложиться.

manifesto:
  - Ритм складывается, а не делится.
  - Фигура живёт — растёт и сжимается.
  - Гармония меняет свет только тогда, когда круг пройден.
  - Повтор не скучен; меняется слух.
  - Музыка — среда, в которой живут, а не рассказ, который слушают.
  - Громкость и непрерывность — путь в состояние, а не грубость.

form:
  code: src/mnemosyne/music/schools/additive.py
  note: >
    Код берёт пятинотную ячейку из пентатоники (0, 2, 4, 7, 9 полутонов в случайном порядке) и
    проводит её циклами длины 2, 3, 4, 5, 4, 3 восьмые. Над корнем, который меняется только после
    шести циклов (до, ля, фа, ре), чётные партии играют ячейку, нечётные — чередование корня и
    квинты. Поток непрерывных восьмых. Проверяются порядок сложения и смена корня на границе
    цикла. Оставлены композитору: число повторов каждого размера, арпеджированные аккордовые
    циклы, параллельное движение, тембр и усиление, большая форма из частей и громкость.

climate:
  steadiness: ровный поток, цикл повторяется, гармония стоит
  abundance: фигура растёт, больше нот в цикле
  loss: фигура сжимается до двух нот
  renewal: смена гармонии на границе цикла
  density: больше партий в параллельном движении
  closedness: одна ячейка на весь раздел
  turbulence: циклы короче, гармония сменяется чаще
  novelty: новая ячейка или новый корень

exemplars:
  - Two Pages (1968)
  - Music in Fifths (1969)
  - Music in Similar Motion (1969)
  - Music in Twelve Parts (1971–1974)
  - Einstein on the Beach, с Робертом Уилсоном (1976)
  - Satyagraha (1979)
texts: под охраной (ноты изданы Dunvagen Music Publishers); берутся только приёмы — сложение и вычитание, смена гармонии по циклу, — не фигуры конкретных пьес
