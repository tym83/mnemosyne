# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: basso_continuo
name: Генерал-бас (бассо континуо)
art: music
kind: instrumental
origin:
  place: Италия — Флоренция, Рим, Венеция; затем вся Европа (Лондон, Дрезден, Париж)
  era: примерно 1600–1750 годы
  language: бас с цифровкой, по которому клавесинист или органист импровизирует аккорды; над басом — солисты
  note: >
    Около 1600 года в Италии музыку стали записывать как мелодию над басом, а гармонию между ними
    обозначать цифрами. Ранние образцы — флорентийская монодия (Пери, Каччини, «Эвридика», 1600) и
    «Сто церковных концертов» Лодовико Виаданы (1602); Агостино Агаццари описал игру по басу в
    трактате 1607 года. Континуо — клавесин, орган, лютня или теорба вместе с виолончелью,
    виолой да гамба или фаготом — стало основой всего барокко. Арканджело Корелли (1653–1713)
    издал скрипичные сонаты op. 5 (1700) и concerti grossi op. 6 (1714); Антонио Вивальди
    (1678–1741) в сборнике «Гармоническое вдохновение» op. 3 (1711) и «Временах года» (1725)
    утвердил форму ритурнеля — возвращающегося тутти в разных тональностях между сольными
    эпизодами. Гендель (1685–1759) издал concerti grossi op. 6 в 1740 году. Правила реализации
    изложили Иоганн Давид Хайнихен (1728) и Карл Филипп Эмануэль Бах (вторая часть «Опыта», 1762).
    Термин «террасная динамика» — позднейший, музыковедческий.

lineage:
  predecessors:
    - ренессансная полифония — бас как опора многоголосия
    - флорентийская камерата и монодия — солист над басом
    - орган, дублирующий хор в церкви (basso seguente)
  neighbours:
    - фуга и хоральная обработка — тот же язык в полифонии
    - французская сюита и увертюра
    - опера-сериа и кантата
  against:
    - ровная полифония равных голосов без опоры
    - выписанный аккомпанемент без свободы исполнителя
    - гомофония галантного стиля с её короткими периодами (позднейшая реакция)

worldview: >
  Музыка стоит на басе, как здание на фундаменте: бас движется, гармония над ним вырастает из
  цифр, мелодия свободно поёт поверх. Мир — это аффект, ясно представленный: одна часть — одно
  чувство, выдержанное до конца. Контраст тутти и соло, громкого и тихого — риторика, а не
  каприз.

reader: >
  Слушатель — в церкви, при дворе, в академии или в публичном театре; он узнаёт ритурнель, когда
  тот возвращается в новой тональности, и следит, как солист уводит гармонию по квинтовому кругу
  к следующему тутти. Его радость — в энергии движения и в ясной смене массы и одного голоса.

time: >
  Время моторно: бас идёт ровными четвертями или восьмыми, гармония меняется размеренно,
  секвенции несут движение вперёд. Форма концерта — ритурнель (тутти) и эпизоды (соло)
  попеременно; ритурнель открывает и закрывает часть в главной тональности, в середине звучит в
  родственных.

composition:
  principle: бас движется на каждой доле, аккорды реализуются над ним; мелодия над континуо; секвенции по квинтовому кругу; ритурнель; террасная динамика
  forms:
    - концерт с ритурнелем (Вивальди)
    - concerto grosso — концертино и рипиено (Корелли, Гендель)
    - трио-соната и соната для солиста с континуо
    - ария da capo
  inner: >
    Ритурнель — четыре такта с ясной каденцией: тоника, субдоминанта, доминанта, тоника. Эпизод
    берёт короткую фигуру и ведёт её секвенцией: каждый аккорд на квинту ниже предыдущего
    (I — IV — VII — III — VI — II), затем доминанта новой тональности открывает следующий
    ритурнель. Бас ходит по корням с проходящими звуками между ними; клавишный инструмент
    берёт аккорды близким расположением с плавным голосоведением.

narrator: >
  Континуо — коллектив: клавесин или орган и низкий смычковый. Клавишник читает цифры и
  импровизирует расположение; солист украшает. В этой школе реализация выписана: аккорды на
  каждую долю, без импровизации.

character: >
  Вместо героя — бас: неутомимый, ровный, ведущий; над ним — солист, который то сливается с
  тутти, то остаётся один над континуо.

language: >
  Мажор и минор, функциональная гармония с секвенциями; модуляции в доминанту и субдоминанту
  через доминанту новой тональности. Ритм моторный; фигурации восьмыми и шестнадцатыми.
  Динамика блоками: forte в тутти, piano в соло; эхо.

imagery:
  - фундамент и колоннада
  - двор, театр, капелла
  - смена света и тени
  - механизм, который не останавливается

themes:
  - один аффект на часть
  - праздник и блеск
  - разговор солиста и массы
  - порядок движения

devices:
  - бас на каждой доле с проходящими звуками
  - аккорды клавишного над басом
  - ритурнель, возвращающийся в разных тональностях
  - секвенция по квинтовому кругу
  - эпизод соло над одним континуо
  - доминанта новой тональности перед ритурнелем
  - террасная динамика: forte — piano

genres:
  - сольный концерт
  - concerto grosso
  - трио-соната
  - ария и кантата

forbidden:
  - гармония без баса
  - плавные крещендо и диминуэндо как основа формы
  - короткие классические периоды с альбертиевым басом
  - смена аффекта посреди части без причины

markers:
  - бас не останавливается
  - над ним аккорды клавишного
  - одна и та же тема тутти возвращается в разных тональностях
  - в эпизодах аккорды сползают по квинтам
  - громкость меняется ступенями, а не волнами

reading: >
  Понятно — когда с первых тактов слышен бас, идущий на каждую долю, и над ним аккорды, а
  ритурнель узнаётся при возвращении. Захватывает — когда секвенция по квинтам несёт эпизод
  к новой тональности и тутти врывается forte. Проваливается, если бас стоит, если секвенции
  механически повторяют одно и то же без цели или если тутти и соло звучат одинаково.

manifesto:
  - Бас — фундамент; гармония стоит на нём.
  - Бас идёт на каждую долю.
  - Ритурнель возвращается, тональность меняется.
  - Квинтовый круг ведёт к новому дому.
  - Тутти — forte, соло — piano.
  - Одна часть — один аффект.

form:
  code: src/mnemosyne/music/schools/basso_continuo.py
  note: >
    Код выбирает мажор или минор и делит пьесу на единицы по четыре такта: ритурнель (тутти,
    forte) и эпизод (соло, piano) попеременно, последняя единица — ритурнель. Ритурнели звучат в
    тонике, затем в доминанте и субдоминанте (и на большую секунду выше в мажоре, на малую
    септиму в миноре), последний — снова в тонике. Гармония по полутактам: ритурнель I — IV —
    V — I — vi — ii — V — I, эпизод — шесть звеньев квинтового круга и V7 тональности следующего
    ритурнеля. Бас (виолончель, контрабасы) играет корень на первую долю и проходящий или
    аккордовый звук на вторую — движение на каждую долю. Фортепиано (клавесин) берёт аккорд с
    басом на каждую долю, в фортепианном составе бас и аккорд объединены. Мелодия ритурнеля —
    фигуры восьмыми и шестнадцатыми по аккорду; в эпизоде солист повторяет одну фигуру одного
    контура на каждом звене секвенции. Средние голоса звучат только в тутти. Секционная
    динамика плана заменена террасной. Цифровка, импровизация, украшения и концертино не
    реализованы.

climate:
  steadiness: ритурнели в тонике, ровный бас
  loss: минорный лад, долгие эпизоды piano
  scars: секвенция, затянутая дальше привычного
  renewal: ритурнель в новой тональности forte
  age: барокко, эпоха генерал-баса
  closedness: соло и континуо
  crowding: тутти всего оркестра
  turbulence: шестнадцатые и быстрые смены тутти и соло

exemplars:
  - Л. Виадана, «Сто церковных концертов» (1602)
  - А. Корелли, сонаты op. 5 (1700)
  - А. Корелли, concerti grossi op. 6 (1714)
  - А. Вивальди, «Гармоническое вдохновение» op. 3 (1711)
  - А. Вивальди, «Времена года» (1725)
  - Г. Ф. Гендель, concerti grossi op. 6 (1740)
  - И. Д. Хайнихен, «Генерал-бас в композиции» (1728)
texts: общественное достояние; берутся только приёмы — бас на каждую долю, реализация аккордов, ритурнель, квинтовые секвенции, террасная динамика, — но не темы и не басы конкретных сочинений
