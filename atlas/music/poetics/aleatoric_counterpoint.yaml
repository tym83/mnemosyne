# Поэтика школы: черновик для проверки. Схема одна для всех школ, и для рождённых в мастерской тоже.
id: aleatoric_counterpoint
name: Алеаторический контрапункт
art: music
kind: mixed
origin:
  place: Польша, Варшава
  era: с 1960–1961 («Венецианские игры») до 1994
  language: традиция — европейская симфоническая форма, Барток, польский авангард после 1956 года
  note: >
    Витольд Лютославский пришёл к новому языку поздно: после «Концерта для оркестра» (1950–1954) и
    «Траурной музыки» памяти Бартока (1958) он искал способ освободить ритм ансамбля, не отдавая
    форму случаю. Толчком стала услышанная по радио в 1960 году запись «Концерта для фортепиано с
    оркестром» Кейджа. Лютославский взял из неё не философию случая, а технику: в «Венецианских
    играх» (1960–1961) музыканты в определённых местах играют свои партии ad libitum — без общего
    такта, каждый в своём темпе, — пока дирижёр не подаст знак. Высоты при этом выписаны точно,
    поэтому гармония целого контролируется композитором, а ритмическое наложение каждый раз иное.
    Сам он называл это ограниченной алеаторикой и алеаторическим контрапунктом. Чередование
    дирижируемых (a battuta) и свободных (ad libitum) эпизодов стало основой его поздних
    симфоний и концертов.

lineage:
  predecessors:
    - Барток — энергия, симметрия, ночная музыка
    - Дебюсси и Равель — гармония как цвет, оркестровая прозрачность
    - Кейдж — случай, но взятый как техника, а не как философия
  neighbours:
    - польские сонористы — Пендерецкий, Гурецкий, Сероцкий
    - европейская алеаторика — Булез, Штокхаузен (открытые формы)
    - Терри Райли — независимые повторы модулей, но без дирижёра
    - Лигети — тоже ткань из множества голосов, но выписанная до ноты
  against:
    - полная случайность Кейджа, отдающая форму исполнителю
    - тотальный сериализм, где ритм жёстко сетчатый и неслышимый
    - соцреалистическая простота
    - механическая синхронность оркестра, когда все играют в одну долю

worldview: >
  Свобода исполнителя и власть формы могут уживаться: каждый музыкант дышит в своём темпе, а
  целое всё равно звучит так, как задумал композитор. Мир похож на толпу, где каждый говорит
  своё, а вместе слышен гул одного настроения. Форма — драма, у которой есть путь к главному;
  музыка должна захватывать, а не только радовать ум. Гармония — подлинный носитель смысла и
  цвета; ритмическая свобода нужна, чтобы гармония жила и мерцала.

reader: >
  Слушатель воспринимает мерцающую, живую ткань, где множество голосов одновременно говорят
  своё, а гармония целого ясна. Ему не нужно знать, где кончается запись и начинается свобода;
  он чувствует контраст между свободными, «колеблющимися» эпизодами и мощными
  синхронными вступлениями. Слушание — переживание драмы: ожидание, нарастание и прорыв к
  главному разделу.

time: >
  Время двойное: в свободных эпизодах у каждого своё время, без общего такта; в дирижируемых —
  общая, мощная пульсация. Форма часто двухчастна: колеблющееся, ищущее вступление и главная
  часть с прорывом и кульминацией; или цепь эпизодов, сцепленных, как звенья. Свобода и
  синхронность чередуются, как вдох и выдох.

composition:
  principle: точно выписанные высоты и ad libitum ритм исполнителей дают управляемую, но каждый раз новую ткань, а дирижёр задаёт её начала и концы
  forms:
    - двухчастная симфония — вступительная «колеблющаяся» часть и главная, «прямая»
    - мобильная форма, где эпизоды разделены знаками дирижёра или солиста
    - цепь — звенья, начинающиеся и кончающиеся в разное время («Chain»)
    - концерт, где солист и оркестр спорят и разговаривают
    - струнный квартет без общего такта, переходы по знаку
  inner: >
    Внутри свободного эпизода — у каждого исполнителя свой короткий мотив или фигура, которую он
    повторяет в своём темпе, пока не дадут знак. Наложения дают мерцающую ткань, а выбор высот
    гарантирует гармонию: часто двенадцатизвучные аккорды из определённых интервалов. Дирижёрский
    сигнал обрывает или переключает эпизод.

narrator: >
  Источник — оркестр как сообщество независимых, но слышащих голосов. Исполнитель свободен в
  темпе и ритмической фразировке внутри эпизода, но несвободен в высотах; от него требуется
  сохранить независимость и не подстраиваться под соседей. Дирижёр не отбивает такт, а подаёт
  сигналы начала и конца.

character: >
  Персонаж — ткань, сотканная из независимых голосов, и её противоположность — синхронный
  удар-вступление. Иногда персонаж — солист, вступающий в спор с массой.

language: >
  Двенадцатизвучные аккорды, построенные из ограниченного набора интервалов, и их последовательности; гармония как цвет. Ритм — ad libitum в свободных эпизодах,
  строгий в дирижируемых. Тембр — прозрачная и яркая оркестровка, разделение групп. Динамика —
  широкий диапазон, длинные нарастания. Фактура — мерцающие ткани, контрастирующие с
  монолитными вступлениями.

imagery:
  - толпа, говор, гул голосов
  - мерцание, рябь, листва
  - ожидание и прорыв
  - цепь, звенья
  - спор, диалог

themes:
  - свобода внутри формы
  - драма поиска и прорыва
  - индивидуальность в общем звучании
  - диалог и спор
  - напряжённое ожидание

devices:
  - ad libitum эпизод с независимыми повторами фигур
  - дирижёрский знак начала и конца эпизода
  - чередование a battuta и ad libitum
  - двенадцатизвучный аккорд как гармоническая рамка свободы
  - смещённые вступления голосов внутри ad libitum
  - солист, прерывающий оркестр, и оркестр, прерывающий солиста

genres:
  - симфония
  - инструментальный концерт
  - струнный квартет
  - оркестровая пьеса («книга», «цепь»)
  - вокальный цикл с оркестром

forbidden:
  - полная случайность высот
  - механическая синхронность ad libitum эпизодов
  - отсутствие драматургии и направления
  - подстраивание исполнителей друг к другу в свободном эпизоде
  - неслышимая сложность ритмической сетки

markers:
  - ткань мерцает, голоса независимы, гармония ясна
  - контраст свободного и дирижируемого ощутим
  - вступление после свободного эпизода звучит как прорыв
  - каждое исполнение чуть иное, но пьеса узнаваема
  - слушатель ждёт главного и ощущает его приход — признак живой пьесы
  - форма ведёт к цели, а не просто чередует эпизоды

reading: >
  Понятно в алеаторическом контрапункте — когда слушатель различает два состояния: мерцающую
  свободную ткань и мощное синхронное вступление — и чувствует, что форма ведёт от одного к
  другому. Интересно — когда свободные эпизоды живут, ткань меняет плотность и цвет, а
  ожидание главного нарастает и разрешается прорывом. Пьеса проваливается, если свободные эпизоды
  звучат как хаос (высоты не держат гармонию), если они механически синхронны, или если
  чередование не создаёт драмы.

manifesto:
  - Свобода исполнителя и форма композитора совместимы.
  - Высоты пишет композитор, ритм дышит у каждого свой.
  - Гармония — носитель цвета и смысла.
  - Форма — путь к главному, а не череда событий.
  - Дирижёр не отбивает такт, а открывает и закрывает свободу.
  - Случай — техника, а не философия.

form:
  code: src/mnemosyne/music/schools/aleatoric_counterpoint.py
  note: >
    Код чередует секции: чётные — «дирижируемые», все партии синхронно бьют звуки каждые две
    четверти; нечётные — «ad libitum», где у каждой партии своя четырёхзвучная ячейка из случайных
    высотных классов, повторяемая в своём шаге (½, ¾, 1¼ или 1¾ четверти) со смещённым
    вступлением. Ячейки берутся заново в каждой секции. Партитура и аудио фиксируют одну
    реализацию по зерну, а не живую игру по знаку дирижёра. Проверяются чередование и
    независимость шагов. Оставлены композитору: гармоническая рамка (двенадцатизвучные аккорды из
    выбранных интервалов), знаки начала и конца, форма «колебание — прорыв», солист, длина
    свободных эпизодов и их драматургия.

climate:
  volatility: больше ad libitum, голоса расходятся шире
  steadiness: дирижируемые эпизоды, общий пульс
  turbulence: свободные эпизоды плотнее и громче
  crowding: больше голосов в свободной ткани
  renewal: прорыв к главному, синхронное вступление
  strain: долгое ожидание без прорыва
  novelty: новые ячейки, новая гармоническая рамка
  density: шаги короче, ткань гуще

exemplars:
  - Траурная музыка памяти Бартока (1958)
  - Венецианские игры (1960–1961)
  - Струнный квартет (1964)
  - Симфония № 2 (1965–1967)
  - Livre pour orchestre (1968)
  - Концерт для виолончели с оркестром (1969–1970)
  - Mi-parti (1975–1976)
  - Симфония № 3 (1983)
  - Chain 1–3 (1983–1986)
texts: под охраной (Лютославский умер в 1994 году, ноты изданы Chester Music и PWM); берутся только приёмы — ad libitum, знак, двенадцатизвучная рамка, — не партитуры
