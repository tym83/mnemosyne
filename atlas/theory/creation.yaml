# How masterpieces are made: what masters and theorists said, turned into
# working tools. Each entry names the stage of the workshop it serves, an
# operator the artist can use, and a test the critics apply.
# stages: idea, interrogation, method, concept, halftones, drafts, judgement

- id: aristotle
  who: "Аристотель, «Поэтика»"
  claim: "Целое имеет начало, середину и конец; сильнейшее в трагедии — перипетия и узнавание; через сострадание и страх — катарсис."
  stages: [concept, judgement]
  operator: "Строить замысел вокруг перипетии (поворот к противоположному) и узнавания (переход от незнания к знанию)."
  test: "Есть ли в работе поворот и узнавание? Ведёт ли она к очищению, а не к простому впечатлению?"

- id: longinus-burke-kant
  who: "Псевдо-Лонгин «О возвышенном»; Бёрк; Кант, «Критика способности суждения»"
  claim: "Возвышенное — это величие, перед которым воображение не справляется, и восторг от того, что разум всё же его выдерживает."
  stages: [idea, concept]
  operator: "Поставить человека перед несоизмеримым: масштабом, бесконечностью, тьмой, силой — и дать ему выстоять."
  test: "Есть ли в работе мгновение, где дух перехватывает? Или она только красива?"

- id: tolstoy
  who: "Лев Толстой, «Что такое искусство?»"
  claim: "Искусство — заражение чувством, которое художник сам пережил; критерии: индивидуальность чувства, ясность передачи, искренность."
  stages: [interrogation, judgement]
  operator: "Говорить только о том, что художник действительно чувствует; искать единственное, своё чувство."
  test: "Искренне ли это? Заражает ли? Ясно ли передано? Неискреннее отбраковывается, как бы изощрённо ни было."

- id: shklovsky
  who: "Виктор Шкловский, «Искусство как приём»"
  claim: "Цель искусства — вернуть ощущение вещи, сделать камень каменным; приём — остранение: видеть привычное как впервые."
  stages: [idea, method, judgement]
  operator: "Остранение: показать привычное глазами того, кто видит его впервые, — ребёнка, чужеземца, вещи, лошади."
  test: "Увидел ли зритель знакомое заново? Или работа подтверждает то, что он и так знал?"

- id: vygotsky
  who: "Лев Выготский, «Психология искусства»"
  claim: "Эстетическая реакция рождается из противоречия формы и материала: форма уничтожает содержание, и это противоречие разрешается катарсисом (лёгкое дыхание о мрачной истории)."
  stages: [concept, halftones, judgement]
  operator: "Сознательно строить форму против материала: о тяжёлом — легко, о страшном — тихо, о радостном — строго."
  test: "Спорят ли форма и материал? Если форма лишь иллюстрирует материал, катарсиса не будет."

- id: eliot
  who: "Т. С. Элиот, «Гамлет и его проблемы»"
  claim: "Объективный коррелят: чувство выражается не называнием, а набором предметов, ситуаций, цепью событий, которые его неизбежно вызывают."
  stages: [halftones, drafts, judgement]
  operator: "Не называть чувство — найти вещи и обстоятельства, которые его вызывают."
  test: "Названо ли чувство прямо? Если да — переписать через предметы."

- id: poe
  who: "Эдгар По, «Философия творчества»"
  claim: "Начинать с эффекта, который должно произвести целое, и подчинять ему каждую деталь; единство впечатления."
  stages: [concept]
  operator: "Сначала решить, каким будет последнее впечатление, и вести к нему всё остальное."
  test: "Работает ли каждая часть на единство впечатления?"

- id: stanislavsky
  who: "Константин Станиславский"
  claim: "Сверхзадача — то главное, ради чего создаётся всё произведение; сквозное действие ведёт к ней через все куски."
  stages: [interrogation, concept]
  operator: "Сформулировать сверхзадачу одной фразой-глаголом: «хочу, чтобы…» — и проверять ею каждый кусок."
  test: "Есть ли сверхзадача, и служит ли ей каждая часть?"

- id: kandinsky
  who: "Василий Кандинский, «О духовном в искусстве»"
  claim: "Принцип внутренней необходимости: форма оправдана, только если выражает внутреннее; цвет и форма действуют на душу прямо."
  stages: [method, halftones]
  operator: "Выбирать каждое средство только по внутренней необходимости, а не по моде или привычке."
  test: "Можно ли объяснить каждое решение внутренней необходимостью? Или это украшение?"

- id: koestler
  who: "Артур Кёстлер, «Акт творения»"
  claim: "Творческий акт — бисоциация: столкновение двух независимых систем смысла; так рождаются открытие, шутка и искусство."
  stages: [idea]
  operator: "Столкнуть две далёкие рамки: ремесло и миф, бухгалтерию и молитву, приливы и почерк."
  test: "Есть ли в идее столкновение двух миров, которое раньше никто не сводил?"

- id: boden
  who: "Маргарет Боден, «Творческий разум»"
  claim: "Три вида творчества: комбинаторное (новые сочетания), исследовательское (поиск внутри стиля), трансформационное (изменение самих правил пространства стиля) — самое редкое и сильное."
  stages: [method]
  operator: "Определить, какое творчество нужно этой идее; для трансформационного — назвать правило, которое меняется, и что становится возможным."
  test: "Если художник заявляет новизну метода — какое именно правило он изменил? Без ответа это комбинация, а не трансформация."

- id: wallas-poincare
  who: "Грэм Уоллес «Искусство мысли»; Анри Пуанкаре о математическом творчестве"
  claim: "Подготовка, инкубация, озарение, проверка: решение приходит после того, как задачу отложили."
  stages: [drafts]
  operator: "Отложить черновик, переключиться на другую работу, вернуться — отлёживание как инкубация."
  test: "Прошла ли работа инкубацию? Был ли поворот после возвращения?"

- id: gombrich
  who: "Эрнст Гомбрих, «Искусство и иллюзия»"
  claim: "Художник работает через схему и поправку: начинает с привычной схемы и исправляет её, сверяя с миром."
  stages: [drafts]
  operator: "Каждый черновик — схема; следующий — поправка, названная словами: что не так и в какую сторону."
  test: "Видно ли в черновиках последовательное исправление, а не случайный перебор?"

- id: valery
  who: "Поль Валери"
  claim: "Произведение не заканчивают — его оставляют; ценность в самой работе над ним, в поиске."
  stages: [drafts, judgement]
  operator: "Сохранять путь поиска как часть произведения; решать, когда оставить, а не когда «готово»."
  test: "Оставлено ли произведение в верный момент: до того, как правка стала порчей?"

- id: rilke
  who: "Райнер Мария Рильке, «Письма к молодому поэту»"
  claim: "Пишите, только если не можете не писать; ищите в себе необходимость; живите вопросами."
  stages: [interrogation]
  operator: "Спросить себя: умру ли я, если мне запретят это сделать?"
  test: "Есть ли у работы необходимость? Или её можно было не делать?"

- id: tarkovsky
  who: "Андрей Тарковский, «Запечатлённое время»"
  claim: "Образ — это не символ и не мысль, а запечатлённая жизнь, неисчерпаемая толкованием; время в кадре — материал."
  stages: [concept, judgement]
  operator: "Строить образ, который нельзя пересказать мыслью, — он неисчерпаем."
  test: "Сводится ли образ к одной мысли? Если да — это аллегория, а не образ."

- id: eisenstein
  who: "Сергей Эйзенштейн, «Монтаж», «Неравнодушная природа»"
  claim: "Столкновение двух кадров рождает третье понятие; пафос — выход за пределы, скачок в новое качество."
  stages: [concept, drafts]
  operator: "Ставить рядом несовместимое так, чтобы из стыка родился смысл, которого нет ни в одной части."
  test: "Рождает ли соединение частей смысл, которого нет в каждой из них?"

- id: bakhtin
  who: "Михаил Бахтин"
  claim: "Полифония: равноправные голоса, не подчинённые автору; хронотоп: единство времени и пространства как форма смысла."
  stages: [method, concept]
  operator: "Дать голоса, которые автор не побеждает; выстроить хронотоп — особое время-пространство работы."
  test: "Не задавил ли автор другие голоса? Есть ли у работы свой хронотоп?"

- id: lotman
  who: "Юрий Лотман, «Структура художественного текста»"
  claim: "Художественный текст передаёт больше информации, чем любой другой: каждый уровень несёт смысл; минус-приём — значимое отсутствие."
  stages: [concept, drafts]
  operator: "Использовать минус-приём: значимое отсутствие ожидаемого (рифмы, финала, лица, цвета)."
  test: "Несёт ли смысл каждый уровень работы, включая отсутствия?"

- id: heidegger
  who: "Мартин Хайдеггер, «Исток художественного творения»"
  claim: "Произведение открывает мир и выставляет землю; в нём истина происходит, а не изображается."
  stages: [idea]
  operator: "Спросить: какой мир откроет работа, которого до неё не было?"
  test: "Открывает ли работа мир — или только показывает уже известный?"

- id: benjamin
  who: "Вальтер Беньямин, «Произведение искусства в эпоху его технической воспроизводимости»"
  claim: "Аура — неповторимое здесь-и-сейчас подлинника; техническое воспроизведение её разрушает."
  stages: [idea, method]
  operator: "Искать то, что в этой работе нельзя повторить: её здесь-и-сейчас."
  test: "Есть ли у работы аура — то, что не повторится в следующей ночи?"

- id: dewey
  who: "Джон Дьюи, «Искусство как опыт»"
  claim: "Искусство — это завершённый опыт: напряжение, развитие и исполнение, ритм усилия и разрешения."
  stages: [concept]
  operator: "Строить работу как опыт с ритмом напряжения и разрешения, а не как набор впечатлений."
  test: "Проживается ли работа как один завершённый опыт?"

- id: csikszentmihalyi
  who: "Михай Чиксентмихайи"
  claim: "Творчество — система из трёх частей: человек, область (традиция), поле (судьи, которые признают новое)."
  stages: [judgement]
  operator: "Знать свою область (атлас) и своё поле (критиков, жюри, флот)."
  test: "Признало бы новое поле знатоков? Изменило бы оно область?"

- id: danto-kuhn
  who: "Артур Данто «Мир искусства»; Томас Кун о смене парадигм"
  claim: "Новое искусство требует новой теории, без которой его нельзя увидеть; смена парадигмы меняет сами вопросы."
  stages: [method]
  operator: "Изобретая метод, написать теорию, без которой работы этого метода нельзя понять."
  test: "Есть ли у нового метода своя теория? Меняет ли он вопросы, а не только ответы?"

- id: brodsky
  who: "Иосиф Бродский, Нобелевская лекция"
  claim: "Эстетика — мать этики; язык диктует поэту; искусство делает человека частным, отдельным."
  stages: [interrogation, judgement]
  operator: "Говорить с одним человеком, а не с массой; слушать, что диктует сам материал."
  test: "Обращена ли работа к одному человеку? Делает ли она его отдельным?"

- id: mandelstam
  who: "Осип Мандельштам, «Разговор о Данте»"
  claim: "Поэтическая речь — процесс превращения: образ всё время переходит в другой, как метаморфоза, ни на миг не застывая."
  stages: [drafts, concept]
  operator: "Не держать образ неподвижным: пусть он превращается по ходу работы."
  test: "Живёт ли образ, меняется ли он, или застыл с первого появления?"

- id: tsvetaeva
  who: "Марина Цветаева, «Искусство при свете совести»"
  claim: "Поэт — во власти стихии; искусство вне морали, но художник за него отвечает."
  stages: [interrogation]
  operator: "Отдаться стихии замысла, а потом ответить за сделанное."
  test: "Есть ли в работе стихия — то, что больше замысла автора?"

- id: chekhov
  who: "Антон Чехов, письма"
  claim: "Краткость — сестра таланта; ружьё в первом акте стреляет в последнем; не нужно решать вопросы, нужно их правильно ставить."
  stages: [drafts, judgement]
  operator: "Вычёркивать всё, что не стреляет; ставить вопрос, а не давать ответ."
  test: "Есть ли лишнее? Правильно ли поставлен вопрос?"
