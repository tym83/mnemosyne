# Architecture as art: masters whose buildings are ideas of space, light
# and form first. Teachers for the architect-artist, not catalogues.
- id: boullee
  name: "Этьен-Луи Булле"
  principles: ["чистые геометрические тела в колоссальном масштабе", "свет и тень как материал: архитектура теней", "возвышенное, торжественное, надгробное"]
  works: ["Кенотаф Ньютона — сфера, внутри днём звёздная ночь", "Библиотека с бесконечным сводом"]
- id: ledoux
  name: "Клод-Никола Леду"
  principles: ["говорящая архитектура: форма рассказывает о назначении", "идеальный город по кругу", "сфера, куб, цилиндр как слова"]
  works: ["Дом смотрителей реки — цилиндр, сквозь который течёт вода", "Солеварни Арк-э-Сенан"]
- id: piranesi
  name: "Джованни Баттиста Пиранези"
  principles: ["бесконечные пространства, лестницы и мосты в никуда", "масштаб, подавляющий человека", "руина как величие"]
  works: ["Воображаемые темницы"]
- id: melnikov
  name: "Константин Мельников"
  principles: ["дерзкие пересечения объёмов", "цилиндры с сотами окон", "консоли, нависающие над улицей"]
  works: ["Собственный дом в Кривоарбатском — два врезанных цилиндра", "Клуб Русакова"]
- id: leonidov
  name: "Иван Леонидов"
  principles: ["невесомость: тонкая башня, стеклянный шар, плоскость поля", "архитектура как диаграмма будущего", "простор, а не стены"]
  works: ["Институт Ленина — шар на поле и тонкая вертикаль"]
- id: brodsky-utkin
  name: "Александр Бродский и Илья Уткин"
  principles: ["бумажная архитектура: офорт, а не чертёж", "ирония и меланхолия", "город-воспоминание, дом-музей исчезнувших домов"]
  works: ["Колумбарий жилых домов", "Мост через пропасть", "Дом-корабль"]
- id: ando
  name: "Тадао Андо"
  principles: ["бетон, свет и тишина", "щель света как событие", "вода как зеркало и граница"]
  works: ["Церковь Света — крест, прорезанный в стене", "Храм на воде"]
- id: kahn
  name: "Луис Кан"
  principles: ["служащие и обслуживаемые пространства", "свет как дар, падающий сверху", "монументальная простота кирпича и бетона"]
  works: ["Институт Солка — двор с водной нитью к океану", "Национальное собрание в Дакке"]
- id: gaudi
  name: "Антонио Гауди"
  principles: ["формы, найденные висящей цепью", "архитектура как природа: лес колонн", "цвет и тренкадис"]
  works: ["Саграда Фамилия", "Крипта Колонии Гуэль"]
- id: hejduk
  name: "Джон Хейдук"
  principles: ["архитектура как персонажи: дома-маски", "здания для одного обитателя", "архитектура-поэзия"]
  works: ["Маски Риги и Ланкастера", "Дом самоубийцы и дом матери самоубийцы"]
- id: woods
  name: "Лебеус Вудс"
  principles: ["архитектура после катастрофы: шрамы и швы", "новые формы, вросшие в руины", "свобода как пространство"]
  works: ["Проекты для Сараево", "Тихоокеанская стена"]
- id: zumthor
  name: "Петер Цумтор"
  principles: ["атмосфера: материал, звук, температура, свет", "камень и вода", "медленное восприятие"]
  works: ["Термы в Вальсе", "Часовня брата Клауса"]
