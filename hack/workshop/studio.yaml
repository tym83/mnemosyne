# Studio workers: one per workshop node, each a long-running pod with its
# own disk for models, sample libraries and results. Work is handed to them
# with kubectl exec; results come back with kubectl cp.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: studio
  namespace: tenant-scheherazade
spec:
  serviceName: studio
  # Three studios while no workshop runs; give ws2 back when one starts.
  # A fourth pod grabs whichever node frees first and can lock studio-0
  # out of ws1, where its volume lives.
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: studio}
  template:
    metadata:
      labels: {app: studio}
    spec:
      terminationGracePeriodSeconds: 5
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [ws1, ws2, ws3, ws4]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {matchLabels: {app: studio}}
            topologyKey: kubernetes.io/hostname
      containers:
      - name: studio
        image: python:3.12-bookworm
        # System packages live in the container, not on the volume: reinstall
        # them on every start so a restart does not leave the studio without
        # its tools. The venv, models and sfizz build stay on /work.
        command:
        - sh
        - -c
        - >-
          mkdir -p /work/tmp &&
          apt-get update -qq &&
          apt-get install -y -qq lilypond fluidsynth fluid-soundfont-gm ffmpeg poppler-utils
          abcmidi git fonts-dejavu-core libsndfile1 libsamplerate0 >/work/tmp/apt.log 2>&1;
          touch /tmp/tools-ready; exec sleep infinity
        readinessProbe:
          exec: {command: [test, -f, /tmp/tools-ready]}
          periodSeconds: 10
        workingDir: /work
        env:
        - {name: TMPDIR, value: /work/tmp}
        - {name: HF_HOME, value: /work/hf}
        - {name: PIP_CACHE_DIR, value: /work/pip}
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "60", memory: 56Gi}  # leaves tenant quota for e2e clusters
        volumeMounts:
        - {name: work, mountPath: /work}
  volumeClaimTemplates:
  - metadata: {name: work}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: replicated
      resources:
        requests:
          storage: 60Gi
