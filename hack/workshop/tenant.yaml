# The studio lives in its own tenant of the workshop cluster: generation
# runs on CPU across the free cores, never on a laptop.
apiVersion: apps.cozystack.io/v1alpha1
kind: Tenant
metadata:
  name: scheherazade
  namespace: tenant-root
spec:
  etcd: false
  ingress: false
  monitoring: false
  seaweedfs: false
  resourceQuotas:
    cpu: "320"
    memory: 400Gi
