[project]
name = "mnemosyne-art"
version = "0.1.0"
description = "Mnemosyne: memory gives birth to the arts"
readme = "README.md"
authors = [
    { name = "tym83", email = "6355522@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "cryptography>=46",
    "ezdxf>=1.4.5",
    "kubernetes>=37.0.1",
    "music21>=10.5.2",
    "numpy>=2.5.4",
    "ortools>=9.15.6755",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
operator = ["kopf>=1.38,<2", "boto3>=1.35,<2"]

[project.scripts]
mnemo = "mnemosyne:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mnemosyne"
