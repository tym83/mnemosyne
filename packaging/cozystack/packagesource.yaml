apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata: {name: mnemosyne.application}
spec:
  sourceRef:
    kind: OCIRepository
    name: mnemosyne-packages
    namespace: cozy-system
    path: /
  variants:
    - name: default
      dependsOn: [cozystack.cozystack-engine]
      libraries:
        - {name: cozy-lib, path: library/cozy-lib}
      components:
        - {name: mnemosyne-core, path: system/mnemosyne-core}
        - name: mnemosyne
          path: apps/mnemosyne
          libraries: [cozy-lib]
        - name: mnemosyne-rd
          path: system/mnemosyne-rd
          install: {namespace: cozy-system, releaseName: mnemosyne-rd}
---
apiVersion: cozystack.io/v1alpha1
kind: Package
metadata: {name: mnemosyne.application}
spec:
  variant: default
