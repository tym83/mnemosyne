apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: mnemosyne
spec:
  application:
    kind: Mnemosyne
    plural: mnemosynes
    singular: mnemosyne
    openAPISchema: '{"type": "object", "properties": {"enabled": {"type": "boolean",
      "default": false, "description": "Requires real image digests and a recipient
      key."}, "mode": {"type": "string", "default": "chamber", "enum": ["chamber",
      "background"]}, "suspend": {"type": "boolean", "default": true, "description":
      "Keep work paused until the owner enables execution."}, "resourcesPreset": {"type":
      "string", "default": "s1.small", "enum": ["s1.small", "s1.medium", "s1.large",
      "u1.small", "u1.medium"]}, "resources": {"type": "object", "additionalProperties":
      {"type": "string"}, "description": "Flat limits; cozy-lib derives requests using
      platform allocation ratios."}, "size": {"type": "string", "default": "20Gi"},
      "storageClass": {"type": "string", "default": "", "x-cozystack-options": {"source":
      "storageclass"}, "description": "Empty uses the tenant default storage class."},
      "existingClaim": {"type": "string", "default": ""}, "images": {"type": "object",
      "properties": {"controller": {"type": "object", "properties": {"repository":
      {"type": "string"}, "digest": {"type": "string", "pattern": "^$|^sha256:[a-f0-9]{64}$"}}},
      "studio": {"type": "object", "properties": {"repository": {"type": "string"},
      "digest": {"type": "string", "pattern": "^$|^sha256:[a-f0-9]{64}$"}}}}}, "imagePullSecrets":
      {"type": "array", "items": {"type": "object", "required": ["name"], "properties":
      {"name": {"type": "string"}}}}, "keySecretName": {"type": "string", "default":
      ""}, "models": {"type": "object", "x-kubernetes-preserve-unknown-fields": true},
      "window": {"type": "object", "properties": {"kind": {"type": "string", "enum":
      ["night", "weekends", "always"]}, "timeZone": {"type": "string"}, "startHour":
      {"type": "integer", "minimum": 0, "maximum": 23}, "endHour": {"type": "integer",
      "minimum": 0, "maximum": 23}}}, "s3": {"type": "object", "properties": {"bucket":
      {"type": "string", "default": ""}, "endpoint": {"type": "string", "default":
      ""}, "prefix": {"type": "string", "default": ""}, "credentialsSecretName": {"type":
      "string", "default": ""}, "accessKeyField": {"type": "string", "default": "accessKey"},
      "secretKeyField": {"type": "string", "default": "secretKey"}}, "description":
      "Existing tenant Bucket endpoint and bucket name; credentials are mounted by
      reference, never queried by this chart."}}, "title": "Mnemosyne atelier"}'
  release:
    prefix: mnemosyne-
    labels:
      sharding.fluxcd.io/key: tenants
    chartRef:
      kind: ExternalArtifact
      name: mnemosyne-application-default-mnemosyne
      namespace: cozy-system
  dashboard:
    singular: Mnemosyne atelier
    plural: Mnemosyne ateliers
    category: PaaS
    description: Retained works and tenant-scoped backups
    tags:
    - art
    - backup
    tabs:
    - workloads
    - yaml
    keysOrder:
    - - spec
      - enabled
    - - spec
      - mode
    - - spec
      - suspend
    - - spec
      - resourcesPreset
    - - spec
      - resources
    - - spec
      - size
    - - spec
      - storageClass
    - - spec
      - existingClaim
    - - spec
      - images
    - - spec
      - imagePullSecrets
    - - spec
      - keySecretName
    - - spec
      - models
    - - spec
      - window
    - - spec
      - s3
  secrets:
    include: []
    exclude:
    - {}
